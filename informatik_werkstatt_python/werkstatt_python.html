          if (kw.length) throw new PyFehler('SyntaxError', 'positional argument follows keyword argument', a.z);
          args.push(a);
        }
        if (this.istOp(',')) this.p++; else break;
      }
      this.erwarteOp(')'); this.ebene--;
      return { art: 'aufruf', f, args, kw, z: f.z };
    }
    atom() {
      const t = this.t;
      const merke = (k) => { k.erstesToken = t; return k; };
      switch (t.t) {
        case 'NAME': this.p++; return merke({ art: 'name', name: t.v, z: t.z });
        case 'ZAHL': this.p++; return merke({ art: 'konst', wert: t.v, komplex: !!t.komplex, z: t.z });
        case 'TEXT': case 'FTEXT': {
          const teile = [];
          let hinweis = null, f = false;
          while (this.T[this.p].t === 'TEXT' || this.T[this.p].t === 'FTEXT') {
            const s = this.T[this.p];
            if (s.feldFehler) { if (s.feldFehler instanceof Hinweis) throw s.feldFehler; throw s.feldFehler; }
            if (s.hinweis && !hinweis) hinweis = s.hinweis;
            if (s.t === 'FTEXT') { f = true; teile.push(...s.v); } else teile.push(s.v);
            this.p++;
          }
          if (hinweis) throw this.hinweis(hinweis, t.z);
          if (!f) return merke({ art: 'konst', wert: teile.join(''), z: t.z });
          return merke({ art: 'fstring', teile, z: t.z });
        }
        case 'KW':
          if (t.v === 'True' || t.v === 'False' || t.v === 'None') { this.p++; return merke({ art: 'konst', wert: t.v === 'None' ? null : t.v === 'True', z: t.z }); }
          if (t.v === 'lambda') return merke(this.lambdaAusdruck());
          throw this.fehlerBei(t);
        case 'OP':
          if (t.v === '(') return merke(this.klammer());
          if (t.v === '[') return merke(this.liste());
          if (t.v === '{') return merke(this.geschweift());
          if (t.v === '...') throw this.hinweis('Ellipsis (...) kann die Werkstatt nicht.', t.z);
          if (t.v === '*') throw this.hinweis('Sternchen-Ausdrücke kann die Werkstatt noch nicht.', t.z);
          throw this.fehlerBei(t);
      }
      throw this.fehlerBei(t);
    }
    klammer() {
      const auf = this.weiter();
      this.ebene++;
      if (this.istOp(')')) { this.p++; this.ebene--; return { art: 'tupel', el: [], z: auf.z }; }
      if (this.istKw('yield')) throw this.hinweis('yield kann die Werkstatt nicht.', auf.z);
      const a = this.ausdruck();
      if (this.istKw('for')) throw this.hinweis('Generator-Ausdrücke kann die Werkstatt noch nicht.', auf.z);
      this.benannt(a);
      this.kommaPruefen(a);
      if (this.istOp(')')) { this.p++; this.ebene--; return { art: 'gruppe', x: a, z: auf.z }; }
      if (!this.istOp(',')) throw this.fehlerBei(this.t);
      const el = [a];
      while (this.istOp(',')) {
        this.p++;
        if (this.istOp(')')) break;
        const b = this.ausdruck();
        this.kommaPruefen(b);
        el.push(b);
      }
      this.erwarteOp(')'); this.ebene--;
      return { art: 'tupel', el, z: auf.z };
    }
    liste() {
      const auf = this.weiter();
      this.ebene++;
      const el = [];
      while (!this.istOp(']')) {
        if (this.istOp('*')) throw this.hinweis('Sternchen-Ausdrücke kann die Werkstatt noch nicht.', this.t.z);
        const a = this.ausdruck();
        this.benannt(a);
        if (this.istKw('for') && !el.length) {
          const gens = this.erzeuger();
          this.erwarteOp(']'); this.ebene--;
          return { art: 'listcomp', elt: a, gens, z: auf.z };
        }
        this.kommaPruefen(a);
        el.push(a);
        if (this.istOp(',')) this.p++; else break;
      }
      this.erwarteOp(']'); this.ebene--;
      return { art: 'liste', el, z: auf.z };
    }
    geschweift() {
      const auf = this.weiter();
      this.ebene++;
      let woerter = false;
      while (!this.istOp('}')) {
        if (this.istOp('**')) { this.p++; this.ausdruck(); woerter = true; }
        else {
          const a = this.ausdruck();
          if (this.istKw('for')) throw this.hinweis('Mengen und Wörterbücher kann die Werkstatt noch nicht.', auf.z);
          if (this.istOp(':')) { this.p++; woerter = true; this.ausdruck(); } else this.kommaPruefen(a);
        }
        if (this.istOp(',')) this.p++; else break;
      }
      this.erwarteOp('}'); this.ebene--;
      return { art: woerter ? 'woerterbuch' : 'menge', z: auf.z };
    }
  }

  /* ---------- nach dem Parsen, wie CPython: erst die Symboltabelle (global/nonlocal), dann der Compiler
     (break/continue/return außerhalb), beides in Quelltext-Reihenfolge. Dazu je Funktion: lokale Namen in der
     Reihenfolge von co_varnames (erstes Vorkommen im übersetzten Code), globale Namen, qualname. ---------- */
  function kinderAusdruck(k) {
    switch (k.art) {
      case 'gruppe': case 'unaer': case 'nicht': case 'stern': return [k.x];
      case 'tupel': case 'liste': return k.el;
      case 'binaer': return [k.l, k.r];
      case 'und': case 'oder': return k.werte;
      case 'vergleich': return [k.l, ...k.rechts];
      case 'wennA': return [k.test, k.dann, k.sonst];
      case 'aufruf': return [k.f, ...k.args, ...k.kw.map((x) => x[1])];
      case 'index': return [k.o, k.i];
      case 'schnitt': return [k.a, k.b, k.c].filter(Boolean);
      case 'attribut': return [k.o];
      case 'fstring': {
        const aus = [];
        const feld = (teile) => { for (const t of teile) if (typeof t !== 'string') { aus.push(t.ausdruck); if (t.spec) feld(t.spec); } };
        feld(k.teile);
        return aus;
      }
      case 'lambda': return k.params.map((p) => p.std).filter(Boolean);
      default: return [];
    }
  }
  /* gebundene Namen eines Ziels (Zuweisung, for, del) */
  function zielNamen(k, aus) {
    if (k.art === 'name') aus.push(k);
    else if (k.art === 'gruppe') zielNamen(k.x, aus);
    else if (k.art === 'tupel' || k.art === 'liste') k.el.forEach((e) => zielNamen(e, aus));
    return aus;
  }
  const mangle = (name, klasse) => klasse && name.startsWith('__') && !name.endsWith('__') && klasse.replace(/^_+/, '')
    ? '_' + klasse.replace(/^_+/, '') + name : name;

  function analysiere(baum) {
    /* Bereiche: modul, funk (def/lambda), klasse; Comprehensions binden in einem eigenen, versteckten Bereich */
    const neuerBereich = (art, knoten, eltern, name) => ({ art, knoten, eltern, name, gebunden: new Set(), globale: new Set(), benutzt: new Set(), params: [], kinder: [] });
    const modul = neuerBereich('modul', null, null, '<module>');
    const klasseVon = (b) => { while (b && b.art !== 'klasse') { if (b.art === 'funk' && b.eltern && b.eltern.art === 'klasse') return b.eltern.name; b = b.eltern; } return b ? b.name : null; };

    /* 1. Symboltabelle */
    function ausdruckSym(k, b) {
      if (!k) return;
      if (k.art === 'name') { b.benutzt.add(k.name); return; }
      if (k.art === 'lambda') {
        kinderAusdruck(k).forEach((x) => ausdruckSym(x, b));
        const f = neuerBereich('funk', k, b, '<lambda>');
        b.kinder.push(f);
        for (const p of k.params) { f.params.push(p.name); f.gebunden.add(p.name); }
        if (k.stern) { f.params.push(k.stern); f.gebunden.add(k.stern); }
        k.bereich = f;
        ausdruckSym(k.ausdruck, f);
        return;
      }
      if (k.art === 'listcomp') {
        ausdruckSym(k.gens[0].iter, b);
        const c = neuerBereich('comp', k, b, '<listcomp>');
        k.bereich = c;
        k.gens.forEach((g, i) => {
          if (i) ausdruckSym(g.iter, c);
          zielNamen(g.ziel, []).forEach((n) => c.gebunden.add(n.name));
          g.bed.forEach((x) => ausdruckSym(x, c));
        });
        ausdruckSym(k.elt, c);
        /* was die Comprehension liest und nicht selbst bindet, liest der umgebende Bereich */
        for (const n of c.benutzt) if (!c.gebunden.has(n)) b.benutzt.add(n);
        return;
      }
      kinderAusdruck(k).forEach((x) => ausdruckSym(x, b));
    }
    function bindeSym(name, b, z, wie) {
      if (b.globale.has(name)) return;
      b.gebunden.add(name);
      b.reihe = b.reihe || [];
      b.reihe.push({ name, wie, z });
    }
    function folgeSym(liste, b) {
      for (const s of liste) anweisungSym(s, b);
    }
    function anweisungSym(s, b) {
      switch (s.art) {
        case 'ausdruck': ausdruckSym(s.wert, b); break;
        case 'zuweisung':
          ausdruckSym(s.wert, b);
          for (const z of s.ziele) { zielNamen(z, []).forEach((n) => bindeSym(n.name, b, n.z, 'assigned')); kinderZiel(z, b); }
          break;
        case 'erweitert':
          if (s.ziel.art === 'name') { b.benutzt.add(s.ziel.name); bindeSym(s.ziel.name, b, s.z, 'assigned'); } else kinderZiel(s.ziel, b);
          ausdruckSym(s.wert, b);
          break;
        case 'rueck': ausdruckSym(s.wert, b); break;
        case 'loesche': for (const z of s.ziele) { zielNamen(z, []).forEach((n) => bindeSym(n.name, b, n.z, 'assigned')); kinderZiel(z, b); } break;
        case 'assert': ausdruckSym(s.test, b); ausdruckSym(s.text, b); break;
        case 'wenn': for (const zw of s.zweige) { ausdruckSym(zw.test, b); folgeSym(zw.rumpf, b); } if (s.sonst) folgeSym(s.sonst, b); break;
        case 'solange': ausdruckSym(s.test, b); folgeSym(s.rumpf, b); if (s.sonst) folgeSym(s.sonst, b); break;
        case 'fuer':
          ausdruckSym(s.iter, b);
          zielNamen(s.ziel, []).forEach((n) => bindeSym(n.name, b, n.z, 'assigned'));
          kinderZiel(s.ziel, b);
          folgeSym(s.rumpf, b);
          if (s.sonst) folgeSym(s.sonst, b);
          break;
        case 'import': for (const n of s.namen) bindeSym(n.als || n.modul.split('.')[0], b, s.z, 'assigned'); break;
        case 'vonImport': if (s.namen !== '*') for (const n of s.namen) bindeSym(n.als || n.name, b, s.z, 'assigned'); break;
        case 'global': case 'nonlocal':
          for (const n of s.namen) {
            if (s.art === 'nonlocal' && b.art === 'modul') throw new PyFehler('SyntaxError', 'nonlocal declaration not allowed at module level', s.z);
            if (s.art === 'nonlocal') throw new Hinweis('nonlocal kann die Werkstatt noch nicht.', s.z);
            if (b.params.includes(n)) throw new PyFehler('SyntaxError', `name '${n}' is parameter and global`, s.z);
            if ((b.reihe || []).some((r) => r.name === n)) throw new PyFehler('SyntaxError', `name '${n}' is assigned to before global declaration`, s.z);
            if (b.benutzt.has(n)) throw new PyFehler('SyntaxError', `name '${n}' is used prior to global declaration`, s.z);
            b.globale.add(n);
          }
          break;
        case 'def': {
          s.params.forEach((p) => ausdruckSym(p.std, b));
          bindeSym(s.name, b, s.z, 'assigned');
          const f = neuerBereich('funk', s, b, s.name);
          b.kinder.push(f);
          for (const p of s.params) { f.params.push(p.name); f.gebunden.add(p.name); }
          if (s.stern) { f.params.push(s.stern); f.gebunden.add(s.stern); }
          s.bereich = f;
          folgeSym(s.rumpf, f);
          break;
        }
        case 'klasse': {
          s.basen.forEach((x) => ausdruckSym(x, b));
          bindeSym(s.name, b, s.z, 'assigned');
          const k = neuerBereich('klasse', s, b, s.name);
          b.kinder.push(k);
          s.bereich = k;
          folgeSym(s.rumpf, k);
          break;
        }
      }
    }
    function kinderZiel(z, b) {
      if (z.art === 'index') { ausdruckSym(z.o, b); ausdruckSym(z.i, b); }
      else if (z.art === 'attribut') ausdruckSym(z.o, b);
      else if (z.art === 'gruppe') kinderZiel(z.x, b);
      else if (z.art === 'tupel' || z.art === 'liste') z.el.forEach((e) => kinderZiel(e, b));
    }
    folgeSym(baum, modul);

    /* 2. Compiler: break/continue/return außerhalb */
    function pruefe(liste, inSchleife, inFunk) {
      for (const s of liste) {
        if (s.art === 'break' && !inSchleife) throw new PyFehler('SyntaxError', "'break' outside loop", s.z);
        if (s.art === 'continue' && !inSchleife) throw new PyFehler('SyntaxError', "'continue' not properly in loop", s.z);
        if (s.art === 'rueck' && !inFunk) throw new PyFehler('SyntaxError', "'return' outside function", s.z);
        if (s.art === 'wenn') { s.zweige.forEach((zw) => pruefe(zw.rumpf, inSchleife, inFunk)); if (s.sonst) pruefe(s.sonst, inSchleife, inFunk); }
        if (s.art === 'solange' || s.art === 'fuer') { pruefe(s.rumpf, true, inFunk); if (s.sonst) pruefe(s.sonst, inSchleife, inFunk); }
        if (s.art === 'def') pruefe(s.rumpf, false, true);
        if (s.art === 'klasse') pruefe(s.rumpf, false, false);
      }
    }
    pruefe(baum, false, false);

    /* 3. je Funktion: lokale Namen (co_varnames-Reihenfolge), qualname, freie Namen aus umgebenden Funktionen */
    function qual(b) {
      const teile = [];
      let x = b;
      const eigen = b.name;
      x = b.eltern;
      while (x && x.art !== 'modul') {
        if (x.art === 'comp') { x = x.eltern; continue; }
        teile.unshift(x.art === 'funk' ? x.name + '.<locals>' : x.name);
        x = x.eltern;
      }
      return [...teile, eigen].join('.');
    }
    function istLokal(b, n) { return b.gebunden.has(n) && !b.globale.has(n); }
    function bereite(b) {
      const k = b.knoten;
      if (b.art === 'funk' || b.art === 'klasse') k.qualname = qual(b);
      if (b.art === 'funk') {
        const reihe = [...b.params];
        const sieh = (n) => { if (istLokal(b, n) && !reihe.includes(n)) reihe.push(n); };
        const ausdruckReihe = (x) => {
          if (!x) return;
          if (x.art === 'name') { sieh(x.name); return; }
          if (x.art === 'listcomp') {
            ausdruckReihe(x.gens[0].iter);
            for (const n of x.bereich.gebunden) if (!reihe.includes(n)) reihe.push(n);
            x.gens.forEach((g, i) => { if (i) ausdruckReihe(g.iter); zielReihe(g.ziel); g.bed.forEach(ausdruckReihe); });
            ausdruckReihe(x.elt);
            return;
          }
          kinderAusdruck(x).forEach(ausdruckReihe);
        };
        const zielReihe = (z) => {
          if (z.art === 'name') sieh(z.name);
          else if (z.art === 'gruppe') zielReihe(z.x);
          else if (z.art === 'tupel' || z.art === 'liste') z.el.forEach(zielReihe);
          else if (z.art === 'index') { ausdruckReihe(z.o); ausdruckReihe(z.i); }
          else if (z.art === 'attribut') ausdruckReihe(z.o);
        };
        const anw = (s) => {
          switch (s.art) {
            case 'ausdruck': ausdruckReihe(s.wert); break;
            case 'zuweisung': ausdruckReihe(s.wert); s.ziele.forEach(zielReihe); break;
            case 'erweitert': if (s.ziel.art === 'name') sieh(s.ziel.name); else zielReihe(s.ziel); ausdruckReihe(s.wert); break;
            case 'rueck': ausdruckReihe(s.wert); break;
            case 'loesche': s.ziele.forEach(zielReihe); break;
            case 'assert': ausdruckReihe(s.test); ausdruckReihe(s.text); break;
            case 'wenn': for (const zw of s.zweige) { ausdruckReihe(zw.test); zw.rumpf.forEach(anw); } if (s.sonst) s.sonst.forEach(anw); break;
            case 'solange': ausdruckReihe(s.test); s.rumpf.forEach(anw); if (s.sonst) s.sonst.forEach(anw); break;
            case 'fuer': ausdruckReihe(s.iter); zielReihe(s.ziel); s.rumpf.forEach(anw); if (s.sonst) s.sonst.forEach(anw); break;
            case 'import': for (const n of s.namen) sieh(n.als || n.modul.split('.')[0]); break;
            case 'vonImport': if (s.namen !== '*') for (const n of s.namen) sieh(n.als || n.name); break;
            case 'def': s.params.forEach((p) => ausdruckReihe(p.std)); sieh(s.name); break;
            case 'klasse': s.basen.forEach(ausdruckReihe); sieh(s.name); break;
          }
        };
        if (k.art === 'lambda') ausdruckReihe(k.ausdruck); else k.rumpf.forEach(anw);
        /* Zellvariablen (von inneren Funktionen gelesen) stehen in co_localsplus hinter co_varnames, sortiert */
        const zellen = new Set();
        const sucheFrei = (x) => { for (const c of x.kinder) { if (c.art === 'funk' || c.art === 'comp' || c.art === 'klasse') { for (const n of c.benutzt) if (!c.gebunden.has(n) && istLokal(b, n)) zellen.add(n); sucheFrei(c); } } };
        sucheFrei(b);
        const ohneZellen = reihe.filter((n) => !zellen.has(n) || b.params.includes(n));
        k.lokale = [...ohneZellen, ...[...zellen].filter((n) => !b.params.includes(n)).sort()];
        k.lokalSet = new Set([...b.gebunden].filter((n) => !b.globale.has(n)));
        k.globale = b.globale;
        /* freie Namen: in einer umgebenden Funktion lokal gebunden */
        k.frei = new Set();
        for (let x = b.eltern; x; x = x.eltern) {
          if (x.art !== 'funk') continue;
          for (const n of x.gebunden) if (!x.globale.has(n) && !k.lokalSet.has(n) && !k.globale.has(n)) k.frei.add(n);
        }
        k.freiListe = [...b.benutzt].filter((n) => k.frei.has(n)).sort();
      }
      b.kinder.forEach(bereite);
    }
    bereite(modul);
  }

  /* Namensverschleierung in Klassen (__x → _Klasse__x) für Attribute */
  function verschleiere(liste, klasse) {
    const ausdruck = (k) => {
      if (!k || typeof k !== 'object') return;
      if (k.art === 'attribut' && klasse) k.name = mangle(k.name, klasse);
      if (k.art === 'listcomp') { k.gens.forEach((g) => { ausdruck(g.iter); ausdruck(g.ziel); g.bed.forEach(ausdruck); }); ausdruck(k.elt); return; }
      if (k.art === 'lambda') { kinderAusdruck(k).forEach(ausdruck); ausdruck(k.ausdruck); return; }
      kinderAusdruck(k).forEach(ausdruck);
    };
    const ziel = (z) => {
      if (z.art === 'attribut') { if (klasse) z.name = mangle(z.name, klasse); ausdruck(z.o); }
      else if (z.art === 'index') { ausdruck(z.o); ausdruck(z.i); }
      else if (z.art === 'gruppe') ziel(z.x);
      else if (z.art === 'tupel' || z.art === 'liste') z.el.forEach(ziel);
    };
    for (const s of liste) {
      switch (s.art) {
        case 'ausdruck': ausdruck(s.wert); break;
        case 'zuweisung': ausdruck(s.wert); s.ziele.forEach(ziel); break;
        case 'erweitert': ziel(s.ziel); ausdruck(s.wert); break;
        case 'rueck': ausdruck(s.wert); break;
        case 'loesche': s.ziele.forEach(ziel); break;
        case 'assert': ausdruck(s.test); ausdruck(s.text); break;
        case 'wenn': for (const zw of s.zweige) { ausdruck(zw.test); verschleiere(zw.rumpf, klasse); } if (s.sonst) verschleiere(s.sonst, klasse); break;
        case 'solange': ausdruck(s.test); verschleiere(s.rumpf, klasse); if (s.sonst) verschleiere(s.sonst, klasse); break;
        case 'fuer': ausdruck(s.iter); ziel(s.ziel); verschleiere(s.rumpf, klasse); if (s.sonst) verschleiere(s.sonst, klasse); break;
        case 'def': s.params.forEach((p) => ausdruck(p.std)); verschleiere(s.rumpf, klasse); break;
        case 'klasse': s.basen.forEach(ausdruck); verschleiere(s.rumpf, s.name); break;
      }
    }
  }

  /* Vorrang wie CPython: ein Fehler des Zerlegers (irgendwo in der Datei) schlägt einen Fehler des Parsers;
     eine nie geschlossene Klammer nur, wenn sie vor der Fehlerzeile geöffnet wurde. 'unexpected indent' bleibt. */
  function uebersetze(quelle) {
    const Z = zerlege(quelle);
    let baum;
    const P = new Parser(Z);
    try {
      baum = P.datei();
    } catch (e) {
      if (e instanceof PyFehler && (e.zerleger || e.ohneVorrang)) throw e;
      if (e instanceof PyFehler) { const alt = P.legacyPrint(P.p); if (alt && alt.zeile <= e.zeile) e = alt; }
      if (Z.fehl && !Z.fehl.schwach) throw Z.fehl;
      /* CPython vergleicht mit der Zeile des weitesten gelesenen Tokens */
      if (Z.offen && Z.offen.z < P.T[Math.min(P.weitest, P.T.length - 1)].z) throw new PyFehler('SyntaxError', `'${Z.offen.c}' was never closed`, Z.offen.z);
      throw e;
    }
    analysiere(baum);
    verschleiere(baum, null);
    markiereStummesEnde(baum, true);
    return baum;
  }

/* Für das Orakel: jedes Programm der Werkstatt mit den Eingaben, die es braucht */
const WERKSTATT_PROGRAMME = (() => {
  const liste = [];
  for (const [folie, inhalt] of Object.entries(WERKSTATT)) {
    for (const b of inhalt.beispiele) if (!b.endlos) liste.push({ name: `${folie}/${b.name}`, quelle: b.code, laeufe: b.laeufe || [[]] });
    for (const a of inhalt.aufgaben) {
      liste.push({ name: `${folie}/${a.titel} (Lösung)`, quelle: a.loesung, laeufe: a.pruefe.map(([e]) => e), erwartet: a.pruefe.map(([, t]) => t) });
      liste.push({ name: `${folie}/${a.titel} (Start)`, quelle: a.start, laeufe: [a.pruefe[0][0]] });
    }
  }
  return liste;
})();

<script>

    if(f.h2) html += `<div class="titelzeile">${f.eyebrow?`<div class="eyebrow">${f.eyebrow}</div>`:''}<h2>${f.h2}</h2></div>`;

  } else html = f.roh;

/* =====================================================================
   WERKSTATT — Editor links, Ausgabe rechts, Schritt für Schritt mit markierter Zeile und Variablentabelle.
   Der Motor (PY, py_motor.js) rechnet; hier nur Oberfläche. Schritt zurück = Neuablauf bis Schritt n − 1 mit den
   aufgezeichneten Eingaben (der Lauf ist eindeutig, nichts wird kopiert).
   Je Folie: <div class="interaktiv ws" data-werkstatt="<schlüssel in WERKSTATT>">, gebaut von WS_HTML (teil_folien.js).
   Zustand für Probe und Bilder: data-status, data-schritt, data-zeile am Element.
   ===================================================================== */
/* Keine Übergabe an calculution (Rechnung, TeX): erst nach einem Vertragsnachtrag. Die Einbettungsprobe prüft dann Rolle und Port, nicht die Rechnung. */
document.documentElement.setAttribute('data-ohne-rechnung', '');
const WS = (() => {
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const EINR = '    ';
  const KW = new Set(['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except',
    'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']);
  const BI = new Set(['print', 'input', 'int', 'float', 'str', 'bool', 'len', 'range', 'type', 'abs', 'round', 'min', 'max', 'sum', 'divmod', 'pow', 'chr', 'ord',
    'repr', 'tuple', 'exit', 'quit', 'list', 'sorted', 'reversed', 'enumerate', 'zip', 'map', 'filter', 'any', 'all', 'isinstance', 'super', 'bin', 'hex', 'oct',
    'format', 'iter', 'next', 'getattr', 'setattr', 'hasattr', 'self']);
  const eingebettet = (() => { try { return window.parent !== window; } catch (e) { return true; } })();

  /* ---------- Farben im Quelltext (nur Anzeige; der Motor zerlegt selbst) ---------- */
  function farben(q) {
    let aus = '', i = 0;
    const n = q.length;
    while (i < n) {
      const c = q[i];
      if (c === '#') { let j = q.indexOf('\n', i); if (j < 0) j = n; aus += `<i class="hk">${esc(q.slice(i, j))}</i>`; i = j; continue; }
      const pre = /^([rRuUbBfF]{0,2})(['"])/.exec(q.slice(i, i + 4));
      if ((c === '"' || c === "'" || (pre && /[A-Za-z]/.test(c))) && pre && (i === 0 || !/[\w]/.test(q[i - 1]))) {

        let j = i + pre[1].length + (drei ? 3 : 1);

          if (!drei && q[j] === '\n') break;
          if (q.startsWith(drei ? qu.repeat(3) : qu, j)) { j += drei ? 3 : 1; break; }

        aus += `<span class="hs">${zeichenMarken(q.slice(i, j))}</span>`; i = j; continue;
      }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(q[i + 1] || ''))) {
        const m = /^(0[xXoObB][0-9a-fA-F_]+|(\d[\d_]*\.?[\d_]*|\.\d[\d_]*)([eE][+-]?\d+)?[jJ]?)/.exec(q.slice(i));
        aus += `<span class="hz">${esc(m[0])}</span>`; i += m[0].length; continue;
      }
      if (/[\p{L}_]/u.test(c)) {
        const m = /^[\p{L}\p{N}_]+/u.exec(q.slice(i));

  /* Zeichen, die man im Editor kaum sieht oder verwechselt: markiert, aber in derselben Breite */

  /* ---------- Aufgaben im Dateiformat der Werkstatt (# TITEL:, # PRÜFE:, # === START ===, # === LÖSUNG ===) ---------- */
  function liesAufgabe(text) {
    const zeilen = text.replace(/\r\n?/g, '\n').split('\n');
    if (!zeilen.some((z) => /^#\s*TITEL:/.test(z))) return null;
    const a = { titel: '', text: '', tipps: [], pruefe: [], start: null, loesung: null };
    let feld = null, teil = 'kopf';
    const start = [], loesung = [], rest = [];
    for (const z of zeilen) {
      if (/^#\s*===\s*START\s*===/.test(z)) { teil = 'start'; continue; }
      if (/^#\s*===\s*LÖSUNG\s*===/.test(z)) { teil = 'loesung'; continue; }
      if (teil === 'start') { start.push(z); continue; }
      if (teil === 'loesung') { loesung.push(z); continue; }
      const m = /^#\s*(TITEL|BESCHREIBUNG|TIPP|PRÜFE):\s?(.*)$/.exec(z);
      if (m) {
        feld = m[1];
        if (feld === 'TITEL') a.titel = m[2].trim();
        else if (feld === 'BESCHREIBUNG') a.text = m[2].trim();
        else if (feld === 'TIPP') a.tipps.push(m[2].trim());
        else {
          const p = m[2].indexOf('->');
          if (p >= 0) {
            const e = m[2].slice(0, p).trim();

          }
        }
        continue;
      }
      const weiter = /^#\s{2,}(.*)$/.exec(z);
      if (weiter && feld === 'BESCHREIBUNG') { a.text += ' ' + weiter[1].trim(); continue; }
      if (weiter && feld === 'TIPP') { a.tipps[a.tipps.length - 1] += ' ' + weiter[1].trim(); continue; }
      feld = null;
      if (z.trim() || rest.length) rest.push(z);

    a.text = a.text.replace(/`([^`]+)`/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1');
    return a;
  }

  /* ---------- eine Werkstatt ---------- */
  function baue(root) {
    const inhalt = WERKSTATT[root.dataset.werkstatt];
    const R = (r) => root.querySelector(`[data-r="${r}"]`);
    const ta = R('code'), hl = R('hl'), nrn = R('nrn'), wahl = R('wahl'), ausEl = R('aus'), varEl = R('var');
    const S = {
      programme: [...inhalt.beispiele.map((b) => ({ art: 'beispiel', name: b.name, start: b.code })),
        ...inhalt.aufgaben.map((a) => ({ art: 'aufgabe', name: a.titel, start: a.start, a }))],
      aktuell: null, eigene: null, tipp: 0,
      eingaben: [], schritt: 0, ergebnis: null, fertig: false, vorige: null, geschafft: new Set(),
    };

    /* Auswahl: Beispiele und Aufgaben */
    function fuelleWahl() {
      const gruppe = (titel, art) => {
        const p = S.programme.map((x, i) => [x, i]).filter(([x]) => x.art === art);
        return p.length ? `<optgroup label="${titel}">${p.map(([x, i]) => `<option value="${i}">${esc(x.name)}${S.geschafft.has(i) ? ' ✓' : ''}</option>`).join('')}</optgroup>` : '';
      };
      wahl.innerHTML = gruppe('Beispiele', 'beispiel') + gruppe('Aufgaben', 'aufgabe') + gruppe('Geöffnet', 'datei');
      if (S.aktuell !== null) wahl.value = String(S.aktuell);
    }
    function waehle(i) {
      S.aktuell = i; S.eigene = null; S.tipp = 0;
      const p = S.programme[i];
      ta.value = p.start;
      wahl.value = String(i);
      const a = p.a;
      R('auftrag').innerHTML = a ? `<b>Aufgabe:</b> ${esc(a.text)}<span class="ws-tipps" data-r="tipps"></span>`
        : p.art === 'datei' ? `<b>Geöffnet:</b> ${esc(p.name)}` : 'Ausführen oder Schritt für Schritt ansehen – und den Code gern verändern.';
      R('pruefen').hidden = !(a && a.pruefe.length);
      R('loesung').hidden = !(a && a.loesung);
      R('loesung').textContent = 'Lösung zeigen';
      R('tipp').hidden = !(a && a.tipps && a.tipps.length);
      zeigeStatus();
      neu();
    }
    function zeigeStatus() {
      const p = S.programme[S.aktuell], st = R('status');
      st.hidden = !(p && p.a && p.a.pruefe.length);
      const ok = S.geschafft.has(S.aktuell);
      st.textContent = ok ? '✓ geschafft' : 'offen';
      st.className = 'ws-status ' + (ok ? 'ok' : 'offen');
    }

    /* ---------- Editor ---------- */
    function malen() {
      const q = ta.value, n = q.split('\n').length, E = S.ergebnis;
      let akt = 0, vor = 0, fz = 0, hw = 0;
      /* Zeilen, die eine Funktion aufgerufen haben und warten: je äußerem Rahmen seine Zeile, mit der gerufenen Funktion */
      const ruf = new Map();
      if (E && E.stapel && ['halt', 'eingabe', 'fehler'].includes(E.status)) {
        E.stapel.forEach((r, i) => {
          const innen = E.stapel[i + 1];
          if (!innen || !r.zeile) return;
          const name = innen.art === 'klasse' ? `class ${innen.name}` : `${innen.name.replace(/\.<locals>/g, '')}()`;
          const alt = ruf.get(r.zeile);
          ruf.set(r.zeile, alt && alt.name === name ? { name, mal: alt.mal + 1 } : { name, mal: 1 });
        });
      }
      if (E) {
        if (E.status === 'halt' || E.status === 'eingabe') { akt = E.zeile; vor = E.status === 'halt' && E.wechsel !== 'aufruf' && E.wechsel !== 'beides' ? E.vorher : 0; }
        else if (E.status === 'fehler') fz = E.fehler.zeile;
        else if (E.status === 'hinweis' || E.status === 'grenze') hw = (E.hinweis && E.hinweis.zeile) || E.zeile;
        else if (E.status === 'ende') vor = E.zeile;
      }
      const klasse = (k) => (k === akt ? ' akt' : '') + (k === vor && k !== akt ? ' vor' : '') + (ruf.has(k) && k !== akt ? ' ruf' : '') + (k === fz ? ' fz' : '') + (k === hw ? ' hwz' : '');
      const schild = (k) => { const r = ruf.get(k); return r && k !== akt ? `<span class="ws-ruf-schild">ruft ${esc(r.name)} auf${r.mal > 1 ? ` (${r.mal}×)` : ''}</span>` : ''; };
      nrn.innerHTML = Array.from({ length: n }, (_, k) => `<div class="nr${klasse(k + 1)}">${k + 1}</div>`).join('');
      hl.innerHTML = farben(q).split('\n').map((z, k) => `<span class="zl${klasse(k + 1)}">${z || ' '}${schild(k + 1)}</span>`).join('');
      scrollen();
    }
    function scrollen() { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; nrn.scrollTop = ta.scrollTop; }
    function zeileSichtbar(z) {
      if (!z) return;
      const zh = parseFloat(getComputedStyle(ta).lineHeight) || 22, oben = (z - 1) * zh, pad = 10;
      if (oben < ta.scrollTop) ta.scrollTop = Math.max(0, oben - zh);

    /* Text einsetzen, sodass Rückgängig (Strg+Z) erhalten bleibt */
    function setze(text, a, b) {
      ta.focus();
      ta.setSelectionRange(a, b);
      let ok = false;
      try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
      if (!ok) { ta.setRangeText(text, a, b, 'end'); ta.dispatchEvent(new Event('input')); }

      ta.setSelectionRange(a + text.length, a + text.length);
    }
    const zeilenAnfang = (pos) => ta.value.lastIndexOf('\n', pos - 1) + 1;
    function ruecke(richtung) {
      const q = ta.value, a = zeilenAnfang(ta.selectionStart);
      let b = ta.selectionEnd;
      if (b > a && q[b - 1] === '\n') b--;
      const ende = q.indexOf('\n', b) < 0 ? q.length : q.indexOf('\n', b);
      const block = q.slice(a, ende);
      const neuBlock = block.split('\n').map((z) => richtung > 0 ? EINR + z : z.replace(/^ {1,4}/, '').replace(/^\t/, '')).join('\n');
      setze(neuBlock, a, ende);
      ta.setSelectionRange(a, a + neuBlock.length);

      if (e.key === 'Tab') { e.preventDefault(); if (e.shiftKey) ruecke(-1); else if (ta.selectionStart !== ta.selectionEnd && ta.value.slice(ta.selectionStart, ta.selectionEnd).includes('\n')) ruecke(1); else setze(EINR, ta.selectionStart, ta.selectionEnd); return; }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ausfuehren(); return; }
      if (e.key === 'Enter' && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        const a = zeilenAnfang(ta.selectionStart), z = ta.value.slice(a, ta.selectionStart);

      }
    });
    ta.addEventListener('input', () => { if (S.ergebnis || S.schritt) neu(); else malen(); });
    ta.addEventListener('scroll', scrollen);

    /* ---------- Laufen ---------- */
    function neu() {
      S.eingaben = []; S.schritt = 0; S.ergebnis = null; S.fertig = false; S.vorige = null; S.vorigeAus = null; S.saat = null;
      zeige();
    }
    function lauf(bis) {
      let r;
      if (S.saat == null) S.saat = Math.floor(Math.random() * 2 ** 31);
      try { r = PY.lauf(ta.value, { eingaben: S.eingaben, bis, saat: S.saat }); } catch (e) {
        r = { status: 'hinweis', hinweis: { text: 'Interner Fehler der Werkstatt: ' + e.message, zeile: 0 }, ausgabe: [], variablen: [], schritte: 0, zeile: null };
      }
      return r;
    }
    /* alle angezeigten Werte eines Ergebnisses: Rahmen/Name (und .Attribut) → Darstellung, für die Hervorhebung */
    function werteVon(E) {
      const m = new Map();
      const dazu = (vorn, liste) => { for (const [k, , w, attr] of liste || []) { m.set(vorn + k, w); for (const [a, , wa] of attr || []) m.set(vorn + k + '.' + a, wa); } };
      dazu('global:', E.variablen);
      (E.stapel || []).forEach((r, i) => { if (r.variablen) dazu(i + r.name + ':', r.variablen); });
      return m;
    }
    function uebernimm(r, ziel) {
      const vorher = S.ergebnis;
      S.vorige = vorher && ziel === S.schritt + 1 ? werteVon(vorher) : null;
      S.vorigeAus = vorher && ziel === S.schritt + 1 ? vorher.ausgabe.reduce((n, a) => n + a.text.length, 0) : null;
      S.ergebnis = r;
      if (r.status === 'halt') { S.schritt = r.schritte; S.fertig = false; }
      else if (r.status === 'eingabe') { S.schritt = r.schritte; S.fertig = false; }
      else { S.schritt = r.schritte + 1; S.fertig = true; }
      zeige();
      if (r.status === 'eingabe') { const f = root.querySelector('.ws-eingabe'); if (f) f.focus({ preventScroll: true }); }
    }
    function ausfuehren() { S.eingaben = []; S.vorige = null; S.vorigeAus = null; S.ziel = Infinity; S.saat = null; uebernimm(lauf(Infinity), Infinity); }
    function schrittVor() {
      if (S.fertig) return;
      if (S.schritt === 0) S.saat = null;
      if (S.ergebnis && S.ergebnis.status === 'eingabe') { const f = root.querySelector('.ws-eingabe'); if (f) f.focus(); return; }
      S.ziel = S.schritt + 1;
      uebernimm(lauf(S.ziel), S.ziel);
    }
    function schrittZurueck() {
      if (S.schritt <= 1) { S.eingaben = []; S.schritt = 0; S.ergebnis = null; S.fertig = false; S.vorige = null; zeige(); return; }
      S.ziel = S.schritt - 1;
      const r = lauf(S.ziel);
      S.vorige = null; S.vorigeAus = null;
      S.ergebnis = r; S.schritt = r.status === 'halt' ? r.schritte : r.schritte + 1; S.fertig = r.status !== 'halt' && r.status !== 'eingabe';

    }
    function vonVorn() { S.eingaben = []; S.schritt = 0; S.ergebnis = null; S.fertig = false; S.vorige = null; S.vorigeAus = null; zeige(); }
    function eingabeSenden(wert) {
      S.eingaben.push(wert);
      uebernimm(lauf(S.ziel === undefined ? Infinity : S.ziel), S.ziel);
    }

    /* ---------- Anzeige ---------- */
    function zeige() {
      const E = S.ergebnis;
      malen();
      /* Variablen: bei einem Aufruf zuerst die Rahmen von innen nach außen, dann global; Objekte mit ihren Attributen */
      varEl.innerHTML = variablenHtml(E);
      /* Ausgabe */
      let html = '';
      /* was dieser Schritt ausgegeben hat, im Grün der eben ausgeführten Zeile */
      if (E) {
        let pos = 0;
        const grenze = S.vorigeAus == null ? Infinity : S.vorigeAus;
        html += E.ausgabe.map((a) => {
          const k = a.art === 'ein' ? 'ws-ein' : '';
          const alt = a.text.slice(0, Math.max(0, grenze - pos)), neu = a.text.slice(alt.length);
          pos += a.text.length;
          return (alt ? `<span class="${k}">${esc(alt)}</span>` : '') + (neu ? `<span class="${k} ws-neu-aus">${esc(neu)}</span>` : '');
        }).join('');
      }
      if (E && E.status === 'eingabe') html += `<input class="ws-eingabe" data-ohne-eh type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Eingabe für input()"><span class="ws-enter">↵ Enter</span>`;
      if (!E && !S.pruefung) html = `<span class="ws-leer">Hier erscheint, was das Programm ausgibt.</span>`;
      if (E && E.status === 'fehler') html += fehlerHtml(E.fehler);
      if (E && (E.status === 'hinweis' || E.status === 'grenze')) {
        html += `<div class="ws-hinweisbox"><div class="ws-hb-kopf">Meldung der Werkstatt – kein Python-Fehler</div><div>${esc(E.hinweis.text)}</div>`
          + (E.status === 'grenze' ? '<div class="ws-leise">Echtes Python würde einfach weiterlaufen. Prüfe, ob sich die Bedingung der Schleife irgendwann ändert.</div>' : '') + '</div>';
      }
      if (S.pruefung) html += S.pruefung;
      ausEl.innerHTML = html;
      ausEl.scrollTop = ausEl.scrollHeight;
      const f = ausEl.querySelector('.ws-eingabe');
      if (f) f.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); eingabeSenden(f.value); } });
      const k = ausEl.querySelector('[data-r="korrektur"]');
      if (k) k.onclick = () => { const kr = PY_ERKLAERUNG.korrektur(E.fehler, ta.value); if (kr) { ta.value = kr.quelle; neu(); ausfuehren(); } };
      /* Schritt-Anzeige */
      const st = R('schritt');
      if (!E) st.innerHTML = '<span class="ws-leise">bereit</span>';
      else if (E.status === 'halt') {
        const innen = (E.stapel || []).filter((r) => r.art !== 'modul').pop();
        const wo = innen ? ` in <b>${esc(innen.name.replace(/\.<locals>/g, ''))}</b>` : '';
        let vorn;

const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;

  i = Math.max(0, Math.min(slides.length-1, n));

  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));

}

  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }

<script data-handy="technik/handy/handy.js">
/* =====================================================================
   HANDY-SCHICHT — schaltet die Handy-Ansicht, wenn die Bühne 1280 × 720 zu stark
   verkleinert würde (Maßstab unter 0,62: Handy hoch und quer, Tablet hochkant).
   Muss NACH der Folien-Navigation des Rahmens stehen (nutzt stage, zeige, skalieren).
   Meldet Wechsel mit dem Ereignis „handy-wechsel", damit Rechner neu zeichnen können.
   ===================================================================== */
(function(){
  const html = document.documentElement;
  const istHandy = () => Math.min(innerWidth / 1280, innerHeight / 720) < 0.62;
  let vorher = null;
  function pruefen(){
    const h = istHandy();
    html.classList.toggle('handy', h);
    if (h) stage.style.transform = 'none';
    else if (typeof skalieren === 'function') skalieren();
    if (h !== vorher){ vorher = h; window.dispatchEvent(new CustomEvent('handy-wechsel', { detail: h })); }
  }
  addEventListener('resize', pruefen);
  addEventListener('orientationchange', () => setTimeout(pruefen, 200));
  pruefen();

  // Neue Folie (und nur dann, nicht bei jedem Knopf): nach oben scrollen
  const wach = new MutationObserver((liste) => {
    if (!html.classList.contains('handy')) return;
    if (liste.some((m) => m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))) window.scrollTo(0, 0);
  });
  document.querySelectorAll('.slide').forEach((f) => wach.observe(f, { attributes: true, attributeFilter: ['class'], attributeOldValue: true }));

  // Beim Scrollen tippt man oft auf Text: auf dem Handy blättert ein Tipp nicht weiter
  stage.addEventListener('click', (e) => {
    if (html.classList.contains('handy') && !e.target.closest('a, button, input, select, textarea, label, .interaktiv')) e.stopPropagation();
  }, true);
})();
