/* ==== HANDY-SCHICHT: technik/handy/handy.css ==== */
/* =====================================================================
   HANDY-SCHICHT für den Rahmen der Vorlagen (ds1 / Folgen) — plus eine Regel für alle Ansichten:
   zu viel Inhalt scrollt statt abgeschnitten zu werden.
   Greift nur, wenn handy.js <html class="handy"> setzt: Bildschirm zu klein für die
   Bühne 1280 × 720 (Handy, Tablet hochkant). Beamer, Laptop und Druck bleiben unberührt.
   Aus der Bühne wird eine scrollbare Seite pro Folie; Raster werden einspaltig,
   Schrift mindestens 14 px, Knöpfe mindestens 40 px (Finger).
   ===================================================================== */
/* ---- Für ALLE Ansichten (auch Beamer): nie abschneiden. Passt der Inhalt einer Folie nicht,
        scrollt der Inhaltsbereich; Kopf und Fuß bleiben stehen. ---- */
#stage .slide .inhalt{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--mk-primaer-linie) transparent;
  margin-bottom:-10px}   /* bis an die Fußzeilenlinie: der freie Rand darüber gehört zum Inhalt (Folgen nutzt ihn) */
@media print{#stage .slide .inhalt{overflow:visible}}            /* Druck: alles zeigen */

html.handy, html.handy body{height:auto;overflow-x:hidden;overflow-y:auto}
html.handy body{display:block;background:var(--mk-flaeche)}
html.handy #stage{width:100%;height:auto;transform:none!important}
html.handy .slide{position:relative;inset:auto;display:none;min-height:100vh;border-radius:0;box-shadow:none;
  padding:64px 14px 84px;transform:none;transition:none;overflow:visible}
html.handy .slide.aktiv{display:flex}

/* Kopf, Überschriften, Fuß */
html.handy .kopf{height:48px;padding:0 12px;gap:10px}
html.handy .kopf img{height:34px}
html.handy .kopf .schule{font-size:14px;letter-spacing:.06em}
html.handy .kopf .kurs{display:none}
html.handy h1{font-size:34px}
html.handy h2, html.handy .slide.kompakt h2{font-size:25px}
html.handy .eyebrow{font-size:14px;letter-spacing:.12em}
html.handy .titelzeile, html.handy .slide.kompakt .titelzeile{margin-bottom:14px}
html.handy .inhalt, html.handy #stage .slide .inhalt{display:block;overflow:visible;margin-bottom:0}   /* Handy: die Seite scrollt, nicht die Folie */
html.handy .fuss{position:static;margin-top:22px;font-size:14px;gap:10px}
html.handy p, html.handy li{font-size:17px}
html.handy .klein, html.handy .hinweis{font-size:15px}

/* Titelfolie: untereinander */
html.handy .slide.titel{display:none;grid-template-columns:1fr;padding:0}
html.handy .slide.titel.aktiv{display:grid}
html.handy .slide.titel .links{padding:40px 20px 24px}
html.handy .slide.titel .rechts{padding:24px 0 90px;border-left:none;border-top:1px solid rgb(var(--mk-auf-primaer-rgb) / .16)}
html.handy .slide.titel .unter{font-size:18px}
html.handy .slide.titel .meta span{font-size:14px}
html.handy .slide.titel .logokachel{border-radius:26px;padding:16px 18px}
html.handy .slide.titel .logokachel img{width:110px}
html.handy .slide.titel svg{max-width:100%;height:auto}

/* Raster und Karten: einspaltig */
html.handy .raster, html.handy .g2, html.handy .g3, html.handy .g4{grid-template-columns:1fr!important}
html.handy .karte p, html.handy .karte li{font-size:16px}

/* Finger: Knöpfe und Felder mindestens 40 px */
html.handy .knopf{min-height:42px;min-width:42px;font-size:15.5px;padding:8px 14px}
html.handy input, html.handy select{min-height:42px;font-size:16px}   /* 16 px: iOS zoomt sonst beim Tippen */
html.handy #nav{right:10px;bottom:10px;padding:6px 8px;gap:6px}
html.handy #nav button{width:42px;height:42px;font-size:18px}
html.handy #zaehler{font-size:14px}
html.handy svg{max-width:100%;height:auto}
/* ==== /HANDY-SCHICHT ==== */
:root{
  --blau:var(--mk-primaer);
  --blau-d:var(--mk-primaer-dunkel);
  --blau-h:var(--mk-primaer-hell);
  --blau-pastell:var(--mk-primaer-zart);
  --blau-linie:var(--mk-primaer-linie);
  --orange:var(--mk-akzent);
  --orange-d:var(--mk-akzent-dunkel);
  --orange-pastell:var(--mk-akzent-zart);
  --tinte:var(--mk-text);
  --grau:var(--mk-text-leise);
  --linie:var(--mk-linie);
  --papier:var(--mk-flaeche);
  --bg:var(--mk-grund);
  --rot:var(--mk-falsch);
  --gruen:var(--mk-ok);
  --stage-w:1280px;
  --stage-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--mk-grund);
  color:var(--mk-text);
  font-family:var(--mk-schrift);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

#stage{position:relative;width:var(--stage-w);height:var(--stage-h);transform-origin:center center;flex:none}
.slide{
  position:absolute;inset:0;
  background:var(--mk-flaeche);
  border-radius:14px;
  box-shadow:0 18px 50px rgb(var(--mk-primaer-dunkel-rgb) / .22), 0 2px 6px rgb(var(--mk-primaer-dunkel-rgb) / .12);
  overflow:hidden;
  padding:86px 62px 58px;
  opacity:0;visibility:hidden;
  transform:translateY(14px) scale(.995);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
  display:flex;flex-direction:column;
}
.slide.aktiv{opacity:1;visibility:visible;transform:none}

.kopf{
  position:absolute;top:0;left:0;right:0;height:58px;
  background:linear-gradient(100deg,var(--mk-primaer-dunkel) 0%,var(--mk-primaer) 55%,var(--mk-primaer-hell) 100%);
  display:flex;align-items:center;gap:14px;
  padding:0 22px 0 18px;
  color:var(--mk-auf-primaer);
  z-index:5;
}
.kopf::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--mk-akzent) 0%,var(--mk-akzent) 34%,var(--mk-akzent-2) 34%,var(--mk-akzent-2) 100%);
}
.kopf img{height:42px;width:auto;background:var(--mk-logo-grund);border-radius:11px;padding:3px 6px;box-shadow:0 3px 10px rgb(var(--mk-schatten-rgb) / .25), 0 0 0 1px rgb(var(--mk-auf-primaer-rgb) / .5)}
.kopf .schule{font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:var(--mk-kopf-schreibung);opacity:.95}
.kopf .kurs{
  margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgb(var(--mk-auf-primaer-rgb) / .16);border:1px solid rgb(var(--mk-auf-primaer-rgb) / .28);
  padding:5px 12px;border-radius:999px;
}

h1{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em}

.klein{font-size:16px;line-height:1.45;color:var(--mk-text-leise)}

table.wt td{background:var(--mk-flaeche-leise);padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--mk-linie);border-bottom:1px solid var(--mk-linie)}
table.wt td:first-child{text-align:left;border-left:1px solid var(--mk-linie);border-radius:7px 0 0 7px}
table.wt td:last-child{border-right:1px solid var(--mk-linie);border-radius:0 7px 7px 0;font-weight:800;color:var(--mk-akzent-dunkel-text)}
table.wt tr.aktuell td{background:var(--mk-akzent-zart);border-color:var(--mk-akzent-linie)}
table.wt .leer td{background:none;border:none;color:var(--mk-text-leise);text-align:left;font-weight:600}

/* ---------- Knöpfe ---------- */
.interaktiv{cursor:default}
.knopfleiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.knopf{font:inherit;font-size:15.5px;font-weight:700;border:none;border-radius:999px;padding:8px 15px;cursor:pointer;background:var(--mk-primaer);color:var(--mk-auf-primaer);box-shadow:0 2px 0 rgb(var(--mk-primaer-dunkel-rgb) / .25);transition:background .15s, opacity .15s, transform .1s}
.knopf:hover{background:var(--mk-primaer-dunkel)}
.knopf:active{transform:translateY(1px)}
.knopf.o{background:var(--mk-akzent);color:var(--mk-auf-akzent)}
.knopf.o:hover{background:var(--mk-akzent-dunkel)}
.knopf.g{background:var(--mk-ok)}
.knopf.hell{background:var(--mk-primaer-zart);color:var(--mk-primaer-dunkel-text);box-shadow:none;border:1px solid var(--mk-primaer-linie)}
.knopf.hell:hover{background:var(--mk-primaer-zart-2)}
.knopf.hell.an{background:var(--mk-invers);color:var(--mk-auf-invers);border-color:var(--mk-text)}
.knopf.rund{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.knopf:disabled{opacity:.35;cursor:not-allowed}

/* Schritte, Tabelle */
.schritte{display:flex;flex-direction:column;gap:9px}
.schritt{display:flex;gap:14px;align-items:center;background:var(--mk-flaeche);border:1px solid var(--mk-linie);border-radius:11px;padding:9px 14px}
.schritt .nummer{width:34px;height:34px;font-size:17px}
.schritt p{font-size:18px;line-height:1.35}
.schritt.wichtig{background:var(--mk-akzent-zart);border-color:var(--mk-akzent-linie)}
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.tab th{background:var(--mk-primaer-dunkel);color:var(--mk-auf-primaer);text-align:right;padding:9px 16px;font-size:14px;letter-spacing:.06em}
table.tab th:first-child{border-top-left-radius:10px;text-align:left}
table.tab th:last-child{border-top-right-radius:10px}
table.tab td{padding:8px 16px;border-bottom:1px solid var(--mk-linie);text-align:right;font-variant-numeric:tabular-nums}
table.tab td:first-child{text-align:left}
table.tab tr:nth-child(even) td{background:var(--mk-flaeche-leise)}
table.tab td.z{font-weight:800;color:var(--mk-akzent-dunkel-text)}

.frag{opacity:0;transform:translateY(10px);transition:opacity .34s ease,transform .34s ease}
.frag.an{opacity:1;transform:none}
svg .frag{transform:none}

#fortschritt{position:fixed;left:0;top:0;height:4px;background:var(--mk-akzent);width:0;transition:width .3s ease;z-index:50}
#nav{position:fixed;right:18px;bottom:14px;z-index:50;display:flex;align-items:center;gap:8px;background:rgb(var(--mk-flaeche-rgb) / .85);backdrop-filter:blur(6px);border:1px solid var(--mk-linie);border-radius:999px;padding:5px 8px;box-shadow:0 4px 14px rgb(var(--mk-primaer-dunkel-rgb) / .14)}
#nav button{border:none;background:var(--mk-primaer-zart);color:var(--mk-primaer-dunkel-text);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:800}
#nav button:hover{background:var(--mk-primaer);color:var(--mk-flaeche)}
#zaehler{font-size:13px;font-weight:700;color:var(--mk-text-leise);padding:0 6px;min-width:52px;text-align:center}
#uebersicht{position:fixed;inset:0;background:rgb(var(--mk-primaer-tief-rgb) / .96);z-index:100;display:none;padding:34px;overflow:auto}
#uebersicht.an{display:block}
#uebersicht h4{color:var(--mk-auf-primaer);font-size:18px;margin-bottom:18px;font-weight:700}
#uebersicht .gitter{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#uebersicht .mini{background:var(--mk-flaeche);border-radius:8px;padding:14px;cursor:pointer;border:3px solid transparent;min-height:78px}
#uebersicht .mini:hover{border-color:var(--mk-akzent)}
#uebersicht .mini .nr{font-size:11px;font-weight:800;color:var(--mk-akzent-dunkel-text)}
#uebersicht .mini .tt{font-size:14px;font-weight:700;color:var(--mk-primaer-dunkel-text);margin-top:3px;line-height:1.25}

@media print{
  @page{size:A4 landscape;margin:0}
  body{display:block;background:#fff;overflow:visible}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{position:relative;visibility:visible;opacity:1;transform:none;width:1280px;height:720px;page-break-after:always;box-shadow:none;border-radius:0}
  .frag{opacity:1!important;transform:none!important}
  #nav,#fortschritt,#uebersicht{display:none!important}
}
/* Modus-Knopf (hell/dunkel): gehört dem Rahmen; das Skript unten legt ihn nur an, wenn die Marke einen dunklen Modus hat */
#modusknopf{display:inline-flex;align-items:center;justify-content:center;padding:0}
#modusknopf svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html.handy #modusknopf svg{width:20px;height:20px}
#modusknopf .sonne{display:none}
:root[data-modus="dunkel"] #modusknopf .sonne{display:inline}
:root[data-modus="dunkel"] #modusknopf .mond{display:none}
@media (prefers-color-scheme: dark){:root:not([data-modus="hell"]) #modusknopf .sonne{display:inline}:root:not([data-modus="hell"]) #modusknopf .mond{display:none}}
@media print{#modusknopf{display:none}}
/* ==== technik/mathe/farben.css ==== */
/* =====================================================================
   FARBSCHEMA der Mathe-Werkzeuge — EINE Stelle für alle Inhaltsfarben.
   Umfärben: Werte hier ändern, dann  python3 technik/alle_bauen.py  — alle Werkzeuge mit
   quellen/meta.json werden neu gebaut. Werkzeuge benutzen NUR diese Namen, keine Hexwerte.

   Gestaltungsfarben (Rahmen, Kopf, Knöpfe) kommen aus dem Rahmen (--blau, --orange …) und
   dürfen wandern. Die Namen hier sind INHALTSFARBEN: Sie bedeuten etwas und sind in allen
   Werkzeugen dieselbe Bedeutung – erste Größe ist immer --m-1, Ergebnis immer --m-erg usw.
   ===================================================================== */
:root{
  /* Rollen in einer Aufgabe */
  --m-1:#3A8FD6;      --m-1-h:#E1EEF9;      /* erste Größe: linke Seite, Gleichung I, Graph f, x-Richtung */
  --m-2:#E08A1E;      --m-2-h:#FCEBD2;      /* zweite Größe: rechte Seite, Gleichung II, Graph f′, Faktor */
  --m-3:#2E9D8F;      --m-3-h:#DDF2EF;      /* dritte Größe: Gleichung III, Graph f″, z-Richtung */
  --m-erg:#7A57C7;    --m-erg-h:#ECE6F7;    /* Ergebnis, Parameter, das Gesuchte */
  --m-erg-l:#CDB8F0;                        /* Linie um Ergebnis und Eingabefeld */
  --m-1-t:#1F6FB5;    --m-2-t:#A85F07;      /* erste/zweite Größe als SCHRIFT auf hellem Grund (kräftiger als --m-1/--m-2) */
  /* Bewertung */
  --m-ok:#2E7D32;     --m-ok-h:#E6F3E7;     /* richtig, Lösung, Treffer */
  --m-falsch:#D0493F; --m-falsch-h:#FBE6E4; /* falsch, Widerspruch, abgezogen */
  --m-hinweis:#B86E0C;--m-hinweis-h:#FDF0DA;/* fast richtig, Hinweis */
  --m-grau:#8A97A3;   --m-grau-h:#EEF2F5;   /* dein Ergebnis zum Vergleich, verloren, inaktiv */
  /* Koordinatensysteme */
  --m-achse:#6B7C89;  --m-gitter:#E4ECF2;   --m-tick:#5B6A76;
  --m-flaeche-plus:rgba(46,125,50,.18);     /* Fläche über der Achse */
  --m-flaeche-minus:rgba(208,73,63,.18);    /* Fläche unter der Achse */
  /* Schrift für Mathematik */
  --m-schrift:"Cambria Math","Cambria","Times New Roman",serif;
}

/* ---------- Werkstatt Python (Farben nur über Token: --mk-… Rollen, --m-… Inhalt aus technik/mathe/farben.css) ---------- */
.ws-folie{--ed-font:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;--ed-gr:16px;--ed-zh:1.45}
.ws-folie .titelzeile{margin-bottom:8px}
.ws-folie h2{font-size:28px}
.ws-folie h2::after{display:none}
.ws{display:flex;flex-direction:column;gap:8px;height:100%;min-height:0}
.ws-folie .inhalt{min-height:0}

/* Kopf: Auswahl, Auftrag, Knöpfe der Aufgabe */
.ws-kopf{display:flex;align-items:center;gap:12px;flex:none;min-height:42px}
.ws-wahl{font:inherit;font-size:15px;font-weight:700;color:var(--mk-primaer-dunkel-text);background:var(--mk-primaer-zart);border:1px solid var(--mk-primaer-linie);border-radius:10px;padding:7px 10px;max-width:270px;flex:none;cursor:pointer}
.ws-auftrag{flex:1;min-width:0;font-size:15px;line-height:1.38;color:var(--mk-text)}
.ws-auftrag b{color:var(--mk-primaer-dunkel-text)}
.ws-tipps{display:block}
.ws-tipp{display:block;font-size:14.5px;color:var(--mk-text-leise);margin-top:2px}
.ws-tipp b{color:var(--mk-akzent-dunkel-text)}
.ws-kopfknoepfe{display:flex;align-items:center;gap:6px;flex:none}
.ws-kopfknoepfe .knopf{font-size:14px;padding:6px 12px}
.ws-status{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:5px 12px;white-space:nowrap}
.ws-status.offen{background:var(--mk-flaeche);color:var(--mk-text-leise);border:1px solid var(--mk-linie)}
.ws-status.ok{background:var(--m-ok);color:var(--mk-flaeche)}

/* Hauptteil: links Editor, rechts Variablen und Ausgabe */
.ws-haupt{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:14px}
.ws-links{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.ws-rechts{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}

/* Editor: Zeilennummern, Farben darunter, Textfeld darüber */
.ws-editor{flex:1;min-height:0;display:flex;border:1px solid var(--mk-linie);border-radius:12px;overflow:hidden;background:var(--mk-flaeche-leise)}
.ws-editor:focus-within{border-color:var(--mk-primaer);box-shadow:0 0 0 3px rgb(var(--mk-primaer-rgb) / .15)}
.ws-nrn{flex:none;width:46px;padding:10px 0;background:var(--mk-flaeche-grau);color:var(--mk-text-leise);font-family:var(--ed-font);font-size:var(--ed-gr);line-height:var(--ed-zh);text-align:right;overflow:hidden;user-select:none}
.ws-nrn .nr{padding-right:8px;position:relative}
.ws-nrn .nr.akt{color:var(--mk-akzent-dunkel-text);font-weight:800;background:var(--mk-akzent-zart)}
.ws-nrn .nr.akt::before{content:"\25B6\FE0E";position:absolute;left:4px;font-size:.72em;top:.2em;color:var(--mk-akzent)}
.ws-nrn .nr.vor{background:var(--mk-primaer-zart);color:var(--mk-primaer-dunkel-text)}
.ws-nrn .nr.fz{background:var(--m-falsch);color:var(--mk-flaeche);font-weight:800}
.ws-nrn .nr.hwz{background:var(--m-hinweis);color:var(--mk-flaeche);font-weight:800}
.ws-feld{position:relative;flex:1;min-width:0}
.ws-hl,.ws-feld textarea{position:absolute;inset:0;margin:0;border:0;padding:10px 12px;font-family:var(--ed-font);font-size:var(--ed-gr);line-height:var(--ed-zh);
  white-space:pre;tab-size:4;-moz-tab-size:4;letter-spacing:0;font-variant-ligatures:none;box-sizing:border-box;overflow:auto}
.ws-hl{color:var(--mk-text);pointer-events:none;overflow:hidden}
.ws-hl .zl{display:block;min-height:calc(var(--ed-zh) * 1em);margin:0 -12px;padding:0 12px}
.ws-hl .zl.akt{background:var(--mk-akzent-zart);box-shadow:inset 4px 0 0 var(--mk-akzent)}
.ws-hl .zl.vor{background:var(--mk-primaer-zart)}
.ws-hl .zl.fz{background:var(--m-falsch-h);box-shadow:inset 4px 0 0 var(--m-falsch)}
.ws-hl .zl.hwz{background:var(--m-hinweis-h);box-shadow:inset 4px 0 0 var(--m-hinweis)}
.ws-feld textarea{background:transparent;color:transparent;caret-color:var(--mk-text);resize:none;outline:none}
.ws-feld textarea::selection{background:rgb(var(--mk-primaer-rgb) / .28);color:transparent}
.ws-hl .hw,.tb-editor .hw{color:var(--m-erg);font-weight:700}
.ws-hl .hb,.tb-editor .hb{color:var(--m-1-t)}
.ws-hl .hs,.tb-editor .hs{color:var(--m-ok)}
.ws-hl .hz,.tb-editor .hz{color:var(--m-2-t)}
.ws-hl .hk{color:var(--mk-text-leise);font-style:italic}
.ws-typo{background:var(--m-falsch-h);color:var(--m-falsch);border-radius:2px;text-decoration:underline wavy var(--m-falsch);text-underline-offset:3px}
.ws-nbsp{background:var(--m-falsch-h);border-radius:2px;box-shadow:inset 0 -2px 0 var(--m-falsch)}

/* Leisten unter dem Editor */
.ws-leiste{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap}
.ws-leiste .knopf{font-size:14.5px;padding:7px 13px}
.ws-gruppe{display:inline-flex;gap:4px}
.ws-gruppe .knopf{min-width:42px}
.ws-schritt{margin-left:auto;font-size:14.5px;color:var(--mk-text);white-space:nowrap}
.ws-schritt b{color:var(--mk-akzent-dunkel-text)}
.knopf:disabled{opacity:.42;cursor:default;transform:none}

/* rechts: Variablen und Ausgabe */
.ws-block{display:flex;flex-direction:column;min-height:0;border:1px solid var(--mk-linie);border-radius:12px;background:var(--mk-flaeche);overflow:hidden}
.ws-titel{flex:none;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mk-text-leise);padding:6px 12px;background:var(--mk-flaeche-grau);border-bottom:1px solid var(--mk-linie)}
.ws-varblock{flex:none;max-height:42%}
.ws-varrahmen{overflow:auto;min-height:0}
.ws-var{width:100%;border-collapse:collapse;font-size:15px}
.ws-var th{text-align:left;font-size:13px;font-weight:700;color:var(--mk-text-leise);padding:4px 12px;border-bottom:1px solid var(--mk-linie-zart)}
.ws-var td{padding:4px 12px;border-bottom:1px solid var(--mk-linie-zart);vertical-align:top}
.ws-var .ws-vn{font-family:var(--ed-font);font-weight:700;color:var(--mk-text);white-space:nowrap}
.ws-var .ws-vt{font-size:13.5px;color:var(--mk-text-leise);white-space:nowrap}
.ws-var .ws-vw{font-family:var(--ed-font);color:var(--mk-text);word-break:break-all}
.ws-var tr.neu td{background:var(--mk-akzent-zart)}
.ws-var tr.neu .ws-vw{font-weight:800;color:var(--mk-akzent-dunkel-text)}
.ws-leer{color:var(--mk-text-leise);font-style:italic;font-family:var(--mk-schrift);font-size:15px}
.ws-ausblock{flex:1}
.ws-aus{flex:1;min-height:0;overflow:auto;padding:8px 12px;font-family:var(--ed-font);font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:var(--mk-text)}
.ws-aus .ws-ein{font-weight:800;color:var(--m-1-t)}
.ws-eingabe{font-family:var(--ed-font);font-size:15px;min-width:140px;width:45%;border:2px solid var(--mk-akzent);border-radius:6px;padding:2px 6px;background:var(--mk-akzent-zart);color:var(--mk-text);outline:none}
.ws-enter{font-family:var(--mk-schrift);font-size:13px;color:var(--mk-text-leise);margin-left:6px}
.ws-leise{color:var(--mk-text-leise);font-size:14px}

/* Meldungen in der Ausgabe */
.ws-fehler,.ws-hinweisbox,.ws-pruefung{white-space:normal;font-family:var(--mk-schrift);margin-top:8px;border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.4}
.ws-fehler{background:var(--m-falsch-h);border:1px solid var(--m-falsch)}
.ws-f-kopf{display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--m-falsch)}
.ws-f-text{font-family:var(--ed-font);font-size:15px;font-weight:700;color:var(--mk-text);margin:3px 0 4px;word-break:break-word}
.ws-de{color:var(--mk-text)}
.ws-de b{color:var(--mk-primaer-dunkel-text)}
.ws-fehler code,.ws-pruefung code,.ws-auftrag code,.ws-kopier-karte code{font-family:var(--ed-font);font-size:.95em;background:var(--mk-flaeche);border:1px solid var(--mk-linie);border-radius:5px;padding:0 4px}
.ws-korr{margin-top:6px;font-size:14px;padding:6px 12px}
.ws-hinweisbox{background:var(--m-hinweis-h);border:1px solid var(--m-hinweis)}
.ws-hb-kopf{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mk-text);margin-bottom:2px}
.ws-pruefung{border:1px solid var(--mk-linie);background:var(--mk-flaeche-leise)}
.ws-pruefung.ok{background:var(--m-ok-h);border-color:var(--m-ok)}
.ws-p-kopf{font-weight:800;color:var(--mk-text);margin-bottom:2px}
.ws-pruefung ul{margin:0;padding-left:4px;list-style:none}
.ws-pruefung li{font-size:14.5px;line-height:1.45;color:var(--mk-text)}
.ws-pruefung li.nein .ws-p-z{color:var(--m-falsch);font-weight:800}
.ws-pruefung li.ok .ws-p-z{color:var(--m-ok);font-weight:800}

/* Fenster „Code kopieren“ (eingebettet: kein Herunterladen) */
#ws-kopieren .fenster-karte{max-width:720px}
.ws-kopier-text{width:100%;height:280px;font-family:var(--ed-font);font-size:15px;line-height:1.45;border:1px solid var(--mk-linie);border-radius:8px;padding:8px;background:var(--mk-flaeche-leise);color:var(--mk-text);resize:vertical;margin:8px 0;box-sizing:border-box;white-space:pre;tab-size:4}

/* Titelbild: ein kleiner Editor */
.tb-karte{padding:16px 18px;width:340px;font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace}
.tb-editor{border:1px solid var(--mk-linie);border-radius:10px;background:var(--mk-flaeche-leise);padding:8px 0;font-size:16px;line-height:1.6;color:var(--mk-text)}
.tb-z{display:flex;gap:10px;padding:0 12px;white-space:pre}
.tb-z.akt{background:var(--mk-akzent-zart);box-shadow:inset 4px 0 0 var(--mk-akzent)}
.tb-n{color:var(--mk-text-leise);width:14px;text-align:right}
.tb-unten{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:10px;font-size:15px}
.tb-var{display:flex;gap:10px;border:1px solid var(--mk-linie);border-radius:8px;padding:6px 10px;background:var(--mk-akzent-zart);color:var(--mk-text);font-weight:700;align-self:start}
.tb-aus{border:1px solid var(--mk-linie);border-radius:8px;padding:6px 10px;color:var(--mk-text);background:var(--mk-flaeche)}

/* ---------- Handy: untereinander – Editor, Schritt-Leiste, Variablen, Ausgabe; die Schritt-Leiste bleibt beim Scrollen erreichbar ---------- */
html.handy .ws-folie{--ed-gr:15px}
html.handy .ws{height:auto;gap:10px}
html.handy .ws-kopf{flex-wrap:wrap;align-items:flex-start}
html.handy .ws-wahl{max-width:100%;width:100%;font-size:16px;min-height:42px}
html.handy .ws-auftrag{flex-basis:100%;font-size:16px}
html.handy .ws-kopfknoepfe{flex-wrap:wrap}
html.handy .ws-kopfknoepfe .knopf{font-size:15px}
html.handy .ws-haupt{display:flex;flex-direction:column;gap:10px}
html.handy .ws-links,html.handy .ws-rechts{display:contents}
html.handy .ws-editor{order:1;height:300px;flex:none}
html.handy .ws-lauf{order:2;position:sticky;bottom:0;z-index:4;background:var(--mk-flaeche);padding:6px 0;border-top:1px solid var(--mk-linie-zart)}
html.handy .ws-varblock{order:3;max-height:none}
html.handy .ws-ausblock{order:4;min-height:180px}
html.handy .ws-werkzeuge{order:5}
html.handy .ws-aus{max-height:none;font-size:15px}
html.handy .ws-leiste .knopf{font-size:15px}
html.handy .ws-schritt{flex-basis:100%;margin-left:0;font-size:15px}
html.handy .ws-var{font-size:15px}
html.handy .ws-var th,html.handy .ws-titel,html.handy .ws-var .ws-vt,html.handy .ws-status,html.handy .ws-f-kopf,html.handy .ws-hb-kopf,html.handy .ws-enter,html.handy .ws-leise{font-size:14px}
html.handy .ws-eingabe{font-size:16px;min-height:42px;width:100%;margin-top:4px}
html.handy .ws-tipp,html.handy .ws-pruefung li{font-size:15px}
html.handy .tb-karte{width:auto;max-width:330px}

/* Grundregel aller Werkzeuge: hidden gilt immer, auch wenn eine Klasse display:flex/grid setzt */
[hidden]{display:none!important}

/* ==== FENSTER: technik/fenster/fenster.css ==== */
/* Gemeinsames Fenster über der Folie (Eingabehilfe ⓘ, Rechnung …): Überlagerung, Karte, Kopf, Schließen-Knopf.
   Breite und Eigenes stehen beim jeweiligen Baustein (#hilfe, #rechnung). */
.fenster{position:fixed;inset:0;background:rgb(var(--mk-primaer-tief-rgb) / .6);z-index:120;display:none;padding:30px;overflow:auto}
.fenster.an{display:flex;align-items:flex-start;justify-content:center}
.fenster-karte{background:var(--mk-flaeche);border-radius:16px;width:100%;padding:18px 24px 22px;box-shadow:0 20px 46px rgb(var(--mk-schatten-rgb) / .3);font-size:17px;color:var(--mk-text)}
.fenster-kopf{display:flex;align-items:center;gap:12px;margin:-18px -24px 6px;padding:14px 24px 8px;position:sticky;top:-30px;background:var(--mk-flaeche);border-radius:16px 16px 0 0;z-index:1}
.fenster-kopf h3{font-size:24px;color:var(--mk-primaer-dunkel-text)}
.fenster-zu{margin-left:auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--mk-primaer-zart);color:var(--mk-primaer-dunkel-text);font-size:26px;font-weight:700;cursor:pointer;line-height:1}
@media print{.fenster{display:none!important}}
html.handy .fenster{padding:10px}
html.handy .fenster-karte{padding:12px 14px 16px;font-size:16px}
html.handy .fenster-kopf{margin:-12px -14px 6px;padding:10px 14px 6px;top:-10px}
html.handy .fenster-kopf h3{font-size:20px}
/* ==== /FENSTER ==== */
/* ==== EINGABEHILFE: technik/hilfe/eingabehilfe.css ==== */
#hilfeknopf{display:inline-flex;align-items:center;justify-content:center;padding:0}
#hilfeknopf svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round}
#hilfeknopf svg .punkt{fill:currentColor;stroke:none}
html.handy #hilfeknopf svg{width:20px;height:20px}
/* Fenster, Karte, Kopf, Schließen: technik/fenster/ (.fenster …) */
.hilfe-karte{max-width:760px}
.hilfe-inhalt ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;line-height:1.45}
.hilfe-inhalt kbd{font-family:ui-monospace,Consolas,monospace;font-size:15px;background:var(--mk-primaer-zart);border:1px solid var(--mk-primaer-linie);border-radius:6px;padding:1px 6px;color:var(--mk-primaer-dunkel-text);white-space:nowrap;overflow-wrap:anywhere}
.hilfe-tab{border-collapse:collapse;width:100%;margin-bottom:8px}
.hilfe-tab th{text-align:left;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mk-text-leise);padding:4px 8px;border-bottom:1px solid var(--mk-linie)}
.hilfe-tab td{padding:5px 8px;border-bottom:1px solid var(--mk-linie);vertical-align:middle}
.hilfe-tab td:first-child{width:34%}
@media print{#hilfeknopf{display:none!important}}
html.handy .hilfe-tab td:first-child{width:40%}
html.handy .hilfe-inhalt kbd{font-size:14px;white-space:normal;overflow-wrap:anywhere}
/* ==== /EINGABEHILFE ==== */
/* ==== RECHNUNG: technik/rechnung/rechnung.css ==== */
/* Fenster, Karte, Kopf, Schließen: technik/fenster/ (.fenster …) – hier nur das Eigene der Rechnung */
#rechnung{z-index:130}
.re-karte{max-width:880px;padding:18px 26px 24px;line-height:1.5}
.re-kopf{gap:10px;flex-wrap:wrap;margin:-18px -26px 6px;padding:14px 26px 8px}
.re-kopf h3{margin-right:auto}
.re-kopf .fenster-zu{margin-left:0}
.re-kopf .knopf{font-size:14px;padding:7px 14px}
.re-kopf .re-keinweg{font-size:14px;color:var(--mk-text-leise);max-width:30em}   /* statt „In Calculution übernehmen“, wenn kein exakter Weg */
.re-titelzeile{font-size:20px;font-weight:700;color:var(--mk-primaer-dunkel-text);margin:2px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.re-titelzeile math{font-size:22px;font-weight:400}
.re-art{font-size:14px;color:var(--mk-text-leise);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.re-art.vermutung{color:var(--mk-akzent-dunkel-text);font-weight:700}
.re-inhalt section{border-top:1px solid var(--mk-linie);padding-top:8px;margin-top:10px}
.re-inhalt h4{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mk-text-leise);margin-bottom:4px}
.re-inhalt h4 .re-gr{text-transform:none}
.re-absatz{margin:4px 0;overflow-x:auto}
.re-absatz math[display="block"]{margin:8px 0}
html.handy .re-karte{padding:12px 14px 16px}
html.handy .re-kopf{margin:-12px -14px 6px;padding:10px 14px 6px}
html.handy .re-kopf .knopf{font-size:15px}
html.handy .re-kopf .re-keinweg{order:9;flex-basis:100%;max-width:none}   /* eigene Zeile unter Titel, Druck und × */
html.handy .re-titelzeile{font-size:18px}
/* Seitenrahmen: Tabelle nur für den Druck (thead wiederholt die Kopfzeile auf jeder Seite); am Bildschirm unsichtbar */
.re-seite, .re-seite > tbody, .re-seite > tbody > tr, .re-seite > tbody > tr > td{display:block}
.re-seite > thead, .re-seite > tfoot{display:none}
.re-druckkopf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font-size:9.5pt;color:var(--mk-text);
  border-bottom:.6pt solid var(--mk-text-leise);padding-bottom:2.5mm;margin-bottom:6mm}
.re-druckkopf .re-dk-mitte{font-weight:700;text-align:center}
.re-druckkopf img{height:11mm;width:auto;justify-self:end}
/* Druck: wie die .tex gesetzt – Serifenschrift, dunkle Schrift, Abschnitte „Aufgabe“/„Lösungsweg“ fett, Schritte fett nummeriert.
   Seitenformat setzt drucken() (A4 hoch). */
@media print{
  html.re-druck body > *:not(#rechnung){display:none!important}
  html.re-druck body{background:none}
  html.re-druck #rechnung{display:block!important;position:static;background:none;padding:0;overflow:visible}
  html.re-druck .re-karte{box-shadow:none;max-width:none;padding:0;border-radius:0;background:none;
    font-family:"Latin Modern Roman","CMU Serif","Cambria","Times New Roman",serif;font-size:11pt;line-height:1.4;color:var(--tinte)}
  html.re-druck .re-seite{display:table;width:100%;border-collapse:collapse}
  html.re-druck .re-seite > thead{display:table-header-group}
  html.re-druck .re-seite > tfoot{display:table-footer-group}
  html.re-druck .re-druckfuss{height:16mm}                             /* unterer Rand, auf jeder Seite (tfoot) */
  html.re-druck .re-seite > tbody{display:table-row-group}
  html.re-druck .re-seite > tbody > tr, html.re-druck .re-seite > thead > tr{display:table-row}
  html.re-druck .re-seite > tbody > tr > td, html.re-druck .re-seite > thead > tr > td, html.re-druck .re-seite > tfoot > tr > td{display:table-cell;padding:0 20mm}   /* nur der Seitenrahmen, nicht Tabellen im Inhalt (Gauß: Koeffizientenschema) */   /* Seitenränder links/rechts (die Seite selbst hat keinen Rand) */
  html.re-druck .re-druckkopf{font-size:9pt;color:var(--tinte);border-bottom:.4pt solid var(--tinte);padding:14mm 0 2mm;margin-bottom:7mm}   /* oben: Seitenrand */
  html.re-druck .re-druckkopf img{height:10mm}
  html.re-druck .re-kopf, html.re-druck .re-titelzeile{display:none}   /* Fensterkopf und Überschrift: nur Aufgabe und Lösungsweg */
  html.re-druck .re-art{font-size:9.5pt;color:var(--tinte)}
  html.re-druck .re-inhalt section{border:none;padding:0;margin:0 0 5mm}   /* der Lösungsweg beginnt direkt nach der Aufgabe und bricht zwischen den Schritten um (Peter, 09.10.) */
  html.re-druck .re-inhalt h4{font-size:12pt;font-weight:700;letter-spacing:0;text-transform:none;color:var(--tinte);margin:0 0 2.5mm;break-after:avoid-page}   /* Überschrift nie allein am Seitenende */
  html.re-druck .re-absatz{overflow:visible;margin:0 0 2mm;break-inside:avoid-page}   /* ein Schritt bleibt beisammen */
  html.re-druck .re-absatz strong{color:var(--tinte);font-weight:700}
  html.re-druck .re-absatz math{font-size:1.05em}
  html.re-druck .re-absatz math[display="block"]{margin:2mm 0}
}
/* ==== /RECHNUNG ==== */
/* ==== EINBETTUNG: technik/einbettung/einbettung.css ==== */

<script data-einbettung="technik/einbettung/einbettung.js">
/* =====================================================================
   EINBETTUNG — Rolle und Port zu calculution. Die Form steht im Vertrag (eine Heimat, hier nicht abschreiben):
   ../calculution_live/__roadmap/_features/WERKZEUGE_VERTRAG_SCHMIEDE.md §1 (Port), §1d (kaputte Rolle), §1f, §2, §3.
   Quelle: technik/einbettung/ · eingesetzt am Ende des <head> (technik/einsetzen.py), also vor dem ersten Zeichnen.

     EB.rolle          'teacher' | 'student' – aus dem Einsetz-Block im Kopf, streng gelesen:
                       Block fehlt → 'teacher' (Datei außerhalb calculution) · Block da, Wert kaputt → 'student' (fail-closed)
     EB.port()         der von calculution überreichte MessagePort oder null; gleich nach Erhalt geht die Quittung
                       {typ:'bereit', version:1, werkzeug} darauf
     EB.schicke(n)     Nachricht auf den Port (true = gesendet); ohne Port false
   Ereignis 'einbettung-port' auf document, sobald der Port da ist.
   html[data-rolle] steht vor dem ersten Zeichnen; bei 'student' setzt RE.knopf keinen Knopf „Rechnung“.
   Das ist Verbergen für den Unterricht, keine Sicherheitsmaßnahme (Vertrag §2).
   ===================================================================== */
const EB = (() => {
  const root = document.documentElement;
  const block = document.querySelector('script[data-einsetzen]');
  // ROLLE undefiniert bei vorhandenem Block heißt: der Block lief nicht (Syntaxfehler beim Einsetzen) → ebenfalls 'student'
  const rolle = !block ? 'teacher'
    : (typeof ROLLE !== 'undefined' && (ROLLE === 'teacher' || ROLLE === 'student')) ? ROLLE : 'student';
  root.setAttribute('data-rolle', rolle);

  /* Port: nur vom einbettenden Fenster, nur die Bereit-Meldung in Version 1, genau ein Port. Der erste gilt.
     Der Ursprung ist in der Sandbox "null" und sagt nichts – die Herkunft beweist der Port (Vertrag §1). */
  let port = null;
  addEventListener('message', (e) => {
    if (port || window.parent === window || e.source !== window.parent) return;
    const d = e.data;
    if (!d || typeof d !== 'object' || d.typ !== 'calculution-bereit' || d.version !== 1 || !e.ports || e.ports.length !== 1) return;
    port = e.ports[0];
    // Quittung sofort auf den Port: calculution weiß, dass die Leitung steht, und kann ein Ausbleiben melden (Vertrag §1)
    const schluessel = (document.querySelector('meta[name="werkzeug-schluessel"]') || {}).content || '';
    port.postMessage({ typ: 'bereit', version: 1, werkzeug: schluessel });
    root.setAttribute('data-eingebettet', '');
    document.dispatchEvent(new CustomEvent('einbettung-port'));
  });
  const schicke = (n) => { if (!port) return false; port.postMessage(n); return true; };
  return { rolle, port: () => port, schicke };
})();
</script><!-- /EINBETTUNG -->

/* =====================================================================

     RE.alsAufgabe(dok)        Nutzlast für calculutions Creator (Form: Vertrag §1, §1b) – nur mit dok.aufgabe, sonst null
     RE.ausHtml(el)            angezeigtes HTML → LaTeX-Absatz (Formeln exakt über data-tex aus formel.js)
     RE.ausWeg(root, schritte) Dokument aus Aufgabe (.wz-aufgabe oder [data-aufgabe]) und Lösungsweg – benutzt von WZ.weg;
                               behält die Schritte (dok.schritte) für alsAufgabe

   Der Druck bleibt „druckbar wie jetzt“ (HTML, Browser) – kein Systemstandard; eine .tex-Datei gibt es nicht mehr.

   KOPFZEILE (Druck, jede Seite): links der Name der Marke, Mitte „Musterlösung“, rechts das Logo.
   Name und Logo kommen zur Laufzeit aus dem MARKE-Block (const MARKE im Rahmen) – calculution tauscht beides mit dem

const RE = (() => {
  /* ---------- HTML → LaTeX ---------- */
  /* Zeichen, die pdflatex (utf8, T1) nicht selbst kennt → Befehl. Gilt in Formeln (Befehl) und im Text (\ensuremath{Befehl}).

    '⊂': '\\subset', '⊆': '\\subseteq', '≡': '\\equiv', '≙': '\\overset{\\wedge}{=}', '∝': '\\propto', '∣': '\\mid', '∧': '\\wedge', '∨': '\\vee', '¬': '\\neg', '✓': '\\checkmark', '✗': '\\times',
    'ℝ': '\\mathbb{R}', 'ℕ': '\\mathbb{N}', 'ℤ': '\\mathbb{Z}', 'ℚ': '\\mathbb{Q}', '°': '^\\circ', '²': '^{2}', '³': '^{3}', '¹': '^{1}', '⁰': '^{0}', '⁴': '^{4}', '⁵': '^{5}', '⁶': '^{6}', '⁷': '^{7}', '⁸': '^{8}', '⁹': '^{9}', '⁻': '^{-}',
    '₀': '_{0}', '₁': '_{1}', '₂': '_{2}', '₃': '_{3}', '₄': '_{4}', '₅': '_{5}', '₆': '_{6}', '₇': '_{7}', '₈': '_{8}', '₉': '_{9}', 'ₙ': '_{n}', '′': "'", '″': "''",
    'α': '\\alpha', 'β': '\\beta', 'γ': '\\gamma', 'δ': '\\delta', 'ε': '\\varepsilon', 'ζ': '\\zeta', 'η': '\\eta', 'θ': '\\theta', 'κ': '\\kappa',
    'λ': '\\lambda', 'μ': '\\mu', 'ν': '\\nu', 'ξ': '\\xi', 'π': '\\pi', 'ρ': '\\rho', 'σ': '\\sigma', 'τ': '\\tau', 'φ': '\\varphi', 'χ': '\\chi',
    'ψ': '\\psi', 'ω': '\\omega', 'Γ': '\\Gamma', 'Δ': '\\Delta', 'Θ': '\\Theta', 'Λ': '\\Lambda', 'Π': '\\Pi', 'Σ': '\\Sigma', 'Φ': '\\Phi',

  /* \class{name}{inhalt} → {inhalt}, mit Klammerzählung (beliebig tief geschachtelt) */

    }

  function ausHtml(el){

      if (n.nodeType === 3) { grenze = false; aus += text(n.textContent.replace(/\s+/g, ' ')); return; }
      if (n.nodeType !== 1) return;
      if (grenze && aus && !/\s$/.test(aus)) aus += ' ';
      grenze = false;
      ausElement(n);
      grenze = true;
    };
    const ausElement = n => {
      const tag = n.tagName.toLowerCase();

      if (['div', 'p', 'li', 'section'].includes(tag)) aus += ' ';

    lauf(el);

  /* ---------- Zeichnung (SVG) → TikZ ---------- */
  /* Gemessen wird im Dokument: eine Kopie in einem unsichtbaren Wirt, Farben aus der hellen Fassung (Papier ist weiß, auch wenn
     die Seite dunkel steht). Koordinaten exakt über die Matrizen des Browsers (Verschiebungen, viewBox), Größe wie am Bildschirm:
     Breite aus width bzw. viewBox, 1 px = 1/96 Zoll, höchstens 16 cm. Kann es ein Element nicht übersetzen, merkt es sich das

  function svgTex(svg){
    const wirt = document.createElement('div');

    const k = svg.cloneNode(true); wirt.appendChild(k); document.body.appendChild(wirt);
    const root = document.documentElement, modus = root.getAttribute('data-modus');   // umschaltbare Marke: data-modus hell/dunkel (Spiegel)

    catch (e) { luecken.push('Fehler: ' + e.message); return ''; }

  function zeichnung(svg){

    const P = (M, x, y) => { const p = new DOMPoint(x, y).matrixTransform(M); return `(${zahl((p.x - vx) * s)},${zahl((vh - (p.y - vy)) * s)})`; };
    /* Dichte Polygonzüge ausdünnen (Douglas-Peucker, Abweichung < 0,003 cm ≈ 0,09 pt – unsichtbar): Kurven aus Tausenden Punkten
       sprengen sonst den Speicher von pdflatex. teile: '(x,y)' | '-- (x,y)' | anderes (Bogen, cycle) – nur Läufe gerader Stücke. */
    const duenn = teile => {
      const xy = t => t.match(/\(([-\d.]+),([-\d.]+)\)$/).slice(1).map(Number), aus = [];
      const dp = q => { const halt = new Uint8Array(q.length), st = [[0, q.length - 1]]; halt[0] = halt[q.length - 1] = 1;
        while (st.length){ const [a, b] = st.pop(), [x1, y1] = q[a], [x2, y2] = q[b], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); let m = -1, dm = 0.003;
          for (let i = a + 1; i < b; i++){ const d = L ? Math.abs(dy * (q[i][0] - x1) - dx * (q[i][1] - y1)) / L : Math.hypot(q[i][0] - x1, q[i][1] - y1); if (d > dm){ dm = d; m = i; } }
          if (m >= 0){ halt[m] = 1; st.push([a, m], [m, b]); } }
        return halt; };
      for (let i = 0; i < teile.length;){
        if (!/^(-- )?\(/.test(teile[i])) { aus.push(teile[i++]); continue; }
        let j = i + 1; while (j < teile.length && /^-- \(/.test(teile[j])) j++;
        const lauf = teile.slice(i, j); if (lauf.length > 3){ const h = dp(lauf.map(xy)); lauf.forEach((u, k) => { if (h[k]) aus.push(u); }); } else aus.push(...lauf);
        i = j;
      }
      return aus;
    };
    const farbe = c => { const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/.exec(c || ''); if (!m || m[4] === '0') return null;
      return { tex: `{rgb,255:red,${Math.round(+m[1])};green,${Math.round(+m[2])};blue,${Math.round(+m[3])}}`, a: m[4] === undefined ? 1 : +m[4] }; };
    const deckung = el => { let o = 1; for (let e = el; e && e !== svg.parentNode; e = e.parentNode) o *= +getComputedStyle(e).opacity; return o; };
    const sichtbar = el => { const cs = getComputedStyle(el); return cs.display !== 'none' && cs.visibility !== 'hidden'; };
    const stil = (el, M) => {
      const cs = getComputedStyle(el), o = [], d = deckung(el), sk = Math.sqrt(Math.abs(M.a * M.d - M.b * M.c));
      const st = cs.stroke !== 'none' && farbe(cs.stroke), fi = cs.fill !== 'none' && farbe(cs.fill);

        const op = st.a * (+cs.strokeOpacity) * d; if (op < 0.99) o.push(`draw opacity=${zahl(op)}`);
        if (cs.strokeDasharray && cs.strokeDasharray !== 'none'){ const t = cs.strokeDasharray.split(/[\s,]+/).map(parseFloat).filter(x => x > 0);
          if (t.length){ const L = t.length % 2 ? [...t, ...t] : t; o.push('dash pattern=' + L.map((x, i) => `${i % 2 ? 'off' : 'on'} ${zahl(x * sk * ptJe)}pt`).join(' ')); } }
        if (cs.strokeLinecap === 'round') o.push('line cap=round'); if (cs.strokeLinejoin === 'round') o.push('line join=round'); }
      if (fi){ o.push(`fill=${fi.tex}`); const op = fi.a * (+cs.fillOpacity) * d; if (op < 0.99) o.push(`fill opacity=${zahl(op)}`); }

      return o;

      const t = d.match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g) || [], aus = [];
      let i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0, kx = 0, ky = 0;
      const n = () => parseFloat(t[i++]);
      while (i < t.length){

        if (C === 'Z'){ aus.push('-- cycle'); x = sx; y = sy; continue; }
        if (C === 'M'){ x = ox + n(); y = oy + n(); sx = x; sy = y; aus.push(P(M, x, y)); cmd = rel ? 'l' : 'L'; }
        else if (C === 'L'){ x = ox + n(); y = oy + n(); aus.push('-- ' + P(M, x, y)); }
        else if (C === 'H'){ x = ox + n(); aus.push('-- ' + P(M, x, y)); }
        else if (C === 'V'){ y = oy + n(); aus.push('-- ' + P(M, x, y)); }
        else if (C === 'C' || C === 'S'){ let x1, y1; if (C === 'C'){ x1 = ox + n(); y1 = oy + n(); } else { x1 = 2 * x - kx; y1 = 2 * y - ky; }
          const x2 = ox + n(), y2 = oy + n(); x = ox + n(); y = oy + n(); kx = x2; ky = y2;
          aus.push(`.. controls ${P(M, x1, y1)} and ${P(M, x2, y2)} .. ${P(M, x, y)}`); continue; }
        else if (C === 'Q' || C === 'T'){ let qx, qy; if (C === 'Q'){ qx = ox + n(); qy = oy + n(); } else { qx = 2 * x - kx; qy = 2 * y - ky; }
          const ex = ox + n(), ey = oy + n();
          aus.push(`.. controls ${P(M, x + 2 / 3 * (qx - x), y + 2 / 3 * (qy - y))} and ${P(M, ex + 2 / 3 * (qx - ex), ey + 2 / 3 * (qy - ey))} .. ${P(M, ex, ey)}`);
          x = ex; y = ey; kx = qx; ky = qy; continue; }
        else { luecken.push(`path mit Befehl ${cmd}`); return null; }
        kx = x; ky = y;
      }
      return duenn(aus).join(' ');
    };
    const zeilen = [];
    const ausschnitt = el => {                                         // clip-path: url(#id) an el oder einem Vorfahren – nur ein Rechteck
      for (let e = el; e && e !== svg; e = e.parentNode){ const c = getComputedStyle(e).clipPath, m = /url\("?#([^")]+)"?\)/.exec(c || '');
        if (!m) continue;
        const r = svg.querySelector(`clipPath[id="${m[1]}"] rect`); if (!r) { luecken.push('clip-path ohne Rechteck'); return ''; }
        const M = innen.multiply(e.getScreenCTM()), X = r.x.baseVal.value, Y = r.y.baseVal.value, B = r.width.baseVal.value, Hh = r.height.baseVal.value;
        return `\\clip ${P(M, X, Y)} -- ${P(M, X + B, Y)} -- ${P(M, X + B, Y + Hh)} -- ${P(M, X, Y + Hh)} -- cycle;`; }
      return '';
    };
    const zeichne = (el, weg, o) => { if (!o.length) return; const c = ausschnitt(el), z = `\\path[${o.join(',')}] ${weg};`; zeilen.push(c ? `\\begin{scope}${c}${z}\\end{scope}` : z); };
    const lauf = el => {
      for (const e of el.children){
        const tag = e.tagName.toLowerCase();
        if (['defs', 'clippath', 'title', 'desc', 'marker', 'style', 'lineargradient', 'radialgradient', 'pattern', 'mask', 'symbol'].includes(tag)) continue;
        if (!sichtbar(e) || e.classList.contains('re-nicht')) continue;
        if (tag === 'g' || tag === 'a'){ lauf(e); continue; }
        const M = innen.multiply(e.getScreenCTM()), A = n => e[n].baseVal.value;
        if (tag === 'line') zeichne(e, `${P(M, A('x1'), A('y1'))} -- ${P(M, A('x2'), A('y2'))}`, stil(e, M));
        else if (tag === 'polyline' || tag === 'polygon'){ const p = duenn([...e.points].map((q, i) => (i ? '-- ' : '') + P(M, q.x, q.y))); if (p.length) zeichne(e, p.join(' ') + (tag === 'polygon' ? ' -- cycle' : ''), stil(e, M)); }
        else if (tag === 'path'){ const w = pfad(e.getAttribute('d') || '', M); if (w) zeichne(e, w, stil(e, M)); }
        else if (tag === 'rect'){ const X = A('x'), Y = A('y'), B = A('width'), Hh = A('height'); if (B && Hh) zeichne(e, `${P(M, X, Y)} -- ${P(M, X + B, Y)} -- ${P(M, X + B, Y + Hh)} -- ${P(M, X, Y + Hh)} -- cycle`, stil(e, M)); }
        else if (tag === 'circle' || tag === 'ellipse'){ const sk = Math.sqrt(Math.abs(M.a * M.d - M.b * M.c)) * s, rx = tag === 'circle' ? A('r') : A('rx'), ry = tag === 'circle' ? A('r') : A('ry');
          if (rx > 0 && ry > 0) zeichne(e, `${P(M, A('cx'), A('cy'))} ellipse[x radius=${zahl(rx * sk)}, y radius=${zahl(ry * sk)}]`, stil(e, M)); }
        else if (tag === 'text'){
          const inhalt = [...e.childNodes].map(c => c.nodeType === 3 ? text(c.textContent) : c.nodeType === 1 && c.tagName.toLowerCase() === 'tspan'

          const anker = hatXY ? (seite ? 'base ' + seite : 'base') : mitteB ? (seite || 'center') : 'center';

          const gr = GROESSEN.reduce((a, b) => Math.abs(b[0] - pt) < Math.abs(a[0] - pt) ? b : a)[1];
          const fi = farbe(cs.fill), o = ['inner sep=0pt', `anchor=${anker}`, `font=${gr}${+cs.fontWeight >= 600 ? '\\bfseries' : ''}`];
          if (fi) o.push(`text=${fi.tex}`);
          const rand = /^stroke/.test(cs.paintOrder || '') && cs.stroke !== 'none' && farbe(cs.stroke);   // Schrift mit Rand in Papierfarbe (paint-order: stroke) → hinterlegt
          if (rand) o.splice(0, 1, 'inner sep=1pt', `fill=${rand.tex}`);
          const c = ausschnitt(e), z = `\\node[${o.join(',')}] at (${zahl((m.x - vx) * s)},${zahl((vh - (m.y - vy)) * s)}) {${inhalt}};`;
          zeilen.push(c ? `\\begin{scope}${c}${z}\\end{scope}` : z);
        }
        else luecken.push(`Element ${tag}`);
      }
    };
    lauf(svg);
    if (!zeilen.length) return '';
    // je Befehl eine Zeile (\u0004 übersteht das Zusammenziehen der Leerräume in ausHtml): pdflatex liest höchstens 200 000 Zeichen je Zeile
    const bild = `\\useasboundingbox (0,0) rectangle (${zahl(W)},${zahl(H)});\u0004${zeilen.join('\u0004')}\u0004`;
    // klein (Strichliste im Satz): in der Zeile; sonst als eigener Block, mittig
    return H < 1.2 ? `\\tikz[baseline={([yshift=-0.6ex]current bounding box.center)}]{${bild}}`
      : ` \\par{\\centering\\begin{tikzpicture}${bild}\\end{tikzpicture}\\par} `;
  }
  /* ---------- Dokument ---------- */
  /* Markup-Absatz ('Text $…$ $$…$$ **fett**'): Text maskiert (%, &, _ … sonst schneidet pdflatex still ab), Formeln über mathe() */
  // Fett zuerst als Platzhalter (\u0001 … \u0002): **…** darf Formeln umschließen („**Eintauchzahl $N = 10$**“)
  const absatzTex = t => t.replace(/\*\*([\s\S]+?)\*\*/g, '\u0001$1\u0002').split(/(\$\$[\s\S]+?\$\$|\$[^$]+\$)/).map(s =>
    /^\$\$[\s\S]+\$\$$/.test(s) ? `\n\\[ ${mathe(s.slice(2, -2))} \\]\n` : /^\$[^$]+\$$/.test(s) ? `\\(${mathe(s.slice(1, -1))}\\)` : text(s))
    .join('').replace(/\u0001/g, '\\textbf{').replace(/\u0002/g, '}');
  /* ---------- Marke: Name und Logo aus der Kopfleiste der Seite ---------- */
  const MITTE = 'Musterlösung';
  const marke = () => ({ name: typeof MARKE !== 'undefined' ? MARKE.name : ((document.querySelector('.kopf .schule') || {}).textContent || '').trim(),
    logo: typeof MARKE !== 'undefined' ? MARKE.logo : typeof LOGO !== 'undefined' ? LOGO : ((document.querySelector('.kopf img') || {}).src || ''),
    kurs: typeof KURS !== 'undefined' ? KURS : '' });
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  /* dieselbe Kopfzeile für den Druck (wiederholt sich auf jeder Seite: thead) */
  function druckkopf(){
    const { name, logo } = marke();
    return `<div class="re-druckkopf"><span>${esc(name)}</span><span class="re-dk-mitte">${esc(MITTE)}</span>${logo ? `<img src="${esc(logo)}" alt="">` : '<span></span>'}</div>`;
  }
  const absatzHtml = t => M(t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'));
  function alsHtml(dok){
    return dok.abschnitte.map(a => `<section><h4>${a.titel.replace('ε', '<span class="re-gr">ε</span>')}</h4>${a.absaetze.map(x => `<div class="re-absatz">${typeof x === 'string' ? absatzHtml(x) : x.html}</div>`).join('')}</section>`).join('');
  }
  /* ---------- Fenster ---------- */
  let fenster = null, aktuell = null, ausloeser = null;
  function baue(){
    fenster = FENSTER.neu('rechnung', 're-titel', () => schliesse());           // technik/fenster/: Überlagerung, Navigation ruht
    addEventListener('keydown', e => { if (e.key === 'Escape' && offen()) schliesse(); });
    addEventListener('afterprint', () => { document.documentElement.classList.remove('re-druck'); const st = document.getElementById('re-seite'); if (st) st.remove(); });
  }

    if (!fenster) baue();
    aktuell = dok; ausloeser = document.activeElement;
    fenster.innerHTML = `<div class="re-karte fenster-karte"><table class="re-seite"><thead><tr><td>${druckkopf()}</td></tr></thead><tfoot><tr><td><div class="re-druckfuss"></div></td></tr></tfoot><tbody><tr><td>
      <div class="re-kopf fenster-kopf"><h3 id="re-titel">Rechnung</h3>
        <button type="button" class="knopf hell" data-re="druck">Als PDF drucken</button>
        <button type="button" class="knopf" data-re="uebernehmen" hidden>In Calculution übernehmen</button><span class="re-keinweg" data-re="keinweg" hidden>${KEIN_WEG}</span>
        <button type="button" class="re-zu fenster-zu" aria-label="Rechnung schließen">×</button></div>
      <p class="re-titelzeile">${dok.titel}${dok.formel ? ' ' + F(dok.formel) : ''}</p>
      ${dok.art ? `<p class="re-art${dok.vermutung ? ' vermutung' : ''}">${absatzHtml(dok.art)}</p>` : ''}
      <div class="re-inhalt">${alsHtml(dok)}</div>
    </td></tr></tbody></table></div>`;
    eigeneIds(fenster.querySelector('.re-inhalt'));
    fenster.classList.add('an');
    fenster.querySelector('.re-zu').onclick = schliesse;
    fenster.querySelector('[data-re="druck"]').onclick = drucken;
    fenster.querySelector('[data-re="uebernehmen"]').onclick = uebernehmen;
    zeigeUebernehmen();
    fenster.querySelector('.re-zu').focus(); fenster.scrollTop = 0;
  }
  /* Kopien von Zeichnungen tragen dieselben ids wie das Original auf der Folie: url(#…) träfe sonst das Original (verborgen →
     Kurve weg, z. B. clip-path der Skizzen). Im Fenster bekommt jede id einen eigenen Namen, die Verweise ziehen mit. */
  function eigeneIds(el){
    const ids = [...el.querySelectorAll('[id]')]; if (!ids.length) return;
    const neu = new Map(ids.map((e, i) => [e.id, `re${i}-${e.id}`]));
    ids.forEach(e => { e.id = neu.get(e.id); });
    const zieh = v => v.replace(/url\(\s*["']?#([^"')\s]+)["']?\s*\)/g, (m, id) => neu.has(id) ? `url(#${neu.get(id)})` : m);
    el.querySelectorAll('*').forEach(x => { for (const at of [...x.attributes]){
      if (at.value.includes('url(')) x.setAttribute(at.name, zieh(at.value));
      else if (/href$/.test(at.name) && at.value.startsWith('#') && neu.has(at.value.slice(1))) x.setAttribute(at.name, '#' + neu.get(at.value.slice(1))); } });
  }

  function schliesse(){ fenster.classList.remove('an'); if (ausloeser && ausloeser.focus) ausloeser.focus(); }
  /* ---------- Übernehmen in calculution ---------- */
  /* Ohne exakten Weg (Näherung, Verfahren fehlt im Werkzeug) gibt es keine Aufgabe: Dann steht statt des Knopfs EIN Satz für alle
     Werkzeuge – kein Verweis auf andere Werkzeuge, deren Namen sich noch ändern (Peter, 27.10.: „global sauberer Platzhalter“). */
  const KEIN_WEG = 'Für diese Aufgabe gibt es hier keinen exakten Lösungsweg – deshalb keine Übernahme.';

  const darfUebernehmen = () => lehrkraftEingebettet() && uebernehmbar();

  }

  function uebernehmen(){

    k.textContent = ok ? 'An Calculution übergeben' : 'Übergabe nicht möglich'; k.disabled = true;

  /* Drucken: A4 hoch – als eigene Regel, solange gedruckt wird (die Präsentation selbst druckt A4 quer;

  function drucken(){

  /* ---------- aus einem Lösungsweg (WZ.weg) ---------- */
  /* Bereich (Element) → Absatz { html: wie angezeigt, tex: daraus } – ohne Eingaben, Knöpfe, ausgeblendetes */
  function bereich(el){
    const k = el.cloneNode(true);
    k.querySelectorAll('input, button, select, .knopfleiste, .rechts, .wz-gleich, [hidden], .re-nicht').forEach(e => e.remove());
    return { html: k.innerHTML, tex: ausHtml(k) };
  }
  function ausBereichen({ titel, aufgabe, teile = []}){
    const abschnitte = [];
    if (aufgabe){ const a = bereich(aufgabe); if (a.tex) abschnitte.push({ titel: 'Aufgabe', absaetze: [a] }); }
    teile.forEach(([t, el]) => { if (!el) return; const a = bereich(el); if (a.tex) abschnitte.push({ titel: t, absaetze: [a] }); });
    return { titel, abschnitte };
  }
  function knopf(nachbar, dok){
    if (typeof EB !== 'undefined' && EB.rolle === 'student') return null;   // Rolle student: kein Knopf (technik/einbettung/, Vertrag §2)

    const k = document.createElement('button'); k.type = 'button'; k.className = 'knopf hell'; k.dataset.re = 'rechnung'; k.textContent = 'Rechnung';
    nachbar.after(k); k.onclick = () => { const d = dok(); if (d && d.abschnitte.length) zeige(d); };
    return k;
  }
  function ausWeg(root, schritte){
    const folie = root.closest('.slide'), h2 = folie && folie.querySelector('h2');
    const aufgabe = root.querySelector('.wz-aufgabe') || root.querySelector('[data-aufgabe]') || (root.closest('.slide') || root).querySelector('[data-aufgabe]');

    if (aufgabe){ const a = bereich(aufgabe); if (a.tex) abschnitte.push({ titel: 'Aufgabe', absaetze: [a] }); }   // ohne Eingabe und „=“ davor
    abschnitte.push({ titel: 'Lösungsweg', absaetze: schritte.map(([was, html], i) => {
      const d = document.createElement('div'), w = document.createElement('span'); d.innerHTML = html; w.innerHTML = was;
      d.querySelectorAll('.re-nicht').forEach(e => e.remove());                // nur für den Bildschirm: nicht ins Dokument

  }

  /* Ein Schritt [was, html] → Zeilen für align*: jede Formel (data-tex) eine Zeile, Glieder einer Kette („= …“) hängen an der
     Formel davor. Text (auch .hin) ist eine Anmerkung zu DER Formel, neben der er steht: hinter ihr, oder – vor der ersten Formel –
     zu dieser. Die erste Zeile trägt den Schritttitel („Titel: Anmerkung“), weitere Zeilen nur ihre Anmerkung. Bindewörter fallen weg. */
  const BINDEWORT = /^(und|oder|bzw\.?|sowie|[,;:]|=)$/;
  function schrittZeilen(was, html){
    const d = document.createElement('div'); d.innerHTML = html;

    const lauf = n => {

        if (s && !BINDEWORT.test(s)) (zeilen.length ? zeilen[zeilen.length - 1].notizen : vorab).push(s); return; }
      if (n.nodeType !== 1 || n.hidden || (n.classList && n.classList.contains('re-nicht'))) return;
      if (n.tagName.toLowerCase() === 'math'){
        const f = mathe(ohneClass(n.getAttribute('data-tex') || n.textContent)).trim();
        if (/^=/.test(f) && zeilen.length) zeilen[zeilen.length - 1].f += ' ' + f;

      }

    };

    const titel = text(was.replace(/<[^>]+>/g, '').trim());
    const notiz = l => l.map(text).join('; ');
    if (!zeilen.length) return [`&&| \\text{${titel}${vorab.length ? ': ' + notiz(vorab) : ''}}`];
    return zeilen.map((z, i) => ausrichten(z.f) + (i === 0 ? ` &&| \\text{${titel}${z.notizen.length ? ': ' + notiz(z.notizen) : ''}}`
      : z.notizen.length ? ` &&| \\text{${notiz(z.notizen)}}` : ''));
  }
  /* am ersten „=“ außerhalb von Klammern ausrichten; ohne „=“ steht die Formel rechts der Ausrichtung */
  function ausrichten(f){
    let tiefe = 0;
    for (let i = 0; i < f.length; i++){
      const c = f[i];
      if (c === '\\'){ i++; continue; }
      if (c === '{') tiefe++; else if (c === '}') tiefe--;
      else if (c === '=' && !tiefe) return i ? `${f.slice(0, i).trim()} &= ${f.slice(i + 1).trim()}` : `&= ${f.slice(1).trim()}`;
    }
    return `&${f}`;
  }
  const schluessel = () => ((document.querySelector('meta[name="werkzeug-schluessel"]') || {}).content || '');
  /* ein Lösungsblock des Werkzeugs: **fett** (aus ausHtml) → \\textbf; eine mehrzeilige Formel im Text (aligned) wird abgesetzt */
  const blockTex = tex => tex.trim().replace(/\*\*([\s\S]+?)\*\*/g, '\\textbf{$1}')
    .replace(/\\\((\\begin\{aligned\}[\s\S]*?\\end\{aligned\})\\\)/g, '\n\\[$1\\]\n');
  function alsAufgabe(dok){
    const a = dok && dok.aufgabe;
    if (!a || !(a.loesung || (dok.schritte && dok.schritte.length))) return null;
    if (!Array.isArray(a.hinweise) || a.hinweise.length !== 3) throw new Error('RE.alsAufgabe: genau drei Hinweise (Einstieg, Methode, Fehlerquelle)');
    /* Lösung: aus den Schritten als align* (Formelketten, Muster Brüche) – oder vom Werkzeug als Blöcke [[titel, tex], …]
       (Muster Gauß: Koeffizientenschemata), gesetzt wie calculutions Systemmodule: \textbf{1. Titel:}, darunter der Block */
    const weg = a.loesung
      ? a.loesung.map(([was, tex], i) => `\\textbf{${i + 1}. ${text(was)}:}\n\n${blockTex(tex)}`).join('\n\n\\medskip\n')
      : `\\begin{align*}\n${dok.schritte.flatMap(([was, html]) => schrittZeilen(was, html)).join(' \\\\\n')}\n\\end{align*}`;
    const vorschlag = typeof WERKZEUG_META !== 'undefined' ? WERKZEUG_META : {};
    const meta = { afb: vorschlag.afb, punkte: a.punkte, ...(vorschlag.stufe ? { stufe: vorschlag.stufe } : {}),
      ...(vorschlag.tags ? { tags: [...vorschlag.tags] } : {}), ...(a.meta || {}) };
    return {
      title: a.titel,
      task: absatzTex(a.text).trim(),
      solution: `${weg}${a.loesung ? '\n\n\\medskip\n' : '\n'}\\textbf{Ergebnis:} \\(${mathe(ohneClass(a.ergebnis))}\\)`,
      hints: a.hinweise.map(h => absatzTex(h).trim()),
      mchoices: null,
      meta,
      verification: { quelle: 'werkzeug', werkzeug: schluessel(), exakt_gerechnet: true },
    };
  }
  const svgLuecken = () => { const l = luecken; luecken = []; return l; };   // was eine Zeichnung nicht übersetzen konnte (seit der letzten Abfrage)
  return { zeige, alsAufgabe, alsHtml, ausHtml, ausWeg, ausBereichen, knopf, offen, schliesse, aktuell: () => aktuell, text, svgLuecken };
})();

    mit(...bl){

        (b.hinweise || []).forEach(x => { if (!h.includes(x)) h.push(x); });

      hinweise: ['Dezimalzahlen mit Komma oder Punkt, Brüche mit Schrägstrich: `3/4`. Statt gemischter Zahl `1 1/2` lieber `3/2` oder `1,5`.'],

/* =====================================================================

     FENSTER.neu(id, titelId, schliesse)  Fenster-Element (role="dialog", aria-modal) anlegen; Klick auf den Rand schließt
     FENSTER.offen()                      ist irgendein Fenster offen?
   Solange ein Fenster offen ist, RUHT die Navigation der Präsentation: Pfeile, Leertaste, Enter, Bild auf/ab, Pos1/Ende,
   O, F … erreichen die Folien nicht (Tastendruck wird vor dem Rahmen abgefangen). Esc und H bleiben bei den Fenstern.
   ===================================================================== */
const FENSTER = (() => {
  const alle = [];
  const offen = () => alle.some(f => f.classList.contains('an'));
  addEventListener('keydown', e => {
    if (!offen() || ['Escape', 'Tab', 'h', 'H', '?'].includes(e.key)) return;
    e.stopImmediatePropagation();                                    // die Folie dahinter blättert nicht weiter
  }, true);
  function neu(id, titelId, schliesse){
    const f = document.createElement('div');
    f.id = id; f.className = 'fenster'; f.setAttribute('role', 'dialog'); f.setAttribute('aria-modal', 'true'); f.setAttribute('aria-labelledby', titelId);
    document.body.appendChild(f); alle.push(f);
    f.addEventListener('click', e => { if (e.target === f) schliesse(); });
    return f;
  }
  return { neu, offen };
})();

/* =====================================================================
   WERKSTATT — Editor links, Ausgabe rechts, Schritt für Schritt mit markierter Zeile und Variablentabelle.
   Der Motor (PY, py_motor.js) rechnet; hier nur Oberfläche. Schritt zurück = Neuablauf bis Schritt n − 1 mit den
   aufgezeichneten Eingaben (der Lauf ist eindeutig, nichts wird kopiert).
   Je Folie: <div class="interaktiv ws" data-werkstatt="<schlüssel in WERKSTATT>">, gebaut von WS_HTML (teil_folien.js).
   Zustand für Probe und Bilder: data-status, data-schritt, data-zeile am Element.
   ===================================================================== */
/* Keine Übergabe an calculution (Rechnung, TeX): erst nach einem Vertragsnachtrag. Die Einbettungsprobe prüft dann Rolle und Port, nicht die Rechnung. */
document.documentElement.setAttribute('data-ohne-rechnung', '');
const WS = (() => {
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const EINR = '    ';
  const KW = new Set(['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except',
    'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']);
  const BI = new Set(['print', 'input', 'int', 'float', 'str', 'bool', 'len', 'range', 'type', 'abs', 'round', 'min', 'max', 'sum', 'divmod', 'pow', 'chr', 'ord',
    'repr', 'tuple', 'exit', 'quit']);
  const eingebettet = (() => { try { return window.parent !== window; } catch (e) { return true; } })();

  /* ---------- Farben im Quelltext (nur Anzeige; der Motor zerlegt selbst) ---------- */
  function farben(q) {
    let aus = '', i = 0;
    const n = q.length;
    while (i < n) {
      const c = q[i];
      if (c === '#') { let j = q.indexOf('\n', i); if (j < 0) j = n; aus += `<i class="hk">${esc(q.slice(i, j))}</i>`; i = j; continue; }
      const pre = /^([rRuUbBfF]{0,2})(['"])/.exec(q.slice(i, i + 4));
      if ((c === '"' || c === "'" || (pre && /[A-Za-z]/.test(c))) && pre && (i === 0 || !/[\w]/.test(q[i - 1]))) {
        const qu = pre[2], drei = q.substr(i + pre[1].length, 3) === qu.repeat(3);
        let j = i + pre[1].length + (drei ? 3 : 1);
        while (j < n) {
          if (q[j] === '\\') { j += 2; continue; }
          if (!drei && q[j] === '\n') break;
          if (q.startsWith(drei ? qu.repeat(3) : qu, j)) { j += drei ? 3 : 1; break; }
          j++;
        }
        aus += `<span class="hs">${zeichenMarken(q.slice(i, j))}</span>`; i = j; continue;
      }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(q[i + 1] || ''))) {
        const m = /^(0[xXoObB][0-9a-fA-F_]+|(\d[\d_]*\.?[\d_]*|\.\d[\d_]*)([eE][+-]?\d+)?[jJ]?)/.exec(q.slice(i));
        aus += `<span class="hz">${esc(m[0])}</span>`; i += m[0].length; continue;
      }
      if (/[\p{L}_]/u.test(c)) {
        const m = /^[\p{L}\p{N}_]+/u.exec(q.slice(i));
        const w = m[0];
        aus += KW.has(w) ? `<b class="hw">${w}</b>` : BI.has(w) ? `<span class="hb">${w}</span>` : esc(w);
        i += w.length; continue;
      }
      aus += zeichenMarken(c); i++;
    }
    return aus;
  }
  /* Zeichen, die man im Editor kaum sieht oder verwechselt: markiert, aber in derselben Breite */
  const zeichenMarken = (s) => esc(s).replace(/[“”„‟‘’‚‛«»]/g, (z) => `<span class="ws-typo" title="typografisches Zeichen">${z}</span>`)
    .replace(/ /g, '<span class="ws-nbsp" title="geschütztes Leerzeichen"> </span>');

  /* ---------- Aufgaben im Dateiformat der Werkstatt (# TITEL:, # PRÜFE:, # === START ===, # === LÖSUNG ===) ---------- */
  function liesAufgabe(text) {
    const zeilen = text.replace(/\r\n?/g, '\n').split('\n');
    if (!zeilen.some((z) => /^#\s*TITEL:/.test(z))) return null;
    const a = { titel: '', text: '', tipps: [], pruefe: [], start: null, loesung: null };
    let feld = null, teil = 'kopf';
    const start = [], loesung = [], rest = [];
    for (const z of zeilen) {
      if (/^#\s*===\s*START\s*===/.test(z)) { teil = 'start'; continue; }
      if (/^#\s*===\s*LÖSUNG\s*===/.test(z)) { teil = 'loesung'; continue; }
      if (teil === 'start') { start.push(z); continue; }
      if (teil === 'loesung') { loesung.push(z); continue; }
      const m = /^#\s*(TITEL|BESCHREIBUNG|TIPP|PRÜFE):\s?(.*)$/.exec(z);
      if (m) {
        feld = m[1];
        if (feld === 'TITEL') a.titel = m[2].trim();
        else if (feld === 'BESCHREIBUNG') a.text = m[2].trim();
        else if (feld === 'TIPP') a.tipps.push(m[2].trim());
        else {
          const p = m[2].indexOf('->');
          if (p >= 0) {
            const e = m[2].slice(0, p).trim();
            a.pruefe.push([e === '-' || e === '' ? [] : e.split('|').map((x) => x.trim()), m[2].slice(p + 2).trim()]);
          }
        }
        continue;
      }
      const weiter = /^#\s{2,}(.*)$/.exec(z);
      if (weiter && feld === 'BESCHREIBUNG') { a.text += ' ' + weiter[1].trim(); continue; }
      if (weiter && feld === 'TIPP') { a.tipps[a.tipps.length - 1] += ' ' + weiter[1].trim(); continue; }
      feld = null;
      if (z.trim() || rest.length) rest.push(z);
    }
    const ohneLeer = (l) => l.join('\n').replace(/^\n+|\n+$/g, '') + '\n';
    a.start = start.length ? ohneLeer(start) : ohneLeer(rest);
    a.loesung = loesung.length ? ohneLeer(loesung) : null;
    a.text = a.text.replace(/`([^`]+)`/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1');
    return a;
  }

  /* ---------- eine Werkstatt ---------- */
  function baue(root) {
    const inhalt = WERKSTATT[root.dataset.werkstatt];
    const R = (r) => root.querySelector(`[data-r="${r}"]`);
    const ta = R('code'), hl = R('hl'), nrn = R('nrn'), wahl = R('wahl'), ausEl = R('aus'), varEl = R('var');
    const S = {
      programme: [...inhalt.beispiele.map((b) => ({ art: 'beispiel', name: b.name, start: b.code })),
        ...inhalt.aufgaben.map((a) => ({ art: 'aufgabe', name: a.titel, start: a.start, a }))],
      aktuell: null, eigene: null, tipp: 0,
      eingaben: [], schritt: 0, ergebnis: null, fertig: false, vorige: null, geschafft: new Set(),
    };

    /* Auswahl: Beispiele und Aufgaben */
    function fuelleWahl() {
      const gruppe = (titel, art) => {
        const p = S.programme.map((x, i) => [x, i]).filter(([x]) => x.art === art);
        return p.length ? `<optgroup label="${titel}">${p.map(([x, i]) => `<option value="${i}">${esc(x.name)}${S.geschafft.has(i) ? ' ✓' : ''}</option>`).join('')}</optgroup>` : '';
      };
      wahl.innerHTML = gruppe('Beispiele', 'beispiel') + gruppe('Aufgaben', 'aufgabe') + gruppe('Geöffnet', 'datei');
      if (S.aktuell !== null) wahl.value = String(S.aktuell);
    }
    function waehle(i) {
      S.aktuell = i; S.eigene = null; S.tipp = 0;
      const p = S.programme[i];
      ta.value = p.start;
      wahl.value = String(i);
      const a = p.a;
      R('auftrag').innerHTML = a ? `<b>Aufgabe:</b> ${esc(a.text)}<span class="ws-tipps" data-r="tipps"></span>`
        : p.art === 'datei' ? `<b>Geöffnet:</b> ${esc(p.name)}` : 'Ausführen oder Schritt für Schritt ansehen – und den Code gern verändern.';
      R('pruefen').hidden = !(a && a.pruefe.length);
      R('loesung').hidden = !(a && a.loesung);
      R('loesung').textContent = 'Lösung zeigen';
      R('tipp').hidden = !(a && a.tipps && a.tipps.length);
      zeigeStatus();
      neu();
    }
    function zeigeStatus() {
      const p = S.programme[S.aktuell], st = R('status');
      st.hidden = !(p && p.a && p.a.pruefe.length);
      const ok = S.geschafft.has(S.aktuell);
      st.textContent = ok ? '✓ geschafft' : 'offen';
      st.className = 'ws-status ' + (ok ? 'ok' : 'offen');
    }

    /* ---------- Editor ---------- */
    function malen() {
      const q = ta.value, n = q.split('\n').length, E = S.ergebnis;
      let akt = 0, vor = 0, fz = 0, hw = 0;
      if (E) {
        if (E.status === 'halt' || E.status === 'eingabe') { akt = E.zeile; vor = E.status === 'halt' ? E.vorher : 0; }
        else if (E.status === 'fehler') fz = E.fehler.zeile;
        else if (E.status === 'hinweis' || E.status === 'grenze') hw = (E.hinweis && E.hinweis.zeile) || E.zeile;
        else if (E.status === 'ende') vor = E.zeile;
      }
      const klasse = (k) => (k === akt ? ' akt' : '') + (k === vor && k !== akt ? ' vor' : '') + (k === fz ? ' fz' : '') + (k === hw ? ' hwz' : '');
      nrn.innerHTML = Array.from({ length: n }, (_, k) => `<div class="nr${klasse(k + 1)}">${k + 1}</div>`).join('');
      hl.innerHTML = farben(q).split('\n').map((z, k) => `<span class="zl${klasse(k + 1)}">${z || ' '}</span>`).join('');
      scrollen();
    }
    function scrollen() { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; nrn.scrollTop = ta.scrollTop; }
    function zeileSichtbar(z) {
      if (!z) return;
      const zh = parseFloat(getComputedStyle(ta).lineHeight) || 22, oben = (z - 1) * zh, pad = 10;
      if (oben < ta.scrollTop) ta.scrollTop = Math.max(0, oben - zh);
      else if (oben + zh + 2 * pad > ta.scrollTop + ta.clientHeight) ta.scrollTop = oben + 2 * zh + 2 * pad - ta.clientHeight;
      scrollen();
    }
    /* Text einsetzen, sodass Rückgängig (Strg+Z) erhalten bleibt */
    function setze(text, a, b) {
      ta.focus();
      ta.setSelectionRange(a, b);
      let ok = false;
      try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
      if (!ok) { ta.setRangeText(text, a, b, 'end'); ta.dispatchEvent(new Event('input')); }
      /* Chrome lässt den Cursor nach dem Löschen am Textende vor dem letzten Zeilenumbruch stehen – Lage ausdrücklich setzen */
      ta.setSelectionRange(a + text.length, a + text.length);
    }
    const zeilenAnfang = (pos) => ta.value.lastIndexOf('\n', pos - 1) + 1;
    function ruecke(richtung) {
      const q = ta.value, a = zeilenAnfang(ta.selectionStart);
      let b = ta.selectionEnd;
      if (b > a && q[b - 1] === '\n') b--;
      const ende = q.indexOf('\n', b) < 0 ? q.length : q.indexOf('\n', b);
      const block = q.slice(a, ende);
      const neuBlock = block.split('\n').map((z) => richtung > 0 ? EINR + z : z.replace(/^ {1,4}/, '').replace(/^\t/, '')).join('\n');
      setze(neuBlock, a, ende);
      ta.setSelectionRange(a, a + neuBlock.length);
      if (a === ende || block.indexOf('\n') < 0) { const p = a + (neuBlock.length - neuBlock.trimStart().length); ta.setSelectionRange(p, p); }
    }
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') { e.preventDefault(); if (e.shiftKey) ruecke(-1); else if (ta.selectionStart !== ta.selectionEnd && ta.value.slice(ta.selectionStart, ta.selectionEnd).includes('\n')) ruecke(1); else setze(EINR, ta.selectionStart, ta.selectionEnd); return; }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ausfuehren(); return; }
      if (e.key === 'Enter' && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        const a = zeilenAnfang(ta.selectionStart), z = ta.value.slice(a, ta.selectionStart);
        let einr = /^[ \t]*/.exec(z)[0];
        if (/:\s*(#.*)?$/.test(z)) einr += EINR;
        setze('\n' + einr, ta.selectionStart, ta.selectionEnd);
        return;
      }
      if (e.key === 'Backspace' && ta.selectionStart === ta.selectionEnd) {
        const p = ta.selectionStart, a = zeilenAnfang(p), vor = ta.value.slice(a, p);
        if (vor.length && /^ +$/.test(vor)) { e.preventDefault(); const weg = vor.length % 4 || 4; setze('', p - weg, p); }
      }
    });
    ta.addEventListener('input', () => { if (S.ergebnis || S.schritt) neu(); else malen(); });
    ta.addEventListener('scroll', scrollen);

    /* ---------- Laufen ---------- */
    function neu() {
      S.eingaben = []; S.schritt = 0; S.ergebnis = null; S.fertig = false; S.vorige = null;
      zeige();
    }
    function lauf(bis) {
      let r;
      try { r = PY.lauf(ta.value, { eingaben: S.eingaben, bis }); } catch (e) {
        r = { status: 'hinweis', hinweis: { text: 'Interner Fehler der Werkstatt: ' + e.message, zeile: 0 }, ausgabe: [], variablen: [], schritte: 0, zeile: null };
      }
      return r;
    }
    function uebernimm(r, ziel) {
      const vorher = S.ergebnis;
      S.vorige = vorher && ziel === S.schritt + 1 ? new Map(vorher.variablen.map(([k, , w]) => [k, w])) : null;
      S.ergebnis = r;
      if (r.status === 'halt') { S.schritt = r.schritte; S.fertig = false; }
      else if (r.status === 'eingabe') { S.schritt = r.schritte; S.fertig = false; }
      else { S.schritt = r.schritte + 1; S.fertig = true; }
      zeige();
      if (r.status === 'eingabe') { const f = root.querySelector('.ws-eingabe'); if (f) f.focus({ preventScroll: true }); }
    }
    function ausfuehren() { S.eingaben = []; S.vorige = null; S.ziel = Infinity; uebernimm(lauf(Infinity), Infinity); }
    function schrittVor() {
      if (S.fertig) return;
      if (S.ergebnis && S.ergebnis.status === 'eingabe') { const f = root.querySelector('.ws-eingabe'); if (f) f.focus(); return; }

const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;
function frags(n){
  return [...slides[n].querySelectorAll('.frag')]
    .map((el,k)=>({el, ord: el.dataset.schritt ? parseFloat(el.dataset.schritt) : k+1, k}))
    .sort((a,b)=> a.ord - b.ord || a.k - b.k).map(x=>x.el);
}
function zeige(n, alleFragmente=false){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('aktiv', k===i));
  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));
  document.getElementById('zaehler').textContent = (i+1)+' / '+slides.length;
  document.getElementById('fortschritt').style.width = ((i+1)/slides.length*100)+'%';
  try{ history.replaceState(null, '', '#'+(i+1)); }catch(e){}
}
function vor(){ const fr = frags(i); if(schritt < fr.length){ fr[schritt].classList.add('an'); schritt++; return; } if(i < slides.length-1) zeige(i+1); }
function zurueck(){ if(schritt > 0){ schritt--; frags(i)[schritt].classList.remove('an'); return; } if(i > 0) zeige(i-1, true); }
function skalieren(){ const s = Math.min((innerWidth-40)/1280, (innerHeight-40)/720); stage.style.transform = 'scale('+s+')'; }
addEventListener('resize', skalieren);
const ueb = document.getElementById('uebersicht'), gitter = ueb.querySelector('.gitter');
folien.forEach((f,k)=>{ const d = document.createElement('div'); d.className = 'mini';
  d.innerHTML = `<div class="nr">FOLIE ${k+1}</div><div class="tt">${f.h2 || f.titel}</div>`;
  d.onclick = ()=>{ ueb.classList.remove('an'); zeige(k); }; gitter.appendChild(d); });
addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input, select, textarea')) return;   // beim Tippen der Funktion nicht blättern
  if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ e.preventDefault(); zurueck(); }
  else if(e.key==='Home'){ zeige(0); }
  else if(e.key==='End'){ zeige(slides.length-1, true); }

  else if(e.key==='Escape'){ ueb.classList.remove('an'); }

});
function vollbild(){
  const el = document.documentElement;

    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});

}
let wischX = null, wischY = null;
stage.addEventListener('touchstart', e=>{ if(e.target.closest('.interaktiv')){ wischX = null; return; } wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }, {passive:true});

<script data-handy="technik/handy/handy.js">
/* =====================================================================
   HANDY-SCHICHT — schaltet die Handy-Ansicht, wenn die Bühne 1280 × 720 zu stark
   verkleinert würde (Maßstab unter 0,62: Handy hoch und quer, Tablet hochkant).
   Muss NACH der Folien-Navigation des Rahmens stehen (nutzt stage, zeige, skalieren).
   Meldet Wechsel mit dem Ereignis „handy-wechsel", damit Rechner neu zeichnen können.
   ===================================================================== */
(function(){
  const html = document.documentElement;
  const istHandy = () => Math.min(innerWidth / 1280, innerHeight / 720) < 0.62;
  let vorher = null;
  function pruefen(){
    const h = istHandy();
    html.classList.toggle('handy', h);
    if (h) stage.style.transform = 'none';
    else if (typeof skalieren === 'function') skalieren();
    if (h !== vorher){ vorher = h; window.dispatchEvent(new CustomEvent('handy-wechsel', { detail: h })); }
  }
  addEventListener('resize', pruefen);
  addEventListener('orientationchange', () => setTimeout(pruefen, 200));
  pruefen();

  // Neue Folie (und nur dann, nicht bei jedem Knopf): nach oben scrollen
  const wach = new MutationObserver((liste) => {
    if (!html.classList.contains('handy')) return;
    if (liste.some((m) => m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))) window.scrollTo(0, 0);
  });
  document.querySelectorAll('.slide').forEach((f) => wach.observe(f, { attributes: true, attributeFilter: ['class'], attributeOldValue: true }));

  // Beim Scrollen tippt man oft auf Text: auf dem Handy blättert ein Tipp nicht weiter
  stage.addEventListener('click', (e) => {
    if (html.classList.contains('handy') && !e.target.closest('a, button, input, select, textarea, label, .interaktiv')) e.stopPropagation();
  }, true);
})();
</script><!-- /HANDY-SCHICHT -->
