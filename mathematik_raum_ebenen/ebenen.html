/* =====================================================================
   Ebenen im Raum – zwei Werkzeuge:
   EBILD  Koordinatenform eingeben → Spurpunkte, Spurdreieck, Normalenvektor im 3D-Bild
   EBENE  Aufgaben: Spurpunkte, Koordinatenform aus Parameterform (Kreuzprodukt), Parameterform aus
          Koordinatenform (über Spurpunkte), Punktprobe. Exakt mit Brüchen (bruch.js), Formeln gesetzt (formel.js).
   ===================================================================== */
const ACHSE = ['x', 'y', 'z'], SN = ['S_x', 'S_y', 'S_z'];
const EB_liesKf = root => VK.liesFelder(root.querySelectorAll('[data-r="kf"] input'));     // { q, meld } – streng (WZ.liesZahl)
const EB_fuelleKf = (root, n, d) => root.querySelectorAll('[data-r="kf"] input').forEach((i, k) => { i.value = qText(k < 3 ? n[k] : d).replace('-', '−'); i.classList.remove('falsch'); });
/* eine Achse: andere Koordinaten 0 setzen, nach der Achsenkoordinate auflösen (LaTeX) */
function EB_spurRechnung(n, d, i){
  const v = ACHSE[i], rest = ACHSE.filter((_, k) => k !== i).join(' = ');
  if (qNull(n[i])) return { kopf: `$${rest} = 0$ eingesetzt: $0 = ${qTex(d)}$`, ergebnis: null };
  const a = n[i], lin = `${qGleich(a, Q(1)) ? '' : qGleich(a, Q(-1)) ? '-' : qTex(a)}${v}`, w = qDiv(d, a);
  const zeilen = qGleich(a, Q(1)) ? `${v} &= ${qTex(d)}` : `${lin} &= ${qTex(d)} \\\\ ${v} &= ${qTex(w)}`;
  return { kopf: `$${rest} = 0$ einsetzen:`, zeilen, ergebnis: w };
}

/* =====================================================================
   EBILD – Ebene im Bild
   ===================================================================== */
const EBILD = (() => {
  const root = document.querySelector('[data-ebene-bild]');
  const R = r => root.querySelector(`[data-r="${r}"]`);
  const S = { n: EB.QV([2, 3, 6]), d: Q(12), normale: false };
  const feld = EB.raumFeld(R('raum'), V => EB.bild(V, S.n, S.d, { normale: S.normale }), { W: 460, H: 318 });

  function info(){
    const sp = EB.spur(S.n, S.d), teile = [];
    teile.push(`<div class="eb-zeile2">${F(`E\\colon ${EB.koordTex(S.n, S.d)}`)}</div>`);
    teile.push(`<div class="eb-zeile2">${M(`Normalenvektor $\\vec{n} = ${vTex(S.n)}$ – die Zahlen vor $x$, $y$, $z$.`)}</div>`);
    sp.forEach((P, i) => {
      const r = EB_spurRechnung(S.n, S.d, i);
      let t;
      if (P === 'achse') t = M(`Die ganze $${ACHSE[i]}$-Achse liegt in $E$ ($${ACHSE[i]}$ fehlt, $d = 0$).`);
      else if (!P) t = M(`${r.kopf} – falsch. Kein Spurpunkt: $E$ ist parallel zur $${ACHSE[i]}$-Achse.`);
      else {
        const aussen = P.some(q => qWert(q) < EB.LO || qWert(q) > EB.HI);
        t = M(`${r.kopf} $${r.zeilen.replace(/&/g, '').replace(/\\\\/g, ',\\;')}$`) + ' ' + F(`\\Rightarrow\\; ${EB.punktTex(SN[i], P)}`) + (aussen ? ' <span class="eb-klein">(außerhalb des Bildausschnitts)</span>' : '');
      }
      teile.push(`<div class="eb-spurzeile"><span class="eb-achse eb-a${i}">${ACHSE[i]}-Achse</span><span>${t}</span></div>`);
    });
    if (qNull(S.d) && sp.some(P => Array.isArray(P))) teile.push(`<p class="eb-erkl">${M('$E$ geht durch den Ursprung: Alle Spurpunkte fallen in $O\\,(0 \\mid 0 \\mid 0)$ zusammen. Das Bild zeigt die Ebene im Würfel.')}</p>`);
    else teile.push(`<p class="eb-erkl">${M('Zwei Koordinaten $0$ setzen, die dritte ausrechnen. Die Spurpunkte spannen das Spurdreieck auf – ein Stück der Ebene.')}</p>`);
    R('info').innerHTML = teile.join('');
  }
  function setze(n, d){
    Object.assign(S, { n: EB.QV(n), d: typeof d === 'object' ? d : Q(d) });
    EB_fuelleKf(root, S.n, S.d); info(); feld.zeichne();
    WZ.rueck(R('rueck'), '', M('Koeffizienten eintragen – oder ein Beispiel wählen. Ziehen dreht das Bild in der Ansicht „Drehen“.'));
    root.dataset.gleichung = [...S.n, S.d].map(qText).join('|');
  }
  function uebernehmen(){
    const { q, meld } = EB_liesKf(root);
    if (meld) return WZ.rueck(R('rueck'), 'nein', `Bitte alle vier Felder als Zahl oder Bruch ausfüllen (z. B. 2, −1, 3/2). ${meld}`);
    if (q.slice(0, 3).every(qNull)){ root.querySelectorAll('[data-r="kf"] input').forEach((i, k) => i.classList.toggle('falsch', k < 3)); return WZ.rueck(R('rueck'), 'nein', M('Vor $x$, $y$ und $z$ steht überall $0$ – das ist keine Ebene.')); }
    setze(q.slice(0, 3), q[3]);
  }
  R('uebernehmen').onclick = uebernehmen;
  root.querySelectorAll('[data-r="kf"] input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') uebernehmen(); }));
  root.querySelectorAll('[data-bsp]').forEach(b => b.onclick = () => { const z = b.dataset.bsp.split('|').map(Number); setze(z.slice(0, 3), z[3]); });
  R('normale').onclick = () => { S.normale = !S.normale; R('normale').classList.toggle('an', S.normale); feld.zeichne(); };
  setze([2, 3, 6], 12);
  return { S, setze, uebernehmen, feld };
})();

/* =====================================================================
   EBENE – Umrechnen
   ===================================================================== */
const EBENE = (() => {
  const root = document.querySelector('[data-ebene]');
  const R = r => root.querySelector(`[data-r="${r}"]`);
  const S = { art: 'spur', A: null, geloest: false, bild: false };
  const weg = WZ.weg(root);
  const rnd = WZ.rnd, nz = WZ.nz, eins = WZ.eins;
  const kgv = (a, b) => a / ggT(a, b) * b;

  /* ---------- Aufgaben ---------- */
  function ausAbschnitten(X){                                  // Achsenabschnitte (null = parallel) → Ebene, gekürzt
    const L = X.filter(x => x !== null).reduce((m, x) => kgv(m, Math.abs(x)), 1);
    return EB.kuerze(X.map(x => x === null ? Q(0) : Q(L / x)), Q(L));
  }
  function spurAufgabe(){
    const fall = Math.random();
    if (fall < 0.2){                                           // parallel zu einer Achse
      const k = rnd(0, 2), X = [rnd(1, 6), rnd(1, 6), rnd(1, 6)]; X[k] = null; if (Math.random() < 0.3) X[(k + 1) % 3] = -rnd(1, 4);
      return { art: 'spur', ...ausAbschnitten(X) };
    }
    if (fall < 0.45){                                          // Brüche als Spurpunkte
      for (;;){ const n = [rnd(1, 5), rnd(1, 5), rnd(1, 5)].map(x => Math.random() < 0.2 ? -x : x), d = rnd(2, 12);
        if (n.every(a => Math.abs(d / a) <= 6) && n.some(a => d % a !== 0)) return { art: 'spur', ...EB.kuerze(EB.QV(n), Q(d)) }; }
    }
    const X = [rnd(1, 6), rnd(1, 6), rnd(1, 6)]; if (Math.random() < 0.3) X[rnd(0, 2)] = -rnd(1, 4);
    return { art: 'spur', ...ausAbschnitten(X) };
  }
  function koordAufgabe(){
    for (;;){
      const p = [rnd(0, 3), rnd(0, 3), rnd(0, 3)], u = [rnd(-2, 2), rnd(-2, 2), rnd(-2, 2)], v = [rnd(-2, 2), rnd(-2, 2), rnd(-2, 2)];
      const P = EB.QV(p), U = EB.QV(u), Vv = EB.QV(v), c = EB.kreuz(U, Vv);
      if (EB.nullV(U) || EB.nullV(Vv) || EB.nullV(c) || c.some(q => Math.abs(q.z) > 12) || c.filter(qNull).length > 1) continue;
      const k = EB.kuerze(c, EB.skalar(c, P));
      return { art: 'koord', p: P, u: U, v: Vv, c, n: k.n, d: k.d };
    }
  }
  function paramAufgabe(){
    const X = [rnd(1, 6), rnd(1, 6), rnd(1, 6)]; if (Math.random() < 0.25) X[rnd(0, 2)] = -rnd(1, 4);
    return { art: 'param', ...ausAbschnitten(X) };
  }
  function probeAufgabe(){
    for (;;){
      const n = EB.QV([rnd(-3, 4), rnd(-3, 4), rnd(-3, 4)]); if (n.filter(qNull).length > 1) continue;
      const P = EB.QV([rnd(-1, 4), rnd(-1, 4), rnd(-1, 4)]), wert = EB.skalar(n, P), drin = Math.random() < 0.5;
      const d = drin ? wert : qAdd(wert, Q(nz(-3, 3)));
      return { art: 'probe', n, d, P, drin };
    }
  }
  const BAU = { spur: spurAufgabe, koord: koordAufgabe, param: paramAufgabe, probe: probeAufgabe };

  /* ---------- Anzeige ---------- */
  const vk = n => `<span class="vk" data-v="${n}">${ACHSE.map((v, i) => `<input data-k="${i}" inputmode="text" aria-label="${n} ${v}">`).join('')}</span>`;
  function angabe(A){
    if (A.art === 'koord') return `<span class="eb-teil">${F(`E\\colon \\vec{x} = ${vTex(A.p)}`)}</span><span class="eb-teil">${F(`{} + r \\cdot ${vTex(A.u)}`)}</span><span class="eb-teil">${F(`{} + s \\cdot ${vTex(A.v)}`)}</span>`;
    if (A.art === 'probe') return `<span class="eb-teil">${F(`E\\colon ${EB.koordTex(A.n, A.d)}`)}</span><span class="eb-teil">${F(EB.punktTex('P', A.P))}</span>`;
    return `<span class="eb-teil">${F(`E\\colon ${EB.koordTex(A.n, A.d)}`)}</span>`;
  }
  const WAS = { spur: 'Spurpunkte von', koord: 'Koordinatenform von', param: 'Eine Parameterform von', probe: 'Liegt P in E?' };
  function eingabe(A){
    if (A.art === 'spur') return `<span class="eb-spurin">${[0, 1, 2].map(i => {
      const t = ['0', '0', '0'].map((z, k) => k === i ? '§' : z), [vor, nach] = t.join(' \\mid ').split('§');
      return `<span class="eb-sp">${F(`${SN[i]}\\,(${vor}`)}<input data-s="${i}" inputmode="text" aria-label="Spurpunkt ${ACHSE[i]}-Koordinate">${F(`${nach})`)}</span>`; }).join('')}</span>
      <div class="knopfleiste"><button class="knopf o" data-r="pruefen">Prüfen</button></div>
      <p class="eb-hinweis">${M('Kein Spurpunkt auf einer Achse? Dann „–“ eintragen.')}</p>`;
    if (A.art === 'koord') return `<span class="eb-name">${F('E\\colon')}</span>${kfFelder}<div class="knopfleiste"><button class="knopf o" data-r="pruefen">Prüfen</button></div>`;
    if (A.art === 'param') return `<span class="eb-pf"><span class="eb-teil">${F('\\vec{x} =')}${vk('p')}</span><span class="eb-teil">${F('{} + r \\cdot')}${vk('u')}</span><span class="eb-teil">${F('{} + s \\cdot')}${vk('v')}</span></span><div class="knopfleiste"><button class="knopf o" data-r="pruefen">Prüfen</button></div>`;
    return `<div class="eb-wahl"><button class="knopf hell" data-wahl="ja">${M('$P$ liegt in $E$')}</button><button class="knopf hell" data-wahl="nein">${M('$P$ liegt nicht in $E$')}</button></div>`;
  }

  /* ---------- Lösungswege ---------- */
  function wegSpur(A){
    const s = [], sp = EB.spur(A.n, A.d);
    sp.forEach((P, i) => {
      const r = EB_spurRechnung(A.n, A.d, i);
      if (!P) s.push([`${ACHSE[i]}-Achse`, M(`${r.kopf} – das ist falsch.`) + ' ' + M(`Kein Spurpunkt: $E$ ist parallel zur $${ACHSE[i]}$-Achse.`)]);
      else s.push([`${ACHSE[i]}-Achse`, M(r.kopf) + FB(`\\begin{aligned} ${r.zeilen} \\end{aligned}`) + F(EB.punktTex(SN[i], P))]);
    });
    s.push(['Ergebnis', sp.map((P, i) => P ? F(EB.punktTex(SN[i], P)) : M(`kein $${SN[i]}$`)).join(',&nbsp; '), true]);
    return s;
  }
  function wegKoord(A){
    const { p, u, v, c, n, d } = A, kl = EB.kl, s = [];
    s.push(['Richtungsvektoren', M(`Der Normalenvektor steht senkrecht auf $\\vec{u} = ${vTex(u)}$ und $\\vec{v} = ${vTex(v)}$: Kreuzprodukt.`)]);
    const zeile = (i, j) => `${kl(u[i])} \\cdot ${kl(v[j])} - ${kl(u[j])} \\cdot ${kl(v[i])}`;
    s.push(['Kreuzprodukt', FB(`\\begin{aligned} \\vec{n} &= \\vec{u} \\times \\vec{v} \\\\ &= \\begin{pmatrix} ${zeile(1, 2)} \\\\ ${zeile(2, 0)} \\\\ ${zeile(0, 1)} \\end{pmatrix} \\\\ &= ${vTex(c)} \\end{aligned}`)
      + `<span class="eb-klein">${M('Mitte: $u_3 v_1 - u_1 v_3$ – die Reihenfolge dreht sich.')}</span>`]);
    if (!c.every((q, i) => qGleich(q, n[i]))){
      const k = qDiv(c.find(q => !qNull(q)), n.find(q => !qNull(q)));
      s.push(['Vereinfachen', FB(`${vTex(c)} = ${qTex(k)} \\cdot ${vTex(n)}`) + M(`Jedes Vielfache ist ein Normalenvektor – wir nehmen $\\vec{n} = ${vTex(n)}$.`)]);
    }
    // nach dem zweiten Produkt umbrechen – drei Produkte mit Klammern ragen auf dem Handy heraus
    const prod3 = n.map((q, i) => `${kl(q)} \\cdot ${kl(p[i])}`);
    s.push(['d bestimmen', M('Der Stützpunkt liegt in $E$:') + FB(`\\begin{aligned} d = \\vec{n} \\cdot \\vec{p} &= ${prod3.slice(0, 2).join(' + ')} \\\\ &\\quad {} + ${prod3[2]} \\\\ &= ${qTex(d)} \\end{aligned}`)]);
    s.push(['Ergebnis', F(`E\\colon ${EB.koordTex(n, d)}`), true]);
    // drei Summanden: nach zweien umbrechen, damit die Zeile auch auf dem Handy passt
    const sum3 = (a, b) => { const t = n.map((q, i) => `${kl(q)} \\cdot ${kl(b[i])}`); return `${t.slice(0, 2).join(' + ')} \\\\ &\\quad {} + ${t[2]}`; };
    s.push(['Probe', FB(`\\begin{aligned} \\vec{n} \\cdot \\vec{u} &= ${sum3(n, u)} \\\\ &= ${qTex(EB.skalar(n, u))} \\\\ \\vec{n} \\cdot \\vec{v} &= ${sum3(n, v)} \\\\ &= ${qTex(EB.skalar(n, v))} \\end{aligned}`) + M('Beide $0$: $\\vec{n}$ steht senkrecht auf der Ebene.')]);
    return s;
  }
  function paramLoesung(A){
    const [Sx, Sy, Sz] = EB.spur(A.n, A.d);
    return { p: Sx, u: EB.sub(Sy, Sx), v: EB.sub(Sz, Sx), Sx, Sy, Sz };
  }
  function wegParam(A){
    const L = paramLoesung(A), s = [];
    s.push(['Spurpunkte', M('Je zwei Koordinaten $0$ setzen:') + FB(`\\begin{aligned} ${[L.Sx, L.Sy, L.Sz].map((P, i) => EB.punktTex(SN[i], P)).join(' \\\\ ')} \\end{aligned}`)]);
    s.push(['Stützvektor', M('Ein Punkt der Ebene, z. B. $S_x$:') + FB(`\\vec{p} = \\overrightarrow{OS_x} = ${vTex(L.p)}`)]);

    s.push(['Ergebnis', FB(`\\begin{aligned} E\\colon \\vec{x} &= ${vTex(L.p)} \\\\ &\\quad {} + r \\cdot ${vTex(L.u)} + s \\cdot ${vTex(L.v)} \\end{aligned}`), true]);
    s.push(['Andere Wahl', M('Jeder Punkt von $E$ als Stützvektor und zwei nicht parallele Richtungen in $E$ sind ebenso richtig – Probe: $\\vec{n} \\cdot \\vec{p} = d$, $\\vec{n} \\cdot \\vec{u} = 0$, $\\vec{n} \\cdot \\vec{v} = 0$.')]);

  }
  function wegProbe(A){

    normale: S.A.art === 'koord', P: S.A.art === 'probe' ? S.A.P : S.A.art === 'koord' ? S.A.p : null,

  const frei = () => S.geloest || (weg.anzahl() > 0 && weg.offen() >= weg.anzahl());

  /* ---------- Setzen ---------- */
  function neu(art = S.art){ S.art = art; setze(BAU[art === 'gemischt' ? eins(['spur', 'koord', 'param', 'probe']) : art]()); }
  function setze(A){

    weg.setze(WEG[A.art](A));

  function pruefeSpur(){

    const ok = ein.map((e, i) => sp[i] === null ? e === 'kein' : e !== 'kein' && qGleich(e, sp[i]));

    const gerundet = ein.map((e, i) => !ok[i] && sp[i] !== null && nahe(e, sp[i]));
    markiere(felder, ok.map((o, i) => o || gerundet[i]));
    if (ok.every(Boolean)){ geloest(); return aus('ok', 'Richtig! ' + sp.map((P, i) => P ? F(EB.punktTex(SN[i], [0, 1, 2].map(k => k === i ? P : Q(0)))) : M(`kein $${SN[i]}$`)).join(',&nbsp; ')); }
    if (ok.every((o, i) => o || gerundet[i])) return aus('fast', M(`Gerundet richtig. Exakt als Bruch: ${sp.map((x, i) => gerundet[i] ? `$${ACHSE[i]} = ${qTex(x)}$` : '').filter(Boolean).join(', ')}.`));
    const i = ok.findIndex((x, k) => !x && !gerundet[k]), e = ein[i], a = A.n[i], v = ACHSE[i], rest = ACHSE.filter((_, k) => k !== i).join(' = ');

    if (nahe(e, qMul(A.d, a)) && !qGleich(a, Q(1)) && !qGleich(a, Q(-1))) return aus('nein', M(`Mit dem Koeffizienten malgenommen – durch ihn <b>teilen</b>: $${v} = \\dfrac{d}{${qTex(a)}}$.`));

    aus('nein', M(`Der Spurpunkt auf der $${v}$-Achse stimmt nicht: $${rest} = 0$ setzen, dann nach $${v}$ auflösen.`));
  }
  function pruefeKoord(){
    const A = S.A, felder = [...root.querySelectorAll('[data-r="kf"] input')], { q, meld } = EB_liesKf(root);
    if (meld) return aus('nein', `Bitte alle vier Felder als Zahl oder Bruch ausfüllen – auch 0, wo nichts steht. ${meld}`);
    const n2 = q.slice(0, 3), d2 = q[3];
    if (EB.nullV(n2)){ markiere(felder, [false, false, false, true]); return aus('nein', M('Vor $x$, $y$ und $z$ steht überall $0$ – das ist keine Ebene.')); }
    if (EB.parallel(n2, A.n)){
      const i = A.n.findIndex(x => !qNull(x)), k = qDiv(n2[i], A.n[i]);

    if (EB.parallel(n2, A.u) || EB.parallel(n2, A.v)) return aus('nein', M('Das ist ein Richtungsvektor der Ebene – der Normalenvektor steht senkrecht auf beiden: $\\vec{n} = \\vec{u} \\times \\vec{v}$.'));
    const su = EB.skalar(n2, A.u), sv = EB.skalar(n2, A.v);
    aus('nein', M(`Dein Normalenvektor steht nicht senkrecht auf der Ebene: $\\vec{n} \\cdot \\vec{u} = ${qTex(su)}$, $\\vec{n} \\cdot \\vec{v} = ${qTex(sv)}$ – beide müssten $0$ sein.`));

    const meld = L.map(l => l.meld).find(Boolean);

    const rot = n => root.querySelectorAll(`[data-v="${n}"] input`).forEach(i => i.classList.add('falsch'));
    if (EB.nullV(u) || EB.nullV(v)){ rot(EB.nullV(u) ? 'u' : 'v'); return aus('nein', 'Ein Richtungsvektor darf nicht der Nullvektor sein.'); }
    if (EB.parallel(u, v)){ rot('v'); return aus('nein', M('$\\vec{u}$ und $\\vec{v}$ sind parallel – zusammen spannen sie keine Ebene auf.')); }
    const wp = EB.skalar(A.n, p);
    if (!qGleich(wp, A.d)){ rot('p'); return aus('nein', M(`Der Stützvektor liegt nicht in $E$: eingesetzt $${qTex(wp)} \\neq ${qTex(A.d)}$.`)); }
    const sp = EB.spur(A.n, A.d).filter(P => Array.isArray(P));
    for (const [w, name] of [[u, 'u'], [v, 'v']]){
      if (qNull(EB.skalar(A.n, w))) continue;
      rot(name);
      if (sp.some(P => P.every((q, k) => qGleich(q, w[k])))) return aus('nein', M(`$\\vec{${name}}$ ist der Ortsvektor eines Spurpunkts. Richtungsvektoren sind <b>Differenzen</b> zweier Punkte von $E$, z. B. $\\overrightarrow{S_xS_y} = \\vec{S_y} - \\vec{S_x}$.`));
      if (EB.parallel(w, A.n)) return aus('nein', M(`$\\vec{${name}}$ ist der Normalenvektor – er steht senkrecht auf $E$, liegt also nicht in $E$.`));

  function waehle(ja){

    aus('nein', M(`Setz $P$ ein: Links kommt $${qTex(w)}$ heraus, rechts steht $${qTex(A.d)}$ – ${A.drin ? 'gleich, also liegt $P$ in $E$' : 'verschieden, also liegt $P$ nicht in $E$'}.`));

  /* ---------- Bedienung ---------- */
  root.querySelectorAll('[data-art]').forEach(b => b.onclick = () => neu(b.dataset.art));

})();
/* =====================================================================
   Folien-Navigation
   ===================================================================== */
const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;
function frags(n){
  return [...slides[n].querySelectorAll('.frag')]
    .map((el,k)=>({el, ord: el.dataset.schritt ? parseFloat(el.dataset.schritt) : k+1, k}))
    .sort((a,b)=> a.ord - b.ord || a.k - b.k).map(x=>x.el);
}
function zeige(n, alleFragmente=false){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('aktiv', k===i));
  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));
  document.getElementById('zaehler').textContent = (i+1)+' / '+slides.length;
  document.getElementById('fortschritt').style.width = ((i+1)/slides.length*100)+'%';
  try{ history.replaceState(null, '', '#'+(i+1)); }catch(e){}
}
function vor(){ const fr = frags(i); if(schritt < fr.length){ fr[schritt].classList.add('an'); schritt++; return; } if(i < slides.length-1) zeige(i+1); }
function zurueck(){ if(schritt > 0){ schritt--; frags(i)[schritt].classList.remove('an'); return; } if(i > 0) zeige(i-1, true); }
function skalieren(){ const s = Math.min((innerWidth-40)/1280, (innerHeight-40)/720); stage.style.transform = 'scale('+s+')'; }
addEventListener('resize', skalieren);
const ueb = document.getElementById('uebersicht'), gitter = ueb.querySelector('.gitter');
folien.forEach((f,k)=>{ const d = document.createElement('div'); d.className = 'mini';
  d.innerHTML = `<div class="nr">FOLIE ${k+1}</div><div class="tt">${f.h2 || f.titel}</div>`;
  d.onclick = ()=>{ ueb.classList.remove('an'); zeige(k); }; gitter.appendChild(d); });
addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input, select, textarea')) return;   // beim Tippen der Funktion nicht blättern
  if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ e.preventDefault(); zurueck(); }
  else if(e.key==='Home'){ zeige(0); }
  else if(e.key==='End'){ zeige(slides.length-1, true); }
  else if(e.key==='o'||e.key==='O'){ ueb.classList.toggle('an'); }
  else if(e.key==='Escape'){ ueb.classList.remove('an'); }
  else if(e.key==='f'||e.key==='F'){ vollbild(); }
});
function vollbild(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
}
let wischX = null, wischY = null;
stage.addEventListener('touchstart', e=>{ if(e.target.closest('.interaktiv')){ wischX = null; return; } wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e=>{ if(wischX === null) return; const dx = e.changedTouches[0].clientX - wischX, dy = e.changedTouches[0].clientY - wischY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? vor : zurueck)(); wischX = null; });
document.getElementById('uebBtn').onclick = ()=> ueb.classList.toggle('an');
document.getElementById('vor').onclick = vor;
document.getElementById('zurueck').onclick = zurueck;
stage.addEventListener('click', e=>{ if(!e.target.closest('a, button, input, select, .interaktiv')) vor(); });
skalieren();
zeige(parseInt(location.hash.slice(1)) - 1 || 0);
</script>
<script data-handy="technik/handy/handy.js">
/* =====================================================================
   HANDY-SCHICHT — schaltet die Handy-Ansicht, wenn die Bühne 1280 × 720 zu stark
   verkleinert würde (Maßstab unter 0,62: Handy hoch und quer, Tablet hochkant).
   Muss NACH der Folien-Navigation des Rahmens stehen (nutzt stage, zeige, skalieren).
   Meldet Wechsel mit dem Ereignis „handy-wechsel", damit Rechner neu zeichnen können.
   ===================================================================== */
(function(){
  const html = document.documentElement;
  const istHandy = () => Math.min(innerWidth / 1280, innerHeight / 720) < 0.62;
  let vorher = null;
  function pruefen(){
    const h = istHandy();
    html.classList.toggle('handy', h);
    if (h) stage.style.transform = 'none';
    else if (typeof skalieren === 'function') skalieren();
    if (h !== vorher){ vorher = h; window.dispatchEvent(new CustomEvent('handy-wechsel', { detail: h })); }
  }
  addEventListener('resize', pruefen);
  addEventListener('orientationchange', () => setTimeout(pruefen, 200));
  pruefen();

  // Neue Folie (und nur dann, nicht bei jedem Knopf): nach oben scrollen
  const wach = new MutationObserver((liste) => {
    if (!html.classList.contains('handy')) return;
    if (liste.some((m) => m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))) window.scrollTo(0, 0);
  });
  document.querySelectorAll('.slide').forEach((f) => wach.observe(f, { attributes: true, attributeFilter: ['class'], attributeOldValue: true }));

  // Beim Scrollen tippt man oft auf Text: auf dem Handy blättert ein Tipp nicht weiter
  stage.addEventListener('click', (e) => {
    if (html.classList.contains('handy') && !e.target.closest('a, button, input, select, textarea, label, .interaktiv')) e.stopPropagation();
  }, true);
})();
</script><!-- /HANDY-SCHICHT -->
