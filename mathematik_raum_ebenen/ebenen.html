/* ==== HANDY-SCHICHT: technik/handy/handy.css ==== */
/* =====================================================================
   HANDY-SCHICHT für den Rahmen der Vorlagen (ds1 / Folgen) — plus eine Regel für alle Ansichten:
   zu viel Inhalt scrollt statt abgeschnitten zu werden.
   Greift nur, wenn handy.js <html class="handy"> setzt: Bildschirm zu klein für die
   Bühne 1280 × 720 (Handy, Tablet hochkant). Beamer, Laptop und Druck bleiben unberührt.
   Aus der Bühne wird eine scrollbare Seite pro Folie; Raster werden einspaltig,
   Schrift mindestens 14 px, Knöpfe mindestens 40 px (Finger).
   ===================================================================== */
/* ---- Für ALLE Ansichten (auch Beamer): nie abschneiden. Passt der Inhalt einer Folie nicht,
        scrollt der Inhaltsbereich; Kopf und Fuß bleiben stehen. ---- */
#stage .slide .inhalt{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#C4DFF2 transparent;
  margin-bottom:-10px}   /* bis an die Fußzeilenlinie: der freie Rand darüber gehört zum Inhalt (Folgen nutzt ihn) */
@media print{#stage .slide .inhalt{overflow:visible}}            /* Druck: alles zeigen */

html.handy, html.handy body{height:auto;overflow-x:hidden;overflow-y:auto}
html.handy body{display:block;background:var(--papier)}
html.handy #stage{width:100%;height:auto;transform:none!important}
html.handy .slide{position:relative;inset:auto;display:none;min-height:100vh;border-radius:0;box-shadow:none;
  padding:64px 14px 84px;transform:none;transition:none;overflow:visible}
html.handy .slide.aktiv{display:flex}

/* Kopf, Überschriften, Fuß */
html.handy .kopf{height:48px;padding:0 12px;gap:10px}
html.handy .kopf img{height:34px}
html.handy .kopf .schule{font-size:14px;letter-spacing:.06em}
html.handy .kopf .kurs{display:none}
html.handy h1{font-size:34px}
html.handy h2, html.handy .slide.kompakt h2{font-size:25px}
html.handy .eyebrow{font-size:14px;letter-spacing:.12em}
html.handy .titelzeile, html.handy .slide.kompakt .titelzeile{margin-bottom:14px}
html.handy .inhalt, html.handy #stage .slide .inhalt{display:block;overflow:visible;margin-bottom:0}   /* Handy: die Seite scrollt, nicht die Folie */
html.handy .fuss{position:static;margin-top:22px;font-size:14px;gap:10px}
html.handy p, html.handy li{font-size:17px}
html.handy .klein, html.handy .hinweis{font-size:15px}

/* Titelfolie: untereinander */
html.handy .slide.titel{display:none;grid-template-columns:1fr;padding:0}
html.handy .slide.titel.aktiv{display:grid}
html.handy .slide.titel .links{padding:40px 20px 24px}
html.handy .slide.titel .rechts{padding:24px 0 90px;border-left:none;border-top:1px solid rgba(255,255,255,.16)}
html.handy .slide.titel .unter{font-size:18px}
html.handy .slide.titel .meta span{font-size:14px}
html.handy .slide.titel .logokachel{border-radius:26px;padding:16px 18px}
html.handy .slide.titel .logokachel img{width:110px}
html.handy .slide.titel svg{max-width:100%;height:auto}

/* Raster und Karten: einspaltig */
html.handy .raster, html.handy .g2, html.handy .g3, html.handy .g4{grid-template-columns:1fr!important}
html.handy .karte p, html.handy .karte li{font-size:16px}

/* Finger: Knöpfe und Felder mindestens 40 px */
html.handy .knopf{min-height:42px;min-width:42px;font-size:15.5px;padding:8px 14px}
html.handy input, html.handy select{min-height:42px;font-size:16px}   /* 16 px: iOS zoomt sonst beim Tippen */
html.handy #nav{right:10px;bottom:10px;padding:6px 8px;gap:6px}
html.handy #nav button{width:42px;height:42px;font-size:18px}
html.handy #zaehler{font-size:14px}
html.handy svg{max-width:100%;height:auto}
/* ==== /HANDY-SCHICHT ==== */
:root{
  --blau:#136EA9;
  --blau-d:#0C4E79;
  --blau-h:#3E93CE;
  --blau-pastell:#E3F0F9;
  --blau-linie:#C4DFF2;
  --orange:#F3A92F;
  --orange-d:#D98908;
  --orange-pastell:#FDF0DA;
  --tinte:#16232E;
  --grau:#5B6A76;
  --linie:#D8E2EA;
  --papier:#FFFFFF;
  --bg:#EAF1F6;
  --rot:#C62828;
  --gruen:#2E7D32;
  --stage-w:1280px;
  --stage-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:"Sansation","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

#stage{position:relative;width:var(--stage-w);height:var(--stage-h);transform-origin:center center;flex:none}
.slide{
  position:absolute;inset:0;
  background:var(--papier);
  border-radius:14px;
  box-shadow:0 18px 50px rgba(12,78,121,.22), 0 2px 6px rgba(12,78,121,.12);
  overflow:hidden;
  padding:86px 62px 58px;
  opacity:0;visibility:hidden;
  transform:translateY(14px) scale(.995);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
  display:flex;flex-direction:column;
}
.slide.aktiv{opacity:1;visibility:visible;transform:none}

.kopf{
  position:absolute;top:0;left:0;right:0;height:58px;
  background:linear-gradient(100deg,var(--blau-d) 0%,var(--blau) 55%,var(--blau-h) 100%);
  display:flex;align-items:center;gap:14px;
  padding:0 22px 0 18px;
  color:#fff;
  z-index:5;
}
.kopf::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 34%,#F6C46E 34%,#F6C46E 100%);
}
.kopf img{height:42px;width:auto;background:#fff;border-radius:11px;padding:3px 6px;box-shadow:0 3px 10px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.5)}
.kopf .schule{font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.95}
.kopf .kurs{
  margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  padding:5px 12px;border-radius:999px;
}

h1{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.015em;color:var(--blau-d)}
h3{font-size:20px;font-weight:750;color:var(--blau-d)}
p,li{font-size:19px;line-height:1.5;color:var(--tinte)}
.klein{font-size:16px;line-height:1.45;color:var(--grau)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--orange-d);margin-bottom:10px}
.titelzeile{margin-bottom:26px;flex:none}
.titelzeile h2::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--orange);margin-top:12px}
.slide.kompakt .titelzeile{margin-bottom:14px}
.slide.kompakt h2{font-size:32px}
.slide.kompakt h2::after{margin-top:8px;height:4px;width:52px}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center}
.slide.oben .inhalt{justify-content:flex-start}
strong{color:var(--blau-d)}

.raster{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.karte{background:var(--papier);border:1px solid var(--linie);border-radius:12px;padding:20px 22px;box-shadow:0 2px 0 rgba(19,110,169,.05);display:flex;flex-direction:column;gap:8px}
.karte.blau{background:var(--blau-pastell);border-color:var(--blau-linie)}
.karte.orange{background:var(--orange-pastell);border-color:#F3DCAF}
.karte.voll{background:linear-gradient(150deg,var(--blau-d),var(--blau));border:none;color:#fff}
.karte.voll h3,.karte.voll strong{color:#fff}
.karte.voll p,.karte.voll li{color:rgba(255,255,255,.92)}
.karte.voll .hl{color:var(--orange)}
.karte p,.karte li{font-size:17px;line-height:1.45}

.nummer{width:38px;height:38px;flex:none;border-radius:10px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.nummer.b{background:var(--blau)}
.zeile{display:flex;gap:16px;align-items:flex-start}

.fuss{position:absolute;left:62px;right:62px;bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--grau);border-top:1px solid var(--linie);padding-top:9px}

/* Formeln */
.formel{font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:normal;white-space:nowrap}
.formel i{font-style:italic}
.bruch{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.15}
.bruch > span:first-child{border-bottom:2px solid currentColor;padding:0 4px 2px}
.bruch > span:last-child{padding:2px 4px 0}
.antwort{border-top:1px dashed #E3C489;padding-top:8px;margin-top:2px;color:var(--tinte)!important}
.karte.voll .antwort{border-top-color:rgba(255,255,255,.35);color:#fff!important}

/* ---------- Titel und Schluss ---------- */
.slide.titel{
  padding:0;
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(243,169,47,.20), transparent 62%),
    linear-gradient(140deg,#0A4470 0%, var(--blau-d) 40%, var(--blau) 100%);
  color:#fff;display:grid;grid-template-columns:1.35fr .65fr;
}
.slide.titel .links{padding:74px 56px 56px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.slide.titel .rechts{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.16);position:relative;z-index:2}
.slide.titel .logokachel{background:#fff;border-radius:38px;padding:28px 30px;box-shadow:0 20px 46px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
.slide.titel .logokachel img{width:168px;display:block}
.titelkarte{background:rgba(255,255,255,.95);border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.25)}   /* Bild auf der Titelfolie (Werkzeuge): Stil hier, nicht inline – Marke tauschbar */
.slide.titel h1{color:#fff}
.slide.titel .eyebrow{color:var(--orange)}
.slide.titel .unter{font-size:23px;color:rgba(255,255,255,.9);margin-top:18px;max-width:640px}
.slide.titel .meta{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.slide.titel .meta span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);padding:8px 16px;border-radius:999px;font-size:15.5px;font-weight:600}
.slide.titel .balken{height:6px;width:110px;background:var(--orange);border-radius:4px;margin-bottom:26px}
.karogrund{position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:40px 40px}
.titelgraph svg{display:block}
.slide.schluss{grid-template-columns:1fr}
.slide.schluss .links{align-items:center;text-align:center;padding:60px 120px}
.slide.schluss img{width:64px;margin-bottom:34px;background:rgba(255,255,255,.92);border-radius:50%;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.zitatgross{font-size:40px;line-height:1.28;font-weight:700;letter-spacing:-.015em;color:#fff;max-width:960px}
.zitatgross .strich{display:block;width:56px;height:5px;background:var(--orange);border-radius:3px;margin:26px auto 20px}
.quelle{font-size:18px;font-weight:600;color:var(--orange);letter-spacing:.06em}

/* ---------- Graphen (SVG) ---------- */
svg .gitter line{stroke:#E4ECF2;stroke-width:1}
svg .achse{stroke:#6B7C89;stroke-width:1.6}
svg .tick{font-size:12px;fill:var(--grau);font-weight:600}
svg .kurve-f{fill:none;stroke:var(--blau);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
svg .kurve-a{fill:none;stroke:var(--gruen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg .sekante{stroke:var(--orange-d);stroke-width:2.6}
svg .dreieck{fill:rgba(243,169,47,.16);stroke:var(--orange-d);stroke-width:1.8;stroke-dasharray:5 4}
svg .dlabel{font-size:15px;font-weight:800;fill:var(--orange-d)}
svg .band{fill:rgba(243,169,47,.13)}
svg .bandrand{stroke:var(--orange);stroke-width:1.5;stroke-dasharray:4 4}
svg .lot{stroke:var(--orange-d);stroke-width:1.5;stroke-dasharray:3 4}
svg .punkt{fill:var(--orange);stroke:#fff;stroke-width:2}
svg .kreuz{stroke:var(--orange-d);stroke-width:3;stroke-linecap:round}
svg .kreuz.neu{animation:punktrein .45s ease;transform-box:fill-box;transform-origin:center}
@keyframes punktrein{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
svg .verbindung{fill:none;stroke:var(--orange);stroke-width:1.6;stroke-dasharray:5 4}
svg .kreuz.alt{stroke:#F2B64F;stroke-width:2;opacity:.75}
svg .kreuz.draussen{stroke:#9FB3C3}
svg .glied{fill:var(--orange);stroke:#fff;stroke-width:1.6}
svg .glied.draussen{fill:#9FB3C3}
svg .achsname{font-size:15px;font-weight:800;fill:var(--blau-d);font-style:italic}
svg .grenzlinie{stroke:var(--gruen);stroke-width:2.4;stroke-dasharray:8 6}
svg .grenzt{font-size:15px;font-weight:800;fill:var(--gruen)}
svg .schranke{stroke:var(--blau-d);stroke-width:1.8;stroke-dasharray:3 5}
svg .schrt{font-size:13px;font-weight:700;fill:var(--blau-d)}
svg .schlauch{fill:rgba(243,169,47,.16);stroke:rgba(217,137,8,.5);stroke-width:1}
svg .abn{stroke:var(--orange-d);stroke-width:2;stroke-dasharray:4 4}
svg .abnt{font-size:14px;font-weight:800;fill:var(--orange-d)}
svg .glied.hoch{fill:var(--gruen)}
svg .glied.runter{fill:var(--rot)}
svg .glied.gleich{fill:var(--grau)}
.labspalte .knopfleiste .knopf.hell{font-size:14px;padding:6px 9px}
.labspalte .knopfleiste{gap:5px;flex-wrap:nowrap}
.erg{border:1px solid var(--linie);border-radius:11px;padding:5px 12px;background:#fff;transition:background .3s,border-color .3s}
.erg h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);font-weight:800;margin-bottom:0}
.erg p{font-size:14.5px;line-height:1.35;transition:filter .3s,opacity .3s}
.erg:not(.an) p{filter:blur(5px);opacity:.45;user-select:none}
.erg.an{background:var(--blau-pastell);border-color:var(--blau-linie)}
.erg .klein{font-size:13px}
.startname{font-size:14px;font-weight:700;color:var(--grau);white-space:nowrap}
.modus{display:flex;flex:none}
.modus .knopf{font-size:14px;padding:5px 10px;border-radius:0}
.modus .knopf:first-child{border-radius:999px 0 0 999px}
.modus .knopf:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
.hinweis{font-size:12.5px;line-height:1.4;color:var(--grau)}
svg .altlinie{fill:none;stroke:#F6C46E;stroke-width:1.3;stroke-dasharray:4 4;opacity:.7}
svg .legende{font-size:14px;font-weight:700;fill:var(--tinte)}
svg .legbox{fill:rgba(255,255,255,.9);stroke:var(--linie)}

/* ---------- Labor ---------- */
.labor{display:grid;grid-template-columns:720px 1fr;gap:18px;align-items:start}
.plotrahmen{position:relative;border:1px solid var(--linie);border-radius:12px;overflow:hidden;background:#fff;touch-action:none;cursor:grab}
.plotrahmen.zieht{cursor:grabbing}
.plotrahmen svg{display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.bereich{display:flex;align-items:center;gap:10px;margin-top:10px;padding:6px 14px;background:var(--orange-pastell);border:1px solid #F3DCAF;border-radius:12px}
.bereich .bt{font-size:15px;font-weight:700;color:var(--grau);white-space:nowrap}
.bereich b{font-size:17px;color:var(--orange-d);min-width:34px;font-variant-numeric:tabular-nums}
.bereich input[type=text]{width:74px;flex:none;font:inherit;font-size:16px;font-weight:800;color:var(--orange-d);border:1px solid #E3C489;border-radius:8px;padding:3px 7px;background:#fff;font-variant-numeric:tabular-nums}
.bereich input[type=text].falsch{border-color:var(--rot);color:var(--rot)}
.bereich input[type=range]{flex:1;accent-color:var(--orange-d);min-width:0;height:28px}
.labspalte{display:flex;flex-direction:column;gap:9px;min-width:0}
.labspalte .knopf{font-size:15px;padding:7px 13px}
.eingabe{display:flex;flex-direction:column;gap:7px;background:var(--blau-pastell);border:1px solid var(--blau-linie);border-radius:12px;padding:10px 12px}
.eingabe .reihe{display:flex;gap:8px;align-items:center}
.eingabe label{font-weight:800;color:var(--blau-d);font-size:17px;font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:italic;white-space:nowrap}
.eingabe input,.eingabe select{font:inherit;font-size:16px;border:1px solid #9FC3DE;border-radius:8px;padding:6px 9px;background:#fff;color:var(--tinte);min-width:0}
.eingabe input{flex:1;font-family:ui-monospace,Consolas,monospace}
.eingabe select{flex:1}
.fehler{font-size:14px;font-weight:700;color:var(--rot);min-height:0}
.formelzeile{font-size:17px;color:var(--tinte);line-height:1.5}
.formelzeile .fx{color:var(--blau);font-weight:700}
.formelzeile .ax{color:var(--gruen);font-weight:700}
.laborstatus{font-size:15px;font-weight:700;color:var(--blau-d)}
.laborstatus .sub{font-weight:600;color:var(--grau)}
table.wt{border-collapse:separate;border-spacing:0 3px;width:100%;font-size:13px}
table.wt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grau);text-align:right;padding:0 6px;font-weight:800}
table.wt th:first-child{text-align:left}
table.wt td{background:#F6FAFD;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--linie);border-bottom:1px solid var(--linie)}
table.wt td:first-child{text-align:left;border-left:1px solid var(--linie);border-radius:7px 0 0 7px}
table.wt td:last-child{border-right:1px solid var(--linie);border-radius:0 7px 7px 0;font-weight:800;color:var(--orange-d)}
table.wt tr.aktuell td{background:var(--orange-pastell);border-color:#F3DCAF}
table.wt .leer td{background:none;border:none;color:var(--grau);text-align:left;font-weight:600}

/* ---------- Knöpfe ---------- */
.interaktiv{cursor:default}
.knopfleiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.knopf{font:inherit;font-size:15.5px;font-weight:700;border:none;border-radius:999px;padding:8px 15px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 2px 0 rgba(12,78,121,.25);transition:background .15s, opacity .15s, transform .1s}
.knopf:hover{background:var(--blau-d)}
.knopf:active{transform:translateY(1px)}
.knopf.o{background:var(--orange);color:#3A2500}
.knopf.o:hover{background:var(--orange-d)}
.knopf.g{background:var(--gruen)}
.knopf.hell{background:var(--blau-pastell);color:var(--blau-d);box-shadow:none;border:1px solid var(--blau-linie)}
.knopf.hell:hover{background:#D2E7F6}
.knopf.hell.an{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.knopf.rund{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.knopf:disabled{opacity:.35;cursor:not-allowed}

/* Schritte, Tabelle */
.schritte{display:flex;flex-direction:column;gap:9px}
.schritt{display:flex;gap:14px;align-items:center;background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:9px 14px}
.schritt .nummer{width:34px;height:34px;font-size:17px}
.schritt p{font-size:18px;line-height:1.35}
.schritt.wichtig{background:var(--orange-pastell);border-color:#F3DCAF}
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.tab th{background:var(--blau-d);color:#fff;text-align:right;padding:9px 16px;font-size:14px;letter-spacing:.06em}
table.tab th:first-child{border-top-left-radius:10px;text-align:left}
table.tab th:last-child{border-top-right-radius:10px}
table.tab td{padding:8px 16px;border-bottom:1px solid var(--linie);text-align:right;font-variant-numeric:tabular-nums}
table.tab td:first-child{text-align:left}
table.tab tr:nth-child(even) td{background:#F6FAFD}
table.tab td.z{font-weight:800;color:var(--orange-d)}

.frag{opacity:0;transform:translateY(10px);transition:opacity .34s ease,transform .34s ease}
.frag.an{opacity:1;transform:none}
svg .frag{transform:none}

#fortschritt{position:fixed;left:0;top:0;height:4px;background:var(--orange);width:0;transition:width .3s ease;z-index:50}
#nav{position:fixed;right:18px;bottom:14px;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:1px solid var(--linie);border-radius:999px;padding:5px 8px;box-shadow:0 4px 14px rgba(12,78,121,.14)}
#nav button{border:none;background:var(--blau-pastell);color:var(--blau-d);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:800}
#nav button:hover{background:var(--blau);color:#fff}
#zaehler{font-size:13px;font-weight:700;color:var(--grau);padding:0 6px;min-width:52px;text-align:center}
#uebersicht{position:fixed;inset:0;background:rgba(10,68,112,.96);z-index:100;display:none;padding:34px;overflow:auto}
#uebersicht.an{display:block}
#uebersicht h4{color:#fff;font-size:18px;margin-bottom:18px;font-weight:700}
#uebersicht .gitter{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#uebersicht .mini{background:#fff;border-radius:8px;padding:14px;cursor:pointer;border:3px solid transparent;min-height:78px}
#uebersicht .mini:hover{border-color:var(--orange)}
#uebersicht .mini .nr{font-size:11px;font-weight:800;color:var(--orange-d)}
#uebersicht .mini .tt{font-size:14px;font-weight:700;color:var(--blau-d);margin-top:3px;line-height:1.25}

@media print{
  @page{size:A4 landscape;margin:0}
  body{display:block;background:#fff;overflow:visible}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{position:relative;visibility:visible;opacity:1;transform:none;width:1280px;height:720px;page-break-after:always;box-shadow:none;border-radius:0}
  .frag{opacity:1!important;transform:none!important}
  #nav,#fortschritt,#uebersicht{display:none!important}
}
/* ==== technik/mathe/farben.css ==== */
/* =====================================================================
   FARBSCHEMA der Mathe-Werkzeuge — EINE Stelle für alle Inhaltsfarben.
   Umfärben: Werte hier ändern, dann  python3 technik/alle_bauen.py  — alle Werkzeuge mit
   quellen/meta.json werden neu gebaut. Werkzeuge benutzen NUR diese Namen, keine Hexwerte.

   Gestaltungsfarben (Rahmen, Kopf, Knöpfe) kommen aus dem Rahmen (--blau, --orange …) und
   dürfen wandern. Die Namen hier sind INHALTSFARBEN: Sie bedeuten etwas und sind in allen
   Werkzeugen dieselbe Bedeutung – erste Größe ist immer --m-1, Ergebnis immer --m-erg usw.
   ===================================================================== */
:root{
  /* Rollen in einer Aufgabe */
  --m-1:#3A8FD6;      --m-1-h:#E1EEF9;      /* erste Größe: linke Seite, Gleichung I, Graph f, x-Richtung */
  --m-2:#E08A1E;      --m-2-h:#FCEBD2;      /* zweite Größe: rechte Seite, Gleichung II, Graph f′, Faktor */
  --m-3:#2E9D8F;      --m-3-h:#DDF2EF;      /* dritte Größe: Gleichung III, Graph f″, z-Richtung */
  --m-erg:#7A57C7;    --m-erg-h:#ECE6F7;    /* Ergebnis, Parameter, das Gesuchte */
  --m-erg-l:#CDB8F0;                        /* Linie um Ergebnis und Eingabefeld */
  --m-1-t:#1F6FB5;    --m-2-t:#A85F07;      /* erste/zweite Größe als SCHRIFT auf hellem Grund (kräftiger als --m-1/--m-2) */
  /* Bewertung */
  --m-ok:#2E7D32;     --m-ok-h:#E6F3E7;     /* richtig, Lösung, Treffer */
  --m-falsch:#D0493F; --m-falsch-h:#FBE6E4; /* falsch, Widerspruch, abgezogen */
  --m-hinweis:#B86E0C;--m-hinweis-h:#FDF0DA;/* fast richtig, Hinweis */
  --m-grau:#8A97A3;   --m-grau-h:#EEF2F5;   /* dein Ergebnis zum Vergleich, verloren, inaktiv */
  /* Koordinatensysteme */
  --m-achse:#6B7C89;  --m-gitter:#E4ECF2;   --m-tick:#5B6A76;
  --m-flaeche-plus:rgba(46,125,50,.18);     /* Fläche über der Achse */
  --m-flaeche-minus:rgba(208,73,63,.18);    /* Fläche unter der Achse */
  /* Schrift für Mathematik */
  --m-schrift:"Cambria Math","Cambria","Times New Roman",serif;
}

/* ==== technik/mathe/werkzeug.css ==== */
/* =====================================================================
   WERKZEUG — gemeinsames Aussehen der Mathe-Rechner (Präfix wz-, keine Namenskonflikte).
   Farben nur aus technik/mathe/farben.css. Handy-Regeln am Ende (html.handy).
   Bausteine:
     .wz-aufgabe   Kasten oben: Aufgabe + Eingabe + Knöpfe
     .wz-term      Mathe in großer Schrift          .wz-eingabe   Textfeld für Terme/Zahlen
     .wz-arten     Zeile mit Aufgabenarten-Knöpfen   .wz-rueck     Rückmeldung (.ok .fast .nein)
     .wz-zwei      zwei Spalten (Lösungsweg | Bild)  .wz-panel     Kasten mit h3-Kopf
     .wz-weg/.wz-w Lösungsweg-Schritte (.letzt)      .wz-leer      Platzhaltertext
     .wz-m         Mathe-Schrift inline              .wz-bild svg  Grafik, schrumpft mit
   ===================================================================== */
.wz-aufgabe{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--blau-pastell);border:1px solid var(--blau-linie);border-radius:14px;padding:7px 16px}
.wz-aufgabe .wz-was{font-size:15px;font-weight:800;color:var(--grau);letter-spacing:.06em;text-transform:uppercase}
.wz-aufgabe .knopfleiste{margin-left:auto}
.wz-term{font-family:var(--m-schrift);font-size:30px;color:var(--tinte);white-space:nowrap}
.wz-term sup{font-size:.62em}
.wz-gleich{font-size:30px;font-weight:700}
.wz-eingabe{font:inherit;font-family:var(--m-schrift);font-size:24px;width:260px;border:2px solid var(--m-erg-l);border-radius:10px;padding:3px 10px;background:#fff;color:var(--tinte)}
.wz-eingabe.klein{width:90px;text-align:center}
.wz-eingabe.ok{border-color:var(--m-ok);background:var(--m-ok-h)}
.wz-eingabe.nein,.wz-eingabe.falsch{border-color:var(--m-falsch);background:var(--m-falsch-h)}
.wz-eingabe.fast{border-color:var(--m-hinweis);background:var(--m-hinweis-h)}
.wz-arten{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.wz-arten .bt{font-size:14px;font-weight:700;color:var(--grau);margin-right:4px}
.wz-arten .knopf{font-size:14px;padding:5px 11px}
.wz-arten .rechts{margin-left:auto;display:flex;gap:6px;align-items:center}
.wz-rueck{min-height:24px;margin:6px 2px;font-size:17px;font-weight:700;color:var(--grau)}
.wz-rueck.ok{color:var(--m-ok)} .wz-rueck.fast{color:var(--m-hinweis)} .wz-rueck.nein{color:var(--m-falsch)}
.wz-zwei{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.wz-zwei.links-breit{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.wz-zwei.rechts-breit{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.wz-panel{border:1px solid var(--linie);border-radius:12px;background:#fff;padding:8px 12px}
.wz-panel h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.wz-panel h3 .rechts{margin-left:auto;display:flex;gap:6px}
.wz-panel h3 .knopf{font-size:13.5px;padding:5px 10px;letter-spacing:0;text-transform:none}
.wz-weg{display:flex;flex-direction:column;gap:5px}
.wz-w{display:flex;gap:8px;align-items:center;border-radius:10px;padding:4px 8px;background:#F6FAFD;border:1px solid var(--linie);font-size:16px}
.wz-w .nummer{width:26px;height:26px;font-size:14px;border-radius:8px;flex:none}
.wz-w .was{font-size:13px;font-weight:700;color:var(--grau);min-width:110px}
.wz-w.letzt{background:var(--m-erg-h);border-color:var(--m-erg-l)}
.wz-w[hidden]{display:none}
.wz-m{font-family:var(--m-schrift);font-size:18px}
.wz-m .bruch{font-size:15px;line-height:1.05}
.wz-leer{color:var(--grau);font-size:15px;padding:24px 10px;text-align:center}
.wz-bild svg{display:block;max-width:100%;height:auto}
.wz-c1{color:var(--m-1);font-weight:700} .wz-c2{color:var(--m-2);font-weight:700} .wz-c3{color:var(--m-3);font-weight:700}
.wz-cerg{color:var(--m-erg);font-weight:700} .wz-cok{color:var(--m-ok);font-weight:700} .wz-cfalsch{color:var(--m-falsch);font-weight:700}
.wz-regler{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--orange-pastell);border:1px solid #F3DCAF;border-radius:12px}
.wz-regler[hidden]{display:none}
.wz-regler .bt{font-size:15px;font-weight:700;color:var(--grau);white-space:nowrap;font-family:var(--m-schrift)}
.wz-regler input[type=range]{flex:1;min-width:0;height:26px;accent-color:var(--orange-d)}
.wz-regler b{font-size:17px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--orange-d)}
.wz-regler .wz-reglerwert{width:84px;flex:none;font-size:17px;text-align:center;padding:2px 6px;color:var(--orange-d);font-variant-numeric:tabular-nums}
.wz-reglerfehler{font-size:15px;color:var(--m-falsch);margin:4px 0 0}
.wz-reglerfehler:empty{display:none}
/* Grafik-Grundformen (graph.js) */
svg .g-gitter line{stroke:var(--m-gitter);stroke-width:1}
svg .g-achse{stroke:var(--m-achse);stroke-width:1.6} svg .g-pfeil{fill:var(--m-achse)}
svg line.g-mass{stroke:var(--m-erg);stroke-width:1.8} svg path.g-mass-spitze{fill:var(--m-erg);stroke:none}
svg .g-tick{font-size:12px;fill:var(--m-tick);font-weight:600}
svg .g-name{font-size:14px;font-weight:800;fill:var(--blau-d);font-style:italic}
svg .g-k1{fill:none;stroke:var(--m-1);stroke-width:3} svg .g-k2{fill:none;stroke:var(--m-2);stroke-width:3}
svg .g-k3{fill:none;stroke:var(--m-3);stroke-width:3} svg .g-kerg{fill:none;stroke:var(--m-erg);stroke-width:3}
svg .g-kgrau{fill:none;stroke:var(--m-grau);stroke-width:2;stroke-dasharray:5 5}
svg .g-p1{fill:var(--m-1);stroke:#fff;stroke-width:2} svg .g-p2{fill:var(--m-2);stroke:#fff;stroke-width:2} svg .g-p3{fill:var(--m-3);stroke:#fff;stroke-width:2}
svg .g-pok{fill:var(--m-ok);stroke:#fff;stroke-width:2} svg .g-perg{fill:var(--m-erg);stroke:#fff;stroke-width:2}
svg .g-pfalsch{fill:#fff;stroke:var(--m-falsch);stroke-width:3} svg .g-pgrau{fill:#fff;stroke:var(--m-grau);stroke-width:3}
svg .g-t{font-size:13px;font-weight:800}
svg .g-plus{fill:var(--m-flaeche-plus)} svg .g-minus{fill:var(--m-flaeche-minus)}

/* ---------- Handy ---------- */
html.handy .wz-aufgabe{padding:10px;gap:10px}
html.handy .wz-term, html.handy .wz-gleich{font-size:24px;white-space:normal}
html.handy .wz-eingabe{width:100%;font-size:20px}
html.handy .wz-eingabe.klein{width:90px}
html.handy .wz-aufgabe .knopfleiste{margin-left:0;width:100%}
html.handy .wz-arten .knopf, html.handy .wz-panel h3 .knopf{font-size:15px}
html.handy .wz-arten .bt{width:100%;font-size:14px}
html.handy .wz-arten .rechts{margin-left:0;width:100%}
html.handy .wz-rueck{font-size:16px}
html.handy .wz-zwei, html.handy .wz-zwei.links-breit, html.handy .wz-zwei.rechts-breit{grid-template-columns:minmax(0,1fr);gap:12px}
html.handy .wz-panel h3 .rechts{margin-left:0}
html.handy .wz-w{flex-wrap:wrap;row-gap:2px}
html.handy .wz-w .was{min-width:0;font-size:14px}
html.handy .wz-m .bruch{font-size:16px}
html.handy svg .g-tick{font-size:14px}
html.handy svg .g-t{font-size:14px}
html.handy .wz-regler{flex-wrap:wrap} html.handy .wz-regler .wz-reglerwert{height:42px}
/* Zoom an jeder Skizze (graph.js: G_zoom, G_zoomKnoepfe) */
.g-zoomfeld{position:relative;display:inline-block;max-width:100%}
.g-zoomfeld > svg{display:block;max-width:100%;height:auto;cursor:grab;user-select:none;-webkit-user-select:none}   /* Ziehen markiert keine Achsenzahlen */
.g-zoom{position:absolute;right:14px;bottom:30px;display:flex;gap:6px}
html.handy .g-zoom .knopf.rund{width:42px;height:42px}
@media print{.g-zoom{display:none}}
/* Vektor als Spalte aus Eingabefeldern (VK.spalte, vektor.js) – Klammern in der Schriftfarbe der Spalte */
.vk{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;padding:0 7px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:9px;line-height:1.2;font-family:var(--m-schrift);margin:0 2px}
.vk input{width:52px;font-size:17px;text-align:center;padding:1px 2px;margin:1px 0;font-family:var(--m-schrift);border:1.5px solid var(--m-grau);border-radius:5px;background:#fff}
.vk input.falsch{border-color:var(--m-falsch);background:var(--m-falsch-h)}
html.handy .vk input{width:52px;height:40px;font-size:17px}

/* ==== technik/mathe/raum3d.css ==== */
/* RAUM3D — Aussehen des 3D-Koordinatensystems (Farben aus farben.css). Quelle: technik/mathe/raum3d.css */
svg .r3-achse{stroke:var(--m-achse);stroke-width:2}
svg .r3-achse.r3-x{stroke:var(--m-1)} svg .r3-achse.r3-y{stroke:var(--m-2)} svg .r3-achse.r3-z{stroke:var(--m-3)}
svg .r3-pfeil.r3-x{fill:var(--m-1)} svg .r3-pfeil.r3-y{fill:var(--m-2)} svg .r3-pfeil.r3-z{fill:var(--m-3)}
svg .r3-strich.r3-x{fill:var(--m-1)} svg .r3-strich.r3-y{fill:var(--m-2)} svg .r3-strich.r3-z{fill:var(--m-3)}
svg .r3-zahl{font-size:13px;font-weight:600;fill:var(--m-tick)}
svg .r3-name{font-size:17px;font-weight:800;font-style:italic;font-family:var(--m-schrift)}
svg .r3-name.r3-x{fill:var(--m-1)} svg .r3-name.r3-y{fill:var(--m-2)} svg .r3-name.r3-z{fill:var(--m-3)}
svg .r3-gitter{stroke:var(--m-gitter);stroke-width:1}
svg .r3-pfad{stroke-width:3;stroke-dasharray:6 4}
svg .r3-pfad.r3-x{stroke:var(--m-1)} svg .r3-pfad.r3-y{stroke:var(--m-2)} svg .r3-pfad.r3-z{stroke:var(--m-3)}
svg .r3-quader{stroke:var(--m-grau);stroke-width:1.3;stroke-dasharray:4 4}
svg .r3-strecke{stroke:var(--m-erg);stroke-width:3}
svg .r3-punkt{fill:var(--m-erg);stroke:#fff;stroke-width:2}
svg .r3-punkt.ziel{fill:#fff;stroke:var(--m-ok);stroke-width:3}
svg .r3-punkt.grau{fill:#fff;stroke:var(--m-grau);stroke-width:3}
svg .r3-text{font-size:15px;font-weight:800;fill:var(--m-erg);font-family:var(--m-schrift)}
svg .r3-text.ziel{fill:var(--m-ok)}
html.handy svg .r3-zahl{font-size:14px}

/* Bedienung wie im Muster (entwurf/mathematik_raum_koordinatensystem): Leiste mit Knopfgruppen, Feld mit Rahmen */
.r3-leiste{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.r3-leiste .knopf{font-size:14px;padding:5px 11px}
.r3-leiste .gruppe{display:flex}
.r3-leiste .gruppe .knopf{border-radius:0;margin-left:-1px}
.r3-leiste .gruppe .knopf:first-child{border-radius:999px 0 0 999px;margin-left:0}
.r3-leiste .gruppe .knopf:last-child{border-radius:0 999px 999px 0}
.r3-leiste .rechts{margin-left:auto;display:flex;gap:6px}
.r3-feld{border:1px solid var(--linie);border-radius:12px;background:var(--papier)}
.r3-feld svg{display:block;max-width:100%;height:auto;user-select:none}
.r3-feld.dreh svg{cursor:grab;touch-action:none}          /* nur beim Drehen: Ziehen statt Scrollen */
html.handy .r3-leiste .knopf{font-size:15px}
html.handy .r3-leiste .rechts{margin-left:0}

/* Vektorpfeile (V.pfeil): Linie und Spitze in derselben Farbe */
svg line.r3-pfeil-v{stroke:var(--m-erg);stroke-width:2.6} svg path.r3-spitze{stroke:none} svg path.r3-pfeil-v{fill:var(--m-erg)}

/* ==== technik/mathe/formel.css ==== */
/* =====================================================================
   FORMEL — Aussehen der MathML-Formeln. Quelle: technik/mathe/formel.css
   Grundlage: Temml-Local.css aus Temml 0.13.5 (MIT, technik/mathe/temml/LICENSE), ohne @font-face:
   Es wird keine Schrift eingebettet, das Gerät liefert die Matheschrift (Windows: Cambria Math,
   iPad/Mac: STIX Two Math, Linux mit TeX: Latin Modern Math).
   ===================================================================== */

/* Der Folienrahmen setzt *{margin:0;padding:0} – das löscht die Zellabstände, die der Browser MathML-Tabellen
   (Vektoren, Gleichungssysteme) mitgibt. Hier wiederhergestellt wie in MathML Core; Temmls Regeln unten verfeinern. */
mtd{padding:0.5ex 0.4em}

math {
  font-family: "Latin Modern Math", "STIX Two Math", "STIXTwoMath-Regular", "Cambria Math", "NotoSansMath-Regular", math;
  font-style: normal;
  font-weight: normal;
  line-height: normal;
  font-size-adjust: none;
  text-indent: 0;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  direction: ltr;
  /* Prevent Firefox from omitting the dot on i or j. */
  font-feature-settings: "dtls" off;
}

math * {
  border-color: currentColor;
}

/* display: block is necessary in Firefox and Safari.
 * Not in Chromium, which recognizes display: "block math" written inline. */
 math.tml-display {
  display: block;
  width: 100%;
}

*.mathcal {
  /* NotoSans */
  font-feature-settings: 'ss01';
}

math .mathscr {
  font-family: "Temml";
}

mo.tml-prime {
  font-family: Temml;
}

/* Cramped superscripts in WebKit */
mfrac > :nth-child(2),
msqrt,
mover > :first-child {
  math-shift: compact
}

.menclose {
  display: inline-block;
  position: relative;
  padding: 0.5ex 0ex;
}
.tml-cancelto {
  display: inline-block;
  position: absolute;
  top: 0;
  left: 0;
  padding: 0.5ex 0ex;
  background-color: currentColor;
  /* Use the SVG as an alpha mask (painted by background-color) */
  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
  -webkit-mask-position: 0 0;
          mask-position: 0 0;
}

@supports (-moz-appearance: none) {
  /* \vec w/o italic correction for Firefox */
  .tml-vec {
    transform: scale(0.75)
  }
  /* Fix \cancelto in Firefox */
  .ff-narrow {
    width: 0em;
  }
  .ff-nudge-left {
    margin-left: -0.2em;
  }
  /* Squash hidden mrows in \bordermatrix. Messes with centering, but necessary to squash. */
  .ff-squash mtd {
    display: block;
    height: 0;
  }
}

@supports (not (-moz-appearance: none)) {
  /* Chromium and WebKit */
  /* prime vertical alignment */
  mo.tml-prime {
    font-family: Temml;
  }
  /* Italic correction on superscripts */
  .tml-sml-pad {
    padding-left: 0.05em;
  }
  .tml-med-pad {
    padding-left: 0.10em;
  }
  .tml-lrg-pad {
    padding-left: 0.15em;
  }
}

@supports (-webkit-backdrop-filter: blur(1px)) {

/* ==== FENSTER: technik/fenster/fenster.css ==== */
/* Gemeinsames Fenster über der Folie (Eingabehilfe ⓘ, Rechnung …): Überlagerung, Karte, Kopf, Schließen-Knopf.
   Breite und Eigenes stehen beim jeweiligen Baustein (#hilfe, #rechnung). */
.fenster{position:fixed;inset:0;background:rgba(10,68,112,.6);z-index:120;display:none;padding:30px;overflow:auto}
.fenster.an{display:flex;align-items:flex-start;justify-content:center}

.fenster-kopf{display:flex;align-items:center;gap:12px;margin:-18px -24px 6px;padding:14px 24px 8px;position:sticky;top:-30px;background:#fff;border-radius:16px 16px 0 0;z-index:1}

.fenster-zu{margin-left:auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--blau-pastell);color:var(--blau-d);font-size:26px;font-weight:700;cursor:pointer;line-height:1}

/* Fenster, Karte, Kopf, Schließen: technik/fenster/ (.fenster …) */
.hilfe-karte{max-width:760px}

/* ==== RECHNUNG: technik/rechnung/rechnung.css ==== */
/* Fenster, Karte, Kopf, Schließen: technik/fenster/ (.fenster …) – hier nur das Eigene der Rechnung */

.re-seite > thead, .re-seite > tfoot{display:none}
.re-druckkopf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font-size:9.5pt;color:var(--tinte);
  border-bottom:.6pt solid var(--grau);padding-bottom:2.5mm;margin-bottom:6mm}
.re-druckkopf .re-dk-mitte{font-weight:700;text-align:center}
.re-druckkopf img{height:11mm;width:auto;justify-self:end}
/* Druck: wie die .tex gesetzt – Serifenschrift, dunkle Schrift, Abschnitte „Aufgabe“/„Lösungsweg“ fett, Schritte fett nummeriert.
   Seitenformat setzt drucken() (A4 hoch). */
@media print{
  html.re-druck body > *:not(#rechnung){display:none!important}
  html.re-druck body{background:none}
  html.re-druck #rechnung{display:block!important;position:static;background:none;padding:0;overflow:visible}
  html.re-druck .re-karte{box-shadow:none;max-width:none;padding:0;border-radius:0;background:none;
    font-family:"Latin Modern Roman","CMU Serif","Cambria","Times New Roman",serif;font-size:11pt;line-height:1.4;color:var(--tinte)}
  html.re-druck .re-seite{display:table;width:100%;border-collapse:collapse}
  html.re-druck .re-seite > thead{display:table-header-group}
  html.re-druck .re-seite > tfoot{display:table-footer-group}
  html.re-druck .re-druckfuss{height:16mm}                             /* unterer Rand, auf jeder Seite (tfoot) */
  html.re-druck .re-seite > tbody{display:table-row-group}
  html.re-druck .re-seite > tbody > tr, html.re-druck .re-seite > thead > tr{display:table-row}
  html.re-druck .re-seite td{display:table-cell;padding:0 20mm}   /* Seitenränder links/rechts (die Seite selbst hat keinen Rand) */
  html.re-druck .re-druckkopf{font-size:9pt;color:var(--tinte);border-bottom:.4pt solid var(--tinte);padding:14mm 0 2mm;margin-bottom:7mm}   /* oben: Seitenrand */
  html.re-druck .re-druckkopf img{height:10mm}
  html.re-druck .re-kopf, html.re-druck .re-titelzeile{display:none}   /* Fensterkopf und Überschrift: nur Aufgabe und Lösungsweg */
  html.re-druck .re-art{font-size:9.5pt;color:var(--tinte)}
  html.re-druck .re-inhalt section{border:none;padding:0;margin:0 0 5mm}   /* der Lösungsweg beginnt direkt nach der Aufgabe und bricht zwischen den Schritten um (Peter, 09.10.) */
  html.re-druck .re-inhalt h4{font-size:12pt;font-weight:700;letter-spacing:0;text-transform:none;color:var(--tinte);margin:0 0 2.5mm;break-after:avoid-page}   /* Überschrift nie allein am Seitenende */
  html.re-druck .re-absatz{overflow:visible;margin:0 0 2mm;break-inside:avoid-page}   /* ein Schritt bleibt beisammen */
  html.re-druck .re-absatz strong{color:var(--tinte);font-weight:700}
  html.re-druck .re-absatz math{font-size:1.05em}
  html.re-druck .re-absatz math[display="block"]{margin:2mm 0}
}

        ['3x', ['3x', '3*x']], ['x^{2}', ['x^2', 'x²']], ['2(x+1)', ['2(x+1)']], ['\\dfrac{x+1}{x-2}', ['(x+1)/(x-2)']],
        ['e^{2x}', ['e^(2x)']], ['\\sqrt{x}', ['√x', 'Wurzel(x)']], ['1{,}5x', ['1,5x', '1.5x']],
      ]),
      hinweise: ['Der Malpunkt darf fehlen: `3x`, `2(x+1)`. Hochzahl mit `^`, mehrteilige Hochzahl in Klammern: `e^(2x)`, `x^(-2)`.',
                 'Bei Brüchen Klammern um Zähler und Nenner: `(x+1)/(x-2)`. Auch erlaubt: `π`, `ln(x)`, `sin(x)`, `cos(x)`.'],
    }; },
    /* eine Zahl, die als Term geschrieben werden darf (ohne x): √2, π/4, ln(5)/2 */
    zahlTerm(lies, { pi = true, ln = true } = {}){ return {
      zeilen: zeilen(lies, [
        ['\\sqrt{2}', ['√2', 'sqrt(2)']], ['2\\sqrt{3}', ['2√3']], ['\\dfrac{\\sqrt{3}}{2}', ['√3/2']],
        ...(pi ? [['\\dfrac{\\pi}{4}', ['pi/4', 'π/4']]] : []), ...(ln ? [['\\dfrac{\\ln(5)}{2}', ['ln(5)/2']]] : []),
      ]),
      hinweise: ['Ein genauer Wert darf als Term stehen (`√2`, `2√3`), ein gerundeter als Dezimalzahl (`1,41`).'],
    }; },
    /* Lösungsmengen und Listen von x-Werten */
    liste(lies, { wurzel = true, keine = true, pm = true } = {}){ return {
      zeilen: zeilen(lies, [
        ['\\{0;\\,3;\\,-\\tfrac{1}{2}\\}', ['0; 3; -1/2']],
        ...(pm ? [['x = \\pm 2', ['±2', '+-2']]] : []),
        ...(wurzel ? [['1 \\pm \\sqrt{5}', ['1±√5']]] : []),
        ...(keine ? [['\\{\\,\\}', ['keine']]] : []),
      ]),
      hinweise: ['Mehrere Werte mit Semikolon trennen: `0; 3`. `x =` davor ist erlaubt.'],
    }; },
    /* Prozent-Angaben */
    prozent(lies){ return {
      zeilen: zeilen(lies, [['15\\,\\%', ['15 %', '15%']]]),
      hinweise: ['Prozent mit Zeichen am Ende: `15 %`.'],
    }; },
    /* Winkel in Grad */
    grad(lies){ return {
      zeilen: zeilen(lies, [['30^{\\circ}', ['30°', '30']]]),
      hinweise: ['Winkel in Grad: das Gradzeichen `°` darf fehlen.'],
    }; },
  };
})();

/* Knopf und Fenster – wenn die Seite fertig ist (dann haben sich alle Teile angemeldet) */
const EINGABEHILFE_FENSTER = { selbstpruefung: () => [] };
document.addEventListener('DOMContentLoaded', () => {
  const nav = document.getElementById('nav');
  if (!nav || !EH.hat()) return;
  const taste = t => `<kbd>${t}</kbd>`;
  const mitTasten = t => t.replace(/`([^`]+)`/g, (_, x) => taste(x));
  const knopf = document.createElement('button');
  knopf.id = 'hilfeknopf'; knopf.type = 'button'; knopf.title = 'So gibst du Mathe ein (H)'; knopf.setAttribute('aria-label', 'Eingabehilfe: so gibst du Mathe ein');
  knopf.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="punkt" cx="12" cy="6.6" r="1.9"/><path d="M12 11v8"/></svg>';
  nav.insertBefore(knopf, nav.firstChild);
  const fenster = FENSTER.neu('hilfe', 'hilfe-titel', () => schliesse());     // technik/fenster/: Überlagerung, Navigation ruht

  function oeffne(){
    const E = EH.alle();
    fenster.innerHTML = `<div class="hilfe-karte fenster-karte">
      <div class="fenster-kopf"><h3 id="hilfe-titel">So gibst du Mathe ein</h3><button type="button" class="hilfe-zu fenster-zu" aria-label="Hilfe schließen">×</button></div>
      <div class="hilfe-inhalt">
        <table class="hilfe-tab"><tr><th>gemeint</th><th>eintippen</th></tr>
          ${E.zeilen.map((z, i) => `<tr data-zeile="${i}"><td>${F(z.tex)}</td><td>${z.text ? mitTasten(z.text) : z.ein.map(taste).join(' oder ')}</td></tr>`).join('')}
        </table>
        ${E.hinweise.length ? `<ul>${E.hinweise.map(h => `<li>${mitTasten(h)}</li>`).join('')}</ul>` : ''}
      </div>
    </div>`;
    fenster.classList.add('an');
    fenster.querySelector('.hilfe-zu').onclick = schliesse;
    fenster.querySelector('.hilfe-zu').focus();
    fenster.scrollTop = 0;
  }
  function schliesse(){ fenster.classList.remove('an'); knopf.focus(); }
  const offen = () => fenster.classList.contains('an');
  knopf.addEventListener('click', () => offen() ? schliesse() : oeffne());
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (e.key === 'h' || e.key === 'H' || e.key === '?') { e.preventDefault(); offen() ? schliesse() : oeffne(); }
    else if (e.key === 'Escape' && offen()) schliesse();
  });
  /* für die Prüfung: jede Schreibweise der Tabelle durch ihren Leser */
  EINGABEHILFE_FENSTER.selbstpruefung = () => {
    const f = [], E = EH.alle();
    if (!E.zeilen.length) f.push('keine Zeilen');
    E.zeilen.forEach(z => {
      const schreib = [...z.ein, ...[...(z.text || '').matchAll(/`([^`]+)`/g)].map(m => m[1])];
      if (!schreib.length) f.push(`Zeile ${z.tex}: keine Schreibweise`);
      schreib.filter(s => z.lies(s) === null).forEach(s => f.push(`„${s}" (Zeile ${z.tex}) wird nicht angenommen`));
      const k = new Set(z.ein.map(s => z.lies(s)).filter(x => x !== null));
      if (k.size > 1) f.push(`Zeile ${z.tex}: ${z.ein.join(' / ')} meinen nicht dasselbe`);
    });
    return f;
  };
  Object.assign(EINGABEHILFE_FENSTER, { oeffne, schliesse, offen });
});

<script data-fenster="technik/fenster/fenster.js">
/* =====================================================================
   FENSTER — gemeinsames Verhalten der Fenster über der Folie (Eingabehilfe ⓘ, Rechnung). Quelle: technik/fenster/
     FENSTER.neu(id, titelId, schliesse)  Fenster-Element (role="dialog", aria-modal) anlegen; Klick auf den Rand schließt
     FENSTER.offen()                      ist irgendein Fenster offen?
   Solange ein Fenster offen ist, RUHT die Navigation der Präsentation: Pfeile, Leertaste, Enter, Bild auf/ab, Pos1/Ende,
   O, F … erreichen die Folien nicht (Tastendruck wird vor dem Rahmen abgefangen). Esc und H bleiben bei den Fenstern.
   ===================================================================== */
const FENSTER = (() => {
  const alle = [];
  const offen = () => alle.some(f => f.classList.contains('an'));
  addEventListener('keydown', e => {
    if (!offen() || ['Escape', 'Tab', 'h', 'H', '?'].includes(e.key)) return;
    e.stopImmediatePropagation();                                    // die Folie dahinter blättert nicht weiter
  }, true);
  function neu(id, titelId, schliesse){
    const f = document.createElement('div');
    f.id = id; f.className = 'fenster'; f.setAttribute('role', 'dialog'); f.setAttribute('aria-modal', 'true'); f.setAttribute('aria-labelledby', titelId);
    document.body.appendChild(f); alle.push(f);
    f.addEventListener('click', e => { if (e.target === f) schliesse(); });
    return f;
  }
  return { neu, offen };
})();
</script><!-- /FENSTER -->

<script>
/* ==== technik/mathe/bruch.js ==== */
/* =====================================================================
   BRUCH — exakt rechnen mit Brüchen { z, n } (n > 0, gekürzt). Gemeinsam genutzt von den
   Mathe-Werkzeugen (Gleichungssysteme). Quelle: technik/mathe/bruch.js
     Q(z, n) · qAdd qSub qMul qDiv qNeg qNull qGleich qWert · qHtml (Bruch übereinander) · qText
     linHtml([[k, 'x'], [k2, 'y'], [k3, '']]) → „2x − y + 3" · qLies("3/2" | "-1,5") → Bruch oder null
   ===================================================================== */
const ggT = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
/* Exakt heißt: Zähler und Nenner bleiben sichere Ganzzahlen (< 2^53). Darum vor dem Multiplizieren kürzen
   (Hauptnenner statt Produkt, über Kreuz kürzen) – und laut scheitern statt still runden (08.10., Vierfeldertafel). */
function Q(z, n = 1){ if (n < 0) { z = -z; n = -n; }
  if (!Number.isSafeInteger(z) || !Number.isSafeInteger(n)) throw new Error('Die Zahlen werden zu groß für eine exakte Rechnung.');
  const g = ggT(z, n); return { z: z / g, n: n / g }; }
const qAdd = (a, b) => { const g = ggT(a.n, b.n); return Q(a.z * (b.n / g) + b.z * (a.n / g), a.n / g * b.n); };
const qSub = (a, b) => qAdd(a, { z: -b.z, n: b.n });
const qMul = (a, b) => { const g1 = ggT(a.z, b.n), g2 = ggT(b.z, a.n); return Q((a.z / g1) * (b.z / g2), (a.n / g2) * (b.n / g1)); };
const qDiv = (a, b) => qMul(a, b.z < 0 ? { z: -b.n, n: -b.z } : { z: b.n, n: b.z });
const qNeg = a => Q(-a.z, a.n);
const qNull = a => a.z === 0;
const qGleich = (a, b) => a.z === b.z && a.n === b.n;
const qWert = a => a.z / a.n;
/* als HTML: ganze Zahl oder Bruch übereinander; Minus davor */
function qHtml(a){
  const s = a.z < 0 ? '−' : '';
  return a.n === 1 ? s + Math.abs(a.z) : `${s}<span class="bruch"><span>${Math.abs(a.z)}</span><span>${a.n}</span></span>`;
}
const qText = a => a.n === 1 ? String(a.z) : `${a.z}/${a.n}`;
/* lineare Summe  a·x + b·y  (ohne Nullen, 1 weglassen) */
function linHtml(teile){
  let s = '';
  teile.forEach(([k, v]) => {
    if (qNull(k)) return;
    const neg = k.z < 0, betrag = Q(Math.abs(k.z), k.n);
    const zahl = v && qGleich(betrag, Q(1)) ? '' : qHtml(betrag);
    s += (s ? (neg ? ' − ' : ' + ') : (neg ? '−' : '')) + zahl + (v ? `<i>${v}</i>` : '');
  });
  return s || '0';
}
/* Eingabe wie „3/2", „-1,5", „ + 4 ", „3 / -4" → Bruch oder null. Nie raten: was nicht passt, ist null. */
function qLies(text){
  if (/\d\s+[\d,.]|[,.]\s+\d/.test(String(text))) return null;          // streng: „2 5“ ist nicht 25, „2, 5“ nicht 2,5
  const t = String(text).replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/^\+/, '').replace(',', '.');
  let m = t.match(/^(-?\d+)\/(-?\d+)$/);
  if (m) { const z = Number(m[1]), n = Number(m[2]); return n ? Q(z, n) : null; }
  m = t.match(/^(-?)(\d+)(?:\.(\d{1,6}))?$/);
  if (m) { const nk = m[3] || '', n = 10 ** nk.length; return Q((m[1] ? -1 : 1) * (Number(m[2]) * n + Number(nk || 0)), n); }
  return null;
}


/* ==== technik/mathe/vektor.js ==== */
/* =====================================================================
   VEKTOR — exakt rechnen mit Vektoren aus Brüchen. Quelle: technik/mathe/vektor.js
   Braucht technik/mathe/bruch.js. Ein Vektor ist ein Feld von Brüchen [{z, n}, …] (Länge beliebig, kreuz nur 3D).
     VK.QV([1, -2, Q(1, 2)])        Zahlen und Brüche gemischt → Vektor aus Brüchen
     VK.add(a, b) · VK.sub(a, b)    Summe, Differenz
     VK.mal(k, a)                   k-faches (k ein Bruch)
     VK.skalar(a, b) → Bruch        Skalarprodukt
     VK.kreuz(a, b) → Vektor        Kreuzprodukt (3D)
     VK.nullV(a) · VK.gleich(a, b) · VK.parallel(a, b)   Nullvektor? gleich? parallel (3D: Kreuzprodukt null)?
     VK.liesFelder(inputs, opt) → { v, meld }   Feldreihe streng lesen (WZ.liesZahl, opt wie dort): v = Vektor aus Brüchen
                                    oder null; falsche Felder bekommen .falsch, meld = Meldung des ersten (z. B. „2 5“ ist nicht 25)
     VK.wurzel(q) → { c, r }          √q exakt für einen Bruch q ≥ 0: c·√r mit c Bruch, r quadratfrei (√(9/2) = 3/2·√2)
     VK.wurzelTex(c, r)               c·√r als LaTeX (Bruch: Wurzel in den Zähler)
     VK.laenge(a) → { c, r, q }      Betrag exakt (q = a·a)
     VK.spalte(name, werte, klasse)  Spalte aus drei Eingabefeldern (<span class="vk" data-v="name">), Werte vorbelegt –
                                    Stil in werkzeug.css (.vk); lesen mit VK.liesFelder(root.querySelectorAll('[data-v="name"] input'))
   Matrizen bleiben vorerst in ihren Werkzeugen (nur zwei brauchen sie).
   ===================================================================== */
const VK = {
  QV: a => a.map(x => typeof x === 'object' ? x : Q(x)),
  add: (a, b) => a.map((x, i) => qAdd(x, b[i])),
  sub: (a, b) => a.map((x, i) => qSub(x, b[i])),
  mal: (k, a) => a.map(x => qMul(k, x)),
  skalar: (a, b) => a.reduce((s, x, i) => qAdd(s, qMul(x, b[i])), Q(0)),
  kreuz: (u, v) => [qSub(qMul(u[1], v[2]), qMul(u[2], v[1])), qSub(qMul(u[2], v[0]), qMul(u[0], v[2])), qSub(qMul(u[0], v[1]), qMul(u[1], v[0]))],
  nullV: a => a.every(qNull),
  gleich: (a, b) => a.length === b.length && a.every((x, i) => qGleich(x, b[i])),
  parallel: (a, b) => VK.nullV(VK.kreuz(a, b)),
  wurzel(q){                                                     // √(z/n) = √(z·n)/n = k·√r / n
    if (qNull(q)) return { c: Q(0), r: 1 };
    const m = q.z * q.n; let k = 1; for (let t = 2; t * t <= m; t++) if (m % (t * t) === 0) k = t;
    return { c: Q(k, q.n), r: m / (k * k) };
  },
  wurzelTex(c, r){
    if (qNull(c)) return '0';
    if (r === 1) return qTex(c);
    const z = c.z === 1 ? `\\sqrt{${r}}` : `${c.z}\\sqrt{${r}}`;
    return c.n === 1 ? z : `\\dfrac{${z}}{${c.n}}`;
  },
  laenge(a){ const q = VK.skalar(a, a); return { ...VK.wurzel(q), q }; },
  spalte: (name, werte = ['', '', ''], klasse = '') => `<span class="vk${klasse ? ' ' + klasse : ''}" data-v="${name}">${werte.map((x, i) => `<input data-k="${i}" value="${typeof x === 'object' ? qText(x) : x}" spellcheck="false" autocomplete="off" aria-label="${name} ${'xyz'[i] || i + 1}">`).join('')}</span>`,
  liesFelder(felder, opt = {}){
    let meld = '';
    const q = [...felder].map(f => {
      try { const r = WZ.liesZahl(f.value, opt); if (!r.q) throw new Error('Bitte eine Zahl oder einen Bruch eintragen.'); f.classList.remove('falsch'); return r.q; }
      catch (e) { f.classList.add('falsch'); meld = meld || e.message; return null; }
    });
    return { v: q.every(Boolean) ? q : null, q, meld };
  },
};

/* ==== technik/mathe/werkzeug.js ==== */
/* =====================================================================
   WERKZEUG — gemeinsame Bedienhelfer der Mathe-Rechner. Quelle: technik/mathe/werkzeug.js
     WZ.weg(root, {weg, schritt, alle})   Lösungsweg mit „Nächster Schritt" / „Alle" / „Rechnung" (ganzer Weg als Dokument,
                                          .tex und PDF-Druck; Aufgabe aus .wz-aufgabe – technik/rechnung/)
         .setze([[was, html, letzt?], …])  .offen()  .alle()
     WZ.rueck(el, art, html)              Rückmeldung: art '' | 'ok' | 'fast' | 'nein'
     WZ.handy()                           Handy-Ansicht aktiv?
     WZ.rnd(a, b) · WZ.nz(a, b) · WZ.eins(liste)   Zufall (ganze Zahl, ohne 0, Element)
     WZ.zahl(v, stellen)                  deutsch: Komma, Minus als −
     WZ.ganz(text)                        streng: nur ganze Zahl, sonst NaN (nie still abschneiden)
     WZ.liesZahl(text, {prozent, euro, grad, einheiten, praefix, term})
                                          Zahlantwort streng lesen (Standard seit 05.10.2026) → {q, v, stellen, zusatz}; sonst Error mit
                                          Meldung. Immer: ≈ davor, Dezimalkomma/-punkt, Bruch a/b (qLies), „2 5“ und „2,5,1“ sind Fehler.
                                          prozent/euro/grad: %, €, ° am Ende erlaubt (zusatz sagt, was da stand – umrechnen tut das Werkzeug)
                                          einheiten: ['cm', 'm'] am Ende · praefix: 'x' erlaubt „x =“ / „x ≈“ davor
                                          term: auch ein Zahlterm ohne x (√2, 3pi/4, ln(5)/2) über T_lies – dann stellen = Infinity
     WZ.reglerEingabe(feld, setze, opt) · WZ.reglerWert(feld, text)
                                          Schieber mit Eingabefeld: Wert eintippen (streng, Brüche) oder schieben; setze({q, v}) →
                                          Fehlertext oder null. Feld: <input class="wz-eingabe wz-reglerwert"> im .wz-regler (Muster Parabeln)
     WZ.liesMenge(text, eintrag, {leer, pm, praefix})
                                          Lösungsmenge: „L =“, { }, Trennung mit ;, „x₁ =“ je Eintrag, „±“/„+-“ → zwei Einträge,
                                          leer ('keine', '∅', '{}', '-') → []. eintrag(t) liest einen Eintrag (z. B. t => WZ.liesZahl(t, {term: true}))
     WZ.stellen(text)                     getippte Nachkommastellen; Infinity bei exakter Eingabe (Bruch, π, √, ln …)
     WZ.zahlPruefen({v, stellen}, soll, {min, fehler, fast, textStellen, textGenauer})
                                          Zahlantwort prüfen (Standard seit 05.10.2026) → {art, text, gerundet}:
                                          1. richtig: Toleranz nach getippten Stellen, mindestens min (Std. 2) – „2“ gilt nicht für 2,025
                                          2. Fehlerbilder [[wert, meldung], …] VOR „fast“; mehrere passende → „Oder:“ (Doppeldeutung)
                                          3. „fast“: richtig gerundet, aber zu wenige Stellen (höchstens 5 % daneben) – oder eine Stelle gröber daneben
                                          text null: das Werkzeug sagt selbst „nicht richtig“
     WZ.beiBreite(el, neu)                neu() aufrufen, sobald el (wieder) eine Breite hat und wenn sie sich ändert –
                                          für Grafiken auf Folien, die beim Laden verborgen sind (sonst Breite 0)
   ===================================================================== */
const WZ = {
  weg(root, ids = {}){
    const R = r => root.querySelector(`[data-r="${r}"]`);
    const kasten = R(ids.weg || 'weg'), kSchritt = R(ids.schritt || 'schritt'), kAlle = R(ids.alle || 'alle');
    let schritte = [], offen = 0, kRe = null;
    const zeichne = () => {
      kasten.innerHTML = schritte.map(([was, html, letzt], i) => `<div class="wz-w${letzt ? ' letzt' : ''}"${i < offen ? '' : ' hidden'}>
        <span class="nummer">${i + 1}</span><span class="was">${was}</span><span>${html}</span></div>`).join('')
        + (offen === 0 && schritte.length ? `<p class="wz-leer">${schritte.length} ${schritte.length === 1 ? "Schritt" : "Schritte"}. Aufdecken mit „Nächster Schritt".</p>` : '');
      if (kSchritt) kSchritt.disabled = offen >= schritte.length;
      if (kRe) kRe.disabled = !schritte.length;                      // ohne Weg keine Rechnung
      root.dataset.offen = offen;
    };
    // Knopf „Rechnung“ neben „Alle“: Aufgabe und ganzer Weg als Dokument (Fenster, .tex, PDF-Druck – technik/rechnung/)
    if (kAlle && typeof RE !== 'undefined') kRe = RE.knopf(kAlle, () => schritte.length ? RE.ausWeg(root, schritte) : null);
    if (kRe) kRe.disabled = true;                                  // bis ein Weg gesetzt ist
    if (kSchritt) kSchritt.onclick = () => { offen = Math.min(schritte.length, offen + 1); zeichne(); };
    if (kAlle) kAlle.onclick = () => { offen = schritte.length; zeichne(); };
    return {
      setze(s){ schritte = s; offen = 0; zeichne(); },
      alle(){ offen = schritte.length; zeichne(); },
      offen: () => offen, anzahl: () => schritte.length,
    };
  },
  rueck(el, art, html){ el.className = 'wz-rueck' + (art ? ' ' + art : ''); el.innerHTML = html; const r = el.closest('[data-werkzeug]'); if (r) { if (art) r.dataset.pruefung = art; else delete r.dataset.pruefung; } },
  handy: () => document.documentElement.classList.contains('handy'),
  rnd: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  nz(a, b){ let v; do v = WZ.rnd(a, b); while (v === 0); return v; },
  eins: liste => liste[Math.floor(Math.random() * liste.length)],
  beiBreite(el, neu){ let b = -1; new ResizeObserver(() => { const w = Math.round(el.clientWidth); if (w > 0 && w !== b) { b = w; neu(w); } }).observe(el); },
  zahl(v, stellen = 4){ const s = (Math.round(v * 10 ** stellen) / 10 ** stellen).toString(); return s.replace('-', '−').replace('.', ','); },
  ganz: t => /^\s*[-−]?\d+\s*$/.test(String(t)) ? parseInt(String(t).replace('−', '-'), 10) : NaN,
  stellen(text){
    const t = String(text);
    if (/[\/π√∛∜]|pi|sqrt|ln|log|e\^|exp|sin|cos/i.test(t)) return Infinity;
    const m = t.match(/\d[.,](\d+)(?!.*\d[.,]\d)/); return m ? m[1].length : 0;
  },
  liesZahl(text, { prozent = false, euro = false, grad = false, einheiten = [], praefix = '', term = false } = {}){
    let t = String(text).trim().replace(/^≈\s*/, '');
    if (praefix) t = t.replace(new RegExp('^' + praefix + '\\s*[=≈]\\s*'), '');
    if (!t) throw new Error('Bitte eine Zahl eintragen.');
    let zusatz = '';
    for (const e of [...(prozent ? ['%'] : []), ...(euro ? ['€'] : []), ...(grad ? ['°'] : []), ...einheiten])
      if (t.endsWith(e)) { zusatz = e; t = t.slice(0, -e.length).trim(); break; }
    const fremd = t.match(/[%€°]/); if (fremd) throw new Error(`„${fremd[0]}“ gehört hier nicht hin – nur die Zahl.`);
    if (/\d\s+[\d,.]|[,.]\s+\d/.test(t)) throw new Error('Zwischen zwei Zahlen fehlt ein Rechenzeichen – „2 5“ ist nicht 25.');
    if (typeof qLies !== 'function') throw new Error('WZ.liesZahl braucht technik/mathe/bruch.js (in meta.json unter „gemeinsam“).');
    const q = qLies(t);
    if (q) return { q, v: q.z / q.n, stellen: WZ.stellen(t), zusatz };
    if (term && typeof T_lies === 'function') {
      let b; try { b = T_lies(t); } catch (e) { throw new Error(e.message); }
      const v = T_wert(b, 0.37), v2 = T_wert(b, 1.91);
      if (!Number.isFinite(v)) throw new Error(`„${t}“ ist nicht definiert.`);
      if (Math.abs(v - v2) > 1e-9 * Math.max(1, Math.abs(v))) throw new Error('Hier ist eine Zahl gefragt, kein Term mit x.');
      return { q: null, v, stellen: WZ.stellen(t), zusatz };   // „1+1,73“ (aus ±) behält seine Stellen; Bruch, π, √ … → Infinity
    }
    throw new Error(`„${t}“ ist keine Zahl. Erlaubt: Dezimalzahl wie 2,5 oder Bruch wie 5/2.`);
  },
  liesMenge(text, eintrag, { leer = true, pm = true, praefix = 'x' } = {}){
    let t = String(text).trim().replace(/^L\s*=\s*/i, '');
    if (/^\{[^{}]*\}$/.test(t)) t = t.slice(1, -1).trim();
    if (!t && !/[{}]/.test(String(text))) throw new Error('Bitte die Lösungen eintragen, mit ; getrennt – oder „keine“.');
    if (!t || /^(keine?|leer|∅|-|–|−)$/i.test(t)) { if (leer) return []; throw new Error('Hier gibt es Lösungen.'); }
    const teile = t.split(/\s*;\s*/);
    if (teile.some(x => !x)) throw new Error('Leerer Eintrag – Lösungen mit ; trennen, z. B. 2; −3.');
    const aus = [], vor = new RegExp('^' + praefix + '(?:_?\\d+|[₀-₉]+)?\\s*[=≈]\\s*');
    for (let s of teile){
      s = s.replace(vor, '');
      const m = pm && s.match(/^(.*?)\s*(±|\+-|\+\/-)\s*(.+)$/);
      if (m) { const a = m[1], b = m[3]; aus.push(eintrag(a ? `${a}+(${b})` : b), eintrag(a ? `${a}-(${b})` : `-(${b})`)); }
      else aus.push(eintrag(s));
    }
    return aus;
  },
  /* Schieber mit Eingabefeld (Peter, 06.10., Parabeln: „so muss das sein“): <input class="wz-eingabe wz-reglerwert"> im .wz-regler.
     Eintippen + Enter (oder Feld verlassen): streng lesen (liesZahl, Brüche erlaubt), setze({ q, v }) → Fehlertext oder null
     (dann übernommen – setze() setzt den Zustand, zeichnet neu und ruft reglerWert für die Anzeige). Unsinn: Feld rot, Meldung, nichts ändert sich. */
  reglerEingabe(feld, setze, optionen = {}){
    const regler = feld.closest('.wz-regler'), meldung = WZ.reglerMeldung(regler);
    const los = () => {
      try { const z = WZ.liesZahl(feld.value, typeof optionen === 'function' ? optionen() : optionen);   // Optionen auch als Funktion (Einheit wechselt) if (!z.q && !Number.isFinite(z.v)) throw new Error('Bitte eine Zahl.');
        const fehl = setze(z); if (fehl) throw new Error(fehl);
        feld.classList.remove('falsch'); meldung.textContent = '';
        regler.parentElement.querySelectorAll('.wz-reglerwert.falsch').forEach(f => f.classList.remove('falsch')); }
      catch (e) { feld.classList.add('falsch'); meldung.textContent = e.message; } };
    feld.addEventListener('change', los);
    feld.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); los(); } });
  },
  /* Meldungszeile direkt unter der Gruppe aufeinanderfolgender Schieber (einmal angelegt) */
  reglerMeldung(regler){
    let n = regler; while (n.nextElementSibling && n.nextElementSibling.classList.contains('wz-regler')) n = n.nextElementSibling;
    if (n.nextElementSibling && n.nextElementSibling.classList.contains('wz-reglerfehler')) return n.nextElementSibling;
    const m = document.createElement('p'); m.className = 'wz-reglerfehler'; n.after(m); return m;
  },
  /* Anzeige im Feld nachführen – nicht, solange jemand darin tippt */
  reglerWert(feld, text){ if (document.activeElement === feld) return; feld.value = String(text).replace(/-/g, '−'); feld.classList.remove('falsch');
    const m = WZ.reglerMeldung(feld.closest('.wz-regler')); if (!m.parentElement.querySelector('.wz-reglerwert.falsch')) m.textContent = ''; },
  zahlPruefen(a, soll, { min = 2, fehler = [], fast = true, textStellen, textGenauer } = {}){
    const eps = 1e-9 * Math.max(1, Math.abs(soll)), d = Math.abs(a.v - soll);
    const t = a.stellen === Infinity ? eps : 0.5 * 10 ** -Math.max(min, a.stellen) + eps;
    if (d <= t) return { art: 'ok', text: null, gerundet: d > eps };
    const tf = Math.max(t, 0.5 * 10 ** -min * (a.stellen === Infinity ? 0 : 1) + eps);
    const treffer = fehler.filter(([w]) => Number.isFinite(w) && Math.abs(w - soll) > t && Math.abs(a.v - w) <= tf)   // unterscheidbar nach getippter Genauigkeit, Treffer mit mind. min Stellen
      .map(([, m]) => m).filter((m, i, L) => L.indexOf(m) === i);
    if (treffer.length) return { art: 'nein', text: treffer.join(' Oder: ') };
    if (fast && a.stellen < min && d <= 0.5 * 10 ** -a.stellen + eps && d <= 0.05 * Math.abs(soll))   // richtig gerundet, nur zu grob – „1“ für 0,866 ist es nicht
      return { art: 'fast', text: textStellen || `Fast – bitte genauer: auf ${min === 1 ? 'eine Nachkommastelle' : min + ' Nachkommastellen'}.` };
    if (fast && d <= 5 * 10 ** -min + eps) return { art: 'fast', text: textGenauer || 'Fast – genauer rechnen und erst am Ende runden.' };
    return { art: 'nein', text: null };
  },
};

/* ==== technik/mathe/raum3d.js ==== */
/* =====================================================================
   RAUM3D — 3D-Koordinatensystem als SVG, ohne Bibliothek. Quelle: technik/mathe/raum3d.js
   Zwei Ansichten:
     'schraeg'  Schrägbild wie im Schulbuch (Kavalierperspektive): y nach rechts, z nach oben,
                x schräg nach vorn-unten unter 45°, auf die Hälfte verkürzt.
     'dreh'     senkrechte Parallelprojektion, drehbar: Winkel a (um die z-Achse), e (Neigung).
   const V = R3_ansicht({ W, H, art, a, e, einheit, mitte: [mx, my], bereich: [min, max] })
     V.p(x, y, z) → [X, Y]          Bildpunkt
     V.achsen()                      Achsen x (Farbe --m-1), y (--m-2), z (--m-3) mit Pfeilspitze, Strichen und Zahlen
     V.gitterXY()                    leichtes Gitter in der x-y-Ebene
     V.strecke(P, Q, klasse) · V.punkt(P, klasse, r) · V.text(P, text, klasse, dx, dy)
     V.pfeil(P, Q, klasse)           Vektorpfeil mit Dreieckspitze (Linie und Spitze tragen die Klasse, Spitze zusätzlich r3-spitze)
     V.pfad(P)                       Weg vom Ursprung: erst x, dann y, dann z (gestrichelt, farbig)
     V.quader(P)                     Kanten des Quaders vom Ursprung bis P (Hilfslinien)
   R3_einpassen(o, rand)             setzt einheit und mitte so, dass Achsen samt Namen ins Bild passen
                                     (bei 'dreh' über alle Drehwinkel – das Bild pumpt beim Drehen nicht)
   R3_drehen(svg, V, beiAenderung)   Ziehen dreht (nur bei art 'dreh')
   R3_geradenStueck(P, u, lo, hi)    Stück der Geraden P + t·u im Würfel [lo; hi]³ → [A, B] oder null (Zahlen)
   R3_ebenenStueck(n, d, lo, hi)     Schnitt der Ebene n·x = d mit dem Würfel → Eckpunkte im Umlauf (Zahlen), sonst []
   R3_flaeche(V, ecken, klasse)      Vieleck als SVG-Pfad (z. B. das Ebenenstück)
   ===================================================================== */
function R3_ansicht(o){
  const W = o.W, H = o.H, art = o.art || 'schraeg', s = o.einheit || 34;
  const [mx, my] = o.mitte || [W * 0.42, H * 0.62];
  const [bmin, bmax] = o.bereich || [-1, 6];
  const a = (o.a ?? 30) * Math.PI / 180, e = (o.e ?? 20) * Math.PI / 180;
  const k = Math.SQRT1_2 * 0.5;                        // Kavalier: Faktor ½, Winkel 45°
  const p = art === 'schraeg'
    ? (x, y, z) => [mx + s * (y - k * x), my - s * (z - k * x)]
    : (x, y, z) => {
        const u = -x * Math.sin(a) + y * Math.cos(a);
        const t = x * Math.cos(a) + y * Math.sin(a);   // Tiefe (zum Betrachter)
        return [mx + s * u, my - s * (z * Math.cos(e) - t * Math.sin(e))];
      };
  const f = v => v.toFixed(1);
  const L = (P, Q, kl, extra = '') => { const [x1, y1] = p(...P), [x2, y2] = p(...Q); return `<line class="${kl}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"${extra}/>`; };
  const V = {
    W, H, art, p, a: o.a ?? 30, e: o.e ?? 20,
    achsen(){
      let g = '';
      const achse = (i, name, kl) => {
        const E = [0, 0, 0], A = [0, 0, 0]; E[i] = bmax + 0.8; A[i] = bmin;
        const [X0, Y0] = p(...A), [X1, Y1] = p(...E), lang = Math.hypot(X1 - X0, Y1 - Y0);
        if (lang > 1e-6){                                       // Pfeilspitze als eigenes Dreieck (kein SVG-Marker: IDs kollidieren zwischen Folien)
          const dx = (X1 - X0) / lang, dy = (Y1 - Y0) / lang, b = [X1 - 11 * dx, Y1 - 11 * dy];
          g += `<line class="r3-achse ${kl}" x1="${f(X0)}" y1="${f(Y0)}" x2="${f(b[0] + 2 * dx)}" y2="${f(b[1] + 2 * dy)}"/>`
            + `<path class="r3-pfeil ${kl}" d="M${f(X1)} ${f(Y1)}L${f(b[0] - 5 * dy)} ${f(b[1] + 5 * dx)}L${f(b[0] + 5 * dy)} ${f(b[1] - 5 * dx)}Z"/>`;
        }
        for (let t = bmin; t <= bmax; t++){
          if (t === 0) continue;
          const P = [0, 0, 0]; P[i] = t; const [X, Y] = p(...P);
          g += `<circle class="r3-strich ${kl}" cx="${f(X)}" cy="${f(Y)}" r="2.2"/>`;
          if (t > 0) { const d = i === 2 ? [-14, 4] : i === 1 ? [0, 16] : [-12, 12]; g += `<text class="r3-zahl" x="${f(X + d[0])}" y="${f(Y + d[1])}" text-anchor="middle">${t}</text>`; }
        }
        const [X, Y] = p(...E); const d = i === 2 ? [8, -2] : i === 1 ? [6, -8] : [-14, 14];
        g += `<text class="r3-name ${kl}" x="${f(X + d[0])}" y="${f(Y + d[1])}">${name}</text>`;
      };
      achse(0, 'x', 'r3-x'); achse(1, 'y', 'r3-y'); achse(2, 'z', 'r3-z');
      return g;
    },
    gitterXY(){
      let g = '';
      for (let t = 0; t <= bmax; t++){ g += L([t, 0, 0], [t, bmax, 0], 'r3-gitter') + L([0, t, 0], [bmax, t, 0], 'r3-gitter'); }
      return g;
    },
    strecke: (P, Q, kl = 'r3-strecke') => L(P, Q, kl),
    /* Pfeil von P nach Q mit Dreieckspitze (keine Marker). Klasse gilt für Linie und Spitze; Farbe über stroke/fill der Klasse. */
    pfeil(P, Q, kl = 'r3-pfeil-v'){
      const [x1, y1] = p(...P), [x2, y2] = p(...Q), l = Math.hypot(x2 - x1, y2 - y1);
      if (l < 2) return '';
      const ux = (x2 - x1) / l, uy = (y2 - y1) / l, bx = x2 - 11 * ux, by = y2 - 11 * uy;
      return `<line class="${kl}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(bx + 2 * ux)}" y2="${f(by + 2 * uy)}"/>`
        + `<path class="${kl} r3-spitze" d="M${f(x2)} ${f(y2)}L${f(bx - 5 * uy)} ${f(by + 5 * ux)}L${f(bx + 5 * uy)} ${f(by - 5 * ux)}Z"/>`;
    },
    punkt(P, kl = 'r3-punkt', r = 6){ const [X, Y] = p(...P); return `<circle class="${kl}" cx="${f(X)}" cy="${f(Y)}" r="${r}"/>`; },
    text(P, t, kl = 'r3-text', dx = 9, dy = -9){ const [X, Y] = p(...P); return `<text class="${kl}" x="${f(X + dx)}" y="${f(Y + dy)}">${t}</text>`; },
    pfad([x, y, z]){
      return L([0, 0, 0], [x, 0, 0], 'r3-pfad r3-x') + L([x, 0, 0], [x, y, 0], 'r3-pfad r3-y') + L([x, y, 0], [x, y, z], 'r3-pfad r3-z');
    },
    quader([x, y, z]){
      const E = [[0, 0, 0], [x, 0, 0], [x, y, 0], [0, y, 0], [0, 0, z], [x, 0, z], [x, y, z], [0, y, z]];
      return [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]].map(([i, j]) => L(E[i], E[j], 'r3-quader')).join('');
    },
  };
  return V;

      V = R3_ansicht(R3_einpassen({ W, H, art: S.ansicht, a: S.a, e: S.e, bereich: [LO, HI] }));
      svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.innerHTML = (S.gitter ? V.gitterXY() : '') + V.achsen() + inhalt(V);
      feld.classList.toggle('dreh', S.ansicht === 'dreh');
      B('schraeg').classList.toggle('an', S.ansicht === 'schraeg'); B('dreh').classList.toggle('an', S.ansicht === 'dreh');
      B('gitter').classList.toggle('an', S.gitter);
      el.dataset.ansicht = S.ansicht; el.dataset.winkel = `${Math.round(S.a)}|${Math.round(S.e)}`;
    }
    const drehe = d => { S.ansicht = 'dreh'; S.a = ((S.a + d) % 360 + 360) % 360; zeichne(); };
    B('schraeg').onclick = () => { S.ansicht = 'schraeg'; zeichne(); };
    B('dreh').onclick = () => { S.ansicht = 'dreh'; zeichne(); };
    B('links').onclick = () => drehe(-15); B('rechts').onclick = () => drehe(15);
    B('gitter').onclick = () => { S.gitter = !S.gitter; zeichne(); };
    R3_drehen(svg, () => V, (a, e) => { S.a = a; S.e = e; zeichne(); });
    window.addEventListener('handy-wechsel', zeichne);
    return { zeichne, S };
  }

  return { QV, kreuz, skalar, sub, nullV, parallel, spur, kuerze, lin, koordTex, punktTex, kl, polygon, bild, raumFeld, qt, LO, HI };
})();
