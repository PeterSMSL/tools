<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Das Folgenlabor: Glied für Glied Monotonie, Schranken und Grenzwert untersuchen, automatisch ausgewertet.">
<title>Folgen und Grenzwerte · Mathematik</title>
<style>
/* ==== HANDY-SCHICHT: technik/handy/handy.css ==== */
/* =====================================================================
   HANDY-SCHICHT für den Rahmen der Vorlagen (ds1 / Folgen) — plus eine Regel für alle Ansichten:
   zu viel Inhalt scrollt statt abgeschnitten zu werden.
   Greift nur, wenn handy.js <html class="handy"> setzt: Bildschirm zu klein für die
   Bühne 1280 × 720 (Handy, Tablet hochkant). Beamer, Laptop und Druck bleiben unberührt.
   Aus der Bühne wird eine scrollbare Seite pro Folie; Raster werden einspaltig,
   Schrift mindestens 14 px, Knöpfe mindestens 40 px (Finger).
   ===================================================================== */
/* ---- Für ALLE Ansichten (auch Beamer): nie abschneiden. Passt der Inhalt einer Folie nicht,
        scrollt der Inhaltsbereich; Kopf und Fuß bleiben stehen. ---- */
#stage .slide .inhalt{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#C4DFF2 transparent;
  margin-bottom:-10px}   /* bis an die Fußzeilenlinie: der freie Rand darüber gehört zum Inhalt (Folgen nutzt ihn) */
@media print{#stage .slide .inhalt{overflow:visible}}            /* Druck: alles zeigen */

html.handy, html.handy body{height:auto;overflow-x:hidden;overflow-y:auto}
html.handy body{display:block;background:var(--papier)}
html.handy #stage{width:100%;height:auto;transform:none!important}
html.handy .slide{position:relative;inset:auto;display:none;min-height:100vh;border-radius:0;box-shadow:none;
  padding:64px 14px 84px;transform:none;transition:none;overflow:visible}
html.handy .slide.aktiv{display:flex}

/* Kopf, Überschriften, Fuß */
html.handy .kopf{height:48px;padding:0 12px;gap:10px}
html.handy .kopf img{height:34px}
html.handy .kopf .schule{font-size:14px;letter-spacing:.06em}
html.handy .kopf .kurs{display:none}
html.handy h1{font-size:34px}
html.handy h2, html.handy .slide.kompakt h2{font-size:25px}
html.handy .eyebrow{font-size:14px;letter-spacing:.12em}
html.handy .titelzeile, html.handy .slide.kompakt .titelzeile{margin-bottom:14px}
html.handy .inhalt, html.handy #stage .slide .inhalt{display:block;overflow:visible;margin-bottom:0}   /* Handy: die Seite scrollt, nicht die Folie */
html.handy .fuss{position:static;margin-top:22px;font-size:14px;gap:10px}
html.handy p, html.handy li{font-size:17px}
html.handy .klein, html.handy .hinweis{font-size:15px}

/* Titelfolie: untereinander */
html.handy .slide.titel{display:none;grid-template-columns:1fr;padding:0}
html.handy .slide.titel.aktiv{display:grid}
html.handy .slide.titel .links{padding:40px 20px 24px}
html.handy .slide.titel .rechts{padding:24px 0 90px;border-left:none;border-top:1px solid rgba(255,255,255,.16)}
html.handy .slide.titel .unter{font-size:18px}
html.handy .slide.titel .meta span{font-size:14px}
html.handy .slide.titel .logokachel{border-radius:26px;padding:16px 18px}
html.handy .slide.titel .logokachel img{width:110px}
html.handy .slide.titel svg{max-width:100%;height:auto}

/* Raster und Karten: einspaltig */
html.handy .raster, html.handy .g2, html.handy .g3, html.handy .g4{grid-template-columns:1fr!important}
html.handy .karte p, html.handy .karte li{font-size:16px}

/* Finger: Knöpfe und Felder mindestens 40 px */
html.handy .knopf{min-height:42px;min-width:42px;font-size:15.5px;padding:8px 14px}
html.handy input, html.handy select{min-height:42px;font-size:16px}   /* 16 px: iOS zoomt sonst beim Tippen */
html.handy #nav{right:10px;bottom:10px;padding:6px 8px;gap:6px}
html.handy #nav button{width:42px;height:42px;font-size:18px}
html.handy #zaehler{font-size:14px}
html.handy svg{max-width:100%;height:auto}
/* ==== /HANDY-SCHICHT ==== */
:root{
  --blau:#136EA9;
  --blau-d:#0C4E79;
  --blau-h:#3E93CE;
  --blau-pastell:#E3F0F9;
  --orange:#F3A92F;
  --orange-d:#D98908;
  --orange-pastell:#FDF0DA;
  --tinte:#16232E;
  --grau:#5B6A76;
  --linie:#D8E2EA;
  --papier:#FFFFFF;
  --bg:#EAF1F6;
  --rot:#C62828;
  --gruen:#2E7D32;
  --stage-w:1280px;
  --stage-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:"Sansation","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

#stage{position:relative;width:var(--stage-w);height:var(--stage-h);transform-origin:center center;flex:none}
.slide{
  position:absolute;inset:0;
  background:var(--papier);
  border-radius:14px;
  box-shadow:0 18px 50px rgba(12,78,121,.22), 0 2px 6px rgba(12,78,121,.12);
  overflow:hidden;
  padding:86px 62px 58px;
  opacity:0;visibility:hidden;
  transform:translateY(14px) scale(.995);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
  display:flex;flex-direction:column;
}
.slide.aktiv{opacity:1;visibility:visible;transform:none}

.kopf{
  position:absolute;top:0;left:0;right:0;height:58px;
  background:linear-gradient(100deg,var(--blau-d) 0%,var(--blau) 55%,var(--blau-h) 100%);
  display:flex;align-items:center;gap:14px;
  padding:0 22px 0 18px;
  color:#fff;
  z-index:5;
}
.kopf::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 34%,#F6C46E 34%,#F6C46E 100%);
}
.kopf img{height:42px;width:auto;background:#fff;border-radius:11px;padding:3px 6px;box-shadow:0 3px 10px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.5)}
.kopf .schule{font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.95}
.kopf .kurs{
  margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  padding:5px 12px;border-radius:999px;
}

h1{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.015em;color:var(--blau-d)}
h3{font-size:20px;font-weight:750;color:var(--blau-d)}
p,li{font-size:19px;line-height:1.5;color:var(--tinte)}
.klein{font-size:16px;line-height:1.45;color:var(--grau)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--orange-d);margin-bottom:10px}
.titelzeile{margin-bottom:26px;flex:none}
.titelzeile h2::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--orange);margin-top:12px}
.slide.kompakt .titelzeile{margin-bottom:14px}
.slide.kompakt h2{font-size:32px}
.slide.kompakt h2::after{margin-top:8px;height:4px;width:52px}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center}
.slide.oben .inhalt{justify-content:flex-start}
strong{color:var(--blau-d)}

.raster{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.karte{background:var(--papier);border:1px solid var(--linie);border-radius:12px;padding:20px 22px;box-shadow:0 2px 0 rgba(19,110,169,.05);display:flex;flex-direction:column;gap:8px}
.karte.blau{background:var(--blau-pastell);border-color:#C4DFF2}
.karte.orange{background:var(--orange-pastell);border-color:#F3DCAF}
.karte.voll{background:linear-gradient(150deg,var(--blau-d),var(--blau));border:none;color:#fff}
.karte.voll h3,.karte.voll strong{color:#fff}
.karte.voll p,.karte.voll li{color:rgba(255,255,255,.92)}
.karte.voll .hl{color:var(--orange)}
.karte p,.karte li{font-size:17px;line-height:1.45}

.nummer{width:38px;height:38px;flex:none;border-radius:10px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.nummer.b{background:var(--blau)}
.zeile{display:flex;gap:16px;align-items:flex-start}

.fuss{position:absolute;left:62px;right:62px;bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--grau);border-top:1px solid var(--linie);padding-top:9px}

/* Formeln */
.formel{font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:normal;white-space:nowrap}
.formel i{font-style:italic}
.bruch{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.15}
.bruch > span:first-child{border-bottom:2px solid currentColor;padding:0 4px 2px}
.bruch > span:last-child{padding:2px 4px 0}
.antwort{border-top:1px dashed #E3C489;padding-top:8px;margin-top:2px;color:var(--tinte)!important}
.karte.voll .antwort{border-top-color:rgba(255,255,255,.35);color:#fff!important}

/* ---------- Titel und Schluss ---------- */
.slide.titel{
  padding:0;
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(243,169,47,.20), transparent 62%),
    linear-gradient(140deg,#0A4470 0%, var(--blau-d) 40%, var(--blau) 100%);
  color:#fff;display:grid;grid-template-columns:1.35fr .65fr;
}
.slide.titel .links{padding:74px 56px 56px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.slide.titel .rechts{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.16);position:relative;z-index:2}
.slide.titel .logokachel{background:#fff;border-radius:38px;padding:28px 30px;box-shadow:0 20px 46px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
.slide.titel .logokachel img{width:168px;display:block}
.slide.titel h1{color:#fff}
.slide.titel .eyebrow{color:var(--orange)}
.slide.titel .unter{font-size:23px;color:rgba(255,255,255,.9);margin-top:18px;max-width:640px}
.slide.titel .meta{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.slide.titel .meta span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);padding:8px 16px;border-radius:999px;font-size:15.5px;font-weight:600}
.slide.titel .balken{height:6px;width:110px;background:var(--orange);border-radius:4px;margin-bottom:26px}
.karogrund{position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:40px 40px}
.titelgraph svg{display:block}
.slide.schluss{grid-template-columns:1fr}
.slide.schluss .links{align-items:center;text-align:center;padding:60px 120px}
.slide.schluss img{width:64px;margin-bottom:34px;background:rgba(255,255,255,.92);border-radius:50%;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.zitatgross{font-size:40px;line-height:1.28;font-weight:700;letter-spacing:-.015em;color:#fff;max-width:960px}
.zitatgross .strich{display:block;width:56px;height:5px;background:var(--orange);border-radius:3px;margin:26px auto 20px}
.quelle{font-size:18px;font-weight:600;color:var(--orange);letter-spacing:.06em}

/* ---------- Graphen (SVG) ---------- */
svg .gitter line{stroke:#E4ECF2;stroke-width:1}
svg .achse{stroke:#6B7C89;stroke-width:1.6}
svg .tick{font-size:12px;fill:var(--grau);font-weight:600}
svg .kurve-f{fill:none;stroke:var(--blau);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
svg .kurve-a{fill:none;stroke:var(--gruen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg .sekante{stroke:var(--orange-d);stroke-width:2.6}
svg .dreieck{fill:rgba(243,169,47,.16);stroke:var(--orange-d);stroke-width:1.8;stroke-dasharray:5 4}
svg .dlabel{font-size:15px;font-weight:800;fill:var(--orange-d)}
svg .band{fill:rgba(243,169,47,.13)}
svg .bandrand{stroke:var(--orange);stroke-width:1.5;stroke-dasharray:4 4}
svg .lot{stroke:var(--orange-d);stroke-width:1.5;stroke-dasharray:3 4}
svg .punkt{fill:var(--orange);stroke:#fff;stroke-width:2}
svg .kreuz{stroke:var(--orange-d);stroke-width:3;stroke-linecap:round}
svg .kreuz.neu{animation:punktrein .45s ease;transform-box:fill-box;transform-origin:center}
@keyframes punktrein{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
svg .verbindung{fill:none;stroke:var(--orange);stroke-width:1.6;stroke-dasharray:5 4}
svg .kreuz.alt{stroke:#F2B64F;stroke-width:2;opacity:.75}
svg .kreuz.draussen{stroke:#9FB3C3}
svg .glied{fill:var(--orange);stroke:#fff;stroke-width:1.6}
svg .glied.draussen{fill:#9FB3C3}
svg .achsname{font-size:15px;font-weight:800;fill:var(--blau-d);font-style:italic}
svg .grenzlinie{stroke:var(--gruen);stroke-width:2.4;stroke-dasharray:8 6}
svg .grenzt{font-size:15px;font-weight:800;fill:var(--gruen)}
svg .schranke{stroke:var(--blau-d);stroke-width:1.8;stroke-dasharray:3 5}
svg .schrt{font-size:13px;font-weight:700;fill:var(--blau-d)}
svg .schlauch{fill:rgba(243,169,47,.16);stroke:rgba(217,137,8,.5);stroke-width:1}
svg .abn{stroke:var(--orange-d);stroke-width:2;stroke-dasharray:4 4}
svg .abnt{font-size:14px;font-weight:800;fill:var(--orange-d)}
svg .glied.hoch{fill:var(--gruen)}
svg .glied.runter{fill:var(--rot)}
svg .glied.gleich{fill:var(--grau)}
.labspalte .knopfleiste .knopf.hell{font-size:14px;padding:6px 9px}
.labspalte .knopfleiste{gap:5px;flex-wrap:nowrap}
.erg{border:1px solid var(--linie);border-radius:11px;padding:5px 12px;background:#fff;transition:background .3s,border-color .3s}
.erg h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);font-weight:800;margin-bottom:0}
.erg p{font-size:14.5px;line-height:1.35;transition:filter .3s,opacity .3s}
.erg:not(.an) p{filter:blur(5px);opacity:.45;user-select:none}
.erg.an{background:var(--blau-pastell);border-color:#C4DFF2}
.erg .klein{font-size:13px}
.startname{font-size:14px;font-weight:700;color:var(--grau);white-space:nowrap}
.modus{display:flex;flex:none}
.modus .knopf{font-size:14px;padding:5px 10px;border-radius:0}
.modus .knopf:first-child{border-radius:999px 0 0 999px}
.modus .knopf:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
.hinweis{font-size:12.5px;line-height:1.4;color:var(--grau)}
svg .altlinie{fill:none;stroke:#F6C46E;stroke-width:1.3;stroke-dasharray:4 4;opacity:.7}
svg .legende{font-size:14px;font-weight:700;fill:var(--tinte)}
svg .legbox{fill:rgba(255,255,255,.9);stroke:var(--linie)}

/* ---------- Labor ---------- */
.labor{display:grid;grid-template-columns:720px 1fr;gap:18px;align-items:start}
.plotrahmen{position:relative;border:1px solid var(--linie);border-radius:12px;overflow:hidden;background:#fff;touch-action:none;cursor:grab}
.plotrahmen.zieht{cursor:grabbing}
.plotrahmen svg{display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.bereich{display:flex;align-items:center;gap:10px;margin-top:10px;padding:6px 14px;background:var(--orange-pastell);border:1px solid #F3DCAF;border-radius:12px}
.bereich .bt{font-size:15px;font-weight:700;color:var(--grau);white-space:nowrap}
.bereich b{font-size:17px;color:var(--orange-d);min-width:34px;font-variant-numeric:tabular-nums}
.bereich input[type=text]{width:74px;flex:none;font:inherit;font-size:16px;font-weight:800;color:var(--orange-d);border:1px solid #E3C489;border-radius:8px;padding:3px 7px;background:#fff;font-variant-numeric:tabular-nums}
.bereich input[type=text].falsch{border-color:var(--rot);color:var(--rot)}
.bereich input[type=range]{flex:1;accent-color:var(--orange-d);min-width:0;height:28px}
.labspalte{display:flex;flex-direction:column;gap:9px;min-width:0}
.labspalte .knopf{font-size:15px;padding:7px 13px}
.eingabe{display:flex;flex-direction:column;gap:7px;background:var(--blau-pastell);border:1px solid #C4DFF2;border-radius:12px;padding:10px 12px}
.eingabe .reihe{display:flex;gap:8px;align-items:center}
.eingabe label{font-weight:800;color:var(--blau-d);font-size:17px;font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:italic;white-space:nowrap}
.eingabe input,.eingabe select{font:inherit;font-size:16px;border:1px solid #9FC3DE;border-radius:8px;padding:6px 9px;background:#fff;color:var(--tinte);min-width:0}
.eingabe input{flex:1;font-family:ui-monospace,Consolas,monospace}
.eingabe select{flex:1}
.fehler{font-size:14px;font-weight:700;color:var(--rot);min-height:0}
.formelzeile{font-size:17px;color:var(--tinte);line-height:1.5}
.formelzeile .fx{color:var(--blau);font-weight:700}
.formelzeile .ax{color:var(--gruen);font-weight:700}
.laborstatus{font-size:15px;font-weight:700;color:var(--blau-d)}
.laborstatus .sub{font-weight:600;color:var(--grau)}
table.wt{border-collapse:separate;border-spacing:0 3px;width:100%;font-size:13px}
table.wt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grau);text-align:right;padding:0 6px;font-weight:800}
table.wt th:first-child{text-align:left}
table.wt td{background:#F6FAFD;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--linie);border-bottom:1px solid var(--linie)}
table.wt td:first-child{text-align:left;border-left:1px solid var(--linie);border-radius:7px 0 0 7px}
table.wt td:last-child{border-right:1px solid var(--linie);border-radius:0 7px 7px 0;font-weight:800;color:var(--orange-d)}
table.wt tr.aktuell td{background:var(--orange-pastell);border-color:#F3DCAF}
table.wt .leer td{background:none;border:none;color:var(--grau);text-align:left;font-weight:600}

/* ---------- Knöpfe ---------- */
.interaktiv{cursor:default}
.knopfleiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.knopf{font:inherit;font-size:15.5px;font-weight:700;border:none;border-radius:999px;padding:8px 15px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 2px 0 rgba(12,78,121,.25);transition:background .15s, opacity .15s, transform .1s}
.knopf:hover{background:var(--blau-d)}
.knopf:active{transform:translateY(1px)}
.knopf.o{background:var(--orange);color:#3A2500}
.knopf.o:hover{background:var(--orange-d)}
.knopf.g{background:var(--gruen)}
.knopf.hell{background:var(--blau-pastell);color:var(--blau-d);box-shadow:none;border:1px solid #C4DFF2}
.knopf.hell:hover{background:#D2E7F6}
.knopf.hell.an{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.knopf.rund{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.knopf:disabled{opacity:.35;cursor:not-allowed}

/* Schritte, Tabelle */
.schritte{display:flex;flex-direction:column;gap:9px}
.schritt{display:flex;gap:14px;align-items:center;background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:9px 14px}
.schritt .nummer{width:34px;height:34px;font-size:17px}
.schritt p{font-size:18px;line-height:1.35}
.schritt.wichtig{background:var(--orange-pastell);border-color:#F3DCAF}
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.tab th{background:var(--blau-d);color:#fff;text-align:right;padding:9px 16px;font-size:14px;letter-spacing:.06em}
table.tab th:first-child{border-top-left-radius:10px;text-align:left}
table.tab th:last-child{border-top-right-radius:10px}
table.tab td{padding:8px 16px;border-bottom:1px solid var(--linie);text-align:right;font-variant-numeric:tabular-nums}
table.tab td:first-child{text-align:left}
table.tab tr:nth-child(even) td{background:#F6FAFD}
table.tab td.z{font-weight:800;color:var(--orange-d)}

.frag{opacity:0;transform:translateY(10px);transition:opacity .34s ease,transform .34s ease}
.frag.an{opacity:1;transform:none}
svg .frag{transform:none}

#fortschritt{position:fixed;left:0;top:0;height:4px;background:var(--orange);width:0;transition:width .3s ease;z-index:50}
#nav{position:fixed;right:18px;bottom:14px;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:1px solid var(--linie);border-radius:999px;padding:5px 8px;box-shadow:0 4px 14px rgba(12,78,121,.14)}
#nav button{border:none;background:var(--blau-pastell);color:var(--blau-d);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:800}
#nav button:hover{background:var(--blau);color:#fff}
#zaehler{font-size:13px;font-weight:700;color:var(--grau);padding:0 6px;min-width:52px;text-align:center}
#uebersicht{position:fixed;inset:0;background:rgba(10,68,112,.96);z-index:100;display:none;padding:34px;overflow:auto}
#uebersicht.an{display:block}
#uebersicht h4{color:#fff;font-size:18px;margin-bottom:18px;font-weight:700}
#uebersicht .gitter{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#uebersicht .mini{background:#fff;border-radius:8px;padding:14px;cursor:pointer;border:3px solid transparent;min-height:78px}
#uebersicht .mini:hover{border-color:var(--orange)}
#uebersicht .mini .nr{font-size:11px;font-weight:800;color:var(--orange-d)}
#uebersicht .mini .tt{font-size:14px;font-weight:700;color:var(--blau-d);margin-top:3px;line-height:1.25}

@media print{
  @page{size:A4 landscape;margin:0}
  body{display:block;background:#fff;overflow:visible}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{position:relative;visibility:visible;opacity:1;transform:none;width:1280px;height:720px;page-break-after:always;box-shadow:none;border-radius:0}
  .frag{opacity:1!important;transform:none!important}
  #nav,#fortschritt,#uebersicht{display:none!important}
}
/* ==== NUR DIESE PRÄSENTATION ==== */
/* ---------- Handy-Ansicht des Folgenlabors (html.handy, s. technik/handy/) ---------- */
html.handy .labor{grid-template-columns:minmax(0,1fr);gap:12px}
html.handy .labor > div{min-width:0}
html.handy .plotrahmen{touch-action:auto;cursor:default}       /* sonst lässt sich über dem Diagramm nicht scrollen */
html.handy .bereich{display:grid;grid-template-columns:auto minmax(0,1fr) 84px;align-items:center;gap:8px 10px;padding:8px 10px}
html.handy .bereich b{text-align:center}
html.handy .bereich input[type=text]{width:84px}
html.handy .labspalte .knopfleiste{flex-wrap:wrap;gap:6px}
html.handy .labspalte .knopfleiste .knopf.hell, html.handy .modus .knopf{font-size:15px}
html.handy .eingabe .reihe{flex-wrap:wrap}
html.handy .eingabe label{font-size:18px}
html.handy .startname{font-size:15px}
html.handy .fehler{font-size:15px}
html.handy .erg h4{font-size:14px}
html.handy .erg p{font-size:17px}                             /* Indizes (aₙ) bleiben so ≥ 14 px */
html.handy .erg .klein{font-size:15px}
html.handy .formelzeile .klein{font-size:17px}
html.handy svg .tick{font-size:14px}
html.handy .titelgraph svg{max-width:100%;height:auto}
/* ==== /NUR DIESE PRÄSENTATION ==== */
</style>
</head>

<script>
/* =====================================================================
   Formeln: lesen, auswerten, schön hinschreiben (Variable n)
   ===================================================================== */
const FUNKTIONEN = {sin:Math.sin, cos:Math.cos, tan:Math.tan, exp:Math.exp, ln:Math.log, lg:Math.log10,
                    sqrt:Math.sqrt, abs:Math.abs, sgn:Math.sign,
                    fak:k => (k<0 || !Number.isInteger(k)) ? NaN : k>170 ? NaN : [...Array(k)].reduce((a,_,i)=>a*(i+1),1)};
const ALIAS = {log:'ln', wurzel:'sqrt', betrag:'abs'};
const NAMEN = ['wurzel','betrag','sqrt','sin','cos','tan','exp','abs','sgn','log','ln','lg','pi','n','e','a'];            // a = aₙ (nur rekursiv)

function zerlege(text){
  let s = String(text).trim()
    .replace(/[−–]/g,'-').replace(/[·×⋅]/g,'*').replace(/²/g,'^2').replace(/³/g,'^3')
    .replace(/π/g,'pi').replace(/\*\*/g,'^').replace(/,/g,'.').replace(/√/g,'sqrt');
  s = s.replace(/^\s*a\s*(_?\s*\(?\s*n\s*\+\s*1\s*\)?|\(\s*n\s*\+\s*1\s*\)|ₙ₊₁)\s*=/i,'')   // „aₙ₊₁ =“, „a_(n+1) =“ am Anfang
       .replace(/^\s*a\s*(_?\s*n|\(\s*n\s*\)|ₙ)\s*=/i,'')                                   // „aₙ =“, „a_n =“, „a(n) =“ am Anfang
       .replace(/a\s*_\s*\(?\s*n\s*\)?|a\s*\(\s*n\s*\)|aₙ/g, 'a');                              // aₙ im Term heißt kurz a
  const t = []; let i = 0;
  while(i < s.length){
    const c = s[i];
    if(c === ' '){ i++; continue; }
    const zahl = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);
    if(zahl){ t.push({k:'zahl', v:parseFloat(zahl[1])}); i += zahl[1].length; continue; }
    if(/[a-zA-Z]/.test(c)){
      const wort = s.slice(i).match(/^[a-zA-Z]+/)[0].toLowerCase();
      let j = 0;
      while(j < wort.length){
        const n = NAMEN.find(n=>wort.startsWith(n, j));
        if(!n) throw new Error(`„${wort.slice(j)}“ kenne ich nicht. Erlaubt: n, a (für aₙ), e, pi, sin, cos, tan, exp, ln, lg, sqrt, abs, n!`);
        t.push({k:'name', v:ALIAS[n]||n}); j += n.length;
      }
      i += wort.length; continue;
    }
    if('+-*/^()|!'.includes(c)){ t.push({k:c}); i++; continue; }
    throw new Error(`Das Zeichen „${c}“ kenne ich nicht.`);
  }
  return t;
}

function lies(text){
  const t = zerlege(text); let p = 0;
  if(!t.length) throw new Error('Bitte eine Folge eingeben, z. B. 1/n.');
  const sieh = () => t[p], nimm = () => t[p++];
  const beginntFaktor = (k) => k && (k.k==='zahl' || k.k==='name' || k.k==='(' );
  function summe(){
    let a = produkt();
    while(sieh() && (sieh().k==='+' || sieh().k==='-')){ const o = nimm().k; a = {t:o, a, b:produkt()}; }
    return a;
  }
  function produkt(){
    let a = vorzeichen();
    for(;;){
      const k = sieh();
      if(k && (k.k==='*' || k.k==='/')){ nimm(); a = {t:k.k, a, b:vorzeichen()}; }
      else if(beginntFaktor(k)){ a = {t:'*', a, b:potenz()}; }       // 2x, 3(x+1), x sin(x)
      else return a;
    }
  }
  function vorzeichen(){
    if(sieh() && sieh().k==='-'){ nimm(); return {t:'neg', a:vorzeichen()}; }
    if(sieh() && sieh().k==='+'){ nimm(); return vorzeichen(); }
    return potenz();
  }
  function potenz(){
    let a = atom();
    while(sieh() && sieh().k==='!'){ nimm(); a = {t:'fn', f:'fak', a}; }      // n!
    if(sieh() && sieh().k==='^'){ nimm(); return {t:'^', a, b:vorzeichen()}; }
    return a;
  }
  function atom(){
    const k = nimm();
    if(!k) throw new Error('Die Eingabe hört zu früh auf.');
    if(k.k==='zahl') return {t:'num', v:k.v};
    if(k.k==='(') { const a = summe(); if(!sieh() || nimm().k!==')') throw new Error('Eine Klammer „)“ fehlt.'); return a; }
    if(k.k==='|') { const a = summe(); if(!sieh() || nimm().k!=='|') throw new Error('Ein Betragsstrich „|“ fehlt.'); return {t:'fn', f:'abs', a}; }
    if(k.k==='name'){
      if(k.v==='n') return {t:'x'};                      // intern heißt die Variable x
      if(k.v==='a') return {t:'folge'};
      if(k.v==='e') return {t:'num', v:Math.E, name:'e'};
      if(k.v==='pi') return {t:'num', v:Math.PI, name:'π'};
      if(!sieh() || sieh().k!=='(') throw new Error(`Nach ${k.v} bitte eine Klammer, z. B. ${k.v}(x).`);
      nimm(); const a = summe();
      if(!sieh() || nimm().k!==')') throw new Error('Eine Klammer „)“ fehlt.');
      return {t:'fn', f:k.v, a};
    }
    throw new Error(`An dieser Stelle passt „${k.k}“ nicht.`);
  }
  const baum = summe();
  if(p < t.length) throw new Error(`An dieser Stelle passt „${t[p].k==='zahl'?t[p].v:t[p].k==='name'?t[p].v:t[p].k}“ nicht.`);
  return vereinfache(baum);
}

function werte(k){
  // liefert eine Funktion (n, aₙ) → Wert; aₙ braucht nur das rekursive Bildungsgesetz
  switch(k.t){
    case 'num': return () => k.v;
    case 'x': return (x) => x;
    case 'folge': return (x, v) => v;
    case 'neg': { const a = werte(k.a); return (x,v) => -a(x,v); }
    case '+': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)+b(x,v); }
    case '-': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)-b(x,v); }
    case '*': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)*b(x,v); }
    case '/': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)/b(x,v); }
    case '^': { const a = werte(k.a), b = werte(k.b);
      return (x,v) => { const g = a(x,v), h = b(x,v);
        // (−8)^(1/3) usw.: bei negativer Basis nur ganze Exponenten
        return (g < 0 && !Number.isInteger(h)) ? NaN : Math.pow(g, h); }; }
    case 'fn': { const a = werte(k.a), f = FUNKTIONEN[k.f]; return (x,v) => f(a(x,v)); }
  }
}

const hatX = n => n.t==='x' || (n.a && hatX(n.a)) || (n.b && hatX(n.b));
const Z = v => ({t:'num', v});
const istZ = (n, v) => n.t==='num' && !n.name && (v===undefined || n.v===v);

function vereinfache(n){
  if(n.a) n = {...n, a:vereinfache(n.a)};
  if(n.b) n = {...n, b:vereinfache(n.b)};
  const {a, b} = n;
  switch(n.t){
    case 'neg':
      if(istZ(a)) return Z(-a.v);
      if(a.t==='neg') return a.a;
      return n;
    case '+':
      if(istZ(a) && istZ(b)) return Z(a.v+b.v);
      if(istZ(a,0)) return b;
      if(istZ(b,0)) return a;
      if(b.t==='neg') return vereinfache({t:'-', a, b:b.a});
      if(istZ(b) && b.v<0) return {t:'-', a, b:Z(-b.v)};
      return n;
    case '-':
      if(istZ(a) && istZ(b)) return Z(a.v-b.v);
      if(istZ(b,0)) return a;
      if(istZ(a,0)) return vereinfache({t:'neg', a:b});
      if(b.t==='neg') return vereinfache({t:'+', a, b:b.a});
      return n;
    case '*':
      if(istZ(a) && istZ(b)) return Z(a.v*b.v);
      if(istZ(a,0) || istZ(b,0)) return Z(0);
      if(istZ(a,1)) return b;
      if(istZ(b,1)) return a;
      if(istZ(b) && !istZ(a)) return vereinfache({t:'*', a:b, b:a});           // Zahl nach vorn
      if(istZ(a) && b.t==='*' && istZ(b.a)) return vereinfache({t:'*', a:Z(a.v*b.a.v), b:b.b});
      if(a.t==='neg') return vereinfache({t:'neg', a:{t:'*', a:a.a, b}});
      if(b.t==='neg') return vereinfache({t:'neg', a:{t:'*', a, b:b.a}});
      if(istZ(a) && a.v<0) return vereinfache({t:'neg', a:{t:'*', a:Z(-a.v), b}});
      if(istZ(a) && b.t==='/' && istZ(b.a)) return vereinfache({t:'/', a:Z(a.v*b.a.v), b:b.b});
      if(a.t==='*' && istZ(a.a)) return vereinfache({t:'*', a:a.a, b:{t:'*', a:a.b, b}});   // (2·u)·v → 2·(u·v)
      if(b.t==='*' && istZ(b.a) && !istZ(a)) return vereinfache({t:'*', a:b.a, b:{t:'*', a, b:b.b}});
      return n;
    case '/':
      if(istZ(a) && istZ(b) && Number.isInteger(a.v/b.v)) return Z(a.v/b.v);
      if(istZ(a,0)) return Z(0);
      if(istZ(b,1)) return a;
      if(a.t==='*' && istZ(a.a) && istZ(b)) return vereinfache({t:'*', a:Z(a.a.v/b.v), b:a.b});
      if(JSON.stringify(a)===JSON.stringify(b)) return Z(1);
      if(istZ(b) && !istZ(a) && b.v!==0 && Number.isInteger(1e4/b.v)) return vereinfache({t:'*', a:Z(1/b.v), b:a});   // x/4 → 0,25x, aber x/3 bleibt
      if(a.t==='neg') return vereinfache({t:'neg', a:{t:'/', a:a.a, b}});
      return n;
    case '^':
      if(istZ(a) && istZ(b)) return Z(Math.pow(a.v, b.v));
      if(istZ(b,1)) return a;
      if(istZ(b,0)) return Z(1);
      if(a.t==='^' && istZ(a.b) && istZ(b)) return vereinfache({t:'^', a:a.a, b:Z(a.b.v*b.v)});
      return n;
    case 'fn':
      if(n.f==='ln' && a.t==='num' && a.name==='e') return Z(1);
      if(n.f==='exp' && istZ(a,0)) return Z(1);
      return n;
  }
  return n;
}

/* Zahl deutsch: Komma, höchstens 4 Nachkommastellen, Minus als − */
function zahlText(v, stellen=4){
  if(!isFinite(v)) return '–';
  let s = (Math.round(v*10**stellen)/10**stellen).toString();
  if(s.includes('e')) s = v.toPrecision(3);
  return s.replace('-','−').replace('.',',');
}
const RANG = {'+':1, '-':1, '*':2, '/':2, 'neg':3, '^':4};
const rang = n => RANG[n.t] || 5;
function schreibe(n, ctx=0){
  const k = (inner, r) => r < ctx ? `(${inner})` : inner;
  switch(n.t){
    case 'num': return n.name ? n.name : (n.v < 0 ? k(zahlText(n.v), 3) : zahlText(n.v));
    case 'x': return '<i>n</i>';
    case 'folge': return '<i>a</i><sub>n</sub>';
    case 'neg': return k('−' + schreibe(n.a, 2), 3);          // −2 · sin(x) statt −(2 · sin(x))
    case '+': return k(`${schreibe(n.a,1)} + ${schreibe(n.b,1)}`, 1);
    case '-': return k(`${schreibe(n.a,1)} − ${schreibe(n.b,2)}`, 1);
    case '*': {
      const links = schreibe(n.a,2), rechts = schreibe(n.b,2);
      const startX = m => m.t==='x' || (m.t==='^' && m.a.t==='x') || (m.t==='*' && startX(m.a));
      const eng = istZ(n.a) && n.a.v > 0 && startX(n.b);        // 3x², 2x · eˣ
      return k(eng ? links + rechts : `${links} · ${rechts}`, 2);
    }
    case '/': return k(`${schreibe(n.a,2)} / ${schreibe(n.b,3)}`, 2);
    case '^': return k(`${schreibe(n.a,5)}<sup>${schreibe(n.b,0)}</sup>`, 4);
    case 'fn':
      if(n.f==='abs') return `|${schreibe(n.a,0)}|`;
      if(n.f==='sqrt') return `√(${schreibe(n.a,0)})`;
      if(n.f==='exp') return `e<sup>${schreibe(n.a,0)}</sup>`;
      if(n.f==='fak') return `${schreibe(n.a,5)}!`;
      return `${n.f}(${schreibe(n.a,0)})`;
  }
}

/* =====================================================================
   Achsen und Gitter (Folgen: x = n, y = aₙ, eigene Maßstäbe)
   ===================================================================== */
function schoenerSchritt(bereich, teile=8){
  const roh = bereich/teile, p = 10**Math.floor(Math.log10(roh)), f = roh/p;
  return (f<1.5 ? 1 : f<3.5 ? 2 : f<7.5 ? 5 : 10) * p;
}
function achsenSVG(s, W, H, R){          // R = Ränder für die Beschriftung
  const px = x => R.l + (x-s.xmin)/(s.xmax-s.xmin)*(W-R.l-R.r), py = y => R.o + (1-(y-s.ymin)/(s.ymax-s.ymin))*(H-R.o-R.u);
  const sx = Math.max(1, schoenerSchritt(s.xmax-s.xmin, 10)), sy = schoenerSchritt(s.ymax-s.ymin, 7);
  let g = '<g class="gitter">', z = '';
  for(let x = Math.ceil(s.xmin/sx)*sx; x <= s.xmax; x += sx){ const X = px(x).toFixed(1);
    g += `<line x1="${X}" y1="${R.o}" x2="${X}" y2="${H-R.u}"/>`; z += `<text class="tick" x="${X}" y="${H-R.u+17}" text-anchor="middle">${zahlText(x,3)}</text>`; }
  for(let y = Math.ceil(s.ymin/sy)*sy; y <= s.ymax + sy*1e-9; y += sy){ const Y = py(y).toFixed(1);
    g += `<line x1="${R.l}" y1="${Y}" x2="${W-R.r}" y2="${Y}"/>`; z += `<text class="tick" x="${R.l-7}" y="${(+Y+4).toFixed(1)}" text-anchor="end">${zahlText(Math.abs(y)<sy*1e-9?0:y,4)}</text>`; }
  g += '</g>';
  if(s.ymin < 0 && s.ymax > 0) g += `<line class="achse" x1="${R.l}" y1="${py(0).toFixed(1)}" x2="${W-R.r}" y2="${py(0).toFixed(1)}"/>`;
  g += `<text class="achsname" x="${W-R.r}" y="${H-R.u+32}" text-anchor="end">n</text><text class="achsname" x="${R.l-7}" y="${R.o-8}" text-anchor="end">aₙ</text>`;
  return {svg: g + z, px, py};
}
const punkt = (X, Y, r, cls='') => `<circle class="glied ${cls}" cx="${(+X).toFixed(1)}" cy="${(+Y).toFixed(1)}" r="${r}"/>`;
const kreuz = (X, Y, r, cls='') => { const a = r/Math.SQRT2*1.25, x = +X, y = +Y;
  return `<path class="kreuz ${cls}" d="M${(x-a).toFixed(1)} ${(y-a).toFixed(1)}L${(x+a).toFixed(1)} ${(y+a).toFixed(1)}M${(x-a).toFixed(1)} ${(y+a).toFixed(1)}L${(x+a).toFixed(1)} ${(y-a).toFixed(1)}"/>`; };

/* =====================================================================
   Auswertung einer Folge: Monotonie, Schranken, Grenzwert
   Grundlage: alle Glieder bis n = 1000, dazu Stichproben n = 10 · 2^k bis 1.310.720
   (gerade n und das ungerade n + 1 getrennt, damit Springen zwischen zwei Werten auffällt).
   Ergebnis ist eine begründete Vermutung, kein Beweis.
   ===================================================================== */
const N_VOLL = 1000;
const STICH = [...Array(18)].map((_,k)=>10*2**k);
function verlauf(v, spanne){
  // längster Lauf endlicher Werte am Ende (z. B. 2ⁿ/n! wird für große n zu ∞/∞)
  let ende = v.length; while(ende > 0 && !isFinite(v[ende-1])){
    if(v[ende-1] === Infinity && v.slice(0,ende).filter(isFinite).length && v.slice(ende-1).every(x=>x===Infinity)) return {art:'plus'};
    if(v[ende-1] === -Infinity && v.slice(ende-1).every(x=>x===-Infinity)) return {art:'minus'};
    ende--; }
  let anf = ende; while(anf > 0 && isFinite(v[anf-1])) anf--;
  const w = v.slice(anf, ende);
  if(w.length < 5) return {art:'unklar'};
  const L = w.length, d = w.slice(1).map((x,k)=>x-w[k]), dl = d.slice(-4);
  const skala = Math.max(1, ...w.slice(-3).map(Math.abs));
  // winzige Schritte, jeweils gemessen an den eigenen Nachbarwerten (sonst wirkt bei n! alles „winzig“)
  if(dl.every((x,j)=>Math.abs(x) <= 1e-12*Math.max(1, Math.abs(w[L-5+j]), Math.abs(w[L-4+j])))) return {art:'konv', g:w[L-1], u:1e-12*skala};
  const r = dl.slice(1).map((x,k)=>x/dl[k]);
  if(r.every(q=>isFinite(q) && Math.abs(q) < 0.95) && Math.abs(dl[3]) < Math.abs(dl[0])){
    const q = r[r.length-1]; return {art:'konv', g:w[L-1] + dl[3]*q/(1-q), u:1e-9*skala};      // Rest wie eine geometrische Reihe
  }
  // zufällige Winzschritte sind kein Wachstum: jeder Schritt muss spürbar sein, gemessen an seinen Nachbarwerten
  const spuerbar = j => 1e-6*Math.max(1, Math.abs(w[L-5+j]), Math.abs(w[L-4+j]));
  if(dl.every((x,j)=>x > spuerbar(j)) && r.every(q=>q>=0.95)) return {art:'plus'};
  if(dl.every((x,j)=>x < -spuerbar(j)) && r.every(q=>q>=0.95)) return {art:'minus'};
  const hinten = w.slice(-4), sp = Math.max(...hinten) - Math.min(...hinten);
  if(sp <= 1e-4*Math.max(spanne, 1e-12) && sp <= 1e-2*(Math.max(...w) - Math.min(...w))) return {art:'konv', g:[...w.slice(-3)].sort((a,b)=>a-b)[1], u:sp};   // nähert sich schwankend an
  return {art:'schwankt'};
}
const KONST = [['π²/6',Math.PI**2/6],['e',Math.E],['π',Math.PI],['√2',Math.SQRT2],['√3',Math.sqrt(3)],['ln 2',Math.LN2],['1/e',1/Math.E],['e²',Math.E**2],['√e',Math.sqrt(Math.E)],['π/2',Math.PI/2],['π/4',Math.PI/4]];
function schoeneZahl(g, extra=0){
  const tol = 1e-6*Math.max(1, Math.abs(g)) + extra;
  for(let q=1;q<=12;q++){ const p = Math.round(g*q); if(Math.abs(g-p/q) < tol){
    const t = (a,b)=> b ? t(b, a%b) : a, k = t(Math.abs(p), q) || 1;
    return {wert:p/q, text: q/k===1 ? zahlText(p/k) : `${p<0?'−':''}${Math.abs(p)/k}/${q/k}`, genau:true}; } }
  for(const [n,c] of KONST){ if(Math.abs(g-c) < tol) return {wert:c, text:n, genau:false}; if(Math.abs(g+c) < tol) return {wert:-c, text:'−'+n, genau:false}; }
  return null;
}
function analysiere(f, n0){
  const T = []; for(let n=n0;n<=N_VOLL;n++){ let y; try{ y = f(n); }catch(e){ y = NaN; } T.push({n, y}); }
  const def = T.filter(t=>isFinite(t.y));
  if(def.length < 10) return {fehler:'Für fast kein n definiert. Stimmt die Eingabe, passt der Startindex?'};
  const spanne = Math.max(...def.map(t=>t.y)) - Math.min(...def.map(t=>t.y));
  const G = verlauf(STICH.map(n=>f(n)), spanne), U = verlauf(STICH.map(n=>f(n+1)), spanne);
  // Grenzverhalten
  let grenz;
  if(G.art==='konv' && U.art==='konv'){
    const u = G.u + U.u, tol = 1e-6*Math.max(1, Math.abs(G.g), Math.abs(U.g)) + 1e-9 + u;
    if(Math.abs(G.g-U.g) <= tol){ let g = (G.g+U.g)/2; if(Math.abs(g) < 1e-9*Math.max(1,spanne) + 2*u) g = 0; const s = schoeneZahl(g, 2*u); grenz = {art:'konv', g: s ? s.wert : g, schoen:s}; }
    else grenz = {art:'zwei', werte:[G.g, U.g].sort((a,b)=>a-b)};
  } else if(G.art==='plus' && U.art==='plus') grenz = {art:'plus'};
  else if(G.art==='minus' && U.art==='minus') grenz = {art:'minus'};
  else if((G.art==='plus'||G.art==='minus') && (U.art==='plus'||U.art==='minus')) grenz = {art:'beide'};
  else if(G.art==='unklar' || U.art==='unklar') grenz = {art:'unklar'};
  else grenz = {art:'schwankt'};
  // Rechengenauigkeit: Viele rekursive Folgen treffen ihren Grenzwert im Rechner nach endlich vielen Schritten
  // exakt (0,5·aₙ + 1 → 2,0), obwohl sie ihn mathematisch nie erreichen. Ab dort ist jeder Vergleich nur Rauschen.
  let bisIdx = def.length, amZiel = false;
  if(grenz.art==='konv'){
    const tolG = 1e-13*Math.max(1, Math.abs(grenz.g));
    const k = def.findIndex((t,j) => def.slice(j).every(u => Math.abs(u.y - grenz.g) <= tolG));
    if(k > 1){ bisIdx = k; amZiel = true; }            // k ≤ 1: echt konstant (z. B. aₙ = 5)
  }
  const pruef = def.slice(0, bisIdx);
  // Monotonie (bis n = 1000 bzw. bis die Folge auf Rechengenauigkeit am Grenzwert ist)
  const d = pruef.slice(1).map((t,k)=>t.y - pruef[k].y);
  const alle = (bed) => d.every(bed);
  let mono;
  if(alle(x=>x===0)) mono = {text:'konstant', art:'konst'};
  else if(alle(x=>x>0)) mono = {text:'streng monoton steigend', art:'steigt'};
  else if(alle(x=>x<0)) mono = {text:'streng monoton fallend', art:'faellt'};
  else if(alle(x=>x>=0)) mono = {text:'monoton steigend (nicht streng)', art:'steigt'};
  else if(alle(x=>x<=0)) mono = {text:'monoton fallend (nicht streng)', art:'faellt'};
  else {
    const abN = (bed) => { let k = d.length; while(k > 0 && bed(d[k-1])) k--; return k < d.length*0.5 ? pruef[k].n : null; };
    const s = abN(x=>x>0), fa = abN(x=>x<0);
    if(s !== null) mono = {text:`ab n = ${s} streng monoton steigend, davor nicht`, art:'ab', ab:s};
    else if(fa !== null) mono = {text:`ab n = ${fa} streng monoton fallend, davor nicht`, art:'ab', ab:fa};
    else mono = {text:'nicht monoton: mal steigt die Folge, mal fällt sie', art:'nein'};
  }
  // Schranken
  const werte = def.map(t=>t.y).concat(STICH.flatMap(n=>[f(n), f(n+1)]).filter(isFinite));
  let maxW = Math.max(...werte), minW = Math.min(...werte);
  const maxT = def.reduce((a,t)=>t.y>a.y?t:a), minT = def.reduce((a,t)=>t.y<a.y?t:a);
  const nurRundung = t => amZiel && def.indexOf(t) >= bisIdx;     // „erreicht“ nur durch Rundung zählt nicht
  const oben = grenz.art==='plus' || grenz.art==='beide' ? null : Math.max(maxW, grenz.art==='konv' ? grenz.g : -Infinity);
  const unten = grenz.art==='minus' || grenz.art==='beide' ? null : Math.min(minW, grenz.art==='konv' ? grenz.g : Infinity);
  const angenommen = (s, t) => s !== null && !nurRundung(t) && (t.y === s || Math.abs(t.y - s) <= 1e-12*Math.max(Math.abs(s), Math.abs(t.y)));
  const schranken = {oben, unten, obenBei: angenommen(oben, maxT) ? maxT.n : null, untenBei: angenommen(unten, minT) ? minT.n : null,
                     beobachtet: grenz.art==='schwankt' || grenz.art==='unklar'};
  return {T, def, grenz, mono, schranken, n0};
}
/* ε-Schlauch: ab welchem n bleiben alle Glieder in (g − ε, g + ε)? */
function abWann(A, eps){
  const g = A.grenz.g, drin = y => Math.abs(y-g) < eps*(1-1e-9);
  let k = A.def.length; while(k > 0 && drin(A.def[k-1].y)) k--;
  if(k === A.def.length) return null;                    // bis n = 1000 noch nicht
  return A.def[k].n;
}

  ['n/2^n', 'aₙ = n/2ⁿ'],

const labor = (function(){
  const B = id => document.getElementById(id);

      const baum = lies(text), F = werte(baum);
      let f, n0;
      if(S.rek){
        const sb = lies(B('fStart').value);
        if(kommtVor(sb,'x') || kommtVor(sb,'folge')) throw new Error('Der Startwert a₀ muss eine Zahl sein.');
        const a0 = werte(sb)(0, 0); if(!isFinite(a0)) throw new Error('Der Startwert a₀ ist keine gültige Zahl.');
        f = rekursiv(F, a0); n0 = 0;
      } else {
        if(kommtVor(baum,'folge')) throw new Error('aₙ kommt nur im rekursiven Bildungsgesetz vor. Oben auf „rekursiv“ umschalten.');
        f = n => F(n); n0 = Math.max(0, Math.min(20, Math.round(+String(B('fStart').value).replace(',','.') || 0)));
      }
      const A = analysiere(f, n0);
      if(A.fehler) throw new Error(A.fehler);
      S.text = text; S.baum = baum; S.f = f; S.A = A; S.n0 = n0;
      B('fFehler').textContent = '';
      auswertungSchreiben(); zeichne(); return true;
    }catch(e){ B('fFehler').textContent = e.message; return false; }
  }
  const z = (v) => zahlText(v, 4);
  const glied = (n) => `a<sub>${n}</sub>`;
  function auswertungSchreiben(){
    const A = S.A, G = A.grenz, sch = A.schranken;
    const erste = A.def.slice(0, 4).map(t=>`${glied(t.n)} ${Math.abs(t.y - Math.round(t.y*1e4)/1e4) < 1e-12 ? '=' : '≈'} ${z(t.y)}`).join(' · ');
    B('fFormel').innerHTML = `<span class="klein" title="a(n) = ${schreibe(S.baum).replace(/<[^>]+>/g,'')}">${erste} …</span>`;
    B('eMonoT').innerHTML = `Die Folge ist <strong>${A.mono.text}</strong>.`;
    const gText = G.art==='konv' ? (G.schoen ? (G.schoen.genau ? G.schoen.text : `${z(G.g)} (vermutlich ${G.schoen.text})`) : `≈ ${zahlText(G.g,6)}`) : '';
    const sText = (wert, bei, art) => wert===null ? `nach ${art} <strong>unbeschränkt</strong>`
      : `${art==='oben'?'kleinste obere':'größte untere'} Schranke <strong>${bei!==null ? z(wert) + ' = ' + glied(bei) : (G.art==='konv' && Math.abs(wert-G.g)<1e-9 ? gText : '≈ '+z(wert))}</strong>${bei===null && G.art==='konv' && Math.abs(wert-G.g)<1e-9 ? ' (der Grenzwert, wird nie erreicht)' : ''}`;
    B('eSchrT').innerHTML = (sch.oben!==null && sch.unten!==null ? '<strong>Beschränkt.</strong> ' : '') + sText(sch.oben, sch.obenBei, 'oben') + ', ' + sText(sch.unten, sch.untenBei, 'unten') + '.'
      + (sch.beobachtet ? ' <span class="klein">(Beobachtet an den berechneten Gliedern.)</span>' : '');
    B('eGrenzT').innerHTML = {
      konv: () => `<strong>Konvergent</strong>, Grenzwert <strong>g = ${gText}</strong>${G.g===0 ? ': eine <strong>Nullfolge</strong>' : ''}.<span id="eEps"></span>`,
      zwei: () => `<strong>Divergent.</strong> Die Folge springt zwischen <strong>${z(G.werte[0])}</strong> und <strong>${z(G.werte[1])}</strong> hin und her (zwei Häufungswerte).`,
      plus: () => `<strong>Divergent</strong>, wächst über jede Grenze: <strong>bestimmt divergent gegen +∞</strong>.`,
      minus: () => `<strong>Divergent</strong>, fällt unter jede Grenze: <strong>bestimmt divergent gegen −∞</strong>.`,
      beide: () => `<strong>Divergent</strong>, der Betrag wächst über jede Grenze, das Vorzeichen wechselt.`,
      schwankt: () => `<strong>Divergent</strong>: Die Glieder schwanken und kommen keinem Wert immer näher.`,
      unklar: () => `Dazu kann das Labor hier <strong>nichts Sicheres</strong> sagen (die Werte werden zu groß zum Rechnen).`,
    }[G.art]();
    B('fSchlauch').disabled = G.art !== 'konv';
    if(G.art !== 'konv') S.zeige.schlauch = false;
  }

  function zeichne(){
    // Handy: eigenes, schmales Diagramm statt verkleinertem (Achsenschrift bleibt lesbar)
    const handy = document.documentElement.classList.contains('handy');
    [W, H, R] = handy ? [360, 300, {l:46, r:10, o:22, u:36}] : [720, 440, {l:58, r:18, o:26, u:40}];
    B('plot').setAttribute('width', W); B('plot').setAttribute('height', H); B('plot').setAttribute('viewBox', `0 0 ${W} ${H}`);
    const A = S.A, G = A.grenz, sch = A.schranken, bis = Math.max(S.n0 + 4, S.bis);
    const pts = A.T.filter(t=>t.n <= bis && isFinite(t.y));
    let ys = pts.map(t=>t.y);
    if(G.art==='konv' && (S.zeige.grenz || S.zeige.schlauch)) ys.push(G.g);
    if(S.zeige.schr){ if(sch.oben!==null) ys.push(sch.oben); if(sch.unten!==null) ys.push(sch.unten); }
    if(S.zeige.schlauch) ys.push(G.g + eps(), G.g - eps());
    let ymin = Math.min(...ys), ymax = Math.max(...ys);
    if(ymax - ymin < 1e-9){ ymin -= 1; ymax += 1; }
    const pad = (ymax-ymin)*0.1; ymin -= pad; ymax += pad;
    const s = {xmin:S.n0 - 0.8, xmax:bis + 0.8, ymin, ymax};
    const {svg:achsen, px, py} = achsenSVG(s, W, H, R);
    let svg = `<clipPath id="flaeche"><rect x="${R.l}" y="${R.o}" width="${W-R.l-R.r}" height="${H-R.o-R.u}"/></clipPath>` + achsen;
    const L = R.l, Rr = W-R.r;
    let N = null;
    if(S.zeige.schlauch && G.art==='konv'){
      const e = eps(); N = abWann(A, e);
      svg += `<rect class="schlauch" x="${L}" y="${py(G.g+e)}" width="${Rr-L}" height="${py(G.g-e)-py(G.g+e)}"/>`;
      if(N !== null && N <= bis) svg += `<line class="abn" x1="${px(N)}" y1="${R.o}" x2="${px(N)}" y2="${H-R.u}"/><text class="abnt" x="${px(N)+6}" y="${R.o+16}">N = ${N}</text>`;
    }
    if(S.zeige.schr){
      if(sch.oben!==null) svg += `<line class="schranke" x1="${L}" y1="${py(sch.oben)}" x2="${Rr}" y2="${py(sch.oben)}"/><text class="schrt" x="${Rr-6}" y="${py(sch.oben)-6}" text-anchor="end">obere Schranke</text>`;
      if(sch.unten!==null) svg += `<line class="schranke" x1="${L}" y1="${py(sch.unten)}" x2="${Rr}" y2="${py(sch.unten)}"/><text class="schrt" x="${Rr-6}" y="${py(sch.unten)+16}" text-anchor="end">untere Schranke</text>`;
    }
    if((S.zeige.grenz || S.zeige.schlauch) && G.art==='konv')
      svg += `<line class="grenzlinie" x1="${L}" y1="${py(G.g)}" x2="${Rr}" y2="${py(G.g)}"/><text class="grenzt" x="${L+8}" y="${py(G.g)-7}">g = ${G.schoen ? G.schoen.text : zahlText(G.g,4)}</text>`;
    if(S.zeige.grenz && G.art==='zwei') G.werte.forEach(w=>{ svg += `<line class="grenzlinie" x1="${L}" y1="${py(w)}" x2="${Rr}" y2="${py(w)}"/><text class="grenzt" x="${L+8}" y="${py(w)-7}">Häufungswert ${z(w)}</text>`; });
    const r = pts.length > 80 ? 3.2 : pts.length > 40 ? 4.2 : 5.5;
    // nur Punkte, keine Verbindungslinien: eine Folge ist nur für natürliche Zahlen n definiert.
    // Monotonie: Punkt grün, wenn das Glied größer ist als das vorige, rot, wenn kleiner.
    const klasse = (t, k) => {
      if(S.zeige.schlauch && G.art==='konv' && Math.abs(t.y-G.g) >= eps()*(1-1e-9)) return 'draussen';
      if(S.zeige.mono && k > 0 && pts[k-1].n === t.n-1) return t.y > pts[k-1].y ? 'hoch' : t.y < pts[k-1].y ? 'runter' : 'gleich';
      return '';
    };
    svg += `<g clip-path="url(#flaeche)">` + pts.map((t,k)=>punkt(px(t.n), py(t.y), r, klasse(t,k))).join('') + '</g>';
    B('plot').innerHTML = svg;

    ['mono','schr','grenz'].forEach(k=>B('e'+k[0].toUpperCase()+k.slice(1)).classList.toggle('an', S.zeige[k] || (k==='grenz' && S.zeige.schlauch)));
    [['fMono','mono'],['fSchr','schr'],['fGrenz','grenz'],['fSchlauch','schlauch']].forEach(([id,k])=>B(id).classList.toggle('an', S.zeige[k]));
    B('fEps').disabled = B('fEpsW').disabled = !S.zeige.schlauch; B('fEpsName').style.opacity = B('fEpsW').style.opacity = S.zeige.schlauch ? 1 : .4;
    const ee = document.getElementById('eEps');
    if(ee) ee.innerHTML = S.zeige.schlauch ? (N===null ? ` <br>ε = ${zahlText(eps(),3)}: N &gt; 1.000, bis n = 1.000 liegen noch Glieder außerhalb.` : ` <br>ε = ${zahlText(eps(),3)}: Eintauchzahl <strong>N = ${N}</strong>, ab n = ${N} liegen alle Glieder im Schlauch.`) : '';
    B('labor').dataset.ab = N===null ? '' : N;
  }

  B('fZeichnen').onclick = ()=> setze(B('fEingabe').value);
  B('fEingabe').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); setze(B('fEingabe').value); } });
  B('fStart').addEventListener('change', ()=> setze(B('fEingabe').value));
  B('fAuswahl').onchange = ()=>{ const v = B('fAuswahl').value; if(v==='') return;
    if(S.rek){ const [w, a0] = BEISPIELE_REK[+v]; B('fEingabe').value = w; B('fStart').value = a0; setze(w); }
    else { B('fEingabe').value = v; setze(v); }
    B('fAuswahl').value = ''; };
  function modus(rek){
    S.rek = rek; B('fExpl').classList.toggle('an', !rek); B('fRek').classList.toggle('an', rek);
    B('fLabel').innerHTML = rek ? 'a<sub>n+1</sub> =' : 'a<sub>n</sub> =';
    B('fStartName').innerHTML = rek ? 'a<sub>0</sub> =' : 'ab n =';
    auswahlFuellen();
    const [w, a0] = rek ? BEISPIELE_REK[0] : ['(n+1)/n', '1'];
    B('fEingabe').value = w; B('fStart').value = a0; setze(w);
  }
  B('fExpl').onclick = ()=> modus(false);
  B('fRek').onclick = ()=> modus(true);
  B('fStart').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); setze(B('fEingabe').value); } });
  const schalter = (k) => ()=>{ S.zeige[k] = !S.zeige[k]; zeichne(); };
  B('fMono').onclick = schalter('mono'); B('fSchr').onclick = schalter('schr'); B('fGrenz').onclick = schalter('grenz'); B('fSchlauch').onclick = schalter('schlauch');
  B('fBis').addEventListener('input', ()=>{ S.bis = +B('fBis').value; B('fBisW').textContent = S.bis; zeichne(); });
  // ε: Schieber (0,001 bis 1 in Zehntel-Zehnerpotenzen) oder frei eintippen
  const epsText = v => zahlText(v, 6);
  B('fEps').addEventListener('input', ()=>{ S.eps = +(10**(-B('fEps').value/10)).toPrecision(2); B('fEpsW').value = epsText(S.eps); B('fEpsW').classList.remove('falsch'); zeichne(); });
  const epsTippen = ()=>{
    const v = parseFloat(B('fEpsW').value.replace(',', '.').replace('−','-'));
    if(!(v > 0 && v < 1e6)){ B('fEpsW').classList.add('falsch'); return; }
    B('fEpsW').classList.remove('falsch'); S.eps = v;
    B('fEps').value = Math.max(0, Math.min(30, Math.round(-10*Math.log10(v))));
    zeichne();
  };
  B('fEpsW').addEventListener('change', epsTippen);
  B('fEpsW').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); epsTippen(); } });
  window.addEventListener('handy-wechsel', ()=>{ if(S.A) zeichne(); });
  setze(B('fEingabe').value);
  return {S, setze};
})();

/* =====================================================================
   Folien-Navigation
   ===================================================================== */
const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;
function frags(n){
  return [...slides[n].querySelectorAll('.frag')]
    .map((el,k)=>({el, ord: el.dataset.schritt ? parseFloat(el.dataset.schritt) : k+1, k}))
    .sort((a,b)=> a.ord - b.ord || a.k - b.k).map(x=>x.el);
}
function zeige(n, alleFragmente=false){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('aktiv', k===i));
  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));
  document.getElementById('zaehler').textContent = (i+1)+' / '+slides.length;
  document.getElementById('fortschritt').style.width = ((i+1)/slides.length*100)+'%';
  try{ history.replaceState(null, '', '#'+(i+1)); }catch(e){}
}
function vor(){ const fr = frags(i); if(schritt < fr.length){ fr[schritt].classList.add('an'); schritt++; return; } if(i < slides.length-1) zeige(i+1); }
function zurueck(){ if(schritt > 0){ schritt--; frags(i)[schritt].classList.remove('an'); return; } if(i > 0) zeige(i-1, true); }
function skalieren(){ const s = Math.min((innerWidth-40)/1280, (innerHeight-40)/720); stage.style.transform = 'scale('+s+')'; }
addEventListener('resize', skalieren);
const ueb = document.getElementById('uebersicht'), gitter = ueb.querySelector('.gitter');
folien.forEach((f,k)=>{ const d = document.createElement('div'); d.className = 'mini';
  d.innerHTML = `<div class="nr">FOLIE ${k+1}</div><div class="tt">${f.h2 || f.titel}</div>`;
  d.onclick = ()=>{ ueb.classList.remove('an'); zeige(k); }; gitter.appendChild(d); });
addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input, select, textarea')) return;   // beim Tippen der Funktion nicht blättern
  if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ e.preventDefault(); zurueck(); }
  else if(e.key==='Home'){ zeige(0); }
  else if(e.key==='End'){ zeige(slides.length-1, true); }
  else if(e.key==='o'||e.key==='O'){ ueb.classList.toggle('an'); }
  else if(e.key==='Escape'){ ueb.classList.remove('an'); }
  else if(e.key==='f'||e.key==='F'){ vollbild(); }
});
function vollbild(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
}
let wischX = null, wischY = null;
stage.addEventListener('touchstart', e=>{ if(e.target.closest('.interaktiv')){ wischX = null; return; } wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e=>{ if(wischX === null) return; const dx = e.changedTouches[0].clientX - wischX, dy = e.changedTouches[0].clientY - wischY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? vor : zurueck)(); wischX = null; });
document.getElementById('uebBtn').onclick = ()=> ueb.classList.toggle('an');
document.getElementById('vor').onclick = vor;
document.getElementById('zurueck').onclick = zurueck;
stage.addEventListener('click', e=>{ if(!e.target.closest('a, button, input, select, .interaktiv')) vor(); });
skalieren();
zeige(parseInt(location.hash.slice(1)) - 1 || 0);
</script>
<script data-handy="technik/handy/handy.js">
/* =====================================================================
   HANDY-SCHICHT — schaltet die Handy-Ansicht, wenn die Bühne 1280 × 720 zu stark
   verkleinert würde (Maßstab unter 0,62: Handy hoch und quer, Tablet hochkant).
   Muss NACH der Folien-Navigation des Rahmens stehen (nutzt stage, zeige, skalieren).
   Meldet Wechsel mit dem Ereignis „handy-wechsel", damit Rechner neu zeichnen können.
   ===================================================================== */
(function(){
  const html = document.documentElement;
  const istHandy = () => Math.min(innerWidth / 1280, innerHeight / 720) < 0.62;
  let vorher = null;
  function pruefen(){
    const h = istHandy();
    html.classList.toggle('handy', h);
    if (h) stage.style.transform = 'none';
    else if (typeof skalieren === 'function') skalieren();
    if (h !== vorher){ vorher = h; window.dispatchEvent(new CustomEvent('handy-wechsel', { detail: h })); }
  }
  addEventListener('resize', pruefen);
  addEventListener('orientationchange', () => setTimeout(pruefen, 200));
  pruefen();

  // Neue Folie (und nur dann, nicht bei jedem Knopf): nach oben scrollen
  const wach = new MutationObserver((liste) => {
    if (!html.classList.contains('handy')) return;
    if (liste.some((m) => m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))) window.scrollTo(0, 0);
  });
  document.querySelectorAll('.slide').forEach((f) => wach.observe(f, { attributes: true, attributeFilter: ['class'], attributeOldValue: true }));

  // Beim Scrollen tippt man oft auf Text: auf dem Handy blättert ein Tipp nicht weiter
  stage.addEventListener('click', (e) => {
    if (html.classList.contains('handy') && !e.target.closest('a, button, input, select, textarea, label, .interaktiv')) e.stopPropagation();
  }, true);
})();
</script><!-- /HANDY-SCHICHT -->
