<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Das Folgenlabor: Glied für Glied Monotonie, Schranken und Grenzwert untersuchen, automatisch ausgewertet.">
<title>Folgen und Grenzwerte · Mathematik</title>
<style>
/* ==== HANDY-SCHICHT: technik/handy/handy.css ==== */
/* =====================================================================
   HANDY-SCHICHT für den Rahmen der Vorlagen (ds1 / Folgen) — plus eine Regel für alle Ansichten:
   zu viel Inhalt scrollt statt abgeschnitten zu werden.
   Greift nur, wenn handy.js <html class="handy"> setzt: Bildschirm zu klein für die
   Bühne 1280 × 720 (Handy, Tablet hochkant). Beamer, Laptop und Druck bleiben unberührt.
   Aus der Bühne wird eine scrollbare Seite pro Folie; Raster werden einspaltig,
   Schrift mindestens 14 px, Knöpfe mindestens 40 px (Finger).
   ===================================================================== */
/* ---- Für ALLE Ansichten (auch Beamer): nie abschneiden. Passt der Inhalt einer Folie nicht,
        scrollt der Inhaltsbereich; Kopf und Fuß bleiben stehen. ---- */
#stage .slide .inhalt{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#C4DFF2 transparent;
  margin-bottom:-10px}   /* bis an die Fußzeilenlinie: der freie Rand darüber gehört zum Inhalt (Folgen nutzt ihn) */
@media print{#stage .slide .inhalt{overflow:visible}}            /* Druck: alles zeigen */

html.handy, html.handy body{height:auto;overflow-x:hidden;overflow-y:auto}
html.handy body{display:block;background:var(--papier)}
html.handy #stage{width:100%;height:auto;transform:none!important}
html.handy .slide{position:relative;inset:auto;display:none;min-height:100vh;border-radius:0;box-shadow:none;
  padding:64px 14px 84px;transform:none;transition:none;overflow:visible}
html.handy .slide.aktiv{display:flex}

/* Kopf, Überschriften, Fuß */
html.handy .kopf{height:48px;padding:0 12px;gap:10px}
html.handy .kopf img{height:34px}
html.handy .kopf .schule{font-size:14px;letter-spacing:.06em}
html.handy .kopf .kurs{display:none}
html.handy h1{font-size:34px}
html.handy h2, html.handy .slide.kompakt h2{font-size:25px}
html.handy .eyebrow{font-size:14px;letter-spacing:.12em}
html.handy .titelzeile, html.handy .slide.kompakt .titelzeile{margin-bottom:14px}
html.handy .inhalt, html.handy #stage .slide .inhalt{display:block;overflow:visible;margin-bottom:0}   /* Handy: die Seite scrollt, nicht die Folie */
html.handy .fuss{position:static;margin-top:22px;font-size:14px;gap:10px}
html.handy p, html.handy li{font-size:17px}
html.handy .klein, html.handy .hinweis{font-size:15px}

/* Titelfolie: untereinander */
html.handy .slide.titel{display:none;grid-template-columns:1fr;padding:0}
html.handy .slide.titel.aktiv{display:grid}
html.handy .slide.titel .links{padding:40px 20px 24px}
html.handy .slide.titel .rechts{padding:24px 0 90px;border-left:none;border-top:1px solid rgba(255,255,255,.16)}
html.handy .slide.titel .unter{font-size:18px}
html.handy .slide.titel .meta span{font-size:14px}
html.handy .slide.titel .logokachel{border-radius:26px;padding:16px 18px}
html.handy .slide.titel .logokachel img{width:110px}
html.handy .slide.titel svg{max-width:100%;height:auto}

/* Raster und Karten: einspaltig */
html.handy .raster, html.handy .g2, html.handy .g3, html.handy .g4{grid-template-columns:1fr!important}
html.handy .karte p, html.handy .karte li{font-size:16px}

/* Finger: Knöpfe und Felder mindestens 40 px */
html.handy .knopf{min-height:42px;min-width:42px;font-size:15.5px;padding:8px 14px}
html.handy input, html.handy select{min-height:42px;font-size:16px}   /* 16 px: iOS zoomt sonst beim Tippen */
html.handy #nav{right:10px;bottom:10px;padding:6px 8px;gap:6px}
html.handy #nav button{width:42px;height:42px;font-size:18px}
html.handy #zaehler{font-size:14px}
html.handy svg{max-width:100%;height:auto}
/* ==== /HANDY-SCHICHT ==== */
:root{
  --blau:#136EA9;
  --blau-d:#0C4E79;
  --blau-h:#3E93CE;
  --blau-pastell:#E3F0F9;
  --blau-linie:#C4DFF2;
  --orange:#F3A92F;
  --orange-d:#D98908;
  --orange-pastell:#FDF0DA;
  --tinte:#16232E;
  --grau:#5B6A76;
  --linie:#D8E2EA;
  --papier:#FFFFFF;
  --bg:#EAF1F6;
  --rot:#C62828;
  --gruen:#2E7D32;
  --stage-w:1280px;
  --stage-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:"Sansation","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

#stage{position:relative;width:var(--stage-w);height:var(--stage-h);transform-origin:center center;flex:none}
.slide{
  position:absolute;inset:0;
  background:var(--papier);
  border-radius:14px;
  box-shadow:0 18px 50px rgba(12,78,121,.22), 0 2px 6px rgba(12,78,121,.12);
  overflow:hidden;
  padding:86px 62px 58px;
  opacity:0;visibility:hidden;
  transform:translateY(14px) scale(.995);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
  display:flex;flex-direction:column;
}
.slide.aktiv{opacity:1;visibility:visible;transform:none}

.kopf{
  position:absolute;top:0;left:0;right:0;height:58px;
  background:linear-gradient(100deg,var(--blau-d) 0%,var(--blau) 55%,var(--blau-h) 100%);
  display:flex;align-items:center;gap:14px;
  padding:0 22px 0 18px;
  color:#fff;
  z-index:5;
}
.kopf::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 34%,#F6C46E 34%,#F6C46E 100%);
}
.kopf img{height:42px;width:auto;background:#fff;border-radius:11px;padding:3px 6px;box-shadow:0 3px 10px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.5)}
.kopf .schule{font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.95}
.kopf .kurs{
  margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  padding:5px 12px;border-radius:999px;
}

h1{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.015em;color:var(--blau-d)}
h3{font-size:20px;font-weight:750;color:var(--blau-d)}
p,li{font-size:19px;line-height:1.5;color:var(--tinte)}
.klein{font-size:16px;line-height:1.45;color:var(--grau)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--orange-d);margin-bottom:10px}
.titelzeile{margin-bottom:26px;flex:none}
.titelzeile h2::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--orange);margin-top:12px}
.slide.kompakt .titelzeile{margin-bottom:14px}
.slide.kompakt h2{font-size:32px}
.slide.kompakt h2::after{margin-top:8px;height:4px;width:52px}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center}
.slide.oben .inhalt{justify-content:flex-start}
strong{color:var(--blau-d)}

.raster{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.karte{background:var(--papier);border:1px solid var(--linie);border-radius:12px;padding:20px 22px;box-shadow:0 2px 0 rgba(19,110,169,.05);display:flex;flex-direction:column;gap:8px}
.karte.blau{background:var(--blau-pastell);border-color:var(--blau-linie)}
.karte.orange{background:var(--orange-pastell);border-color:#F3DCAF}
.karte.voll{background:linear-gradient(150deg,var(--blau-d),var(--blau));border:none;color:#fff}
.karte.voll h3,.karte.voll strong{color:#fff}
.karte.voll p,.karte.voll li{color:rgba(255,255,255,.92)}
.karte.voll .hl{color:var(--orange)}
.karte p,.karte li{font-size:17px;line-height:1.45}

.nummer{width:38px;height:38px;flex:none;border-radius:10px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.nummer.b{background:var(--blau)}
.zeile{display:flex;gap:16px;align-items:flex-start}

.fuss{position:absolute;left:62px;right:62px;bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--grau);border-top:1px solid var(--linie);padding-top:9px}

/* Formeln */
.formel{font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:normal;white-space:nowrap}
.formel i{font-style:italic}
.bruch{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.15}
.bruch > span:first-child{border-bottom:2px solid currentColor;padding:0 4px 2px}
.bruch > span:last-child{padding:2px 4px 0}
.antwort{border-top:1px dashed #E3C489;padding-top:8px;margin-top:2px;color:var(--tinte)!important}
.karte.voll .antwort{border-top-color:rgba(255,255,255,.35);color:#fff!important}

/* ---------- Titel und Schluss ---------- */
.slide.titel{
  padding:0;
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(243,169,47,.20), transparent 62%),
    linear-gradient(140deg,#0A4470 0%, var(--blau-d) 40%, var(--blau) 100%);
  color:#fff;display:grid;grid-template-columns:1.35fr .65fr;
}
.slide.titel .links{padding:74px 56px 56px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.slide.titel .rechts{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.16);position:relative;z-index:2}
.slide.titel .logokachel{background:#fff;border-radius:38px;padding:28px 30px;box-shadow:0 20px 46px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
.slide.titel .logokachel img{width:168px;display:block}
.titelkarte{background:rgba(255,255,255,.95);border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.25)}   /* Bild auf der Titelfolie (Werkzeuge): Stil hier, nicht inline – Marke tauschbar */
.slide.titel h1{color:#fff}
.slide.titel .eyebrow{color:var(--orange)}
.slide.titel .unter{font-size:23px;color:rgba(255,255,255,.9);margin-top:18px;max-width:640px}
.slide.titel .meta{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.slide.titel .meta span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);padding:8px 16px;border-radius:999px;font-size:15.5px;font-weight:600}
.slide.titel .balken{height:6px;width:110px;background:var(--orange);border-radius:4px;margin-bottom:26px}
.karogrund{position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:40px 40px}
.titelgraph svg{display:block}
.slide.schluss{grid-template-columns:1fr}
.slide.schluss .links{align-items:center;text-align:center;padding:60px 120px}
.slide.schluss img{width:64px;margin-bottom:34px;background:rgba(255,255,255,.92);border-radius:50%;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.zitatgross{font-size:40px;line-height:1.28;font-weight:700;letter-spacing:-.015em;color:#fff;max-width:960px}
.zitatgross .strich{display:block;width:56px;height:5px;background:var(--orange);border-radius:3px;margin:26px auto 20px}
.quelle{font-size:18px;font-weight:600;color:var(--orange);letter-spacing:.06em}

/* ---------- Graphen (SVG) ---------- */
svg .gitter line{stroke:#E4ECF2;stroke-width:1}
svg .achse{stroke:#6B7C89;stroke-width:1.6}
svg .tick{font-size:12px;fill:var(--grau);font-weight:600}
svg .kurve-f{fill:none;stroke:var(--blau);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
svg .kurve-a{fill:none;stroke:var(--gruen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg .sekante{stroke:var(--orange-d);stroke-width:2.6}
svg .dreieck{fill:rgba(243,169,47,.16);stroke:var(--orange-d);stroke-width:1.8;stroke-dasharray:5 4}
svg .dlabel{font-size:15px;font-weight:800;fill:var(--orange-d)}
svg .band{fill:rgba(243,169,47,.13)}
svg .bandrand{stroke:var(--orange);stroke-width:1.5;stroke-dasharray:4 4}
svg .lot{stroke:var(--orange-d);stroke-width:1.5;stroke-dasharray:3 4}
svg .punkt{fill:var(--orange);stroke:#fff;stroke-width:2}
svg .kreuz{stroke:var(--orange-d);stroke-width:3;stroke-linecap:round}
svg .kreuz.neu{animation:punktrein .45s ease;transform-box:fill-box;transform-origin:center}
@keyframes punktrein{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
svg .verbindung{fill:none;stroke:var(--orange);stroke-width:1.6;stroke-dasharray:5 4}
svg .kreuz.alt{stroke:#F2B64F;stroke-width:2;opacity:.75}
svg .kreuz.draussen{stroke:#9FB3C3}
svg .glied{fill:var(--orange);stroke:#fff;stroke-width:1.6}
svg .glied.draussen{fill:#9FB3C3}
svg .achsname{font-size:15px;font-weight:800;fill:var(--blau-d);font-style:italic}
svg .grenzlinie{stroke:var(--gruen);stroke-width:2.4;stroke-dasharray:8 6}
svg .grenzt{font-size:15px;font-weight:800;fill:var(--gruen)}
svg .schranke{stroke:var(--blau-d);stroke-width:1.8;stroke-dasharray:3 5}
svg .schrt{font-size:13px;font-weight:700;fill:var(--blau-d)}
svg .schlauch{fill:rgba(243,169,47,.16);stroke:rgba(217,137,8,.5);stroke-width:1}
svg .abn{stroke:var(--orange-d);stroke-width:2;stroke-dasharray:4 4}
svg .abnt{font-size:14px;font-weight:800;fill:var(--orange-d)}
svg .glied.hoch{fill:var(--gruen)}
svg .glied.runter{fill:var(--rot)}
svg .glied.gleich{fill:var(--grau)}
.labspalte .knopfleiste .knopf.hell{font-size:14px;padding:6px 9px}
.labspalte .knopfleiste{gap:5px;flex-wrap:nowrap}
.erg{border:1px solid var(--linie);border-radius:11px;padding:5px 12px;background:#fff;transition:background .3s,border-color .3s}
.erg h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);font-weight:800;margin-bottom:0}
.erg p{font-size:14.5px;line-height:1.35;transition:filter .3s,opacity .3s}
.erg:not(.an) p{filter:blur(5px);opacity:.45;user-select:none}
.erg.an{background:var(--blau-pastell);border-color:var(--blau-linie)}
.erg .klein{font-size:13px}
.startname{font-size:14px;font-weight:700;color:var(--grau);white-space:nowrap}
.modus{display:flex;flex:none}
.modus .knopf{font-size:14px;padding:5px 10px;border-radius:0}
.modus .knopf:first-child{border-radius:999px 0 0 999px}
.modus .knopf:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
.hinweis{font-size:12.5px;line-height:1.4;color:var(--grau)}
svg .altlinie{fill:none;stroke:#F6C46E;stroke-width:1.3;stroke-dasharray:4 4;opacity:.7}
svg .legende{font-size:14px;font-weight:700;fill:var(--tinte)}
svg .legbox{fill:rgba(255,255,255,.9);stroke:var(--linie)}

/* ---------- Labor ---------- */
.labor{display:grid;grid-template-columns:720px 1fr;gap:18px;align-items:start}
.plotrahmen{position:relative;border:1px solid var(--linie);border-radius:12px;overflow:hidden;background:#fff;touch-action:none;cursor:grab}
.plotrahmen.zieht{cursor:grabbing}
.plotrahmen svg{display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.bereich{display:flex;align-items:center;gap:10px;margin-top:10px;padding:6px 14px;background:var(--orange-pastell);border:1px solid #F3DCAF;border-radius:12px}
.bereich .bt{font-size:15px;font-weight:700;color:var(--grau);white-space:nowrap}
.bereich b{font-size:17px;color:var(--orange-d);min-width:34px;font-variant-numeric:tabular-nums}
.bereich input[type=text]{width:74px;flex:none;font:inherit;font-size:16px;font-weight:800;color:var(--orange-d);border:1px solid #E3C489;border-radius:8px;padding:3px 7px;background:#fff;font-variant-numeric:tabular-nums}
.bereich input[type=text].falsch{border-color:var(--rot);color:var(--rot)}
.bereich input[type=range]{flex:1;accent-color:var(--orange-d);min-width:0;height:28px}
.labspalte{display:flex;flex-direction:column;gap:9px;min-width:0}
.labspalte .knopf{font-size:15px;padding:7px 13px}
.eingabe{display:flex;flex-direction:column;gap:7px;background:var(--blau-pastell);border:1px solid var(--blau-linie);border-radius:12px;padding:10px 12px}
.eingabe .reihe{display:flex;gap:8px;align-items:center}
.eingabe label{font-weight:800;color:var(--blau-d);font-size:17px;font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:italic;white-space:nowrap}
.eingabe input,.eingabe select{font:inherit;font-size:16px;border:1px solid #9FC3DE;border-radius:8px;padding:6px 9px;background:#fff;color:var(--tinte);min-width:0}
.eingabe input{flex:1;font-family:ui-monospace,Consolas,monospace}
.eingabe select{flex:1}
.fehler{font-size:14px;font-weight:700;color:var(--rot);min-height:0}
.formelzeile{font-size:17px;color:var(--tinte);line-height:1.5}
.formelzeile .fx{color:var(--blau);font-weight:700}
.formelzeile .ax{color:var(--gruen);font-weight:700}
.laborstatus{font-size:15px;font-weight:700;color:var(--blau-d)}
.laborstatus .sub{font-weight:600;color:var(--grau)}
table.wt{border-collapse:separate;border-spacing:0 3px;width:100%;font-size:13px}
table.wt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grau);text-align:right;padding:0 6px;font-weight:800}
table.wt th:first-child{text-align:left}
table.wt td{background:#F6FAFD;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--linie);border-bottom:1px solid var(--linie)}
table.wt td:first-child{text-align:left;border-left:1px solid var(--linie);border-radius:7px 0 0 7px}
table.wt td:last-child{border-right:1px solid var(--linie);border-radius:0 7px 7px 0;font-weight:800;color:var(--orange-d)}
table.wt tr.aktuell td{background:var(--orange-pastell);border-color:#F3DCAF}
table.wt .leer td{background:none;border:none;color:var(--grau);text-align:left;font-weight:600}

/* ---------- Knöpfe ---------- */
.interaktiv{cursor:default}
.knopfleiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.knopf{font:inherit;font-size:15.5px;font-weight:700;border:none;border-radius:999px;padding:8px 15px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 2px 0 rgba(12,78,121,.25);transition:background .15s, opacity .15s, transform .1s}
.knopf:hover{background:var(--blau-d)}
.knopf:active{transform:translateY(1px)}
.knopf.o{background:var(--orange);color:#3A2500}
.knopf.o:hover{background:var(--orange-d)}
.knopf.g{background:var(--gruen)}
.knopf.hell{background:var(--blau-pastell);color:var(--blau-d);box-shadow:none;border:1px solid var(--blau-linie)}
.knopf.hell:hover{background:#D2E7F6}
.knopf.hell.an{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.knopf.rund{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.knopf:disabled{opacity:.35;cursor:not-allowed}

/* Schritte, Tabelle */
.schritte{display:flex;flex-direction:column;gap:9px}
.schritt{display:flex;gap:14px;align-items:center;background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:9px 14px}
.schritt .nummer{width:34px;height:34px;font-size:17px}
.schritt p{font-size:18px;line-height:1.35}
.schritt.wichtig{background:var(--orange-pastell);border-color:#F3DCAF}
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.tab th{background:var(--blau-d);color:#fff;text-align:right;padding:9px 16px;font-size:14px;letter-spacing:.06em}
table.tab th:first-child{border-top-left-radius:10px;text-align:left}
table.tab th:last-child{border-top-right-radius:10px}
table.tab td{padding:8px 16px;border-bottom:1px solid var(--linie);text-align:right;font-variant-numeric:tabular-nums}
table.tab td:first-child{text-align:left}
table.tab tr:nth-child(even) td{background:#F6FAFD}
table.tab td.z{font-weight:800;color:var(--orange-d)}

.frag{opacity:0;transform:translateY(10px);transition:opacity .34s ease,transform .34s ease}

#uebersicht .mini:hover{border-color:var(--orange)}

@media print{

  body{display:block;background:#fff;overflow:visible}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{position:relative;visibility:visible;opacity:1;transform:none;width:1280px;height:720px;page-break-after:always;box-shadow:none;border-radius:0}
  .frag{opacity:1!important;transform:none!important}
  #nav,#fortschritt,#uebersicht{display:none!important}
}

html.handy .fehler{font-size:15px}

.rechnungzeile{display:flex;align-items:center;gap:12px}
.rechnungzeile .knopf{flex:none}
.rechnungzeile .hinweis{margin:0}

/* Grundregel aller Werkzeuge: hidden gilt immer, auch wenn eine Klasse display:flex/grid setzt */
[hidden]{display:none!important}

/* ==== FENSTER: technik/fenster/fenster.css ==== */
/* Gemeinsames Fenster über der Folie (Eingabehilfe ⓘ, Rechnung …): Überlagerung, Karte, Kopf, Schließen-Knopf.
   Breite und Eigenes stehen beim jeweiligen Baustein (#hilfe, #rechnung). */
.fenster{position:fixed;inset:0;background:rgba(10,68,112,.6);z-index:120;display:none;padding:30px;overflow:auto}

.fenster-karte{background:#fff;border-radius:16px;width:100%;padding:18px 24px 22px;box-shadow:0 20px 46px rgba(0,0,0,.3);font-size:17px;color:var(--tinte)}
.fenster-kopf{display:flex;align-items:center;gap:12px;margin:-18px -24px 6px;padding:14px 24px 8px;position:sticky;top:-30px;background:#fff;border-radius:16px 16px 0 0;z-index:1}
.fenster-kopf h3{font-size:24px;color:var(--blau-d)}
.fenster-zu{margin-left:auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--blau-pastell);color:var(--blau-d);font-size:26px;font-weight:700;cursor:pointer;line-height:1}
@media print{.fenster{display:none!important}}

html.handy .fenster-karte{padding:12px 14px 16px;font-size:16px}

/* ==== /FENSTER ==== */

html.handy #hilfeknopf svg{width:20px;height:20px}
/* Fenster, Karte, Kopf, Schließen: technik/fenster/ (.fenster …) */
.hilfe-karte{max-width:760px}
.hilfe-inhalt ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;line-height:1.45}

/* ==== RECHNUNG: technik/rechnung/rechnung.css ==== */

.re-seite > thead, .re-seite > tfoot{display:none}
.re-druckkopf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font-size:9.5pt;color:var(--tinte);
  border-bottom:.6pt solid var(--grau);padding-bottom:2.5mm;margin-bottom:6mm}

  html.re-druck .re-druckkopf img{height:10mm}

<script data-rechnung="technik/rechnung/rechnung.js">
/* =====================================================================
   RECHNUNG — die vollständige Rechnung als Dokument: Fenster, „.tex herunterladen“, „Als PDF drucken“ (A4 hoch).
   Quelle: technik/rechnung/ · eingesetzt vor dem Code der Präsentation (zusammensetzen.py; handgebaut: rechnung.py).

     RE.zeige(dok)             Fenster öffnen
     RE.alsTex(dok)            vollständige LaTeX-Datei (pdflatex, Standardpakete)
     RE.ausHtml(el)            angezeigtes HTML → LaTeX-Absatz (Formeln exakt über data-tex aus formel.js)
     RE.ausWeg(root, schritte) Dokument aus Aufgabe (.wz-aufgabe oder [data-aufgabe]) und Lösungsweg – benutzt von WZ.weg
     RE.ausBereichen({ titel, aufgabe, teile: [[titel, element], …] })   Dokument aus angezeigten Bereichen (eigener Rechenweg)
     RE.knopf(nachbar, () => dok)   Knopf „Rechnung“ hinter nachbar einsetzen (einmal; öffnet RE.zeige(dok))
   Ein Dokument:  { titel, formel?, art?, datei?, abschnitte: [{ titel, absaetze: [...] }] }
   Ein Absatz: 'Text mit $…$, $$…$$, **fett**' (eine Quelle für Anzeige und Datei) – oder { html, tex } (Anzeige wie im
   Werkzeug, Datei aus ausHtml)

   KOPFZEILE (.tex und Druck, jede Seite): links der Name der Marke, Mitte „Musterlösung“, rechts das Logo; Fuß: Fach, Seite.
   Name und Logo kommen zur Laufzeit aus der Seite (Kopfleiste: .kopf .schule, LOGO) – der Spiegel tauscht beides, also
   trägt die calcUlution-Fassung von selbst ihre Marke (später: jede Schule ihre). Stelle im Code: marke(), kopfTex(), druckkopf().
   Das Logo steht in der .tex als PDF-Inline-Bild (Text, kein Anhang; pdflatex): RE.bereit() bereitet es einmal auf.
   ===================================================================== */
const RE = (() => {
  /* ---------- HTML → LaTeX ---------- */
  /* Zeichen, die pdflatex (utf8, T1) nicht selbst kennt → Befehl. Gilt in Formeln (Befehl) und im Text (\ensuremath{Befehl}). */
  const ZEICHEN = { '−': '-', '·': '\\cdot', '×': '\\times', '≈': '\\approx', '≤': '\\le', '≥': '\\ge', '≠': '\\ne', '±': '\\pm', '∓': '\\mp',
    '⇒': '\\Rightarrow', '⇔': '\\Leftrightarrow', '→': '\\to', '←': '\\leftarrow', '↦': '\\mapsto', '∞': '\\infty', '∈': '\\in', '∉': '\\notin',
    '∅': '\\emptyset', '√': '\\surd', '∑': '\\sum', '∫': '\\int', '∠': '\\angle', '⊥': '\\perp', '∥': '\\parallel', '∩': '\\cap', '∪': '\\cup',
    '⊂': '\\subset', '⊆': '\\subseteq', '≡': '\\equiv', '≙': '\\mathrel{\\widehat{=}}', '∝': '\\propto', '∣': '\\mid', '∧': '\\wedge', '∨': '\\vee', '¬': '\\neg', '✓': '\\checkmark', '✗': '\\times',
    'ℝ': '\\mathbb{R}', 'ℕ': '\\mathbb{N}', 'ℤ': '\\mathbb{Z}', 'ℚ': '\\mathbb{Q}', '°': '^\\circ', '²': '^{2}', '³': '^{3}', '¹': '^{1}', '⁰': '^{0}', '⁴': '^{4}', '⁵': '^{5}', '⁶': '^{6}', '⁷': '^{7}', '⁸': '^{8}', '⁹': '^{9}', '⁻': '^{-}',
    '₀': '_{0}', '₁': '_{1}', '₂': '_{2}', '₃': '_{3}', '₄': '_{4}', '₅': '_{5}', '₆': '_{6}', '₇': '_{7}', '₈': '_{8}', '₉': '_{9}', 'ₙ': '_{n}', '′': "'", '″': "''",
    'α': '\\alpha', 'β': '\\beta', 'γ': '\\gamma', 'δ': '\\delta', 'ε': '\\varepsilon', 'ζ': '\\zeta', 'η': '\\eta', 'θ': '\\theta', 'κ': '\\kappa',
    'λ': '\\lambda', 'μ': '\\mu', 'ν': '\\nu', 'ξ': '\\xi', 'π': '\\pi', 'ρ': '\\rho', 'σ': '\\sigma', 'τ': '\\tau', 'φ': '\\varphi', 'χ': '\\chi',
    'ψ': '\\psi', 'ω': '\\omega', 'Γ': '\\Gamma', 'Δ': '\\Delta', 'Θ': '\\Theta', 'Λ': '\\Lambda', 'Π': '\\Pi', 'Σ': '\\Sigma', 'Φ': '\\Phi',
    'Ψ': '\\Psi', 'Ω': '\\Omega' };
  const ZK = new RegExp('[' + Object.keys(ZEICHEN).join('').replace(/[-\]\\^]/g, '\\$&') + ']', 'g');
  const TEXT = { '%': '\\%', '&': '\\&', '#': '\\#', '_': '\\_', '{': '\\{', '}': '\\}', '\\': '\\textbackslash{}', '^': '\\^{}', '~': '\\~{}', '$': '\\$' };
  const text = t => t.replace(/[%&#_{}\\^~$]/g, c => TEXT[c]).replace(ZK, c => `\\ensuremath{${ZEICHEN[c]}}`);
  const mathe = t => t.replace(ZK, c => `${ZEICHEN[c]}${/[a-z]$/i.test(ZEICHEN[c]) ? ' ' : ''}`);   // in Formeln: Befehl (+ Leerzeichen vor Buchstaben)
  /* \class{name}{inhalt} → {inhalt}, mit Klammerzählung (beliebig tief geschachtelt) */
  function ohneClass(t){
    let i;
    while ((i = t.indexOf('\\class{')) >= 0){
      let j = t.indexOf('}', i) + 1;                                   // Ende des Namens
      if (t[j] !== '{') { t = t.slice(0, i) + t.slice(j); continue; }
      let tiefe = 0, k = j;
      for (; k < t.length; k++){ if (t[k] === '{' && t[k - 1] !== '\\') tiefe++; else if (t[k] === '}' && t[k - 1] !== '\\' && --tiefe === 0) break; }
      t = t.slice(0, i) + t.slice(j, k + 1) + t.slice(k + 1);
    }
    return t;
  }
  function ausHtml(el){
    let aus = '', grenze = false;                       // grenze: eben endete ein Element – das nächste Element bekommt ein Leerzeichen davor
    const lauf = n => {
      if (n.nodeType === 3) { grenze = false; aus += text(n.textContent.replace(/\s+/g, ' ')); return; }
      if (n.nodeType !== 1) return;
      if (grenze && aus && !/\s$/.test(aus)) aus += ' ';
      grenze = false;
      ausElement(n);
      grenze = true;
    };
    const ausElement = n => {
      const tag = n.tagName.toLowerCase();
      if (n.hidden || ['input', 'button', 'select', 'svg', 'script', 'style', 'canvas'].includes(tag) || (n.classList && n.classList.contains('re-nicht'))) return;
      // \( \) und \[ \] statt $: zwei Formeln direkt nebeneinander ergäben sonst „$$“ (abgesetzte Formel)
      if (tag === 'math'){ const t = mathe(ohneClass(n.getAttribute('data-tex') || n.textContent)); aus += n.getAttribute('display') === 'block' ? `\\[${t}\\]` : `\\(${t}\\)`; return; }
      if (tag === 'strong' || tag === 'b'){ aus += '**'; n.childNodes.forEach(lauf); aus += '**'; return; }
      if (tag === 'br'){ aus += ' '; return; }
      n.childNodes.forEach(lauf);
      if (['div', 'p', 'li', 'section'].includes(tag)) aus += ' ';
    };
    lauf(el);
    return aus.replace(/\*\*\s*\*\*/g, '').replace(/\s+/g, ' ').trim();
  }
  /* ---------- Dokument ---------- */
  const texFertig = t => t.replace(/\*\*(.+?)\*\*/g, '\\textbf{$1}').replace(/ε/g, '\\ensuremath{\\varepsilon}');   // { tex } aus ausHtml: schon maskiert
  /* Markup-Absatz ('Text $…$ $$…$$ **fett**'): Text maskiert (%, &, _ … sonst schneidet pdflatex still ab), Formeln über mathe() */
  // Fett zuerst als Platzhalter (\u0001 … \u0002): **…** darf Formeln umschließen („**Eintauchzahl $N = 10$**“)
  const absatzTex = t => t.replace(/\*\*([\s\S]+?)\*\*/g, '\u0001$1\u0002').split(/(\$\$[\s\S]+?\$\$|\$[^$]+\$)/).map(s =>
    /^\$\$[\s\S]+\$\$$/.test(s) ? `\n\\[ ${mathe(s.slice(2, -2))} \\]\n` : /^\$[^$]+\$$/.test(s) ? `\\(${mathe(s.slice(1, -1))}\\)` : text(s))
    .join('').replace(/\u0001/g, '\\textbf{').replace(/\u0002/g, '}');
  /* ---------- Marke: Name und Logo aus der Kopfleiste der Seite ---------- */
  const MITTE = 'Musterlösung';
  const marke = () => ({ name: ((document.querySelector('.kopf .schule') || {}).textContent || '').trim(),
    logo: typeof LOGO !== 'undefined' ? LOGO : ((document.querySelector('.kopf img') || {}).src || ''),
    kurs: typeof KURS !== 'undefined' ? KURS : '' });
  /* Logo für pdflatex: auf Weiß gelegt, 160 px hoch, RGB, Deflate (CompressionStream), hexadezimal – als Inline-Bild
     (BI … ID … EI) in \pdfliteral. Eine Textdatei, kein Anhang. Ohne pdfTeX oder ohne Logo: Kopf ohne Bild. */
  let logoTex = '', logoBereit = null;
  function bereit(){
    if (logoBereit) return logoBereit;
    logoBereit = (async () => {
      try {
        const { logo } = marke(); if (!logo || typeof CompressionStream === 'undefined') return;
        const img = new Image(); img.src = logo; await img.decode();
        const H = 160, W = Math.max(1, Math.round(img.naturalWidth / img.naturalHeight * H));
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const g = c.getContext('2d'); g.drawImage(img, 0, 0, W, H);
        const px = g.getImageData(0, 0, W, H).data, rgb = new Uint8Array(W * H * 3);
        for (let i = 0, j = 0; i < px.length; i += 4) { const a = px[i + 3] / 255;   // auf Papier gelegt: Durchsichtiges wird weiß
          rgb[j++] = Math.round(px[i] * a + 255 * (1 - a)); rgb[j++] = Math.round(px[i + 1] * a + 255 * (1 - a)); rgb[j++] = Math.round(px[i + 2] * a + 255 * (1 - a)); }
        const z = new Uint8Array(await new Response(new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
        let hex = ''; for (let i = 0; i < z.length; i++) hex += z[i].toString(16).padStart(2, '0') + (i % 40 === 39 ? '\n' : '');
        const hcm = 0.75, wcm = hcm * W / H, bp = 72 / 2.54;
        logoTex = `\\hbox to ${wcm.toFixed(3)}cm{\\vbox to ${hcm}cm{\\vfil}\\pdfliteral{q ${(wcm * bp).toFixed(2)} 0 0 ${(hcm * bp).toFixed(2)} 0 0 cm `
          + `BI /W ${W} /H ${H} /CS /RGB /BPC 8 /F [/AHx /Fl] ID\n${hex}>\nEI Q}\\hfil}`;
      } catch (e) { logoTex = ''; }
    })();
    return logoBereit;
  }
  /* Kopf und Fuß der Datei – die EINE Stelle dafür (fancyhdr) */
  function kopfTex(){
    const { name } = marke();
    return ['\\usepackage{fancyhdr}', '\\pagestyle{fancy}', '\\fancyhf{}',
      logoTex ? `\\ifdefined\\pdfliteral\\newcommand{\\markenlogo}{${logoTex}}\\else\\newcommand{\\markenlogo}{}\\fi` : '\\newcommand{\\markenlogo}{}',
      `\\fancyhead[L]{\\small ${text(name)}}`, `\\fancyhead[C]{\\small\\bfseries ${text(MITTE)}}`, '\\fancyhead[R]{\\raisebox{3pt}{\\markenlogo}}',
      '\\renewcommand{\\headrulewidth}{0.4pt}'].join('\n');                              // ohne Fuß und Seitenzahl
  }
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  /* dieselbe Kopfzeile für den Druck (wiederholt sich auf jeder Seite: thead) */
  function druckkopf(){
    const { name, logo } = marke();
    return `<div class="re-druckkopf"><span>${esc(name)}</span><span class="re-dk-mitte">${esc(MITTE)}</span>${logo ? `<img src="${esc(logo)}" alt="">` : '<span></span>'}</div>`;
  }
  function alsTex(dok){
    return ['\\documentclass[a4paper,11pt]{article}', '\\usepackage[utf8]{inputenc}', '\\usepackage[T1]{fontenc}', '\\usepackage[ngerman]{babel}',
      '\\usepackage{amsmath,amssymb}', '\\usepackage{cancel}', '\\usepackage[a4paper,margin=2.2cm,top=1.4cm,bottom=2cm,headheight=29pt,headsep=10pt,includehead]{geometry}',   // Kopf: Logo 0,75 cm + 3 pt
      kopfTex(), '\\setlength{\\parindent}{0pt}', '\\setlength{\\parskip}{6pt}', '\\begin{document}', '',
      dok.art ? `{\\small ${absatzTex(dok.art)}}` : '',
      ...dok.abschnitte.flatMap(a => [`\\subsection*{${text(a.titel)}}`, ...a.absaetze.flatMap(x => [typeof x === 'string' ? absatzTex(x) : texFertig(x.tex), ''])]), '\\end{document}', ''].join('\n');   // Leerzeile: jeder Absatz ein eigener TeX-Absatz
  }
  const absatzHtml = t => M(t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'));
  function alsHtml(dok){
    return dok.abschnitte.map(a => `<section><h4>${a.titel.replace('ε', '<span class="re-gr">ε</span>')}</h4>${a.absaetze.map(x => `<div class="re-absatz">${typeof x === 'string' ? absatzHtml(x) : x.html}</div>`).join('')}</section>`).join('');
  }
  /* ---------- Fenster ---------- */
  let fenster = null, aktuell = null, ausloeser = null;
  function baue(){
    fenster = FENSTER.neu('rechnung', 're-titel', () => schliesse());           // technik/fenster/: Überlagerung, Navigation ruht
    addEventListener('keydown', e => { if (e.key === 'Escape' && offen()) schliesse(); });
    addEventListener('afterprint', () => { document.documentElement.classList.remove('re-druck'); const st = document.getElementById('re-seite'); if (st) st.remove(); });
  }
  function zeige(dok){
    if (!fenster) baue();
    aktuell = dok; ausloeser = document.activeElement;
    bereit();
    fenster.innerHTML = `<div class="re-karte fenster-karte"><table class="re-seite"><thead><tr><td>${druckkopf()}</td></tr></thead><tfoot><tr><td><div class="re-druckfuss"></div></td></tr></tfoot><tbody><tr><td>
      <div class="re-kopf fenster-kopf"><h3 id="re-titel">Rechnung</h3>
        <button type="button" class="knopf hell" data-re="tex">.tex herunterladen</button>
        <button type="button" class="knopf hell" data-re="druck">Als PDF drucken</button>
        <button type="button" class="re-zu fenster-zu" aria-label="Rechnung schließen">×</button></div>
      <p class="re-titelzeile">${dok.titel}${dok.formel ? ' ' + F(dok.formel) : ''}</p>
      ${dok.art ? `<p class="re-art${dok.vermutung ? ' vermutung' : ''}">${absatzHtml(dok.art)}</p>` : ''}
      <div class="re-inhalt">${alsHtml(dok)}</div>
    </td></tr></tbody></table></div>`;
    fenster.classList.add('an');
    fenster.querySelector('.re-zu').onclick = schliesse;
    fenster.querySelector('[data-re="tex"]').onclick = herunterladen;
    fenster.querySelector('[data-re="druck"]').onclick = drucken;
    fenster.querySelector('.re-zu').focus(); fenster.scrollTop = 0;
  }
  const offen = () => !!fenster && fenster.classList.contains('an');
  function schliesse(){ fenster.classList.remove('an'); if (ausloeser && ausloeser.focus) ausloeser.focus(); }
  async function herunterladen(){
    await bereit();
    const url = URL.createObjectURL(new Blob([alsTex(aktuell)], { type: 'application/x-tex' }));
    const a = document.createElement('a'); a.href = url; a.download = aktuell.datei || 'rechnung.tex'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  /* Drucken: A4 hoch – als eigene Regel, solange gedruckt wird (die Präsentation selbst druckt A4 quer;
     benannte Seiten übernimmt nicht jeder Browser) */
  function drucken(){
    const st = document.createElement('style'); st.id = 're-seite'; st.textContent = '@page{size:A4 portrait;margin:0}';   // ohne Rand druckt der Browser weder Pfad noch Uhrzeit; Ränder: .re-seite
    document.head.appendChild(st); document.documentElement.classList.add('re-druck');
    window.print();
  }

  /* ---------- aus einem Lösungsweg (WZ.weg) ---------- */
  /* Bereich (Element) → Absatz { html: wie angezeigt, tex: daraus } – ohne Eingaben, Knöpfe, ausgeblendetes */
  function bereich(el){
    const k = el.cloneNode(true);
    k.querySelectorAll('input, button, select, .knopfleiste, .rechts, .wz-gleich, [hidden], .re-nicht').forEach(e => e.remove());
    return { html: k.innerHTML, tex: ausHtml(k) };
  }
  function ausBereichen({ titel, aufgabe, teile = [], datei }){
    const abschnitte = [];
    if (aufgabe){ const a = bereich(aufgabe); if (a.tex) abschnitte.push({ titel: 'Aufgabe', absaetze: [a] }); }
    teile.forEach(([t, el]) => { if (!el) return; const a = bereich(el); if (a.tex) abschnitte.push({ titel: t, absaetze: [a] }); });
    return { titel, abschnitte, datei: datei || 'rechnung.tex' };
  }
  function knopf(nachbar, dok){
    if (!nachbar || nachbar.parentNode.querySelector('[data-re="rechnung"]')) return null;
    const k = document.createElement('button'); k.type = 'button'; k.className = 'knopf hell'; k.dataset.re = 'rechnung'; k.textContent = 'Rechnung';
    nachbar.after(k); k.onclick = () => { const d = dok(); if (d && d.abschnitte.length) zeige(d); };
    return k;
  }
  function ausWeg(root, schritte){
    const folie = root.closest('.slide'), h2 = folie && folie.querySelector('h2');
    const aufgabe = root.querySelector('.wz-aufgabe') || root.querySelector('[data-aufgabe]') || (root.closest('.slide') || root).querySelector('[data-aufgabe]');
    const abschnitte = [];
    if (aufgabe){ const a = bereich(aufgabe); if (a.tex) abschnitte.push({ titel: 'Aufgabe', absaetze: [a] }); }   // ohne Eingabe und „=“ davor
    abschnitte.push({ titel: 'Lösungsweg', absaetze: schritte.map(([was, html], i) => {
      const d = document.createElement('div'), w = document.createElement('span'); d.innerHTML = html; w.innerHTML = was;
      return { html: `<strong>${i + 1}. ${was}</strong> ${html}`, tex: `**${i + 1}. ${ausHtml(w)}** ${ausHtml(d)}` }; }) });
    return { titel: h2 ? h2.textContent.trim() : 'Rechnung', abschnitte, datei: 'rechnung.tex' };
  }
  return { zeige, bereit, alsTex, alsHtml, ausHtml, ausWeg, ausBereichen, knopf, kopfTex, offen, schliesse, aktuell: () => aktuell, text };
})();
</script><!-- /RECHNUNG -->
<script data-eingabehilfe="technik/hilfe/eingabehilfe.js">
/* =====================================================================
   EINGABEHILFE — Knopf ⓘ vorn in der Navigation (Taste H oder ?): „So gibst du Mathe ein".
   Nur das: wie man Mathe sauber in ein Textfeld bekommt. Keine Bedienhilfe. Quelle: technik/hilfe/
   Esc, ×, H oder ein Klick daneben schließen. Im Druck unsichtbar.

   Dieser Block läuft VOR dem Code der Präsentation. Jede Präsentation meldet an, was ihre Felder annehmen –
   dort, wo ihr Leser steht (auch in einer Funktion, auch mehrmals):
       EH.melde(() => EH.mit(EH.terme(), EH.zahlen()));                       Standard-Leser (term.js, bruch.js)
       EH.melde(() => EH.liste(lies));                                         eigener Leser `lies` des Feldes
       EH.melde(() => ({ zeilen: EH.zeilen(lies, [[tex, ['ein1', 'ein2']], [tex, null, 'Text mit `Taste`']]), hinweise: [...] }));
   Eine Zeile: gemeint (LaTeX) → eintippen (eine oder mehrere Schreibweisen, oder freier Text; `…` wird zur Taste).
   lies ist der Leser des Feldes; was er bei Unsinn liefert (null, NaN, false, { fehler }, Ausnahme), gilt als „abgelehnt".
   Die Prüfung (pruefe_eingabehilfe.mjs, läuft in jeder Probe) tippt jede Schreibweise der Tabelle ein:
   angenommen? Und meinen alle Schreibweisen einer Zeile dasselbe?
   Meldet niemand etwas an, erscheint kein Knopf. Knopf und Fenster entstehen, wenn die Seite fertig ist.
   ===================================================================== */
const EH = (() => {
  /* Kurzform eines Leser-Ergebnisses, um Schreibweisen zu vergleichen; null = abgelehnt */
  function kurz(r){
    if (r === null || r === undefined || r === false || (typeof r === 'number' && !Number.isFinite(r))) return null;
    if (typeof r === 'number') return r.toPrecision(10);
    if (typeof r === 'string') return r;
    if (Array.isArray(r)) { const k = r.map(kurz); return k.includes(null) ? null : k.join(';'); }
    if (typeof r === 'object'){
      if ('fehler' in r && r.fehler) return null;
      if ('ok' in r && r.ok === false) return null;
      if ('z' in r && 'n' in r && typeof r.z === 'number') return r.n ? (r.z / r.n).toPrecision(10) : null;
      if ('t' in r && typeof T_wert === 'function'){          // Termbaum aus term.js: Werte an drei Stellen
        const w = [0.7, 1.3, 2.9].map(x => { try { return T_wert(r, x); } catch (e) { return NaN; } });
        return w.map(v => Number.isFinite(v) ? v.toPrecision(10) : 'def').join('|');
      }
      if ('M' in r) return kurz(r.M);
      if ('wert' in r) return kurz(r.wert);
      return JSON.stringify(r);
    }
    return String(r);
  }
  const versuch = lies => s => { try { return kurz(lies(s)); } catch (e) { return null; } };
  const zeilen = (lies, liste) => liste.map(([tex, ein, text]) => ({ tex, ein: [].concat(ein || []), text, lies: versuch(lies) }));
  const termLies = s => T_lies(s);
  const teile = [];
  return {
    kurz, versuch, zeilen,
    /* anmelden: f liefert einen Block { zeilen, hinweise } (erst beim Öffnen ausgewertet) */
    melde(f){ teile.push(f); },
    hat: () => teile.length > 0,
    alle(){ return this.mit(...teile.map(f => f())); },
    /* Blöcke zusammenstellen; gleiche Zeilen und Hinweise nur einmal */
    mit(...bl){
      const z = [], h = [], schon = new Set();
      bl.flat().forEach(b => {
        (b.zeilen || []).forEach(r => { const k = r.tex + '|' + r.ein.join(',') + '|' + (r.text || ''); if (!schon.has(k)) { schon.add(k); z.push(r); } });
        (b.hinweise || []).forEach(x => { if (!h.includes(x)) h.push(x); });
      });
      return { zeilen: z, hinweise: h };
    },

    /* ---------- Bausteine (lies: der Leser des Feldes; ohne Angabe der Standard-Leser) ---------- */
    /* Zahlen: ganze Zahl, Dezimalzahl, Bruch (bruch.js: qLies) */
    zahlen(lies = s => qLies(s)){ return {
      zeilen: zeilen(lies, [['-3', ['-3']], ['2{,}5', ['2,5', '2.5']], ['\\dfrac{3}{4}', ['3/4']], ['-\\dfrac{3}{4}', ['-3/4']]]),
      hinweise: ['Dezimalzahlen mit Komma oder Punkt, Brüche mit Schrägstrich: `3/4`. Statt gemischter Zahl `1 1/2` lieber `3/2` oder `1,5`.'],
    }; },
    /* nur Dezimalzahlen (kein Bruch) */
    dezimal(lies){ return {
      zeilen: zeilen(lies, [['0{,}25', ['0,25', '0.25']]]),
      hinweise: ['Hier nur Dezimalzahlen, mit Komma oder Punkt – kein Bruch.'],
    }; },
    /* Terme in x (term.js: T_lies) */
    terme(lies = termLies){ return {
      zeilen: zeilen(lies, [
        ['3x', ['3x', '3*x']], ['x^{2}', ['x^2', 'x²']], ['2(x+1)', ['2(x+1)']], ['\\dfrac{x+1}{x-2}', ['(x+1)/(x-2)']],
        ['e^{2x}', ['e^(2x)']], ['\\sqrt{x}', ['√x', 'Wurzel(x)']], ['1{,}5x', ['1,5x', '1.5x']],
      ]),
      hinweise: ['Der Malpunkt darf fehlen: `3x`, `2(x+1)`. Hochzahl mit `^`, mehrteilige Hochzahl in Klammern: `e^(2x)`, `x^(-2)`.',
                 'Bei Brüchen Klammern um Zähler und Nenner: `(x+1)/(x-2)`. Auch erlaubt: `π`, `ln(x)`, `sin(x)`, `cos(x)`.'],
    }; },
    /* eine Zahl, die als Term geschrieben werden darf (ohne x): √2, π/4, ln(5)/2 */
    zahlTerm(lies, { pi = true, ln = true } = {}){ return {
      zeilen: zeilen(lies, [
        ['\\sqrt{2}', ['√2', 'sqrt(2)']], ['2\\sqrt{3}', ['2√3']], ['\\dfrac{\\sqrt{3}}{2}', ['√3/2']],
        ...(pi ? [['\\dfrac{\\pi}{4}', ['pi/4', 'π/4']]] : []), ...(ln ? [['\\dfrac{\\ln(5)}{2}', ['ln(5)/2']]] : []),
      ]),
      hinweise: ['Ein genauer Wert darf als Term stehen (`√2`, `2√3`), ein gerundeter als Dezimalzahl (`1,41`).'],
    }; },
    /* Lösungsmengen und Listen von x-Werten */
    liste(lies, { wurzel = true, keine = true, pm = true } = {}){ return {
      zeilen: zeilen(lies, [
        ['\\{0;\\,3;\\,-\\tfrac{1}{2}\\}', ['0; 3; -1/2']],
        ...(pm ? [['x = \\pm 2', ['±2', '+-2']]] : []),
        ...(wurzel ? [['1 \\pm \\sqrt{5}', ['1±√5']]] : []),
        ...(keine ? [['\\{\\,\\}', ['keine']]] : []),
      ]),
      hinweise: ['Mehrere Werte mit Semikolon trennen: `0; 3`. `x =` davor ist erlaubt.'],
    }; },
    /* Prozent-Angaben */
    prozent(lies){ return {
      zeilen: zeilen(lies, [['15\\,\\%', ['15 %', '15%']]]),
      hinweise: ['Prozent mit Zeichen am Ende: `15 %`.'],
    }; },
    /* Winkel in Grad */
    grad(lies){ return {
      zeilen: zeilen(lies, [['30^{\\circ}', ['30°', '30']]]),
      hinweise: ['Winkel in Grad: das Gradzeichen `°` darf fehlen.'],
    }; },
  };
})();

const EINGABEHILFE_FENSTER = { selbstpruefung: () => [] };
document.addEventListener('DOMContentLoaded', () => {
  const nav = document.getElementById('nav');
  if (!nav || !EH.hat()) return;
  const taste = t => `<kbd>${t}</kbd>`;
  const mitTasten = t => t.replace(/`([^`]+)`/g, (_, x) => taste(x));
  const knopf = document.createElement('button');
  knopf.id = 'hilfeknopf'; knopf.type = 'button'; knopf.title = 'So gibst du Mathe ein (H)'; knopf.setAttribute('aria-label', 'Eingabehilfe: so gibst du Mathe ein');
  knopf.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="punkt" cx="12" cy="6.6" r="1.9"/><path d="M12 11v8"/></svg>';
  nav.insertBefore(knopf, nav.firstChild);
  const fenster = FENSTER.neu('hilfe', 'hilfe-titel', () => schliesse());     // technik/fenster/: Überlagerung, Navigation ruht

  function oeffne(){
    const E = EH.alle();
    fenster.innerHTML = `<div class="hilfe-karte fenster-karte">
      <div class="fenster-kopf"><h3 id="hilfe-titel">So gibst du Mathe ein</h3><button type="button" class="hilfe-zu fenster-zu" aria-label="Hilfe schließen">×</button></div>
      <div class="hilfe-inhalt">
        <table class="hilfe-tab"><tr><th>gemeint</th><th>eintippen</th></tr>
          ${E.zeilen.map((z, i) => `<tr data-zeile="${i}"><td>${F(z.tex)}</td><td>${z.text ? mitTasten(z.text) : z.ein.map(taste).join(' oder ')}</td></tr>`).join('')}
        </table>
        ${E.hinweise.length ? `<ul>${E.hinweise.map(h => `<li>${mitTasten(h)}</li>`).join('')}</ul>` : ''}
      </div>
    </div>`;
    fenster.classList.add('an');
    fenster.querySelector('.hilfe-zu').onclick = schliesse;
    fenster.querySelector('.hilfe-zu').focus();
    fenster.scrollTop = 0;
  }
  function schliesse(){ fenster.classList.remove('an'); knopf.focus(); }
  const offen = () => fenster.classList.contains('an');
  knopf.addEventListener('click', () => offen() ? schliesse() : oeffne());
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (e.key === 'h' || e.key === 'H' || e.key === '?') { e.preventDefault(); offen() ? schliesse() : oeffne(); }
    else if (e.key === 'Escape' && offen()) schliesse();
  });
  /* für die Prüfung: jede Schreibweise der Tabelle durch ihren Leser */
  EINGABEHILFE_FENSTER.selbstpruefung = () => {
    const f = [], E = EH.alle();
    if (!E.zeilen.length) f.push('keine Zeilen');
    E.zeilen.forEach(z => {
      const schreib = [...z.ein, ...[...(z.text || '').matchAll(/`([^`]+)`/g)].map(m => m[1])];
      if (!schreib.length) f.push(`Zeile ${z.tex}: keine Schreibweise`);
      schreib.filter(s => z.lies(s) === null).forEach(s => f.push(`„${s}" (Zeile ${z.tex}) wird nicht angenommen`));
      const k = new Set(z.ein.map(s => z.lies(s)).filter(x => x !== null));
      if (k.size > 1) f.push(`Zeile ${z.tex}: ${z.ein.join(' / ')} meinen nicht dasselbe`);
    });
    return f;
  };
  Object.assign(EINGABEHILFE_FENSTER, { oeffne, schliesse, offen });
});

<script data-fenster="technik/fenster/fenster.js">
/* =====================================================================
   FENSTER — gemeinsames Verhalten der Fenster über der Folie (Eingabehilfe ⓘ, Rechnung). Quelle: technik/fenster/
     FENSTER.neu(id, titelId, schliesse)  Fenster-Element (role="dialog", aria-modal) anlegen; Klick auf den Rand schließt
     FENSTER.offen()                      ist irgendein Fenster offen?
   Solange ein Fenster offen ist, RUHT die Navigation der Präsentation: Pfeile, Leertaste, Enter, Bild auf/ab, Pos1/Ende,
   O, F … erreichen die Folien nicht (Tastendruck wird vor dem Rahmen abgefangen). Esc und H bleiben bei den Fenstern.
   ===================================================================== */
const FENSTER = (() => {
  const alle = [];
  const offen = () => alle.some(f => f.classList.contains('an'));
  addEventListener('keydown', e => {
    if (!offen() || ['Escape', 'Tab', 'h', 'H', '?'].includes(e.key)) return;
    e.stopImmediatePropagation();                                    // die Folie dahinter blättert nicht weiter
  }, true);
  function neu(id, titelId, schliesse){
    const f = document.createElement('div');
    f.id = id; f.className = 'fenster'; f.setAttribute('role', 'dialog'); f.setAttribute('aria-modal', 'true'); f.setAttribute('aria-labelledby', titelId);
    document.body.appendChild(f); alle.push(f);
    f.addEventListener('click', e => { if (e.target === f) schliesse(); });
    return f;
  }
  return { neu, offen };
})();
</script><!-- /FENSTER -->

   Braucht technik/mathe/temml/temml.min.js (Temml 0.13.5, MIT) und formel.css. Kein Netz, keine Schrift.
     F(tex)          Formel im Text         F(tex, true)   abgesetzte Formel (eigene Zeile, zentriert)
     FB(tex)         = F(tex, true) – abgesetzte Formel (nicht lokal neu definieren)
     qTex(q)         Bruch aus bruch.js als LaTeX: -\frac{3}{4}
     dTex(q)         wie qTex, aber Bruch in voller Größe (\\dfrac) – für Tabellen/Listen (array), wo LaTeX sonst klein setzt
     zTex(v, st)     Dezimalzahl mit Komma: 2{,}5   (st = höchstens so viele Nachkommastellen)
     zfTex(v, st, o) Anzeige-Zahl: Tausenderpunkte, feste Stellen (Geld), Zehnerpotenz bei sehr groß/klein
     vTex([..])      Spaltenvektor  \begin{pmatrix}…\end{pmatrix}  (Einträge: Zahlen, Brüche oder LaTeX)
     pTex(k, v)      Polynom aus Koeffizienten (Index = Hochzahl; Zahlen oder Brüche): \frac{1}{2}x^{2} - 2x + 3
     klTex(tex)      Klammer um tex: normale ( ), nur um Brüche mitwachsend \left( … \right) – wie man es in LaTeX setzt
     M(text)         Text mit Mathe wie in LaTeX: $…$ im Text, $$…$$ abgesetzt. M('Steigung $m = \\frac{2}{3}$')
     kTex(kl, tex)   Teil einer Formel mit CSS-Klasse einfärben: \class{kl}{tex}  (Farben bleiben in farben.css)
   Nur \class ist freigegeben (trust); Nutzereingaben nie roh an F geben.
   In JS jeden Backslash doppelt schreiben: '\\frac', Zeilenumbruch in Tabellen '\\\\'.
   ===================================================================== */

/* Zahl gesetzt, für Anzeigen (Geld, große Anzahlen, Iterationen):

     fest: immer st Nachkommastellen (Geld: zfTex(2871.75, 2, { fest: true }) → 2{.}871{,}75)

/* =====================================================================
   TERM — Terme in x lesen, ausrechnen, schön hinschreiben. Kein CAS: vereinfacht nichts.
   Gemeinsam genutzt von den Mathe-Werkzeugen (Terme, Gleichungen). Quelle: technik/mathe/term.js
     T_lies("3x(2x+3)")  → Baum          T_wert(baum, x) → Zahl (NaN, wenn nicht definiert)
     T_html(baum)        → HTML          T_gleich(b1, b2, stellen) → gleichwertig? (Einsetzen)
     T_faktoren(baum)    → Liste der Faktoren eines Produkts (Minus als Faktor −1)
     T_koeffizienten(b)  → [a0, a1, …] eines Polynoms mit ganzen Koeffizienten, sonst null
     T_tex(baum)         → LaTeX (für formel.js)
     T_summanden(b)      → Summanden mit Vorzeichen · T_hatKlammer(text) · T_polyHtml(k) · T_polyText(k) · T_polyMal(p, q)
   Erlaubt: Zahlen (Komma oder Punkt), x, e, π, + − · * / : ^ ** ² ³ ( ), Wurzel/sqrt/√, ∛/cbrt, ∜/fqrt, ln, lg, exp,
   sin, cos, tan (Bogenmaß), Betrag abs(…)/betrag(…)/|…|, sgn(…) (∛ und ∜ wie in der Schule nur für Zahlen ≥ 0),
   Malpunkt darf fehlen (2x, 3(x+1), x(x−4), e^x(x+2)).
   Optionen: T_lies(text, { variable: 'n', weitere: ['a'], fakultaet: true }) – andere Variable (Knoten {t:'x', name:'n'},
   T_wert(b, n) wie gewohnt), weitere Namen als Knoten {t:'v', n:'a'} (Wert über T_wert(b, x, { a: … })), n! als Fakultät.
   ===================================================================== */
const T_FN = ['wurzel', 'betrag', 'sqrt', 'cbrt', 'fqrt', 'exp', 'sin', 'cos', 'tan', 'abs', 'sgn', 'ln', 'lg'];
function T_zerlege(text, o = {}){
  // streng: Komma/Punkt nur als Dezimalzeichen zwischen Ziffern, höchstens eins je Zahl („2,5,1“ und „2, 5“ nicht still umdeuten)
  const roh = String(text).trim();
  if (/,/.test(roh.replace(/\d,\d/g, ''))) throw new Error('Ein Komma geht nur zwischen Ziffern, als Dezimalkomma (z. B. 2,5).');
  if (/\d[.,]\d+[.,]\d/.test(roh)) throw new Error('Eine Zahl hat höchstens ein Dezimalkomma.');
  const s = roh
    .replace(/[−–]/g, '-').replace(/\*\*/g, '^').replace(/[·×⋅*]/g, '*').replace(/:/g, '/')
    .replace(/²/g, '^2').replace(/³/g, '^3').replace(/π/g, 'pi').replace(/∛/g, 'cbrt').replace(/∜/g, 'fqrt').replace(/√/g, 'sqrt').replace(/,/g, '.');
  const v = o.variable || 'x', weitere = o.weitere || [];
  const namen = [...T_FN, 'pi', v, ...weitere, 'e'];
  const t = []; let i = 0;
  while (i < s.length){
    const c = s[i];
    if (c === ' ') { i++; continue; }
    const z = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);
    if (z) { t.push({ k: 'zahl', v: parseFloat(z[1]) }); i += z[1].length; continue; }
    if (/[a-zA-ZäöüÄÖÜ]/.test(c)){
      const w = s.slice(i).match(/^[a-zA-ZäöüÄÖÜ]+/)[0].toLowerCase(); let j = 0;
      while (j < w.length){
        const n = namen.find(n => w.startsWith(n, j));
        if (!n) throw new Error(`„${w.slice(j)}" kenne ich nicht. Erlaubt sind ${[v, ...weitere].join(', ')}, e, Zahlen, Wurzel, ln, lg, exp, sin, cos, tan, abs.`);
        t.push({ k: 'name', v: n === 'wurzel' ? 'sqrt' : n === 'betrag' ? 'abs' : n }); j += n.length;
      }
      i += w.length; continue;
    }
    if ('+-*/^()|'.includes(c) || (c === '!' && o.fakultaet)) { t.push({ k: c }); i++; continue; }
    throw new Error(`Das Zeichen „${c}" kenne ich nicht.`);
  }
  // streng: zwei Zahlen hintereinander („2 5“, „2. 5“) nicht still malnehmen – der Malpunkt darf nur vor x, e, π, Klammer fehlen
  for (let j = 1; j < t.length; j++) if (t[j].k === 'zahl' && t[j - 1].k === 'zahl') throw new Error('Zwischen zwei Zahlen fehlt ein Rechenzeichen (z. B. 2 · 5 oder 2,5).');
  return t;
}
function T_lies(text, o = {}){
  const t = T_zerlege(text, o); let p = 0;
  const v = o.variable || 'x', weitere = o.weitere || [];
  if (!t.length) throw new Error('Bitte einen Term eingeben.');
  const sieh = () => t[p], nimm = () => t[p++];
  const beginnt = k => k && (k.k === 'zahl' || k.k === 'name' || k.k === '(');
  function summe(){ let a = produkt(); while (sieh() && (sieh().k === '+' || sieh().k === '-')) { const o = nimm().k; a = { t: o, a, b: produkt() }; } return a; }
  function produkt(){
    let a = vorzeichen();
    for (;;){
      const k = sieh();
      if (k && (k.k === '*' || k.k === '/')) { nimm(); a = { t: k.k, a, b: vorzeichen() }; }
      else if (beginnt(k)) a = { t: '*', a, b: potenz(), still: true };      // 3x, 2(x+1)
      else return a;
    }
  }
  function vorzeichen(){
    if (sieh() && sieh().k === '-') { nimm(); return { t: 'neg', a: vorzeichen() }; }
    if (sieh() && sieh().k === '+') { nimm(); return vorzeichen(); }
    return potenz();
  }
  function potenz(){
    let a = atom();
    while (sieh() && sieh().k === '!') { nimm(); a = { t: 'fn', f: 'fak', a }; }                 // n! (nur mit Option fakultaet)
    if (sieh() && sieh().k === '^') { nimm(); return { t: '^', a, b: hochzahl() }; }
    return a;
  }
  function hochzahl(){ if (sieh() && sieh().k === '-') { nimm(); return { t: 'neg', a: hochzahl() }; } return potenz(); }
  function atom(){
    const k = nimm();
    if (!k) throw new Error('Der Term hört zu früh auf.');
    if (k.k === 'zahl') return { t: 'z', v: k.v };
    if (k.k === '(') { const a = summe(); if (!sieh() || nimm().k !== ')') throw new Error('Eine Klammer „)" fehlt.'); return { t: '()', a }; }
    if (k.k === '|') { const a = summe(); if (!sieh() || nimm().k !== '|') throw new Error('Ein Betragsstrich „|" fehlt.'); return { t: 'fn', f: 'abs', a }; }
    if (k.k === 'name'){
      if (k.v === v) return v === 'x' ? { t: 'x' } : { t: 'x', name: v };
      if (weitere.includes(k.v)) return { t: 'v', n: k.v };
      if (k.v === 'e') return { t: 'e' };
      if (k.v === 'pi') return { t: 'z', v: Math.PI, name: 'π' };
      if ((!sieh() || sieh().k !== '(') && ['sqrt', 'cbrt', 'fqrt'].includes(k.v) && sieh() && (sieh().k === 'zahl' || sieh().k === 'name'))
        return { t: 'fn', f: k.v, a: atom() };                                  // √x, √2 wie in der Schule: nur das nächste Zeichen
      if (!sieh() || sieh().k !== '(') throw new Error(`Nach ${k.v} bitte eine Klammer, z. B. ${k.v}(x).`);
      nimm(); const a = summe(); if (!sieh() || nimm().k !== ')') throw new Error('Eine Klammer „)" fehlt.');
      return { t: 'fn', f: k.v, a };
    }
    throw new Error(`An dieser Stelle passt „${k.k}" nicht.`);
  }
  const b = summe();
  if (p < t.length) throw new Error(`An dieser Stelle passt „${t[p].k === 'zahl' ? t[p].v : t[p].k === 'name' ? t[p].v : t[p].k}" nicht.`);
  return b;
}
const T_FAK = k => (k < 0 || !Number.isInteger(k) || k > 170) ? NaN : [...Array(k)].reduce((a, _, i) => a * (i + 1), 1);
function T_wert(b, x, w = {}){
  const W = e => T_wert(e, x, w);
  switch (b.t){
    case 'z': return b.v; case 'x': return x; case 'e': return Math.E;
    case 'v': return b.n in w ? w[b.n] : NaN;
    case '()': return W(b.a);
    case 'neg': return -W(b.a);
    case '+': return W(b.a) + W(b.b);
    case '-': return W(b.a) - W(b.b);
    case '*': return W(b.a) * W(b.b);
    case '/': { const n = W(b.b); return n === 0 ? NaN : W(b.a) / n; }
    case '^': { const g = W(b.a), h = W(b.b); return g < 0 && !Number.isInteger(h) ? NaN : Math.pow(g, h); }
    case 'fn': { const a = W(b.a);
      switch (b.f){
        case 'sqrt': return a < 0 ? NaN : Math.sqrt(a);
        case 'cbrt': return a < 0 ? NaN : Math.cbrt(a);
        case 'fqrt': return a < 0 ? NaN : a ** 0.25;
        case 'ln': return a <= 0 ? NaN : Math.log(a);
        case 'lg': return a <= 0 ? NaN : Math.log10(a);
        case 'sin': return Math.sin(a); case 'cos': return Math.cos(a); case 'tan': return Math.tan(a);
        case 'abs': return Math.abs(a); case 'sgn': return Math.sign(a);
        case 'fak': return T_FAK(a);
        default: return Math.exp(a);
      } }
  }
  return NaN;
}
/* Gleichwertig: an vielen Stellen derselbe Wert (relative Toleranz). */
function T_gleich(b1, b2, stellen = [-2.7, -1.3, -0.4, 0.6, 1.1, 1.9, 2.8, 3.7]){
  let verglichen = 0;
  for (const x of stellen){
    const u = T_wert(b1, x), v = T_wert(b2, x);
    if (!isFinite(u) && !isFinite(v)) continue;
    if (!isFinite(u) || !isFinite(v)) return false;
    if (Math.abs(u - v) > 1e-9 * Math.max(1, Math.abs(u), Math.abs(v))) return false;
    verglichen++;
  }
  return verglichen >= 3;
}
/* Faktoren eines Produkts, Minus vorne als −1 */
function T_faktoren(b){
  if (b.t === 'neg') return [{ t: 'z', v: -1 }, ...T_faktoren(b.a)];
  if (b.t === '*') return [...T_faktoren(b.a), ...T_faktoren(b.b)];
  return [b];
}
const T_istSumme = b => b.t === '()' ? T_istSumme(b.a) : (b.t === '+' || b.t === '-');
function T_html(b, ctx = 0){
  const k = (s, r) => r < ctx ? `(${s})` : s;
  const zahl = v => String(Math.round(v * 1e6) / 1e6).replace('.', ',').replace('-', '−');
  switch (b.t){
    case 'z': return b.name || (b.v < 0 ? k(zahl(b.v), 3) : zahl(b.v));
    case 'x': return `<i>${b.name || 'x'}</i>`; case 'e': return 'e'; case 'v': return `<i>${b.n}</i>`;
    case '()': return `(${T_html(b.a, 0)})`;
    case 'neg': return k('−' + T_html(b.a, 2), 3);
    case '+': return k(`${T_html(b.a, 1)} + ${T_html(b.b, 1)}`, 1);
    case '-': return k(`${T_html(b.a, 1)} − ${T_html(b.b, 2)}`, 1);
    case '*': return k(b.still ? `${T_html(b.a, 2)}${T_html(b.b, 2)}` : `${T_html(b.a, 2)} · ${T_html(b.b, 2)}`, 2);
    case '/': return k(`${T_html(b.a, 2)} : ${T_html(b.b, 3)}`, 2);
    case '^': { const hoch = e => { while (e.t === '()') e = e.a; return e.t === 'neg' ? '−' + hoch(e.a) : e.t === '/' ? `${T_html(e.a, 3)}/${T_html(e.b, 3)}` : T_html(e, 0); };
      return k(`${T_html(b.a, 5)}<sup>${hoch(b.b)}</sup>`, 4); }                 // x^(−3/2): Bruch im Exponenten mit Schrägstrich
    case 'fn': { const w = { sqrt: '√', cbrt: '∛', fqrt: '∜' }[b.f], einfach = b.a.t === 'x' || b.a.t === 'z';
      if (w) return einfach ? w + T_html(b.a, 0) : `${w}(${T_html(b.a, 0)})`;                  // √x, √(x + 1)
      if (b.f === 'abs') return `|${T_html(b.a, 0)}|`;
      if (b.f === 'fak') return `${T_html(b.a, 5)}!`;
      return b.f === 'exp' ? `e<sup>${T_html(b.a, 0)}</sup>` : `${b.f}(${T_html(b.a, 0)})`; }
  }
}
/* Wie T_html, aber als LaTeX für formel.js (Mathe-Standard): echte Brüche, Wurzeln, Hochzahlen.
   Klammern, die nur die Eingabe gliederten (um Zähler, Nenner, Exponenten, Wurzelinhalt), fallen weg. */
function T_tex(b, ctx = 0){
  const kl = s => /\\frac/.test(s) ? `\\left(${s}\\right)` : `(${s})`;           // um Brüche mitwachsende Klammern (wie klTex)
  const k = (s, r) => r < ctx ? kl(s) : s, ohne = e => { while (e.t === '()') e = e.a; return e; };
  const zahl = v => String(Math.round(v * 1e6) / 1e6).replace('.', '{,}');
  switch (b.t){
    case 'z': return b.name ? '{\\pi}' : (b.v < 0 ? k(zahl(b.v), 3) : zahl(b.v));   // {…}: sonst wird aus \pi und x der Befehl \pix
    case 'x': return b.name || 'x'; case 'e': return 'e'; case 'v': return b.n;
    case '()': return kl(T_tex(b.a, 0));
    case 'neg': return k('-' + T_tex(b.a, 2), 3);
    case '+': return k(`${T_tex(b.a, 1)} + ${T_tex(b.b, 1)}`, 1);
    case '-': return k(`${T_tex(b.a, 1)} - ${T_tex(b.b, 2)}`, 1);
    case '*': return k(b.still ? `${T_tex(b.a, 2)}${T_tex(b.b, 2)}` : `${T_tex(b.a, 2)} \\cdot ${T_tex(b.b, 2)}`, 2);
    case '/': return k(`\\frac{${T_tex(ohne(b.a), 0)}}{${T_tex(ohne(b.b), 0)}}`, 3);
    case '^': { const hoch = e => { e = ohne(e); return e.t === 'neg' ? '-' + hoch(e.a) : e.t === '/' ? `${T_tex(e.a, 3)}/${T_tex(e.b, 3)}` : T_tex(e, 0); };
      return k(`{${T_tex(b.a, 5)}}^{${hoch(b.b)}}`, 4); }                    // Bruch im Exponenten mit Schrägstrich: x^{-3/2}
    case 'fn': { const w = { sqrt: '\\sqrt', cbrt: '\\sqrt[3]', fqrt: '\\sqrt[4]' }[b.f];
      if (w) return `${w}{${T_tex(ohne(b.a), 0)}}`;
      if (b.f === 'abs') return `\\left|${T_tex(ohne(b.a), 0)}\\right|`;
      if (b.f === 'fak') return `${T_tex(b.a, 5)}!`;
      if (b.f === 'sgn') return `\\operatorname{sgn}(${T_tex(ohne(b.a), 0)})`;
      return b.f === 'exp' ? `e^{${T_tex(ohne(b.a), 0)}}` : `\\${b.f}${b.a.t === 'x' ? ' ' + (b.a.name || 'x') : `(${T_tex(ohne(b.a), 0)})`}`; }
  }
}
/* Koeffizienten eines Polynoms (ganze Zahlen, Grad ≤ 7) über Differenzen; Index = Hochzahl. Sonst null. */
function T_koeffizienten(b){
  const N = 9, f = [...Array(N)].map((_, i) => T_wert(b, i));
  if (!f.every(Number.isFinite)) return null;
  const delta = [f[0]]; let d = f.slice();
  for (let k = 1; k < N; k++){ d = d.slice(1).map((v, i) => v - d[i]); delta.push(d[0]); }
  if (Math.abs(delta[N - 1]) > 1e-6) return null;
  const koef = Array(N).fill(0); let ff = [1], fak = 1;
  for (let k = 0; k < N; k++){
    if (k > 0){ const nf = Array(ff.length + 1).fill(0); ff.forEach((c, i) => { nf[i + 1] += c; nf[i] -= (k - 1) * c; }); ff = nf; fak *= k; }
    ff.forEach((c, i) => { koef[i] += delta[k] * c / fak; });
  }
  const ganz = koef.map(Math.round);
  if (ganz.some((c, i) => Math.abs(c - koef[i]) > 1e-6)) return null;
  while (ganz.length > 1 && ganz[ganz.length - 1] === 0) ganz.pop();
  return ganz;
}
/* Summanden einer Summe (Klammern um die ganze Summe werden durchgereicht), jeweils mit Vorzeichen als Baum. */
function T_summanden(b, vz = 1){
  if (b.t === '()') return T_summanden(b.a, vz);
  if (b.t === '+') return [...T_summanden(b.a, vz), ...T_summanden(b.b, vz)];
  if (b.t === '-') return [...T_summanden(b.a, vz), ...T_summanden(b.b, -vz)];
  if (b.t === 'neg' && (b.a.t === '+' || b.a.t === '-' || b.a.t === '()')) return T_summanden(b.a, -vz);
  return [vz === 1 ? b : { t: 'neg', a: b }];
}
const T_hatKlammer = text => /[()]/.test(String(text).replace(/(sqrt|cbrt|fqrt|wurzel|betrag|abs|sgn|ln|lg|exp|sin|cos|tan|√|∛|∜)\s*\([^()]*\)/gi, 'F'));   // Funktionsklammern zählen nicht
/* Polynom (Koeffizienten, Index = Hochzahl) als HTML: „2x² − 3x + 1" */
function T_polyHtml(k, v = 'x'){
  let s = '';
  for (let i = k.length - 1; i >= 0; i--){
    const c = k[i]; if (!c) continue;
    const a = Math.abs(c), teil = (a === 1 && i > 0 ? '' : String(a)) + (i === 0 ? '' : i === 1 ? `<i>${v}</i>` : `<i>${v}</i><sup>${i}</sup>`);
    s += s ? (c < 0 ? ' − ' : ' + ') + teil : (c < 0 ? '−' : '') + teil;
  }
  return s || '0';
}
const T_polyText = (k, v = 'x') => k.map((c, i) => c ? `(${c})*${v}^${i}` : '').filter(Boolean).join('+') || '0';
const T_polyMal = (p, q) => { const r = Array(p.length + q.length - 1).fill(0); p.forEach((a, i) => q.forEach((b, j) => { r[i + j] += a * b; })); while (r.length > 1 && r[r.length - 1] === 0) r.pop(); return r; };

/* =====================================================================
   Formeln: lesen, auswerten, schön hinschreiben (Variable n)
   ===================================================================== */
const FUNKTIONEN = {sin:Math.sin, cos:Math.cos, tan:Math.tan, exp:Math.exp, ln:Math.log, lg:Math.log10,
                    sqrt:Math.sqrt, abs:Math.abs, sgn:Math.sign,
                    fak:k => (k<0 || !Number.isInteger(k)) ? NaN : k>170 ? NaN : [...Array(k)].reduce((a,_,i)=>a*(i+1),1)};
/* Lesen über technik/mathe/term.js (T_lies, streng: Komma nur zwischen Ziffern, „2 5“ ist ein Fehler).
   ausT bringt den T-Baum in die Form dieser Rechnung (num mit Namen e/π, keine Klammerknoten). */
function ausT(b){
  switch(b.t){
    case 'z': return b.name ? {t:'num', v:b.v, name:b.name} : {t:'num', v:b.v};
    case 'e': return {t:'num', v:Math.E, name:'e'};
    case 'x': return {t:'x'};
    case 'v': return {t:'folge'};
    case '()': return ausT(b.a);
    case 'neg': return {t:'neg', a:ausT(b.a)};
    case '+': case '-': case '*': case '/': case '^': return {t:b.t, a:ausT(b.a), b:ausT(b.b)};
    case 'fn':
      if(!(b.f in FUNKTIONEN)) throw new Error(b.f === 'cbrt' || b.f === 'fqrt' ? 'Dritte und vierte Wurzel bitte als Hochzahl, z. B. x^(1/3).' : `${b.f} kenne ich hier nicht.`);
      return {t:'fn', f:b.f, a:ausT(b.a)};
  }
  throw new Error('Das kann ich nicht lesen.');
}

function lies(text){
  const s = String(text).trim()
    .replace(/^\s*a\s*(_?\s*\(?\s*n\s*\+\s*1\s*\)?|\(\s*n\s*\+\s*1\s*\)|ₙ₊₁)\s*=/i,'')   // „aₙ₊₁ =“, „a_(n+1) =“ am Anfang
    .replace(/^\s*a\s*(_?\s*n|\(\s*n\s*\)|ₙ)\s*=/i,'')                                   // „aₙ =“, „a_n =“, „a(n) =“ am Anfang
    .replace(/a\s*_\s*\(?\s*n\s*\)?|a\s*\(\s*n\s*\)|aₙ/g, 'a');                              // aₙ im Term heißt kurz a
  if(!s.trim()) throw new Error('Bitte eine Folge eingeben, z. B. 1/n.');
  return vereinfache(ausT(T_lies(s, { variable: 'n', weitere: ['a'], fakultaet: true })));   // intern heißt die Variable x, aₙ ist „folge“
}

function werte(k){
  // liefert eine Funktion (n, aₙ) → Wert; aₙ braucht nur das rekursive Bildungsgesetz
  switch(k.t){
    case 'num': return () => k.v;
    case 'x': return (x) => x;
    case 'folge': return (x, v) => v;
    case 'neg': { const a = werte(k.a); return (x,v) => -a(x,v); }
    case '+': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)+b(x,v); }
    case '-': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)-b(x,v); }
    case '*': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)*b(x,v); }
    case '/': { const a = werte(k.a), b = werte(k.b); return (x,v) => a(x,v)/b(x,v); }
    case '^': { const a = werte(k.a), b = werte(k.b);
      return (x,v) => { const g = a(x,v), h = b(x,v);
        // (−8)^(1/3) usw.: bei negativer Basis nur ganze Exponenten
        return (g < 0 && !Number.isInteger(h)) ? NaN : Math.pow(g, h); }; }
    case 'fn': { const a = werte(k.a), f = FUNKTIONEN[k.f]; return (x,v) => f(a(x,v)); }
  }
}

const hatX = n => n.t==='x' || (n.a && hatX(n.a)) || (n.b && hatX(n.b));
const Z = v => ({t:'num', v});
const istZ = (n, v) => n.t==='num' && !n.name && (v===undefined || n.v===v);

function vereinfache(n){
  if(n.a) n = {...n, a:vereinfache(n.a)};
  if(n.b) n = {...n, b:vereinfache(n.b)};
  const {a, b} = n;
  switch(n.t){
    case 'neg':
      if(istZ(a)) return Z(-a.v);
      if(a.t==='neg') return a.a;

  /* g + k·qⁿ mit g ≠ 0 (z. B. 1 − (1/2)ⁿ): die Differenzen sind geometrisch */

  function erkenne(S){

  /* ---------- Eintauchzahl exakt: kleinstes n ≥ n0 mit |aₙ − g| < ε (Bedingung als ganze Zahlen, BigInt) ---------- */
  function kleinstes(n0, schaetz, gilt){

      T.mono.push(`$$a_{n+1} - a_{n} = \\dfrac{${lin(a, a + b)}}{${lin(c, c + d)}} - \\dfrac{${lin(a, b)}}{${lin(c, d)}}$$`);

  /* g + k·qⁿ: geometrisch (g = 0) und rekursiv affin */
