    else if (q.z < 0) T.mono.push(`$a_{n+1} - a_{n} = ${tq(k)} \\cdot ${tqK(q)}^{n} \\cdot ${tqK(qm1)}$: Weil $q = ${tq(q)}$ negativ ist, wechselt $${tqK(q)}^{n}$ in jedem Schritt das Vorzeichen – die Glieder springen abwechselnd über und unter $${tq(g)}$: **nicht monoton**.`);
    else { const steigt = (k.z > 0) === (qm1.z > 0);
      T.mono.push(`$$a_{n+1} - a_{n} = ${tq(k)} \\cdot ${tqK(q)}^{n} \\cdot ${tqK(qm1)}$$ Der Faktor $${tqK(q)}^{n}$ ist positiv, $${tq(k)}$ ist ${k.z > 0 ? 'positiv' : 'negativ'}, $q - 1 = ${tq(qm1)}$ ist ${qm1.z > 0 ? 'positiv' : 'negativ'}: Die Differenz ist ${steigt ? 'positiv' : 'negativ'}, die Folge ist **streng monoton ${steigt ? 'steigend' : 'fallend'}**.`); }
    // Grenzwert, Schranken, ε
    let N = null;
    if (konv){
      T.grenz.push(`Weil $|q| = ${tq(aq)} < 1$ ist, gilt $${tqK(q)}^{n} \\to 0$. Also $\\lim_{n \\to \\infty} a_{n} = ${tq(g)}$${g.z === 0 ? ' – eine **Nullfolge**' : ''}.`);
      const a0 = wert(n0), a1 = wert(n0 + 1);
      if (q.z > 0) T.schr.push(`Die Folge ist monoton und nähert sich $${tq(g)}$: $$${k.z > 0 ? `${tq(g)} < a_{n} \\le ${tq(a0)}` : `${tq(a0)} \\le a_{n} < ${tq(g)}`}$$ **Beschränkt**, mit $a_{${n0}} = ${tq(a0)}$ als ${k.z > 0 ? 'kleinster oberer' : 'größter unterer'} Schranke und dem Grenzwert $${tq(g)}$ auf der anderen Seite (nie erreicht).`);
      else { const hi = qw(a0) > qw(a1) ? [a0, n0] : [a1, n0 + 1], lo = qw(a0) > qw(a1) ? [a1, n0 + 1] : [a0, n0];
        T.schr.push(`Der Abstand $|a_{n} - ${tq(g)}| = ${tq(ak)} \\cdot ${tq(aq)}^{n}$ wird immer kleiner. Die Ausreißer nach oben und unten sind also die ersten beiden Glieder: $$${tq(lo[0])} \\le a_{n} \\le ${tq(hi[0])}$$ **Beschränkt**, kleinste obere Schranke $a_{${hi[1]}}$, größte untere Schranke $a_{${lo[1]}}$.`); }
      // |aₙ − g| = |k|·|q|ⁿ < ε  ⇔  |kz|·|qz|ⁿ·εn·qnⁿ… exakt:  |kz|·aqzⁿ·εn  <  εz·kn·aqnⁿ
      const gilt = n => B(ak.z) * potB(aq.z, n) * B(e.n) < B(e.z) * B(ak.n) * potB(aq.n, n);
      const schaetz = Math.log(qw(e) / qw(ak)) / Math.log(qw(aq));
      N = kleinstes(n0, schaetz, gilt);
      T.eps.push(`Gesucht: das kleinste $N$ mit $|a_{n} - g| < \\varepsilon$ für alle $n \\ge N$, hier $\\varepsilon = ${dez(e)}$:`);
      T.eps.push(`$$\\begin{aligned} ${tq(ak)} \\cdot ${tqK(aq)}^{n} &< ${dez(e)} \\\\ \\Leftrightarrow \\quad ${tqK(aq)}^{n} &< ${zahlTex(qw(e) / qw(ak), 6)} \\\\ \\Leftrightarrow \\quad n &> \\dfrac{\\ln(${zahlTex(qw(e) / qw(ak), 6)})}{\\ln(${tq(aq, false)})} \\approx ${zahlTex(schaetz, 4)} \\end{aligned}$$`);
      T.eps.push(`(Beim Teilen durch $\\ln(${tq(aq, false)}) < 0$ dreht sich das Zeichen.) **Eintauchzahl $N = ${N}$**: $|a_{${N}} - g| = ${zahlTex(qw(ak) * qw(aq) ** N, 6)} < ${dez(e)}$${N - 1 >= n0 ? `, aber $|a_{${N - 1}} - g| = ${zahlTex(qw(ak) * qw(aq) ** (N - 1), 6)} \\ge ${dez(e)}$` : ''}. Weil der Abstand mit jedem Schritt kleiner wird, bleiben alle späteren Glieder im Schlauch.`);
    } else if (aq.z === aq.n){                                                      // q = −1
      T.grenz.push(`Wegen $q = -1$ springt die Folge zwischen $${tq(wert(n0))}$ und $${tq(wert(n0 + 1))}$ hin und her: **divergent** (zwei Häufungswerte).`);
      T.schr.push(`Beschränkt: Es gibt nur die zwei Werte $${tq(wert(n0))}$ und $${tq(wert(n0 + 1))}$.`);
      T.eps.push('Kein Grenzwert – also kein ε-Schlauch.');
    } else {
      T.grenz.push(q.z > 0 ? `Weil $q = ${tq(q)} > 1$ ist, wächst $${tqK(q)}^{n}$ über jede Grenze: **bestimmt divergent**, $a_{n} \\to ${k.z > 0 ? '+' : '-'}\\infty$.` : `Weil $q = ${tq(q)} < -1$ ist, wächst der Betrag über jede Grenze, das Vorzeichen wechselt: **divergent**, ohne Grenzwert.`);
      T.schr.push(q.z > 0 ? `Nach ${k.z > 0 ? 'unten' : 'oben'} beschränkt durch $a_{${n0}} = ${tq(wert(n0))}$, nach ${k.z > 0 ? 'oben' : 'unten'} **unbeschränkt**.` : 'Nach oben und unten **unbeschränkt**.');
      T.eps.push('Kein Grenzwert – also kein ε-Schlauch.');
    }
    return { T, N, g: konv ? qw(g) : null, art: rek ? 'Bauart: rekursiv mit $a_{n+1} = q \\cdot a_{n} + c$, exakt gerechnet' : g.z ? 'Bauart: verschoben geometrisch, exakt gerechnet' : 'Bauart: geometrisch, exakt gerechnet' };
  }

  function potenzText(R, e, eingabe, alternierend){
    const { k, p, n0 } = R, ak = qAbs(k), T = { folge: [], mono: [], schr: [], grenz: [], eps: [] };
    const u = Math.abs(p.z), v = p.n, np = v === 1 ? (u === 1 ? 'n' : `n^{${u}}`) : v === 2 && u === 1 ? '\\sqrt{n}' : `n^{\\frac{${u}}{${v}}}`;
    const r = p.z < 0 ? `\\dfrac{${tq(ak, false)}}{${np}}` : (ak.z === ak.n ? np : `${tq(ak)} \\cdot ${np}`);
    const wertR = n => qw(ak) * Math.pow(n, qw(p));
    if (alternierend){
      T.folge.push(`Gegeben ist $a_{n} = ${eingabe}$ für $n \\ge ${n0}$: das Vorzeichen wechselt, der Betrag ist $|a_{n}| = ${r}$.`);
      T.mono.push(`Das Vorzeichen wechselt von Glied zu Glied – die Folge ist **nicht monoton**.`);
      T.grenz.push(`Der Betrag $|a_{n}| = ${r}$ geht gegen $0$, weil $${np}$ über jede Grenze wächst. Also $a_{n} \\to 0$: eine **Nullfolge** (mit wechselndem Vorzeichen).`);
      T.schr.push(`Der Betrag ist am Anfang am größten: $$-${zahlTex(wertR(n0), 6)} \\le a_{n} \\le ${zahlTex(wertR(n0), 6)}$$ **Beschränkt**. Genau: die Schranken sind die ersten beiden Glieder (eins positiv, eins negativ).`);
    } else {
      T.folge.push(`Gegeben ist $a_{n} = ${eingabe}$ für $n \\ge ${n0}$, also $a_{n} = ${k.z < 0 ? '-' : ''}${r}$.`);
      const w = p.z > 0;
      // Monotonie über den Quotienten: k kürzt sich, (n+1)/n > 1; die Fallunterscheidung (Vorzeichen der Glieder) steht im Text
      const pos = k.z > 0, kf = ak.z === ak.n ? (pos ? '' : '-') : `${tq(k)} \\cdot `, pt = tq(p, false), gross = w, steigt = pos === gross;
      T.mono.push(`Alle Glieder haben das Vorzeichen von $${tq(k)}$, sie sind ${pos ? 'positiv' : 'negativ'}. Darum vergleichen wir über den Quotienten:`
        + `$$\\dfrac{a_{n+1}}{a_{n}} = \\dfrac{${kf}(n+1)^{${pt}}}{${kf}n^{${pt}}} = \\left(\\dfrac{n+1}{n}\\right)^{${pt}}$$`
        + `Weil $\\dfrac{n+1}{n} > 1$ ist und die Hochzahl $${pt}$ ${w ? 'positiv' : 'negativ'} ist, ist der Quotient ${gross ? 'größer' : 'kleiner'} als $1$. `
        + (pos ? `Bei positiven Gliedern heißt das $a_{n+1} ${gross ? '>' : '<'} a_{n}$` : `Bei negativen Gliedern dreht sich das um: $|a_{n+1}| ${gross ? '>' : '<'} |a_{n}|$, also $a_{n+1} ${gross ? '<' : '>'} a_{n}$`)
        + ` – die Folge ist **streng monoton ${steigt ? 'steigend' : 'fallend'}**.`);
      if (w){ T.grenz.push(`$${np}$ wächst über jede Grenze: **bestimmt divergent**, $a_{n} \\to ${k.z > 0 ? '+' : '-'}\\infty$.`); T.schr.push(`Nach ${k.z > 0 ? 'unten' : 'oben'} beschränkt durch $a_{${n0}}$, nach ${k.z > 0 ? 'oben' : 'unten'} **unbeschränkt**.`); T.eps.push('Kein Grenzwert – also kein ε-Schlauch.'); return { T, N: null, g: null, art: 'Bauart: Potenz von n, exakt gerechnet' }; }
      T.grenz.push(`$${np}$ wächst über jede Grenze, also $a_{n} \\to 0$: eine **Nullfolge**.`);
      T.schr.push(`$$${k.z > 0 ? `0 < a_{n} \\le a_{${n0}} = ${zahlTex(wertR(n0), 6)}` : `${zahlTex(-wertR(n0), 6)} = a_{${n0}} \\le a_{n} < 0`}$$ **Beschränkt**; der Grenzwert $0$ wird nie erreicht.`);
    }
    // |aₙ| = |k| / n^(u/v) < ε  ⇔  nᵘ · (εz·kn)ᵛ > (kz·εn)ᵛ
    const gilt = n => potB(n, u) * B(e.z * ak.n) ** B(v) > B(ak.z * e.n) ** B(v);
    const schaetz = Math.pow(qw(ak) / qw(e), v / u);
    const N = kleinstes(n0, schaetz, gilt);
    T.eps.push(`Gesucht: das kleinste $N$ mit $|a_{n}| < \\varepsilon$ für alle $n \\ge N$, hier $\\varepsilon = ${dez(e)}$:`);
    T.eps.push(`$$\\begin{aligned} ${r} &< ${dez(e)} \\\\ \\Leftrightarrow \\quad ${np} &> \\dfrac{${tq(ak, false)}}{${dez(e)}} = ${zahlTex(qw(ak) / qw(e), 6)} \\\\ \\Leftrightarrow \\quad n &> ${v === 1 && u === 1 ? zahlTex(schaetz, 6) : `${v === 1 && u === 2 ? `\\sqrt{${zahlTex(qw(ak) / qw(e), 6)}}` : v === 1 && u === 3 ? `\\sqrt[3]{${zahlTex(qw(ak) / qw(e), 6)}}` : `${zahlTex(qw(ak) / qw(e), 6)}^{${v === 1 ? `\\frac{1}{${u}}` : `\\frac{${v}}{${u}}`}}`} \\approx ${zahlTex(schaetz, 4)}`} \\end{aligned}$$`);
    T.eps.push(`**Eintauchzahl $N = ${N}$**: $|a_{${N}}| = ${zahlTex(wertR(N), 6)} < ${dez(e)}$${N - 1 >= n0 ? `, aber $|a_{${N - 1}}| = ${zahlTex(wertR(N - 1), 6)} \\ge ${dez(e)}$` : ''}. Der Betrag wird mit jedem Schritt kleiner – alle späteren Glieder bleiben im Schlauch.`);
    return { T, N, g: 0, art: alternierend ? 'Bauart: wechselndes Vorzeichen mal Nullfolge, exakt gerechnet' : 'Bauart: Potenz von n, exakt gerechnet' };
  }

  function alternierendGebrochen(R, e, eingabe){                          // (−1)ⁿ · b/(c·n + d)
    const { b, c, d, n0 } = R.inner, ab = Math.abs(b), T = { folge: [], mono: [], schr: [], grenz: [], eps: [] };
    const r = `\\dfrac{${ab}}{${lin(c, d)}}`, wertR = n => ab / (c * n + d);
    T.folge.push(`Gegeben ist $a_{n} = ${eingabe}$ für $n \\ge ${n0}$: das Vorzeichen wechselt, der Betrag ist $|a_{n}| = ${r}$.`);
    T.mono.push('Das Vorzeichen wechselt von Glied zu Glied – die Folge ist **nicht monoton**.');
    T.grenz.push(`Der Betrag $|a_{n}| = ${r}$ geht gegen $0$, weil der Nenner über jede Grenze wächst. Also $a_{n} \\to 0$: eine **Nullfolge** (mit wechselndem Vorzeichen).`);
    T.schr.push(`Der Betrag ist am Anfang am größten: $$-${tq(Q(ab, c * n0 + d))} \\le a_{n} \\le ${tq(Q(ab, c * n0 + d))}$$ **Beschränkt**. Genau: die Schranken sind die ersten beiden Glieder (eins positiv, eins negativ).`);
    const gilt = n => B(ab) * B(e.n) < B(e.z) * B(c * n + d), grenzeN = Q(ab * e.n - d * e.z, c * e.z);
    const N = kleinstes(n0, qw(grenzeN) + 1, gilt);
    T.eps.push(`Gesucht: das kleinste $N$ mit $|a_{n}| < \\varepsilon$ für alle $n \\ge N$, hier $\\varepsilon = ${dez(e)}$:`);
    T.eps.push(`$$\\begin{aligned} ${r} &< ${dez(e)} \\\\ \\Leftrightarrow \\quad ${lin(c, d)} &> \\dfrac{${ab}}{${dez(e)}} = ${zahlTex(ab / qw(e), 6)} \\\\ \\Leftrightarrow \\quad n &> ${tq(grenzeN)}${grenzeN.n !== 1 ? ` \\approx ${zahlTex(qw(grenzeN), 4)}` : ''} \\end{aligned}$$`);
    T.eps.push(`**Eintauchzahl $N = ${N}$**: $|a_{${N}}| = ${tq(Q(ab, c * N + d), false)} < ${dez(e)}$${N - 1 >= n0 ? `, aber $|a_{${N - 1}}| = ${tq(Q(ab, c * (N - 1) + d), false)} \\ge ${dez(e)}$` : ''}. Der Betrag wird mit jedem Schritt kleiner – alle späteren Glieder bleiben im Schlauch.`);
    return { T, N, g: 0, art: 'Bauart: wechselndes Vorzeichen mal Nullfolge, exakt gerechnet' };
  }

  /* numerisch: dieselbe Gliederung, aus den berechneten Gliedern – ausdrücklich als Vermutung */
  function numerischText(S, e, eingabe){
    const A = S.A, G = A.grenz, sch = A.schranken, T = { folge: [], mono: [], schr: [], grenz: [], eps: [] }, n0 = A.def[0].n;
    T.folge.push(S.rek ? `Gegeben ist $a_{n+1} = ${eingabe}$ mit $a_{0} = ${zahlTex(S.f(0), 6)}$.` : `Gegeben ist $a_{n} = ${eingabe}$ für $n \\ge ${n0}$.`);
    T.folge.push('Für diese Folge kennt das Labor keine Bauart, die es exakt durchrechnen kann. Alles Folgende stützt sich auf die **berechneten Glieder** (alle bis $n = 1000$, Stichproben bis $n \\approx 1{,}3$ Mio.) – eine **begründete Vermutung, kein Beweis**.');
    T.folge.push('Die ersten Glieder: ' + A.def.slice(0, 4).map(t => `$a_{${t.n}} \\approx ${zahlTex(t.y, 6)}$`).join(', ') + ', …');
    T.mono.push(`Die Differenzen $a_{n+1} - a_{n}$ der berechneten Glieder zeigen: Die Folge ist vermutlich **${A.mono.text.replace(/\$/g, '')}**.`.replace(/n = (\d+)/, '$n = $1$'));
    const s = (w, bei, art) => w === null ? `nach ${art} **unbeschränkt**` : `${art === 'oben' ? 'kleinste obere' : 'größte untere'} Schranke $\\approx ${zahlTex(w, 6)}$${bei !== null ? ` (bei $n = ${bei}$)` : ''}`;
    T.schr.push(`Aus den berechneten Gliedern: ${s(sch.oben, sch.obenBei, 'oben')}, ${s(sch.unten, sch.untenBei, 'unten')}.`);
    T.grenz.push({ konv: () => `Die Glieder nähern sich vermutlich $g ${G.schoen && G.schoen.genau ? '= ' + G.schoen.tex : '\\approx ' + zahlTex(G.g, 6)}$${G.schoen && !G.schoen.genau ? ` (vermutlich $${G.schoen.tex}$)` : ''}: **konvergent**.`,
      zwei: () => `Die Glieder springen zwischen $\\approx ${zahlTex(G.werte[0], 6)}$ und $\\approx ${zahlTex(G.werte[1], 6)}$: **divergent** (zwei Häufungswerte).`,
      plus: () => '**Bestimmt divergent**, $a_{n} \\to +\\infty$ (die Glieder wachsen über jede berechnete Grenze).',
      minus: () => '**Bestimmt divergent**, $a_{n} \\to -\\infty$.', beide: () => '**Divergent**: der Betrag wächst, das Vorzeichen wechselt.',
      schwankt: () => '**Divergent**: die Glieder schwanken und kommen keinem Wert immer näher.', unklar: () => 'Dazu lässt sich aus den berechneten Gliedern **nichts Sicheres** sagen.' }[G.art]());
    let N = null;
    if (G.art === 'konv'){ N = abWann(A, qw(e));
      T.eps.push(N === null ? `Mit $\\varepsilon = ${dez(e)}$ liegen bis $n = 1000$ noch Glieder außerhalb des Schlauchs: $N > 1000$.`
        : `Mit $\\varepsilon = ${dez(e)}$ liegen ab **$N = ${N}$** alle berechneten Glieder (bis $n = 1000$) im Schlauch $|a_{n} - g| < \\varepsilon$ – beobachtet, nicht bewiesen.`); }
    else T.eps.push('Kein Grenzwert – also kein ε-Schlauch.');
    return { T, N, g: G.art === 'konv' ? G.g : null, art: 'numerisch: Vermutung aus den berechneten Gliedern', numerisch: true };
  }

  /* ---------- zusammenbauen ---------- */
  const TITEL = [['folge', 'Die Folge'], ['mono', 'Monotonie'], ['schr', 'Schranken'], ['grenz', 'Grenzwert'], ['eps', 'ε-Schlauch und Eintauchzahl']];
  function erzeuge(S){
    const e = S.epsQ || epsBruch(S.eps), eingabe = baumTex(S.baum);
    const R = erkenne(S);
    let E;
    if (R && R.art === 'gebrochen') E = gebrochenText(R, e, eingabe);
    else if (R && R.art === 'arithmetisch') E = arithmetischText(R, e, eingabe);
    else if (R && R.art === 'geometrisch') E = geoText(R, e, eingabe, false);
    else if (R && R.art === 'potenz') E = potenzText(R, e, eingabe, false);
    else if (R && R.art === 'rational') E = rationalText(R, e, eingabe) || numerischText(S, e, eingabe);
    else if (R && R.art === 'alternierend') E = R.inner.art === 'potenz' ? potenzText({ ...R.inner, n0: R.n0 }, e, eingabe, true) : alternierendGebrochen(R, e, eingabe);
    else if (R && R.art === 'affin'){
      const { q, c, a0 } = R, eins = Q(1);
      if (q.z === q.n){ const D = kgv(c.n, a0.n);                            // q = 1: aₙ = a₀ + c·n = (c·D·n + a₀·D)/D
        E = arithmetischText({ a: c.z * D / c.n, b: a0.z * D / a0.n, d: D, n0: 0 }, e, eingabe, true); }
      else { const g = qDiv(c, qSub(eins, q)), k = qSub(a0, g);
        E = k.z === 0 ? { T: { folge: [`Gegeben ist $a_{n+1} = ${eingabe}$ mit $a_{0} = ${tq(a0)}$. Der Start liegt schon auf dem Fixpunkt $g = ${tq(g)}$: Die Folge ist **konstant**.`], mono: ['Konstant.'], schr: ['Konstant, also beschränkt.'], grenz: [`Grenzwert $${tq(g)}$.`], eps: ['Alle Glieder liegen in jedem Schlauch.'] }, N: 0, g: qw(g), art: 'Bauart: rekursiv, konstant' }
          : geoText({ ...R, g, k, q, n0: 0 }, e, eingabe, true); }
    }
    else E = numerischText(S, e, eingabe);
    const kopf = S.rek ? `a_{n+1} = ${eingabe}` : `a_{n} = ${eingabe}`;
    return { kopf, abschnitte: TITEL.map(([k, t]) => ({ titel: t, absaetze: E.T[k] })), N: E.N, g: E.g, art: E.art, numerisch: !!E.numerisch, eps: e };
  }
  /* als Dokument für technik/rechnung/ – Fenster, .tex und Druck kommen von dort (ein Kopf für alle Rechnungen) */
  const alsDok = Rn => ({ titel: 'Rechnung zur Folge', formel: Rn.kopf, vermutung: Rn.numerisch, abschnitte: Rn.abschnitte, datei: 'folge_rechnung.tex',
    art: `${Rn.art}${Rn.numerisch ? ' – kein Beweis' : ''} · $\\varepsilon = ${dez(Rn.eps)}$` });
  const alsTex = Rn => RE.alsTex(alsDok(Rn)), alsHtml = Rn => RE.alsHtml(alsDok(Rn));
  return { erzeuge, alsDok, alsTex, alsHtml, erkenne, baumTex, alsBruch, epsBruch, Q };
})();

/* ε streng lesen: Dezimalzahl (Komma oder Punkt) oder Bruch, 0 < ε < 1 000 000. → { q (Bruch), v (Zahl) } oder null.
   Benutzt vom ε-Feld und von der Eingabehilfe. „1/100“ wird 0,01 – nicht still 1 wie früher mit parseFloat. */
function liesEps(t){
  if (/\d\s+[\d,.]|[,.]\s+\d/.test(String(t))) return null;              // streng wie qLies: „2 5“ ist nicht 25
  t = String(t).trim().replace(/\s+/g, '');
  let q = null, m;
  if ((m = t.match(/^(\d+)\/(\d+)$/))) q = RECHNUNG.Q(Number(m[1]), Number(m[2]) || NaN);
  else if ((m = t.match(/^(\d*)[.,]?(\d*)$/)) && /\d/.test(t)) { const nk = m[2] || ''; q = RECHNUNG.Q(Number((m[1] || '0') + nk), 10 ** nk.length); }
  if (!q || !Number.isFinite(q.z / q.n)) return null;
  const v = q.z / q.n;
  return v > 0 && v < 1e6 ? { q, v } : null;
}

const KURS = "Mathematik · Folgen";

function titelGraph(){
  const W = 250, H = 200, R = {l:14, r:10, o:14, u:14}, s = {xmin:0.3, xmax:12.7, ymin:0.8, ymax:2.15};
  const {px, py} = achsenSVG(s, W, H, R);
  let g = `<line class="grenzlinie" x1="${R.l}" y1="${py(1)}" x2="${W-R.r}" y2="${py(1)}"/>`;
  for(let n=1;n<=12;n++) g += punkt(px(n), py((n+1)/n), 5);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

<script>
const stage = document.getElementById('stage');
folien.forEach((f,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (f.klasse ? ' '+f.klasse : '');
  let html = '';
  if(!(f.klasse||'').split(' ').includes('titel')){
    html += `<header class="kopf"><img src="${LOGO}" alt=""><span class="schule">Montessori-Schule Landau</span><span class="kurs">${KURS}</span></header>`;
    if(f.h2) html += `<div class="titelzeile">${f.eyebrow?`<div class="eyebrow">${f.eyebrow}</div>`:''}<h2>${f.h2}</h2></div>`;

    html += `<div class="fuss"><span>${REIHE}</span><span>${i+1} / ${folien.length}</span></div>`;
  } else html = f.roh;
  el.innerHTML = html;
  stage.appendChild(el);

/* =====================================================================
   Das Folgenlabor
   ===================================================================== */
const BEISPIELE_REK = [
  ['0,5a + 1', '0', 'aₙ₊₁ = 0,5·aₙ + 1, a₀ = 0'],
  ['sqrt(2 + a)', '0', 'aₙ₊₁ = √(2 + aₙ), a₀ = 0'],
  ['(a + 2/a)/2', '1', 'aₙ₊₁ = (aₙ + 2/aₙ)/2, a₀ = 1 (Heron)'],
  ['a + 1/(n+1)^2', '0', 'aₙ₊₁ = aₙ + 1/(n+1)², a₀ = 0'],
  ['3,2a(1 - a)', '0,5', 'aₙ₊₁ = 3,2·aₙ·(1 − aₙ), a₀ = 0,5'],
  ['-a/2 + 3', '0', 'aₙ₊₁ = −aₙ/2 + 3, a₀ = 0'],
  ['2a', '1', 'aₙ₊₁ = 2·aₙ, a₀ = 1'],
  ['a + n', '0', 'aₙ₊₁ = aₙ + n, a₀ = 0'],
];
const BEISPIELE = [
  ['(n+1)/n', 'aₙ = (n + 1)/n'],
  ['(3n^2-1)/(n^2+2n)', 'aₙ = (3n² − 1)/(n² + 2n)'],
  ['1-(1/2)^n', 'aₙ = 1 − (1/2)ⁿ'],
  ['1/n', 'aₙ = 1/n'],
  ['(-1)^n/n', 'aₙ = (−1)ⁿ/n'],
  ['(-1)^n', 'aₙ = (−1)ⁿ'],
  ['(2n+1)/(n+3)', 'aₙ = (2n + 1)/(n + 3)'],
  ['(1+1/n)^n', 'aₙ = (1 + 1/n)ⁿ'],
  ['0,8^n', 'aₙ = 0,8ⁿ'],
  ['n^2', 'aₙ = n²'],
  ['sqrt(n)', 'aₙ = √n'],
  ['sin(n)/n', 'aₙ = sin(n)/n'],
  ['n/2^n', 'aₙ = n/2ⁿ'],
  ['2^n/n!', 'aₙ = 2ⁿ/n!'],
];
const labor = (function(){
  const B = id => document.getElementById(id);
  let W = 720, H = 440, R = {l:58, r:18, o:26, u:40};      // auf dem Handy schmaler, s. zeichne()
  const S = {rek:false, bis:30, eps:0.1, epsQ:{z:1, n:10}, zeige:{mono:false, schr:false, grenz:false, schlauch:false}};
  const eps = () => S.eps;
  function auswahlFuellen(){
    B('fAuswahl').innerHTML = '<option value="">Beispiel wählen …</option>' + (S.rek
      ? BEISPIELE_REK.map(([w,a0,t],k)=>`<option value="${k}">${t}</option>`)
      : BEISPIELE.map(([w,t])=>`<option value="${w}">${t}</option>`)).join('');
  }
  auswahlFuellen();
  const MAX_N = STICH[STICH.length-1] + 1;
  // rekursiv: a₀ gegeben, aₙ₊₁ = F(n, aₙ); einmal bis n ≈ 1,3 Mio. ausrechnen (dauert nur Millisekunden)
  function rekursiv(schritt, a0){                       // nicht F: das ist die Formel-Funktion (formel.js)
    const a = new Float64Array(MAX_N + 1).fill(NaN); a[0] = a0;
    for(let n=0; n<MAX_N; n++){ const w = schritt(n, a[n]); if(!isFinite(w)){ a[n+1] = w; break; } a[n+1] = w; }
    return n => (Number.isInteger(n) && n >= 0 && n <= MAX_N) ? a[n] : NaN;
  }
  const kommtVor = (k, t) => k.t===t || (k.a && kommtVor(k.a, t)) || (k.b && kommtVor(k.b, t));

  function setze(text){
    try{
      const baum = lies(text), fn = werte(baum);
      let f, n0;
      if(S.rek){
        const sb = lies(B('fStart').value);
        if(kommtVor(sb,'x') || kommtVor(sb,'folge')) throw new Error('Der Startwert a₀ muss eine Zahl sein.');
        const a0 = werte(sb)(0, 0); if(!isFinite(a0)) throw new Error('Der Startwert a₀ ist keine gültige Zahl.');
        f = rekursiv(fn, a0); n0 = 0;
      } else {
        if(kommtVor(baum,'folge')) throw new Error('aₙ kommt nur im rekursiven Bildungsgesetz vor. Oben auf „rekursiv“ umschalten.');
        const st = String(B('fStart').value).trim();                       // streng: „2,5“ oder „abc“ nicht still zu 2 bzw. 0
        if(!/^\d{1,2}$/.test(st) || +st > 20){ B('fStart').classList.add('falsch'); throw new Error('Der Startindex ist eine ganze Zahl von 0 bis 20.'); }
        B('fStart').classList.remove('falsch');
        f = n => fn(n); n0 = +st;
      }
      const A = analysiere(f, n0);
      if(A.fehler) throw new Error(A.fehler);
      S.text = text; S.baum = baum; S.f = f; S.A = A; S.n0 = n0;
      B('fFehler').textContent = '';
      auswertungSchreiben(); rechnungKnopf(); zeichne(); return true;
    }catch(e){ B('fFehler').textContent = e.message; return false; }
  }
  const z = (v) => zahlTex(v, 4);                          // LaTeX; Texte unten laufen durch M()
  const glied = (n) => `a_{${n}}`;
  function auswertungSchreiben(){
    const A = S.A, G = A.grenz, sch = A.schranken;
    const erste = A.def.slice(0, 4).map(t=>`${glied(t.n)} ${Math.abs(t.y - Math.round(t.y*1e4)/1e4) < 1e-12 ? '=' : '\\approx'} ${z(t.y)}`);   // je Glied eine Formel: die Zeile darf umbrechen
    B('fFormel').innerHTML = `<span class="klein" title="a(n) = ${schreibe(S.baum).replace(/<[^>]+>/g,'')}">${M(erste.map(t => `$${t}$`).join(', &ensp;') + ', &ensp;…')}</span>`;
    B('eMonoT').innerHTML = M(`Die Folge ist <strong>${A.mono.text}</strong>.`);
    const gTex = G.art==='konv' ? (G.schoen ? (G.schoen.genau ? G.schoen.tex : `${z(G.g)}`) : `\\approx ${zahlTex(G.g,6)}`) : '';
    const vermutlich = G.art==='konv' && G.schoen && !G.schoen.genau ? ` (vermutlich $${G.schoen.tex}$)` : '';
    const sText = (wert, bei, art) => wert===null ? `nach ${art} <strong>unbeschränkt</strong>`
      : `${art==='oben'?'kleinste obere':'größte untere'} Schranke $${bei!==null ? z(wert) + ' = ' + glied(bei) : (G.art==='konv' && Math.abs(wert-G.g)<1e-9 ? gTex : '\\approx '+z(wert))}$${bei===null && G.art==='konv' && Math.abs(wert-G.g)<1e-9 ? ' (der Grenzwert, wird nie erreicht)' : ''}`;
    B('eSchrT').innerHTML = M((sch.oben!==null && sch.unten!==null ? '<strong>Beschränkt.</strong> ' : '') + sText(sch.oben, sch.obenBei, 'oben') + ', ' + sText(sch.unten, sch.untenBei, 'unten') + '.'
      + (sch.beobachtet ? ' <span class="klein">(Beobachtet an den berechneten Gliedern.)</span>' : ''));
    B('eGrenzT').innerHTML = M({
      konv: () => `<strong>Konvergent</strong>, Grenzwert $\\lim_{n \\to \\infty} a_{n} = ${gTex}$${vermutlich}${G.g===0 ? ': eine <strong>Nullfolge</strong>' : ''}.<span id="eEps"></span>`,
      zwei: () => `<strong>Divergent.</strong> Die Folge springt zwischen $${z(G.werte[0])}$ und $${z(G.werte[1])}$ hin und her (zwei Häufungswerte).`,
      plus: () => `<strong>Divergent</strong>, wächst über jede Grenze: <strong>bestimmt divergent</strong>, $a_{n} \\to +\\infty$.`,
      minus: () => `<strong>Divergent</strong>, fällt unter jede Grenze: <strong>bestimmt divergent</strong>, $a_{n} \\to -\\infty$.`,
      beide: () => `<strong>Divergent</strong>, der Betrag wächst über jede Grenze, das Vorzeichen wechselt.`,
      schwankt: () => `<strong>Divergent</strong>: Die Glieder schwanken und kommen keinem Wert immer näher.`,
      unklar: () => `Dazu kann das Labor hier <strong>nichts Sicheres</strong> sagen (die Werte werden zu groß zum Rechnen).`,
    }[G.art]());
    B('fSchlauch').disabled = G.art !== 'konv';
    if(G.art !== 'konv') S.zeige.schlauch = false;
  }

  /* Rechnung nur, wo das Labor exakt rechnet – sonst kein Knopf, nur der Hinweis (Peter, 05.10.) */
  const HINWEIS = {
    exakt: 'Das Bild beruht auf allen Gliedern bis $n = 1000$ und Stichproben bis $n \\approx 1{,}3$ Mio. Die <strong>Rechnung</strong> beweist es exakt.',
    num: 'Diese Folge rechnet das Labor nicht exakt durch – das Bild beruht auf allen Gliedern bis $n = 1000$ und Stichproben bis $n \\approx 1{,}3$ Mio.' };
  function rechnungKnopf(){
    let exakt = false; try { exakt = !!S.A && !RECHNUNG.erzeuge(S).numerisch; } catch (e) { exakt = false; }
    B('fRechnung').hidden = !exakt; B('fHinweis').innerHTML = M(exakt ? HINWEIS.exakt : HINWEIS.num);
  }
  function zeichne(){
    // Handy: eigenes, schmales Diagramm statt verkleinertem (Achsenschrift bleibt lesbar)
    const handy = document.documentElement.classList.contains('handy');
    [W, H, R] = handy ? [360, 300, {l:46, r:10, o:22, u:36}] : [720, 440, {l:58, r:18, o:26, u:40}];
    B('plot').setAttribute('width', W); B('plot').setAttribute('height', H); B('plot').setAttribute('viewBox', `0 0 ${W} ${H}`);
    const A = S.A, G = A.grenz, sch = A.schranken, bis = Math.max(S.n0 + 4, S.bis);
    const pts = A.T.filter(t=>t.n <= bis && isFinite(t.y));
    let ys = pts.map(t=>t.y);
    if(G.art==='konv' && (S.zeige.grenz || S.zeige.schlauch)) ys.push(G.g);
    if(S.zeige.schr){ if(sch.oben!==null) ys.push(sch.oben); if(sch.unten!==null) ys.push(sch.unten); }
    if(S.zeige.schlauch) ys.push(G.g + eps(), G.g - eps());
    let ymin = Math.min(...ys), ymax = Math.max(...ys);
    if(ymax - ymin < 1e-9){ ymin -= 1; ymax += 1; }
    const pad = (ymax-ymin)*0.1; ymin -= pad; ymax += pad;
    const s = {xmin:S.n0 - 0.8, xmax:bis + 0.8, ymin, ymax};
    const {svg:achsen, px, py} = achsenSVG(s, W, H, R);
    let svg = `<clipPath id="flaeche"><rect x="${R.l}" y="${R.o}" width="${W-R.l-R.r}" height="${H-R.o-R.u}"/></clipPath>` + achsen;
    const L = R.l, Rr = W-R.r;
    let N = null;
    if(S.zeige.schlauch && G.art==='konv'){
      const e = eps(); N = abWann(A, e);
      svg += `<rect class="schlauch" x="${L}" y="${py(G.g+e)}" width="${Rr-L}" height="${py(G.g-e)-py(G.g+e)}"/>`;
      if(N !== null && N <= bis) svg += `<line class="abn" x1="${px(N)}" y1="${R.o}" x2="${px(N)}" y2="${H-R.u}"/><text class="abnt" x="${px(N)+6}" y="${R.o+16}">N = ${N}</text>`;
    }
    if(S.zeige.schr){
      if(sch.oben!==null) svg += `<line class="schranke" x1="${L}" y1="${py(sch.oben)}" x2="${Rr}" y2="${py(sch.oben)}"/><text class="schrt" x="${Rr-6}" y="${py(sch.oben)-6}" text-anchor="end">obere Schranke</text>`;
      if(sch.unten!==null) svg += `<line class="schranke" x1="${L}" y1="${py(sch.unten)}" x2="${Rr}" y2="${py(sch.unten)}"/><text class="schrt" x="${Rr-6}" y="${py(sch.unten)+16}" text-anchor="end">untere Schranke</text>`;
    }
    if((S.zeige.grenz || S.zeige.schlauch) && G.art==='konv')
      svg += `<line class="grenzlinie" x1="${L}" y1="${py(G.g)}" x2="${Rr}" y2="${py(G.g)}"/><text class="grenzt" x="${L+8}" y="${py(G.g)-7}">g = ${G.schoen ? G.schoen.text : zahlText(G.g,4)}</text>`;
    if(S.zeige.grenz && G.art==='zwei') G.werte.forEach(w=>{ svg += `<line class="grenzlinie" x1="${L}" y1="${py(w)}" x2="${Rr}" y2="${py(w)}"/><text class="grenzt" x="${L+8}" y="${py(w)-7}">Häufungswert ${z(w)}</text>`; });
    const r = pts.length > 80 ? 3.2 : pts.length > 40 ? 4.2 : 5.5;
    // nur Punkte, keine Verbindungslinien: eine Folge ist nur für natürliche Zahlen n definiert.
    // Monotonie: Punkt grün, wenn das Glied größer ist als das vorige, rot, wenn kleiner.
    const klasse = (t, k) => {
      if(S.zeige.schlauch && G.art==='konv' && Math.abs(t.y-G.g) >= eps()*(1-1e-9)) return 'draussen';
      if(S.zeige.mono && k > 0 && pts[k-1].n === t.n-1) return t.y > pts[k-1].y ? 'hoch' : t.y < pts[k-1].y ? 'runter' : 'gleich';
      return '';
    };
    svg += `<g clip-path="url(#flaeche)">` + pts.map((t,k)=>punkt(px(t.n), py(t.y), r, klasse(t,k))).join('') + '</g>';
    B('plot').innerHTML = svg;

    ['mono','schr','grenz'].forEach(k=>B('e'+k[0].toUpperCase()+k.slice(1)).classList.toggle('an', S.zeige[k] || (k==='grenz' && S.zeige.schlauch)));
    [['fMono','mono'],['fSchr','schr'],['fGrenz','grenz'],['fSchlauch','schlauch']].forEach(([id,k])=>B(id).classList.toggle('an', S.zeige[k]));
    B('fEps').disabled = B('fEpsW').disabled = !S.zeige.schlauch; B('fEpsName').style.opacity = B('fEpsW').style.opacity = S.zeige.schlauch ? 1 : .4;
    const ee = document.getElementById('eEps');
    if(ee) ee.innerHTML = S.zeige.schlauch ? M(N===null ? ` <br>$\\varepsilon = ${zahlTex(eps(),3)}$: $N > 1000$, bis $n = 1000$ liegen noch Glieder außerhalb.`
      : ` <br>$\\varepsilon = ${zahlTex(eps(),3)}$: Eintauchzahl $N = ${N}$, für alle $n \\ge ${N}$ gilt $|a_{n} - g| < \\varepsilon$.`) : '';
    B('labor').dataset.ab = N===null ? '' : N;
  }

  B('fZeichnen').onclick = ()=> setze(B('fEingabe').value);
  B('fEingabe').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); setze(B('fEingabe').value); } });
  B('fStart').addEventListener('change', ()=> setze(B('fEingabe').value));
  B('fAuswahl').onchange = ()=>{ const v = B('fAuswahl').value; if(v==='') return;
    if(S.rek){ const [w, a0] = BEISPIELE_REK[+v]; B('fEingabe').value = w; B('fStart').value = a0; setze(w); }
    else { B('fEingabe').value = v; setze(v); }
    B('fAuswahl').value = ''; };
  function modus(rek){
    S.rek = rek; B('fExpl').classList.toggle('an', !rek); B('fRek').classList.toggle('an', rek);
    B('fLabel').innerHTML = F(rek ? 'a_{n+1} =' : 'a_{n} =');
    B('fStartName').innerHTML = rek ? F('a_{0} =') : 'ab ' + F('n =');
    auswahlFuellen();
    const [w, a0] = rek ? BEISPIELE_REK[0] : ['(n+1)/n', '1'];
    B('fEingabe').value = w; B('fStart').value = a0; setze(w);
  }
  B('fExpl').onclick = ()=> modus(false);
  B('fRek').onclick = ()=> modus(true);
  B('fStart').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); setze(B('fEingabe').value); } });
  const schalter = (k) => ()=>{ S.zeige[k] = !S.zeige[k]; zeichne(); };
  B('fMono').onclick = schalter('mono'); B('fSchr').onclick = schalter('schr'); B('fGrenz').onclick = schalter('grenz'); B('fSchlauch').onclick = schalter('schlauch');
  B('fBis').addEventListener('input', ()=>{ S.bis = +B('fBis').value; B('fBisW').textContent = S.bis; zeichne(); });
  // ε: Schieber (0,001 bis 1 in Zehntel-Zehnerpotenzen) oder frei eintippen
  const epsText = v => zahlText(v, 6);
  B('fEps').addEventListener('input', ()=>{ S.eps = +(10**(-B('fEps').value/10)).toPrecision(2); S.epsQ = RECHNUNG.epsBruch(S.eps); B('fEpsW').value = epsText(S.eps); B('fEpsW').classList.remove('falsch'); rechnungKnopf(); zeichne(); });
  const epsTippen = ()=>{
    const L = liesEps(B('fEpsW').value);                                  // streng: Dezimalzahl oder Bruch, sonst Feld rot
    if(!L){ B('fEpsW').classList.add('falsch'); return; }
    const v = L.v; B('fEpsW').classList.remove('falsch'); S.eps = v; S.epsQ = L.q;
    B('fEps').value = Math.max(0, Math.min(30, Math.round(-10*Math.log10(v))));
    rechnungKnopf(); zeichne();
  };
  B('fEpsW').addEventListener('change', epsTippen);
  B('fEpsW').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); epsTippen(); } });
  window.addEventListener('handy-wechsel', ()=>{ if(S.A) zeichne(); });
  B('fRechnung').onclick = ()=>{ if(S.A) RECHNUNG_FENSTER.oeffne(S); };
  setze(B('fEingabe').value);
  return {S, setze};
})();

/* =====================================================================
   Folien-Navigation
   ===================================================================== */
const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;
function frags(n){
  return [...slides[n].querySelectorAll('.frag')]
    .map((el,k)=>({el, ord: el.dataset.schritt ? parseFloat(el.dataset.schritt) : k+1, k}))
    .sort((a,b)=> a.ord - b.ord || a.k - b.k).map(x=>x.el);
}
function zeige(n, alleFragmente=false){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('aktiv', k===i));
  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));
  document.getElementById('zaehler').textContent = (i+1)+' / '+slides.length;
  document.getElementById('fortschritt').style.width = ((i+1)/slides.length*100)+'%';
  try{ history.replaceState(null, '', '#'+(i+1)); }catch(e){}
}
function vor(){ const fr = frags(i); if(schritt < fr.length){ fr[schritt].classList.add('an'); schritt++; return; } if(i < slides.length-1) zeige(i+1); }
function zurueck(){ if(schritt > 0){ schritt--; frags(i)[schritt].classList.remove('an'); return; } if(i > 0) zeige(i-1, true); }
function skalieren(){ const s = Math.min((innerWidth-40)/1280, (innerHeight-40)/720); stage.style.transform = 'scale('+s+')'; }
addEventListener('resize', skalieren);
const ueb = document.getElementById('uebersicht'), gitter = ueb.querySelector('.gitter');
folien.forEach((f,k)=>{ const d = document.createElement('div'); d.className = 'mini';
  d.innerHTML = `<div class="nr">FOLIE ${k+1}</div><div class="tt">${f.h2 || f.titel}</div>`;
  d.onclick = ()=>{ ueb.classList.remove('an'); zeige(k); }; gitter.appendChild(d); });
addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input, select, textarea')) return;   // beim Tippen der Funktion nicht blättern
  if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ e.preventDefault(); zurueck(); }
  else if(e.key==='Home'){ zeige(0); }
  else if(e.key==='End'){ zeige(slides.length-1, true); }
  else if(e.key==='o'||e.key==='O'){ ueb.classList.toggle('an'); }
  else if(e.key==='Escape'){ ueb.classList.remove('an'); }
  else if(e.key==='f'||e.key==='F'){ vollbild(); }
});
function vollbild(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
}
let wischX = null, wischY = null;
stage.addEventListener('touchstart', e=>{ if(e.target.closest('.interaktiv')){ wischX = null; return; } wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e=>{ if(wischX === null) return; const dx = e.changedTouches[0].clientX - wischX, dy = e.changedTouches[0].clientY - wischY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? vor : zurueck)(); wischX = null; });
document.getElementById('uebBtn').onclick = ()=> ueb.classList.toggle('an');
document.getElementById('vor').onclick = vor;
document.getElementById('zurueck').onclick = zurueck;
stage.addEventListener('click', e=>{ if(!e.target.closest('a, button, input, select, .interaktiv')) vor(); });
skalieren();
zeige(parseInt(location.hash.slice(1)) - 1 || 0);
</script>
<script data-handy="technik/handy/handy.js">
/* =====================================================================
   HANDY-SCHICHT — schaltet die Handy-Ansicht, wenn die Bühne 1280 × 720 zu stark
   verkleinert würde (Maßstab unter 0,62: Handy hoch und quer, Tablet hochkant).
   Muss NACH der Folien-Navigation des Rahmens stehen (nutzt stage, zeige, skalieren).
   Meldet Wechsel mit dem Ereignis „handy-wechsel", damit Rechner neu zeichnen können.
   ===================================================================== */
(function(){
  const html = document.documentElement;
  const istHandy = () => Math.min(innerWidth / 1280, innerHeight / 720) < 0.62;
  let vorher = null;
  function pruefen(){
    const h = istHandy();
    html.classList.toggle('handy', h);
    if (h) stage.style.transform = 'none';
    else if (typeof skalieren === 'function') skalieren();
    if (h !== vorher){ vorher = h; window.dispatchEvent(new CustomEvent('handy-wechsel', { detail: h })); }
  }
  addEventListener('resize', pruefen);
  addEventListener('orientationchange', () => setTimeout(pruefen, 200));
  pruefen();

  // Neue Folie (und nur dann, nicht bei jedem Knopf): nach oben scrollen
  const wach = new MutationObserver((liste) => {
    if (!html.classList.contains('handy')) return;
    if (liste.some((m) => m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))) window.scrollTo(0, 0);
  });
  document.querySelectorAll('.slide').forEach((f) => wach.observe(f, { attributes: true, attributeFilter: ['class'], attributeOldValue: true }));

  // Beim Scrollen tippt man oft auf Text: auf dem Handy blättert ein Tipp nicht weiter
  stage.addEventListener('click', (e) => {
    if (html.classList.contains('handy') && !e.target.closest('a, button, input, select, textarea, label, .interaktiv')) e.stopPropagation();
  }, true);
})();
</script><!-- /HANDY-SCHICHT -->
