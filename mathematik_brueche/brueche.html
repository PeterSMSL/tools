<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Brüche am Kreis sehen, dann addieren, subtrahieren, multiplizieren und dividieren: eigenes Ergebnis prüfen, Lösungsweg Schritt für Schritt.">
<title>Bruchrechnung · Mathematik</title>
<style>
:root{
  --blau:#136EA9;
  --blau-d:#0C4E79;
  --blau-h:#3E93CE;
  --blau-pastell:#E3F0F9;
  --orange:#F3A92F;
  --orange-d:#D98908;
  --orange-pastell:#FDF0DA;
  --tinte:#16232E;
  --grau:#5B6A76;
  --linie:#D8E2EA;
  --papier:#FFFFFF;
  --bg:#EAF1F6;
  --rot:#C62828;
  --gruen:#2E7D32;
  --stage-w:1280px;
  --stage-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:"Sansation","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

#stage{position:relative;width:var(--stage-w);height:var(--stage-h);transform-origin:center center;flex:none}
.slide{
  position:absolute;inset:0;
  background:var(--papier);
  border-radius:14px;
  box-shadow:0 18px 50px rgba(12,78,121,.22), 0 2px 6px rgba(12,78,121,.12);
  overflow:hidden;
  padding:86px 62px 58px;
  opacity:0;visibility:hidden;
  transform:translateY(14px) scale(.995);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
  display:flex;flex-direction:column;
}
.slide.aktiv{opacity:1;visibility:visible;transform:none}

.kopf{
  position:absolute;top:0;left:0;right:0;height:58px;
  background:linear-gradient(100deg,var(--blau-d) 0%,var(--blau) 55%,var(--blau-h) 100%);
  display:flex;align-items:center;gap:14px;
  padding:0 22px 0 18px;
  color:#fff;
  z-index:5;
}
.kopf::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 34%,#F6C46E 34%,#F6C46E 100%);
}
.kopf img{height:42px;width:auto;background:#fff;border-radius:11px;padding:3px 6px;box-shadow:0 3px 10px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.5)}
.kopf .schule{font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.95}
.kopf .kurs{
  margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  padding:5px 12px;border-radius:999px;
}

h1{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.015em;color:var(--blau-d)}
h3{font-size:20px;font-weight:750;color:var(--blau-d)}
p,li{font-size:19px;line-height:1.5;color:var(--tinte)}
.klein{font-size:16px;line-height:1.45;color:var(--grau)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--orange-d);margin-bottom:10px}
.titelzeile{margin-bottom:26px;flex:none}
.titelzeile h2::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--orange);margin-top:12px}
.slide.kompakt .titelzeile{margin-bottom:14px}
.slide.kompakt h2{font-size:32px}
.slide.kompakt h2::after{margin-top:8px;height:4px;width:52px}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center}
.slide.oben .inhalt{justify-content:flex-start}
strong{color:var(--blau-d)}

.raster{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.karte{background:var(--papier);border:1px solid var(--linie);border-radius:12px;padding:20px 22px;box-shadow:0 2px 0 rgba(19,110,169,.05);display:flex;flex-direction:column;gap:8px}
.karte.blau{background:var(--blau-pastell);border-color:#C4DFF2}
.karte.orange{background:var(--orange-pastell);border-color:#F3DCAF}
.karte.voll{background:linear-gradient(150deg,var(--blau-d),var(--blau));border:none;color:#fff}
.karte.voll h3,.karte.voll strong{color:#fff}
.karte.voll p,.karte.voll li{color:rgba(255,255,255,.92)}
.karte.voll .hl{color:var(--orange)}
.karte p,.karte li{font-size:17px;line-height:1.45}

.nummer{width:38px;height:38px;flex:none;border-radius:10px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.nummer.b{background:var(--blau)}
.zeile{display:flex;gap:16px;align-items:flex-start}

.fuss{position:absolute;left:62px;right:62px;bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--grau);border-top:1px solid var(--linie);padding-top:9px}

/* Formeln */
.formel{font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:normal;white-space:nowrap}
.formel i{font-style:italic}
.bruch{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.15}
.bruch > span:first-child{border-bottom:2px solid currentColor;padding:0 4px 2px}
.bruch > span:last-child{padding:2px 4px 0}
.antwort{border-top:1px dashed #E3C489;padding-top:8px;margin-top:2px;color:var(--tinte)!important}
.karte.voll .antwort{border-top-color:rgba(255,255,255,.35);color:#fff!important}

/* ---------- Titel und Schluss ---------- */
.slide.titel{
  padding:0;
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(243,169,47,.20), transparent 62%),
    linear-gradient(140deg,#0A4470 0%, var(--blau-d) 40%, var(--blau) 100%);
  color:#fff;display:grid;grid-template-columns:1.35fr .65fr;
}
.slide.titel .links{padding:74px 56px 56px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.slide.titel .rechts{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.16);position:relative;z-index:2}
.slide.titel .logokachel{background:#fff;border-radius:38px;padding:28px 30px;box-shadow:0 20px 46px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
.slide.titel .logokachel img{width:168px;display:block}
.slide.titel h1{color:#fff}
.slide.titel .eyebrow{color:var(--orange)}
.slide.titel .unter{font-size:23px;color:rgba(255,255,255,.9);margin-top:18px;max-width:640px}
.slide.titel .meta{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.slide.titel .meta span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);padding:8px 16px;border-radius:999px;font-size:15.5px;font-weight:600}
.slide.titel .balken{height:6px;width:110px;background:var(--orange);border-radius:4px;margin-bottom:26px}
.karogrund{position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:40px 40px}
.titelgraph svg{display:block}
.slide.schluss{grid-template-columns:1fr}
.slide.schluss .links{align-items:center;text-align:center;padding:60px 120px}
.slide.schluss img{width:64px;margin-bottom:34px;background:rgba(255,255,255,.92);border-radius:50%;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.zitatgross{font-size:40px;line-height:1.28;font-weight:700;letter-spacing:-.015em;color:#fff;max-width:960px}
.zitatgross .strich{display:block;width:56px;height:5px;background:var(--orange);border-radius:3px;margin:26px auto 20px}
.quelle{font-size:18px;font-weight:600;color:var(--orange);letter-spacing:.06em}

/* ---------- Graphen (SVG) ---------- */
svg .gitter line{stroke:#E4ECF2;stroke-width:1}
svg .achse{stroke:#6B7C89;stroke-width:1.6}
svg .tick{font-size:12px;fill:var(--grau);font-weight:600}
svg .kurve-f{fill:none;stroke:var(--blau);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
svg .kurve-a{fill:none;stroke:var(--gruen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg .sekante{stroke:var(--orange-d);stroke-width:2.6}
svg .dreieck{fill:rgba(243,169,47,.16);stroke:var(--orange-d);stroke-width:1.8;stroke-dasharray:5 4}
svg .dlabel{font-size:15px;font-weight:800;fill:var(--orange-d)}
svg .band{fill:rgba(243,169,47,.13)}
svg .bandrand{stroke:var(--orange);stroke-width:1.5;stroke-dasharray:4 4}
svg .lot{stroke:var(--orange-d);stroke-width:1.5;stroke-dasharray:3 4}
svg .punkt{fill:var(--orange);stroke:#fff;stroke-width:2}
svg .kreuz{stroke:var(--orange-d);stroke-width:3;stroke-linecap:round}
svg .kreuz.neu{animation:punktrein .45s ease;transform-box:fill-box;transform-origin:center}
@keyframes punktrein{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
svg .verbindung{fill:none;stroke:var(--orange);stroke-width:1.6;stroke-dasharray:5 4}
svg .kreuz.alt{stroke:#F2B64F;stroke-width:2;opacity:.75}
svg .kreuz.draussen{stroke:#9FB3C3}
svg .glied{fill:var(--orange);stroke:#fff;stroke-width:1.6}
svg .glied.draussen{fill:#9FB3C3}
svg .achsname{font-size:15px;font-weight:800;fill:var(--blau-d);font-style:italic}
svg .grenzlinie{stroke:var(--gruen);stroke-width:2.4;stroke-dasharray:8 6}
svg .grenzt{font-size:15px;font-weight:800;fill:var(--gruen)}
svg .schranke{stroke:var(--blau-d);stroke-width:1.8;stroke-dasharray:3 5}
svg .schrt{font-size:13px;font-weight:700;fill:var(--blau-d)}
svg .schlauch{fill:rgba(243,169,47,.16);stroke:rgba(217,137,8,.5);stroke-width:1}
svg .abn{stroke:var(--orange-d);stroke-width:2;stroke-dasharray:4 4}
svg .abnt{font-size:14px;font-weight:800;fill:var(--orange-d)}
svg .glied.hoch{fill:var(--gruen)}
svg .glied.runter{fill:var(--rot)}
svg .glied.gleich{fill:var(--grau)}
.labspalte .knopfleiste .knopf.hell{font-size:14px;padding:6px 9px}
.labspalte .knopfleiste{gap:5px;flex-wrap:nowrap}
.erg{border:1px solid var(--linie);border-radius:11px;padding:5px 12px;background:#fff;transition:background .3s,border-color .3s}
.erg h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);font-weight:800;margin-bottom:0}
.erg p{font-size:14.5px;line-height:1.35;transition:filter .3s,opacity .3s}
.erg:not(.an) p{filter:blur(5px);opacity:.45;user-select:none}
.erg.an{background:var(--blau-pastell);border-color:#C4DFF2}
.erg .klein{font-size:13px}
.startname{font-size:14px;font-weight:700;color:var(--grau);white-space:nowrap}
.modus{display:flex;flex:none}
.modus .knopf{font-size:14px;padding:5px 10px;border-radius:0}
.modus .knopf:first-child{border-radius:999px 0 0 999px}
.modus .knopf:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
.hinweis{font-size:12.5px;line-height:1.4;color:var(--grau)}
svg .altlinie{fill:none;stroke:#F6C46E;stroke-width:1.3;stroke-dasharray:4 4;opacity:.7}
svg .legende{font-size:14px;font-weight:700;fill:var(--tinte)}
svg .legbox{fill:rgba(255,255,255,.9);stroke:var(--linie)}

/* ---------- Labor ---------- */
.labor{display:grid;grid-template-columns:720px 1fr;gap:18px;align-items:start}
.plotrahmen{position:relative;border:1px solid var(--linie);border-radius:12px;overflow:hidden;background:#fff;touch-action:none;cursor:grab}
.plotrahmen.zieht{cursor:grabbing}
.plotrahmen svg{display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.bereich{display:flex;align-items:center;gap:10px;margin-top:10px;padding:6px 14px;background:var(--orange-pastell);border:1px solid #F3DCAF;border-radius:12px}
.bereich .bt{font-size:15px;font-weight:700;color:var(--grau);white-space:nowrap}
.bereich b{font-size:17px;color:var(--orange-d);min-width:34px;font-variant-numeric:tabular-nums}
.bereich input[type=text]{width:74px;flex:none;font:inherit;font-size:16px;font-weight:800;color:var(--orange-d);border:1px solid #E3C489;border-radius:8px;padding:3px 7px;background:#fff;font-variant-numeric:tabular-nums}
.bereich input[type=text].falsch{border-color:var(--rot);color:var(--rot)}
.bereich input[type=range]{flex:1;accent-color:var(--orange-d);min-width:0;height:28px}
.labspalte{display:flex;flex-direction:column;gap:9px;min-width:0}
.labspalte .knopf{font-size:15px;padding:7px 13px}
.eingabe{display:flex;flex-direction:column;gap:7px;background:var(--blau-pastell);border:1px solid #C4DFF2;border-radius:12px;padding:10px 12px}
.eingabe .reihe{display:flex;gap:8px;align-items:center}
.eingabe label{font-weight:800;color:var(--blau-d);font-size:17px;font-family:"Cambria Math","Cambria","Times New Roman",serif;font-style:italic;white-space:nowrap}
.eingabe input,.eingabe select{font:inherit;font-size:16px;border:1px solid #9FC3DE;border-radius:8px;padding:6px 9px;background:#fff;color:var(--tinte);min-width:0}
.eingabe input{flex:1;font-family:ui-monospace,Consolas,monospace}
.eingabe select{flex:1}
.fehler{font-size:14px;font-weight:700;color:var(--rot);min-height:0}
.formelzeile{font-size:17px;color:var(--tinte);line-height:1.5}
.formelzeile .fx{color:var(--blau);font-weight:700}
.formelzeile .ax{color:var(--gruen);font-weight:700}
.laborstatus{font-size:15px;font-weight:700;color:var(--blau-d)}
.laborstatus .sub{font-weight:600;color:var(--grau)}
table.wt{border-collapse:separate;border-spacing:0 3px;width:100%;font-size:13px}
table.wt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grau);text-align:right;padding:0 6px;font-weight:800}
table.wt th:first-child{text-align:left}
table.wt td{background:#F6FAFD;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--linie);border-bottom:1px solid var(--linie)}
table.wt td:first-child{text-align:left;border-left:1px solid var(--linie);border-radius:7px 0 0 7px}
table.wt td:last-child{border-right:1px solid var(--linie);border-radius:0 7px 7px 0;font-weight:800;color:var(--orange-d)}
table.wt tr.aktuell td{background:var(--orange-pastell);border-color:#F3DCAF}
table.wt .leer td{background:none;border:none;color:var(--grau);text-align:left;font-weight:600}

/* ---------- Knöpfe ---------- */
.interaktiv{cursor:default}
.knopfleiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.knopf{font:inherit;font-size:15.5px;font-weight:700;border:none;border-radius:999px;padding:8px 15px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 2px 0 rgba(12,78,121,.25);transition:background .15s, opacity .15s, transform .1s}
.knopf:hover{background:var(--blau-d)}
.knopf:active{transform:translateY(1px)}
.knopf.o{background:var(--orange);color:#3A2500}
.knopf.o:hover{background:var(--orange-d)}
.knopf.g{background:var(--gruen)}
.knopf.hell{background:var(--blau-pastell);color:var(--blau-d);box-shadow:none;border:1px solid #C4DFF2}
.knopf.hell:hover{background:#D2E7F6}
.knopf.hell.an{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.knopf.rund{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.knopf:disabled{opacity:.35;cursor:not-allowed}

/* Schritte, Tabelle */
.schritte{display:flex;flex-direction:column;gap:9px}
.schritt{display:flex;gap:14px;align-items:center;background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:9px 14px}
.schritt .nummer{width:34px;height:34px;font-size:17px}
.schritt p{font-size:18px;line-height:1.35}
.schritt.wichtig{background:var(--orange-pastell);border-color:#F3DCAF}
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.tab th{background:var(--blau-d);color:#fff;text-align:right;padding:9px 16px;font-size:14px;letter-spacing:.06em}
table.tab th:first-child{border-top-left-radius:10px;text-align:left}
table.tab th:last-child{border-top-right-radius:10px}
table.tab td{padding:8px 16px;border-bottom:1px solid var(--linie);text-align:right;font-variant-numeric:tabular-nums}
table.tab td:first-child{text-align:left}
table.tab tr:nth-child(even) td{background:#F6FAFD}
table.tab td.z{font-weight:800;color:var(--orange-d)}

.frag{opacity:0;transform:translateY(10px);transition:opacity .34s ease,transform .34s ease}
.frag.an{opacity:1;transform:none}
svg .frag{transform:none}

#fortschritt{position:fixed;left:0;top:0;height:4px;background:var(--orange);width:0;transition:width .3s ease;z-index:50}
#nav{position:fixed;right:18px;bottom:14px;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:1px solid var(--linie);border-radius:999px;padding:5px 8px;box-shadow:0 4px 14px rgba(12,78,121,.14)}
#nav button{border:none;background:var(--blau-pastell);color:var(--blau-d);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:800}
#nav button:hover{background:var(--blau);color:#fff}
#zaehler{font-size:13px;font-weight:700;color:var(--grau);padding:0 6px;min-width:52px;text-align:center}
#uebersicht{position:fixed;inset:0;background:rgba(10,68,112,.96);z-index:100;display:none;padding:34px;overflow:auto}
#uebersicht.an{display:block}
#uebersicht h4{color:#fff;font-size:18px;margin-bottom:18px;font-weight:700}
#uebersicht .gitter{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#uebersicht .mini{background:#fff;border-radius:8px;padding:14px;cursor:pointer;border:3px solid transparent;min-height:78px}
#uebersicht .mini:hover{border-color:var(--orange)}
#uebersicht .mini .nr{font-size:11px;font-weight:800;color:var(--orange-d)}
#uebersicht .mini .tt{font-size:14px;font-weight:700;color:var(--blau-d);margin-top:3px;line-height:1.25}

@media print{
  @page{size:A4 landscape;margin:0}
  body{display:block;background:#fff;overflow:visible}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{position:relative;visibility:visible;opacity:1;transform:none;width:1280px;height:720px;page-break-after:always;box-shadow:none;border-radius:0}
  .frag{opacity:1!important;transform:none!important}
  #nav,#fortschritt,#uebersicht{display:none!important}
}
/* ---------- Bruchrechner ---------- */
:root{
  /* Inhaltsfarben — bedeuten etwas, wandern nie */
  --b1:#3A8FD6;          /* erster Bruch */
  --b2:#EE9A2E;          /* zweiter Bruch */
  --erg:#7A57C7;         /* Ergebnis */
  --erg-h:#E9E2F8;
  --weg:#D0493F;         /* weggenommen / Rest */
  --dein:#8A97A3;        /* dein Ergebnis zum Vergleich */
  --richtig:#2E7D32;
}
/* Bruch-Eingabe: zwei Felder übereinander mit Bruchstrich */
.bf{display:inline-flex;flex-direction:column;align-items:center;gap:3px;vertical-align:middle}
.bf input{width:58px;font:inherit;font-size:22px;font-weight:800;text-align:center;color:var(--blau-d);
  border:2px solid #C4DFF2;border-radius:10px;padding:2px 4px;background:#fff;font-variant-numeric:tabular-nums}
.bf input:focus{outline:none;border-color:var(--blau)}
.bf input.falsch{border-color:var(--weg);color:var(--weg)}
.bf .strich{width:64px;height:3px;border-radius:2px;background:var(--tinte)}
.bf.b1 input{color:var(--b1)} .bf.b2 input{color:#B86E0C}
.bf.dein input{border-color:#CDB8F0;background:var(--erg-h);color:var(--erg)}
.bf.dein.ok input{border-color:var(--richtig);background:#E6F3E7;color:var(--richtig)}
.bf.dein.nein input{border-color:var(--weg);background:#FBE6E4;color:var(--weg)}
.op{font-size:32px;font-weight:800;color:var(--tinte);margin:0 10px}

.aufgabe{display:flex;align-items:center;gap:6px;background:var(--blau-pastell);border:1px solid #C4DFF2;border-radius:14px;padding:6px 16px}
.aufgabe .knopfleiste{margin-left:auto;gap:8px}
.rueck{min-height:24px;margin:5px 2px 5px;font-size:17px;font-weight:700;color:var(--grau)}
.rueck.ok{color:var(--richtig)} .rueck.fast{color:var(--orange-d)} .rueck.nein{color:var(--weg)}
.zwei{display:grid;grid-template-columns:640px minmax(0,1fr);gap:16px;align-items:start}
.panel{border:1px solid var(--linie);border-radius:12px;background:#fff;padding:8px 12px;min-height:290px}
.panel h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.panel h3 .knopf{margin-left:auto;font-size:13.5px;padding:5px 11px;letter-spacing:0;text-transform:none}
.schritte2{display:flex;flex-direction:column;gap:5px}
.s2{display:flex;gap:8px;align-items:center;border-radius:10px;padding:2px 8px;background:#F6FAFD;border:1px solid var(--linie);font-size:17px}
.s2 .nummer{width:28px;height:28px;font-size:15px;border-radius:8px;flex:none}
.s2 .was{font-size:13px;font-weight:700;color:var(--grau);min-width:104px}
.s2.letzt{background:var(--erg-h);border-color:#CDB8F0}
.s2[hidden]{display:none}
.rechnung{font-family:"Cambria Math","Cambria","Times New Roman",serif;font-size:17px;display:flex;align-items:center;flex-wrap:nowrap;gap:2px;white-space:nowrap}
.rechnung .bruch{font-size:16px;line-height:1.1}
.rechnung .hin{font-family:inherit;font-size:13px;color:var(--grau);margin-left:6px}
.leerhinweis{color:var(--grau);font-size:15px;padding:30px 10px;text-align:center}
.kreisbild svg{display:block}
svg .teil{stroke:#fff;stroke-width:1.2}
svg .teil.leer{fill:#F1F4F7;stroke:#C9D3DB}
svg .teil.b1{fill:var(--b1)} svg .teil.b2{fill:var(--b2)} svg .teil.erg{fill:var(--erg)}
svg .teil.hell2{fill:#F7D6A8} svg .teil.dein{fill:var(--dein)}
svg .teil.weg{fill:#fff;stroke:var(--weg);stroke-width:1.6;stroke-dasharray:3 3}
svg .teil.g0{fill:var(--b2)} svg .teil.g1{fill:#C77712} svg .teil.rest{fill:#F7D6A8}
svg .rand{fill:none;stroke:#5B6A76;stroke-width:2}
svg .klabel{font-size:15px;font-weight:800;fill:var(--tinte)}
svg .klabel2{font-size:13px;font-weight:700;fill:var(--grau)}

/* Folie 1: Darstellen */
.darstellen{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.eingabegross{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--blau-pastell);border:1px solid #C4DFF2;border-radius:14px;padding:18px}
.eingabegross .bf input{width:110px;font-size:52px}
.eingabegross .bf .strich{width:120px;height:6px}
.eingabegross .knopfleiste{justify-content:center}
.fakten{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.fakten div{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:8px 12px}
.fakten h4{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);font-weight:800}
.fakten p{font-size:22px;font-weight:800;color:var(--blau-d);font-family:"Cambria Math","Cambria","Times New Roman",serif;display:flex;align-items:center;gap:4px;min-height:44px}
.ueberstrich{text-decoration:overline}
.titelkreise svg{display:block;background:rgba(255,255,255,.95);border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.25)}

</style>
</head>

<div id="stage"></div>

  <span id="zaehler">1 / 1</span>
  <button id="vor" title="Weiter (→)">›</button>

<script>
const KURS = "Mathematik · Brüche";
const REIHE = "Bruchrechnung";

/* ---------- Rechnen mit Brüchen (ganze Zahlen, exakt) ---------- */
const ggT = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const kgV = (a, b) => Math.abs(a * b) / ggT(a, b);
function kuerze(z, n){ const g = ggT(z, n), s = n < 0 ? -1 : 1; return [s * z / g, s * n / g]; }

function zahlText(v, stellen = 4){                 // deutsch: Komma, Minus als −
  let s = (Math.round(v * 10 ** stellen) / 10 ** stellen).toString();
  return s.replace('-', '−').replace('.', ',');
}
/* Bruch als HTML, übereinander (Klasse .bruch aus dem Rahmen) */
const B = (z, n, farbe) => `<span class="bruch"${farbe ? ` style="color:${farbe}"` : ''}><span>${String(z).replace('-', '−')}</span><span>${n}</span></span>`;
/* gemischte Zahl, falls unecht: 7/3 → 2 1/3 */
function gemischt(z, n){
  const neg = z < 0, a = Math.abs(z), g = Math.floor(a / n), r = a % n;
  if (g === 0 || n === 1) return null;
  return (neg ? '−' : '') + g + (r ? B(r, n) : '');
}
/* Dezimalzahl exakt, Periode überstrichen: 1/6 → 0,1‾6 */
function dezimal(z, n){
  const neg = z < 0; let a = Math.abs(z);
  const ganz = Math.floor(a / n); let r = a % n, ziff = '', gesehen = {}, pos = 0;
  while (r && !(r in gesehen) && pos < 40){ gesehen[r] = pos++; r *= 10; ziff += Math.floor(r / n); r %= n; }
  let nach = ziff;
  if (r) { const p = gesehen[r]; nach = ziff.slice(0, p) + `<span class="ueberstrich">${ziff.slice(p)}</span>`; }
  return (neg ? '−' : '') + ganz + (ziff ? ',' + nach : '');
}

/* ---------- Kreise als SVG ----------
   teile: Liste von Klassen, eine pro Stück, gezählt über alle Kreise; N Stücke je Kreis */
function kreise(N, teile, x0, y0, r = 42, abstand = 104){
  const anzahl = Math.max(1, Math.ceil(teile.length / N));
  let g = '';
  for (let k = 0; k < anzahl; k++){
    const cx = x0 + k * abstand;
    for (let i = 0; i < N; i++){
      const cls = teile[k * N + i] || 'leer';
      if (N === 1) { g += `<circle class="teil ${cls}" cx="${cx}" cy="${y0}" r="${r}"/>`; continue; }
      const w0 = -Math.PI / 2 + i * 2 * Math.PI / N, w1 = w0 + 2 * Math.PI / N;
      const p = (w) => `${(cx + r * Math.cos(w)).toFixed(2)} ${(y0 + r * Math.sin(w)).toFixed(2)}`;
      g += `<path class="teil ${cls}" d="M${cx} ${y0}L${p(w0)}A${r} ${r} 0 ${w1 - w0 > Math.PI ? 1 : 0} 1 ${p(w1)}Z"/>`;
    }
    g += `<circle class="rand" cx="${cx}" cy="${y0}" r="${r}"/>`;
  }
  return { svg: g, breite: (anzahl - 1) * abstand + 2 * r, anzahl };
}
const stuecke = (anzahl, cls) => Array(Math.max(0, anzahl)).fill(cls);

function titelKreise(){
  let g = kreise(4, ['b1', 'b1', 'b1'], 70, 80, 50).svg + kreise(8, stuecke(5, 'b2'), 200, 80, 50).svg;
  return `<svg width="280" height="160" viewBox="0 0 280 160">${g}</svg>`;
}

/* Gerüst eines Rechners; befüllt in teil_labor.js */
const ZEICHEN = { plus: '+', minus: '−', mal: '·', durch: ':' };
const rechner = op => `
  <div class="interaktiv" data-rechner="${op}">
    <div class="aufgabe">
      <span class="bf b1"><input data-r="z1" inputmode="numeric" aria-label="Zähler 1"><span class="strich"></span><input data-r="n1" inputmode="numeric" aria-label="Nenner 1"></span>
      <span class="op">${ZEICHEN[op]}</span>
      <span class="bf b2"><input data-r="z2" inputmode="numeric" aria-label="Zähler 2"><span class="strich"></span><input data-r="n2" inputmode="numeric" aria-label="Nenner 2"></span>
      <span class="op">=</span>
      <span class="bf dein"><input data-r="ze" inputmode="numeric" aria-label="dein Zähler" placeholder="?"><span class="strich"></span><input data-r="ne" inputmode="numeric" aria-label="dein Nenner" placeholder="?"></span>
      <div class="knopfleiste">
        <button class="knopf o" data-r="pruefen">Prüfen</button>
        <button class="knopf hell" data-r="neu">Neue Aufgabe</button>
      </div>
    </div>
    <div class="rueck" data-r="rueck">Rechne selbst und trag dein Ergebnis ein, dann „Prüfen".</div>
    <div class="zwei">
      <div class="panel"><h3>Lösungsweg <button class="knopf hell" data-r="schritt">Nächster Schritt</button><button class="knopf hell" data-r="alle">Alle</button></h3>
        <div class="schritte2" data-r="weg"></div></div>
      <div class="panel"><h3>Am Kreis <button class="knopf hell" data-r="kreis">Kreise zeigen</button></h3>
        <div class="kreisbild" data-r="bild"><p class="leerhinweis">Zum Aufklappen: „Kreise zeigen".</p></div></div>
    </div>
  </div>`;

const folien = [

{titel:"Titel", klasse:"titel", roh:`
  <div class="karogrund"></div>
  <div class="links">
    <div class="balken"></div>
    <div class="eyebrow">Bruchrechnung</div>
    <h1>Brüche sehen<br>und rechnen</h1>
    <p class="unter">Jeder Bruch als Kreis: darstellen, addieren, subtrahieren, multiplizieren, dividieren. Selbst rechnen, prüfen, Schritt für Schritt nachvollziehen.</p>
    <div class="meta"><span>Mathematik</span><span>Brüche</span></div>
  </div>
  <div class="rechts">
    <div class="logokachel"><img src="${LOGO}" alt="Logo Montessori-Schule Landau"></div>
    <div class="titelkreise">${titelKreise()}</div>
  </div>
`},

{titel:"Brüche darstellen", klasse:"kompakt oben", eyebrow:"Brüche darstellen", h2:"Zähler und Nenner am Kreis", roh:`
  <div class="interaktiv darstellen" data-darstellen>
    <div class="eingabegross">
      <span class="bf b1"><input data-r="z" inputmode="numeric" aria-label="Zähler" value="3"><span class="strich"></span><input data-r="n" inputmode="numeric" aria-label="Nenner" value="4"></span>
      <div class="knopfleiste">
        <button class="knopf hell" data-r="kuerzen">Kürzen</button>
        <button class="knopf hell" data-r="erw2">Erweitern · 2</button>
        <button class="knopf hell" data-r="erw3">· 3</button>
      </div>
      <p class="hinweis" data-r="erklaer" style="text-align:center"></p>
    </div>
    <div>
      <div class="panel kreisbild" data-r="bild" style="min-height:0"></div>
      <div class="fakten">
        <div><h4>Gekürzt</h4><p data-r="gek"></p></div>
        <div><h4>Gemischte Zahl</h4><p data-r="gem"></p></div>
        <div><h4>Dezimalzahl</h4><p data-r="dez"></p></div>
        <div><h4>Prozent</h4><p data-r="proz"></p></div>
      </div>
    </div>
  </div>
`},

{titel:"Addition", klasse:"kompakt oben", eyebrow:"Addition", h2:"Brüche addieren: erst gleichnamig machen", roh: rechner('plus')},
{titel:"Subtraktion", klasse:"kompakt oben", eyebrow:"Subtraktion", h2:"Brüche subtrahieren: erst gleichnamig machen", roh: rechner('minus')},
{titel:"Multiplikation", klasse:"kompakt oben", eyebrow:"Multiplikation", h2:"Brüche multiplizieren: Zähler mal Zähler, Nenner mal Nenner", roh: rechner('mal')},
{titel:"Division", klasse:"kompakt oben", eyebrow:"Division", h2:"Brüche dividieren: mit dem Kehrwert malnehmen", roh: rechner('durch')},

];
</script>

<script>
const stage = document.getElementById('stage');
folien.forEach((f,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (f.klasse ? ' '+f.klasse : '');
  let html = '';
  if(!(f.klasse||'').split(' ').includes('titel')){
    html += `<header class="kopf"><img src="${LOGO}" alt=""><span class="schule">Montessori-Schule Landau</span><span class="kurs">${KURS}</span></header>`;
    if(f.h2) html += `<div class="titelzeile">${f.eyebrow?`<div class="eyebrow">${f.eyebrow}</div>`:''}<h2>${f.h2}</h2></div>`;
    html += `<div class="inhalt">${f.roh}</div>`;
    html += `<div class="fuss"><span>${REIHE}</span><span>${i+1} / ${folien.length}</span></div>`;
  } else html = f.roh;
  el.innerHTML = html;
  stage.appendChild(el);
});

/* =====================================================================
   Folie „Brüche darstellen"
   ===================================================================== */
const DARSTELLEN = (() => {
  const root = document.querySelector('[data-darstellen]');
  const R = r => root.querySelector(`[data-r="${r}"]`);
  const S = { z: 3, n: 4 };
  function zeichne(meldung = ''){
    R('z').value = S.z; R('n').value = S.n;
    const [gz, gn] = kuerze(S.z, S.n), wert = S.z / S.n;
    const kreisZahl = Math.max(1, Math.ceil(wert));
    if (S.n > 60 || kreisZahl > 4) R('bild').innerHTML = `<p class="leerhinweis">Zu viele Teile oder Kreise für die Zeichnung (höchstens 60 Teile, 4 Kreise).</p>`;
    else {
      const k = kreise(S.n, stuecke(S.z, 'b1'), 0, 0, 70, 160);
      const x0 = (760 - k.breite) / 2 + 70;
      R('bild').innerHTML = `<svg width="760" height="190" viewBox="0 0 760 190">${kreise(S.n, stuecke(S.z, 'b1'), x0, 95, 70, 160).svg}</svg>`;
    }
    R('gek').innerHTML = ggT(S.z, S.n) > 1 ? `${B(S.z, S.n)} = ${B(gz, gn)}` : (S.n === 1 ? String(S.z) : 'schon gekürzt');
    R('gem').innerHTML = gemischt(S.z, S.n) || (wert < 1 ? 'echter Bruch' : String(wert));
    R('dez').innerHTML = dezimal(S.z, S.n);
    const p = wert * 100, exakt = Math.abs(p * 100 - Math.round(p * 100)) < 1e-9;
    R('proz').innerHTML = (exakt ? '' : '≈ ') + zahlText(Math.round(p * 100) / 100, 2) + ' %';
    R('erklaer').innerHTML = meldung || `${S.z} von ${S.n} gleich großen Teilen.`;
    root.dataset.bruch = `${S.z}/${S.n}`;
  }
  function lies(){
    const z = parseInt(R('z').value, 10), n = parseInt(R('n').value, 10);
    const zOk = z >= 0 && z <= 999, nOk = n >= 1 && n <= 999;
    R('z').classList.toggle('falsch', !zOk); R('n').classList.toggle('falsch', !nOk);
    if (zOk && nOk) { S.z = z; S.n = n; zeichne(); }
  }
  ['z', 'n'].forEach(r => { R(r).addEventListener('input', lies); });
  R('kuerzen').onclick = () => {
    const g = ggT(S.z, S.n);
    if (g === 1) return zeichne('Schon vollständig gekürzt: Zähler und Nenner haben keinen gemeinsamen Teiler.');
    [S.z, S.n] = [S.z / g, S.n / g]; zeichne(`Gekürzt durch ${g}: gleich viel vom Kreis, aber gröber geteilt.`);
  };
  const erw = f => () => {
    if (S.n * f > 999) return zeichne('Der Nenner würde zu groß.');
    S.z *= f; S.n *= f; zeichne(`Erweitert mit ${f}: gleich viel vom Kreis, nur feiner geteilt.`);
  };
  R('erw2').onclick = erw(2); R('erw3').onclick = erw(3);
  zeichne();
  return { S, zeichne };
})();

/* =====================================================================
   Die vier Rechner
   ===================================================================== */
const RECHNER = [...document.querySelectorAll('[data-rechner]')].map(root => rechnerLabor(root, root.dataset.rechner));

function rechnerLabor(root, op){
  const R = r => root.querySelector(`[data-r="${r}"]`);
  const START = { plus: [1, 4, 2, 3], minus: [5, 6, 1, 4], mal: [2, 3, 3, 4], durch: [3, 4, 3, 8] };
  const S = { a: 0, b: 1, c: 0, d: 1, offen: 0, kreis: false, dein: null };
  let L;                                            // Lösung: {Z, N (roh), z, n (gekürzt), schritte, ...}

  /* ---------- rechnen ---------- */
  function rechne(){
    const { a, b, c, d } = S, s = [];
    if (op === 'plus' || op === 'minus'){
      const N = kgV(b, d), f1 = N / b, f2 = N / d, A = a * f1, C = c * f2, Z = op === 'plus' ? A + C : A - C, zeichen = op === 'plus' ? '+' : '−';
      s.push({ was: 'Hauptnenner', html: b === d ? `Die Nenner sind schon gleich: <b>${N}</b>` : `kgV(${b}; ${d}) = <b>${N}</b>` });
      const erw = (x, y, f, X) => f === 1 ? `${B(x, y)} bleibt` : `${B(x, y)} = ${B(`${x}·${f}`, `${y}·${f}`)} = ${B(X, N)}`;
      s.push({ was: 'Erweitern', html: `${erw(a, b, f1, A)}<span class="hin">und</span>&nbsp;${erw(c, d, f2, C)}` });
      s.push({ was: op === 'plus' ? 'Zähler addieren' : 'Zähler subtrahieren', html: `${B(A, N)} ${zeichen} ${B(C, N)} = ${B(`${A} ${zeichen} ${C}`, N)} = ${B(Z, N)}` });
      L = { Z, N, A, C, NH: N };
    } else if (op === 'mal'){
      const Z = a * c, N = b * d;
      const tipp = ggT(a, d) > 1 || ggT(c, b) > 1 ? '<span class="hin">Tipp: vorher über Kreuz kürzen spart Arbeit.</span>' : '';
      s.push({ was: 'Multiplizieren', html: `${B(a, b)} · ${B(c, d)} = ${B(`${a}·${c}`, `${b}·${d}`)} = ${B(Z, N)}${tipp}` });
      L = { Z, N };
    } else {
      const Z = a * d, N = b * c;
      s.push({ was: 'Kehrwert', html: `${B(a, b)} : ${B(c, d)} = ${B(a, b)} · ${B(d, c)}<span class="hin">Kehrwert des zweiten Bruchs</span>` });
      s.push({ was: 'Multiplizieren', html: `${B(a, b)} · ${B(d, c)} = ${B(`${a}·${d}`, `${b}·${c}`)} = ${B(Z, N)}` });
      L = { Z, N };
    }
    const [z, n] = kuerze(L.Z, L.N), g = ggT(L.Z, L.N);
    Object.assign(L, { z, n });
    if (L.Z === 0) s.push({ was: 'Ergebnis', html: `${B(0, L.N)} = <b>0</b>` });
    else s.push({ was: 'Kürzen', html: g > 1 ? `${B(L.Z, L.N)} = ${B(`${L.Z} : ${g}`, `${L.N} : ${g}`)} = ${B(z, n)}` : `${B(z, n)}<span class="hin">nicht kürzbar, ggT = 1</span>` });
    const gem = gemischt(z, n);
    if (gem) s.push({ was: 'Gemischte Zahl', html: `${B(z, n)} = ${gem}` });
    else if (n === 1 && L.Z !== 0) s.push({ was: 'Ganze Zahl', html: `${B(z, 1)} = <b>${String(z).replace('-', '−')}</b>` });
    L.schritte = s;
  }

  /* ---------- Lösungsweg ---------- */
  function zeichneWeg(){
    R('weg').innerHTML = L.schritte.map((s, i) => `<div class="s2${i === L.schritte.length - 1 ? ' letzt' : ''}"${i < S.offen ? '' : ' hidden'}>
      <span class="nummer">${i + 1}</span><span class="was">${s.was}</span><span class="rechnung">${s.html}</span></div>`).join('')
      + (S.offen === 0 ? `<p class="leerhinweis">${L.schritte.length} Schritte. Aufdecken mit „Nächster Schritt".</p>` : '');
    R('schritt').disabled = S.offen >= L.schritte.length;
    root.dataset.offen = S.offen;
  }

  /* ---------- Kreise ---------- */
  function zeichneKreise(){
    if (!S.kreis){ R('bild').innerHTML = '<p class="leerhinweis">Zum Aufklappen: „Kreise zeigen".</p>'; R('kreis').textContent = 'Kreise zeigen'; return; }
    R('kreis').textContent = 'Kreise ausblenden';
    const { a, b, c, d } = S, zeilen = [];     // je Zeile: Beschriftung, Nenner, Stücke
    const t = (z, n) => `${String(z).replace('-', '−')}/${n}`;
    if (op === 'plus' || op === 'minus'){
      const { A, C, NH: N, Z } = L;
      zeilen.push([`${t(a, b)} = ${t(A, N)}`, N, stuecke(A, 'b1')]);
      zeilen.push([`${t(c, d)} = ${t(C, N)}`, N, stuecke(C, 'b2')]);
      if (op === 'plus') zeilen.push([`zusammen ${t(Z, N)}`, N, [...stuecke(A, 'b1'), ...stuecke(C, 'b2')]]);
      else if (Z >= 0) zeilen.push([`${A} − ${C} Stücke = ${t(Z, N)}`, N, [...stuecke(Z, 'b1'), ...stuecke(C, 'weg')]]);
      else zeilen.push(['Ergebnis negativ', 0, []]);
    } else if (op === 'mal'){
      if (a > b || c > d) zeilen.push(['Kreisbild nur für Brüche bis 1', 0, []]);
      else {
        zeilen.push([`${t(c, d)}`, d, stuecke(c, 'b2')]);
        // b·d Teile: der Bereich c/d hell, darin von jedem d-tel die ersten a von b Teilen
        const teile = [];
        for (let j = 0; j < d; j++) for (let i = 0; i < b; i++) teile.push(j < c ? (i < a ? 'erg' : 'hell2') : 'leer');
        zeilen.push([`${t(a, b)} davon = ${t(a * c, b * d)}`, b * d, teile]);
      }
    } else {
      const N = kgV(b, d), A = a * N / b, C = c * N / d;
      const teile = stuecke(A, '').map((_, i) => (Math.floor(i / C) + 1) * C <= A ? (Math.floor(i / C) % 2 ? 'g1' : 'g0') : 'rest');
      zeilen.push([`${t(a, b)} = ${t(A, N)}`, N, teile]);
      zeilen.push([`ein Stück ${t(c, d)}${C !== c || N !== d ? ` = ${t(C, N)}` : ''}`, N, stuecke(C, 'b2')]);
      const ganz = Math.floor(A / C), rest = A % C;
      const erg = L.n === 1 ? String(L.z) : t(L.z, L.n);
      zeilen.push([`passt ${ganz}-mal${rest ? ` und ${rest}/${C}-mal` : ''}: ${erg}`, C, stuecke(A, 'erg')]);
    }
    if (S.dein && S.dein[0] >= 0 && S.dein[1] > 0) zeilen.push([`dein Ergebnis ${t(S.dein[0], S.dein[1])}`, S.dein[1], stuecke(S.dein[0], 'dein')]);
    const r = 26, hoehe = 63, W = 468;
    let g = '', zuViel = false;
    zeilen.forEach(([text, N, teile], i) => {
      const y = 30 + i * hoehe;
      g += `<text class="klabel" x="0" y="${y + 5}">${text}</text>`;
      if (!N) return;
      if (N > 60 || Math.ceil(teile.length / N) > 5) { g += `<text class="klabel2" x="215" y="${y + 5}">zu viele Teile für die Zeichnung</text>`; zuViel = true; return; }
      g += kreise(N, teile, 215 + r, y, r, 2 * r + 10).svg;
    });
    R('bild').innerHTML = `<svg width="${W}" height="${zeilen.length * hoehe + 6}" viewBox="0 0 ${W} ${zeilen.length * hoehe + 6}">${g}</svg>`;
  }

  /* ---------- Prüfen ---------- */
  const gleich = (z1, n1, z2, n2) => z1 * n2 === z2 * n1;
  function pruefe(){
    const ze = parseInt(R('ze').value, 10), ne = parseInt(R('ne').value, 10);
    const box = R('ze').closest('.bf');
    box.classList.remove('ok', 'nein');
    if (!Number.isInteger(ze) || !Number.isInteger(ne) || ne === 0){
      R('rueck').className = 'rueck nein'; R('rueck').textContent = 'Bitte Zähler und Nenner als ganze Zahlen eintragen (Nenner nicht 0).'; return;
    }
    S.dein = [ze, ne];
    const { a, b, c, d } = S;
    let art, text;
    if (gleich(ze, ne, L.z, L.n)){
      if (ggT(ze, ne) === 1 && ne > 0) { art = 'ok'; text = `Richtig! ${a}/${b} ${ZEICHEN[op]} ${c}/${d} = ${ze}/${ne}.`; }
      else { art = 'fast'; text = `Richtig gerechnet, aber noch kürzbar: ${ze}/${ne} = ${L.z}/${L.n}.`; }
    } else {
      art = 'nein'; text = 'Noch nicht richtig. Deck den Lösungsweg Schritt für Schritt auf und vergleich mit den Kreisen.';
      if ((op === 'plus' && gleich(ze, ne, a + c, b + d)) || (op === 'minus' && b !== d && gleich(ze, ne, a - c, b - d)))
        text = `Zähler und Nenner einzeln ${op === 'plus' ? 'addiert' : 'subtrahiert'}? Das geht nicht: Erst müssen beide Brüche den gleichen Nenner haben.`;
      else if (op === 'durch' && gleich(ze, ne, a * c, b * d)) text = 'Das ist das Produkt. Beim Dividieren nimmst du mit dem Kehrwert des zweiten Bruchs mal.';
      else if (op === 'durch' && gleich(ze, ne, b * c, a * d)) text = 'Kehrwert vom falschen Bruch: Umgedreht wird nur der zweite Bruch.';
      else if (op === 'mal' && b === d && gleich(ze, ne, a * c, b)) text = 'Beim Multiplizieren werden auch die Nenner malgenommen, nicht nur die Zähler.';
      S.kreis = true;                           // falsch: das Bild hilft
    }
    box.classList.add(art === 'nein' ? 'nein' : 'ok');
    R('rueck').className = 'rueck ' + art; R('rueck').textContent = text;
    root.dataset.pruefung = art;
    zeichneKreise();
  }

  /* ---------- Eingabe der Aufgabe ---------- */
  function lies(){
    const v = ['z1', 'n1', 'z2', 'n2'].map(r => parseInt(R(r).value, 10));
    const ok = [v[0] >= 0 && v[0] <= 99, v[1] >= 1 && v[1] <= 99, v[2] >= (op === 'durch' ? 1 : 0) && v[2] <= 99, v[3] >= 1 && v[3] <= 99];
    ['z1', 'n1', 'z2', 'n2'].forEach((r, i) => R(r).classList.toggle('falsch', !ok[i]));
    if (!ok.every(Boolean)) return;
    [S.a, S.b, S.c, S.d] = v;
    zuruecksetzen();
  }
  function setze(a, b, c, d){
    [S.a, S.b, S.c, S.d] = [a, b, c, d];
    ['z1', 'n1', 'z2', 'n2'].forEach((r, i) => { R(r).value = [a, b, c, d][i]; R(r).classList.remove('falsch'); });
    zuruecksetzen();
  }
  function zuruecksetzen(){
    S.offen = 0; S.dein = null; S.kreis = false;
    R('ze').value = ''; R('ne').value = ''; R('ze').closest('.bf').classList.remove('ok', 'nein');
    R('rueck').className = 'rueck'; R('rueck').textContent = 'Rechne selbst und trag dein Ergebnis ein, dann „Prüfen".';
    delete root.dataset.pruefung;
    rechne(); zeichneWeg(); zeichneKreise();
    root.dataset.loesung = `${L.z}/${L.n}`;
  }
  function zufall(){
    const r = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
    for (;;){
      const b = r(2, 12), d = r(2, 12), a = r(1, b - 1), c = r(1, d - 1);
      if (op === 'minus' && a / b <= c / d) continue;          // Ergebnis positiv
      if ((op === 'plus' || op === 'minus') && kgV(b, d) > 36) continue;   // noch zeichenbar
      if (op === 'durch' && kgV(b, d) > 36) continue;
      return setze(a, b, c, d);
    }
  }

  ['z1', 'n1', 'z2', 'n2'].forEach(r => R(r).addEventListener('input', lies));
  ['ze', 'ne'].forEach(r => R(r).addEventListener('keydown', e => { if (e.key === 'Enter') pruefe(); }));
  R('pruefen').onclick = pruefe;
  R('neu').onclick = zufall;
  R('schritt').onclick = () => { S.offen = Math.min(L.schritte.length, S.offen + 1); zeichneWeg(); };
  R('alle').onclick = () => { S.offen = L.schritte.length; zeichneWeg(); };
  R('kreis').onclick = () => { S.kreis = !S.kreis; zeichneKreise(); };

  setze(...START[op]);
  return { S, setze, loesung: () => L };
}

/* =====================================================================
   Folien-Navigation
   ===================================================================== */
const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;
function frags(n){
  return [...slides[n].querySelectorAll('.frag')]
    .map((el,k)=>({el, ord: el.dataset.schritt ? parseFloat(el.dataset.schritt) : k+1, k}))
    .sort((a,b)=> a.ord - b.ord || a.k - b.k).map(x=>x.el);
}
function zeige(n, alleFragmente=false){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('aktiv', k===i));
  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));
  document.getElementById('zaehler').textContent = (i+1)+' / '+slides.length;
  document.getElementById('fortschritt').style.width = ((i+1)/slides.length*100)+'%';
  try{ history.replaceState(null, '', '#'+(i+1)); }catch(e){}
}
function vor(){ const fr = frags(i); if(schritt < fr.length){ fr[schritt].classList.add('an'); schritt++; return; } if(i < slides.length-1) zeige(i+1); }
function zurueck(){ if(schritt > 0){ schritt--; frags(i)[schritt].classList.remove('an'); return; } if(i > 0) zeige(i-1, true); }
function skalieren(){ const s = Math.min((innerWidth-40)/1280, (innerHeight-40)/720); stage.style.transform = 'scale('+s+')'; }
addEventListener('resize', skalieren);
const ueb = document.getElementById('uebersicht'), gitter = ueb.querySelector('.gitter');
folien.forEach((f,k)=>{ const d = document.createElement('div'); d.className = 'mini';
  d.innerHTML = `<div class="nr">FOLIE ${k+1}</div><div class="tt">${f.h2 || f.titel}</div>`;
  d.onclick = ()=>{ ueb.classList.remove('an'); zeige(k); }; gitter.appendChild(d); });
addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input, select, textarea')) return;   // beim Tippen der Funktion nicht blättern
  if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ e.preventDefault(); zurueck(); }
  else if(e.key==='Home'){ zeige(0); }
  else if(e.key==='End'){ zeige(slides.length-1, true); }
  else if(e.key==='o'||e.key==='O'){ ueb.classList.toggle('an'); }
  else if(e.key==='Escape'){ ueb.classList.remove('an'); }
  else if(e.key==='f'||e.key==='F'){ vollbild(); }
});
function vollbild(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
}
let wischX = null, wischY = null;
stage.addEventListener('touchstart', e=>{ if(e.target.closest('.interaktiv')){ wischX = null; return; } wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', e=>{ if(wischX === null) return; const dx = e.changedTouches[0].clientX - wischX, dy = e.changedTouches[0].clientY - wischY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? vor : zurueck)(); wischX = null; });
document.getElementById('uebBtn').onclick = ()=> ueb.classList.toggle('an');
document.getElementById('vor').onclick = vor;
document.getElementById('zurueck').onclick = zurueck;
stage.addEventListener('click', e=>{ if(!e.target.closest('a, button, input, select, .interaktiv')) vor(); });
skalieren();
zeige(parseInt(location.hash.slice(1)) - 1 || 0);
</script>
