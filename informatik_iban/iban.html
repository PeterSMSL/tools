<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Die IBAN entschlüsselt: Land, Prüfziffern, BLZ und Kontonummer, Buchstaben als Ziffern bis Z (ein System mit 36 Ziffern), die Prüfrechnung mit Rest bei 97, Fehlerjagd mit anderen Teilern und Division mit Rest als Brücke zu den Primzahlen.">
<title>IBAN</title>
<style>
/* ==== HANDY-SCHICHT: technik/handy/handy.css ==== */
/* =====================================================================
   HANDY-SCHICHT für den Rahmen der Vorlagen (ds1 / Folgen) — plus eine Regel für alle Ansichten:
   zu viel Inhalt scrollt statt abgeschnitten zu werden.
   Greift nur, wenn handy.js <html class="handy"> setzt: Bildschirm zu klein für die
   Bühne 1280 × 720 (Handy, Tablet hochkant). Beamer, Laptop und Druck bleiben unberührt.
   Aus der Bühne wird eine scrollbare Seite pro Folie; Raster werden einspaltig,
   Schrift mindestens 14 px, Knöpfe mindestens 40 px (Finger).
   ===================================================================== */
/* ---- Für ALLE Ansichten (auch Beamer): nie abschneiden. Passt der Inhalt einer Folie nicht,
        scrollt der Inhaltsbereich; Kopf und Fuß bleiben stehen. ---- */
#stage .slide .inhalt{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#C4DFF2 transparent;
  margin-bottom:-10px}   /* bis an die Fußzeilenlinie: der freie Rand darüber gehört zum Inhalt (Folgen nutzt ihn) */
@media print{#stage .slide .inhalt{overflow:visible}}            /* Druck: alles zeigen */

html.handy, html.handy body{height:auto;overflow-x:hidden;overflow-y:auto}
html.handy body{display:block;background:var(--papier)}
html.handy #stage{width:100%;height:auto;transform:none!important}
html.handy .slide{position:relative;inset:auto;display:none;min-height:100vh;border-radius:0;box-shadow:none;
  padding:64px 14px 84px;transform:none;transition:none;overflow:visible}
html.handy .slide.aktiv{display:flex}

/* Kopf, Überschriften, Fuß */
html.handy .kopf{height:48px;padding:0 12px;gap:10px}
html.handy .kopf img{height:34px}
html.handy .kopf .schule{font-size:14px;letter-spacing:.06em}
html.handy .kopf .kurs{display:none}
html.handy h1{font-size:34px}
html.handy h2, html.handy .slide.kompakt h2{font-size:25px}
html.handy .eyebrow{font-size:14px;letter-spacing:.12em}
html.handy .titelzeile, html.handy .slide.kompakt .titelzeile{margin-bottom:14px}
html.handy .inhalt, html.handy #stage .slide .inhalt{display:block;overflow:visible;margin-bottom:0}   /* Handy: die Seite scrollt, nicht die Folie */
html.handy .fuss{position:static;margin-top:22px;font-size:14px;gap:10px}
html.handy p, html.handy li{font-size:17px}
html.handy .klein, html.handy .hinweis{font-size:15px}

/* Titelfolie: untereinander */
html.handy .slide.titel{display:none;grid-template-columns:1fr;padding:0}
html.handy .slide.titel.aktiv{display:grid}
html.handy .slide.titel .links{padding:40px 20px 24px}
html.handy .slide.titel .rechts{padding:24px 0 90px;border-left:none;border-top:1px solid rgba(255,255,255,.16)}
html.handy .slide.titel .unter{font-size:18px}
html.handy .slide.titel .meta span{font-size:14px}
html.handy .slide.titel .logokachel{border-radius:26px;padding:16px 18px}
html.handy .slide.titel .logokachel img{width:110px}
html.handy .slide.titel svg{max-width:100%;height:auto}

/* Raster und Karten: einspaltig */
html.handy .raster, html.handy .g2, html.handy .g3, html.handy .g4{grid-template-columns:1fr!important}
html.handy .karte p, html.handy .karte li{font-size:16px}

/* Finger: Knöpfe und Felder mindestens 40 px */
html.handy .knopf{min-height:42px;min-width:42px;font-size:15.5px;padding:8px 14px}
html.handy input, html.handy select{min-height:42px;font-size:16px}   /* 16 px: iOS zoomt sonst beim Tippen */
html.handy #nav{right:10px;bottom:10px;padding:6px 8px;gap:6px}
html.handy #nav button{width:42px;height:42px;font-size:18px}
html.handy #zaehler{font-size:14px}
html.handy svg{max-width:100%;height:auto}
/* ==== /HANDY-SCHICHT ==== */
:root{
  --blau:#136EA9;
  --blau-d:#0C4E79;
  --blau-h:#3E93CE;
  --blau-pastell:#E3F0F9;
  --orange:#F3A92F;
  --orange-d:#D98908;
  --orange-pastell:#FDF0DA;
  --tinte:#16232E;
  --grau:#5B6A76;
  --linie:#D8E2EA;
  --papier:#FFFFFF;
  --bg:#EAF1F6;
  --rot:#C62828;
  --gruen:#2E7D32;
  --stage-w:1280px;
  --stage-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:"Sansation","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

#stage{
  position:relative;
  width:var(--stage-w);height:var(--stage-h);
  transform-origin:center center;
  flex:none;
}
.slide{
  position:absolute;inset:0;
  background:var(--papier);
  border-radius:14px;
  box-shadow:0 18px 50px rgba(12,78,121,.22), 0 2px 6px rgba(12,78,121,.12);
  overflow:hidden;
  padding:86px 62px 58px;
  opacity:0;visibility:hidden;
  transform:translateY(14px) scale(.995);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
  display:flex;flex-direction:column;
}
.slide.aktiv{opacity:1;visibility:visible;transform:none}

.kopf{
  position:absolute;top:0;left:0;right:0;height:58px;
  background:linear-gradient(100deg,var(--blau-d) 0%,var(--blau) 55%,var(--blau-h) 100%);
  display:flex;align-items:center;gap:14px;
  padding:0 22px 0 18px;
  color:#fff;
  z-index:5;
}
.kopf::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 34%,#F6C46E 34%,#F6C46E 100%);
}
.kopf img{height:40px;width:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.kopf .schule{font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.95}
.kopf .kurs{
  margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  padding:5px 12px;border-radius:999px;
}

h1{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.015em;color:var(--blau-d)}
h3{font-size:20px;font-weight:750;color:var(--blau-d)}
p,li{font-size:19px;line-height:1.5;color:var(--tinte)}
.klein{font-size:16px;line-height:1.45;color:var(--grau)}
.eyebrow{
  font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--orange-d);margin-bottom:10px;
}
.titelzeile{margin-bottom:26px;flex:none}
.titelzeile h2::after{
  content:"";display:block;width:64px;height:5px;border-radius:3px;
  background:var(--orange);margin-top:12px;
}
.slide.kompakt .titelzeile{margin-bottom:14px}
.slide.kompakt h2{font-size:32px}
.slide.kompakt h2::after{margin-top:8px;height:4px;width:52px}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center}
strong{color:var(--blau-d)}
em{font-style:normal;background:linear-gradient(transparent 62%, var(--orange-pastell) 62%);padding:0 2px}

.raster{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.karte{
  background:var(--papier);
  border:1px solid var(--linie);
  border-radius:12px;
  padding:20px 22px;
  box-shadow:0 2px 0 rgba(19,110,169,.05);
  display:flex;flex-direction:column;gap:8px;
}
.karte.blau{background:var(--blau-pastell);border-color:#C4DFF2}
.karte.orange{background:var(--orange-pastell);border-color:#F3DCAF}
.karte.voll{background:linear-gradient(150deg,var(--blau-d),var(--blau));border:none;color:#fff}
.karte.voll h3,.karte.voll strong{color:#fff}
.karte.voll p,.karte.voll li{color:rgba(255,255,255,.92)}
.karte .icon{font-size:26px;line-height:1}
.karte p,.karte li{font-size:17px;line-height:1.45}

.nummer{
  width:38px;height:38px;flex:none;border-radius:10px;
  background:var(--orange);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;
}
.nummer.b{background:var(--blau)}
.zeile{display:flex;gap:16px;align-items:flex-start}

ul.liste{list-style:none;display:flex;flex-direction:column;gap:11px}
ul.liste li{position:relative;padding-left:30px}
ul.liste li::before{
  content:"";position:absolute;left:6px;top:.55em;
  width:9px;height:9px;border-radius:3px;background:var(--orange);
}
ul.liste.blaupunkt li::before{background:var(--blau)}
ul.liste.eng{gap:7px}
ul.liste.eng li{font-size:16px}

.chip{
  display:inline-block;padding:6px 14px;border-radius:999px;
  background:var(--blau-pastell);color:var(--blau-d);
  font-size:16px;font-weight:650;border:1px solid #C4DFF2;
}
.chip.o{background:var(--orange-pastell);color:var(--orange-d);border-color:#F3DCAF}

.zitat{
  border-left:6px solid var(--orange);
  padding:6px 0 6px 22px;
  font-size:26px;line-height:1.35;font-weight:600;color:var(--blau-d);
}
.grossezahl{font-size:76px;font-weight:800;line-height:1;color:var(--orange);letter-spacing:-.03em}

.fuss{
  position:absolute;left:62px;right:62px;bottom:20px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;color:var(--grau);
  border-top:1px solid var(--linie);padding-top:9px;
}

/* ---------- Titel ---------- */
.slide.titel{
  padding:0;
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(243,169,47,.20), transparent 62%),
    linear-gradient(140deg,#0A4470 0%, var(--blau-d) 40%, var(--blau) 100%);
  color:#fff;
  display:grid;grid-template-columns:1.35fr .65fr;
}
.slide.titel .links{padding:74px 56px 56px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.slide.titel .rechts{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.16);
  position:relative;z-index:2;
}
.slide.titel .logokachel{
  background:#fff;border-radius:38px;padding:28px 30px;
  box-shadow:0 20px 46px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
}
.slide.titel .logokachel img{width:168px;display:block}
.slide.titel h1{color:#fff}
.slide.titel .eyebrow{color:var(--orange)}
.slide.titel .unter{font-size:23px;color:rgba(255,255,255,.9);margin-top:18px;max-width:640px}
.slide.titel .meta{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.slide.titel .meta span{
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);
  padding:8px 16px;border-radius:999px;font-size:15.5px;font-weight:600;
}
.slide.titel .balken{height:6px;width:110px;background:var(--orange);border-radius:4px;margin-bottom:26px}
.titelfaecher{position:relative;height:150px;width:250px;margin-top:6px}
.titelfaecher .sk{position:absolute;left:83px;top:10px;transform-origin:50% 120%}

.bitregen{
  position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:15px;line-height:1.75;letter-spacing:.34em;
  color:rgba(255,255,255,.085);word-break:break-all;
}
.bitregen div{animation:bitfluss 26s linear infinite}
@keyframes bitfluss{from{transform:translateY(0)}to{transform:translateY(-50%)}}

.slide.schluss{grid-template-columns:1fr}
.slide.schluss .links{align-items:center;text-align:center;padding:60px 120px}
.slide.schluss img{width:64px;margin-bottom:34px;background:rgba(255,255,255,.92);border-radius:50%;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.zitatgross{font-size:40px;line-height:1.28;font-weight:700;letter-spacing:-.015em;color:#fff;max-width:960px}
.zitatgross .strich{display:block;width:56px;height:5px;background:var(--orange);border-radius:3px;margin:26px auto 20px}
.quelle{font-size:18px;font-weight:600;color:var(--orange);letter-spacing:.06em}

/* ---------- Interaktive Bühnen (allgemein) ---------- */
.interaktiv{cursor:default}
.knopfleiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.knopf{
  font:inherit;font-size:16px;font-weight:700;
  border:none;border-radius:999px;padding:9px 18px;cursor:pointer;
  background:var(--blau);color:#fff;
  box-shadow:0 2px 0 rgba(12,78,121,.25);
  transition:background .15s, opacity .15s, transform .1s;
}
.knopf:hover{background:var(--blau-d)}
.knopf:active{transform:translateY(1px)}
.knopf.o{background:var(--orange);color:#3A2500}
.knopf.o:hover{background:var(--orange-d)}
.knopf.hell{background:var(--blau-pastell);color:var(--blau-d);box-shadow:none;border:1px solid #C4DFF2}
.knopf.hell:hover{background:#D2E7F6}
.knopf.hell.an{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.knopf:disabled{opacity:.35;cursor:not-allowed}
.knopf.aus{display:none}
.status{font-size:19px;font-weight:700;color:var(--blau-d);min-height:28px}
.status .sub{font-weight:600;color:var(--grau);font-size:16px}

/* Tabelle */
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.tab th{background:var(--blau-d);color:#fff;text-align:left;padding:10px 16px;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
table.tab th:first-child{border-top-left-radius:10px}
table.tab th:last-child{border-top-right-radius:10px}
table.tab td{padding:9px 16px;border-bottom:1px solid var(--linie)}
table.tab tr:nth-child(even) td{background:#F6FAFD}
table.tab td.z{font-weight:800;color:var(--orange-d);font-size:22px}

/* Schritte */
.schritte{display:flex;flex-direction:column;gap:9px}
.schritt{display:flex;gap:14px;align-items:center;background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:9px 14px}
.schritt .nummer{width:34px;height:34px;font-size:17px}
.schritt p{font-size:18px;line-height:1.35}
.schritt.wichtig{background:var(--orange-pastell);border-color:#F3DCAF}

.frag{opacity:0;transform:translateY(10px);transition:opacity .34s ease,transform .34s ease}
.frag.an{opacity:1;transform:none}
.frag.vl{transform:translateX(-22px)}
.frag.vr{transform:translateX(22px)}
.frag.vl.an,.frag.vr.an{transform:none}

#fortschritt{
  position:fixed;left:0;top:0;height:4px;background:var(--orange);
  width:0;transition:width .3s ease;z-index:50;
}
#nav{
  position:fixed;right:18px;bottom:14px;z-index:50;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
  border:1px solid var(--linie);border-radius:999px;padding:5px 8px;
  box-shadow:0 4px 14px rgba(12,78,121,.14);
}
#nav button{
  border:none;background:var(--blau-pastell);color:var(--blau-d);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:800;
}
#nav button:hover{background:var(--blau);color:#fff}
#zaehler{font-size:13px;font-weight:700;color:var(--grau);padding:0 6px;min-width:52px;text-align:center}

#uebersicht{
  position:fixed;inset:0;background:rgba(10,68,112,.96);z-index:100;
  display:none;padding:34px;overflow:auto;
}
#uebersicht.an{display:block}
#uebersicht h4{color:#fff;font-size:18px;margin-bottom:18px;font-weight:700}
#uebersicht .gitter{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#uebersicht .mini{
  background:#fff;border-radius:8px;padding:14px;cursor:pointer;
  border:3px solid transparent;min-height:78px;
}
#uebersicht .mini:hover{border-color:var(--orange)}
#uebersicht .mini .nr{font-size:11px;font-weight:800;color:var(--orange-d)}
#uebersicht .mini .tt{font-size:14px;font-weight:700;color:var(--blau-d);margin-top:3px;line-height:1.25}

@media print{
  @page{size:A4 landscape;margin:0}
  body{display:block;background:#fff;overflow:visible}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{
    position:relative;visibility:visible;opacity:1;transform:none;
    width:1280px;height:720px;page-break-after:always;box-shadow:none;border-radius:0;
  }
  .frag{opacity:1!important;transform:none!important}
  #nav,#fortschritt,#uebersicht{display:none!important}
}

/* ================= IBAN (diese Präsentation) ================= */
sub{font-size:.62em;vertical-align:-.25em;line-height:0}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.meldung{font-size:16px;font-weight:600;color:var(--grau)}
.meldung:empty{display:none}
.meldung.nein{color:var(--rot);background:#FBE6E4;border:1px solid var(--rot);border-radius:10px;padding:8px 14px}

/* IBAN-Zeichen: Land, Prüfziffern, BLZ, Kontonummer */
.ic{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-weight:800;border-radius:6px;padding:0 .08em;min-width:.75em;text-align:center}
.ic.lk{margin-right:.45em}
.ic.land{color:var(--grau);background:#F1F4F7}
.ic.pz{color:#fff;background:var(--orange)}
.ic.blz{color:var(--blau-d);background:var(--blau-pastell)}
.ic.kto{color:var(--orange-d);background:var(--orange-pastell)}
.ic.mark{outline:3px solid var(--rot);outline-offset:1px;color:var(--rot)}
.luft{display:inline-block;width:.8em}
.ibangross{font-size:46px;text-align:center;line-height:1.5;white-space:nowrap}
.ibangross.klein2{font-size:38px}

/* Titel */
.titeliban{font-size:21px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 0 22px rgba(243,169,47,.55);white-space:nowrap}
.titelrest{font-size:20px;font-weight:800;color:rgba(255,255,255,.9);font-family:ui-monospace,Consolas,monospace}

/* Aufbau */
.aufbau .teil{align-items:flex-start}
.aufbau .tk{font-size:26px;font-weight:800;border-radius:8px;padding:2px 10px}
.aufbau .land .tk{color:var(--grau);background:#F1F4F7}
.aufbau .pz .tk{color:#fff;background:var(--orange)}
.aufbau .blz .tk{color:var(--blau-d);background:var(--blau-pastell)}
.aufbau .kto .tk{color:var(--orange-d);background:var(--orange-pastell)}

/* Tippfehler */
.vergleich{display:flex;flex-direction:column;gap:6px}
.vergleich .vl{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--grau);text-align:center}

/* 36 Ziffern */
.z36{display:grid;grid-template-columns:repeat(12,1fr);gap:7px}
.zk{border-radius:10px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;border:1px solid var(--linie)}
.zk b{font-size:30px;line-height:1.1;font-family:ui-monospace,Consolas,monospace}
.zk span{font-size:14px;font-weight:700;color:var(--grau)}
.zk.d{background:#F1F4F7}
.zk.d b{color:var(--grau)}
.zk.h{background:var(--blau-pastell);border-color:#C4DFF2}
.zk.h b{color:var(--blau-d)}
.zk.n{background:var(--orange-pastell);border-color:#F3DCAF}
.zk.n b{color:var(--orange-d)}
.z36legende{display:flex;gap:18px;justify-content:center;margin-top:10px;font-size:15px;font-weight:700}
.z36legende span{padding:3px 12px;border-radius:999px}
.z36legende .d{background:#F1F4F7;color:var(--grau)}
.z36legende .h{background:var(--blau-pastell);color:var(--blau-d)}
.z36legende .n{background:var(--orange-pastell);color:var(--orange-d)}

/* Eingaben */
.eingabezeile{display:flex;flex-direction:column;gap:4px}
.eingabezeile label{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--grau)}
.grossfeld{font:inherit;font-family:ui-monospace,Consolas,monospace;font-size:40px;font-weight:800;width:100%;min-width:0;border:2px solid var(--linie);border-radius:12px;padding:2px 12px;color:var(--blau-d);background:#fff}
.grossfeld.mittel{font-size:28px}
.grossfeld.breit{font-size:28px}
.grossfeld:focus{outline:none;border-color:var(--blau)}
.grossfeld.falsch{border-color:var(--rot);background:#FBE6E4}

/* Basis 36 */
table.b36{border-collapse:separate;border-spacing:6px}
table.b36 th{font-size:14px;font-weight:800;color:var(--grau);text-align:right;padding-right:8px}
table.b36 td{min-width:84px;height:40px;text-align:center;font-size:20px;font-weight:800;border-radius:9px;background:#F1F4F7;color:var(--blau-d);padding:0 8px}
table.b36 td.sw{background:var(--blau-d);color:#fff;font-size:17px}
table.b36 td.zf{background:var(--orange);color:#fff;font-size:28px}
table.b36 td.ok{background:var(--orange-pastell);color:var(--orange-d);font-size:18px}
.b36erg{background:linear-gradient(150deg,var(--blau-d),var(--blau));border-radius:14px;padding:10px 16px;color:#fff;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.b36erg b{color:var(--orange);font-size:28px}

/* Prüfrechnung */
.pruefweg{display:flex;flex-direction:column;gap:10px}
.pw{display:grid;grid-template-columns:40px 300px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--linie);border-radius:14px;padding:8px 14px}
.pw p{font-size:17px;font-weight:700;color:var(--blau-d)}
.pw.wichtig{background:var(--orange-pastell);border-color:#F3DCAF}
.pwz{font-size:26px;white-space:nowrap}
.pwz.gross{font-size:21px;font-weight:700;color:var(--blau-d)}
.pwz.gross b{color:var(--orange-d)}
.pwz.gross2{font-size:22px;font-weight:700;color:var(--blau-d)}

/* Rest mitnehmen */
.stueckzahl{font-size:40px;font-weight:800;text-align:center;letter-spacing:.02em;margin-bottom:14px}
.s1,.s3{color:var(--blau-d);background:var(--blau-pastell);border-radius:6px}
.s2,.s4{color:var(--orange-d);background:var(--orange-pastell);border-radius:6px}
table.resttab{border-collapse:separate;border-spacing:0 6px;margin:0 auto;font-size:26px;font-weight:700;color:var(--blau-d)}
table.resttab td{padding:2px 12px}
table.resttab td:first-child{text-align:right}
table.resttab td.r{color:var(--orange-d);font-weight:800}
table.resttab .mit{color:#fff;background:var(--grau);border-radius:6px;padding:0 4px;margin-right:2px}
table.resttab tr.frag{opacity:0}
table.resttab tr.frag.an{opacity:1}
table.resttab.klein3{font-size:19px;margin:0;border-spacing:0 3px}
table.resttab.klein3 td{padding:1px 8px}

/* Prüfziffern bauen */
.bauweg{display:flex;flex-direction:column;gap:8px}
.bauweg .schritt{align-items:flex-start}
.sinhalt{display:flex;flex-direction:column;gap:5px;min-width:0}
.sinhalt .pwz{font-size:24px}

/* Prüfer */
.pruefkopf{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.prweg{display:flex;flex-direction:column;gap:8px}
.prweg .pwz{font-size:30px}
.landt{color:var(--grau)}
.pzt{color:var(--orange-d)}
.urteil{border-radius:16px;padding:16px;text-align:center;font-size:26px;font-weight:700;color:#fff}
.urteil b{font-size:44px}
.urteil.gut{background:var(--gruen)}
.urteil.schlecht{background:var(--rot)}
#prFehler strong{color:var(--rot)}

/* Fehlerjagd */
.jagdkopf{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.jgzerlegung{font-size:20px;color:var(--blau-d)}
.jgzerlegung b{font-family:ui-monospace,Consolas,monospace;font-size:24px}
.jagdtab{display:flex;flex-direction:column;gap:9px}
.jz{display:grid;grid-template-columns:230px 1fr;gap:4px 12px;align-items:center;background:#fff;border:1px solid var(--linie);border-radius:12px;padding:8px 12px}
.jt{font-size:16px;font-weight:800;color:var(--blau-d)}
.jb{height:16px;background:#E6F3E7;border-radius:999px;overflow:hidden}
.jb i{display:block;height:100%;background:var(--rot);border-radius:999px}
.jw{grid-column:1 / -1;font-size:16px;font-weight:700}
.jw.rot{color:var(--rot)}
.jw.gruen{color:var(--gruen)}

/* Division mit Rest */
.formelband{display:flex;gap:24px;align-items:baseline;justify-content:center;background:linear-gradient(150deg,var(--blau-d),var(--blau));border-radius:18px;padding:16px;color:#fff}
.formelband .mono{font-size:52px;font-weight:800}
.formelband .klein{color:rgba(255,255,255,.85);font-size:22px}
p.rz{font-size:19px;font-weight:700;color:var(--blau-d)}
p.rz b{color:var(--orange-d)}

/* Rest-Tafel */
.rtfeld{display:grid;justify-content:center}
.rtfeld i{border-radius:4px;background:#F1F4F7;border:1px solid #E4ECF2}
.rtfeld i.voll{background:var(--blau);border-color:var(--blau-d)}
.rtfeld i.rest{background:var(--orange);border-color:var(--orange-d)}
.rterg{text-align:center}
.rterg .gl{font-size:34px;font-weight:800;color:var(--blau-d)}
.rterg .gl b{color:var(--orange-d)}
.rterg .gl2{font-size:24px;font-weight:700;color:var(--grau)}

/* Primzahlen */
.pmgitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px}
.pm{border-radius:8px;background:#F1F4F7;border:1px solid #E4ECF2;display:flex;flex-direction:column;align-items:center;padding:1px 0}
.pm b{font-size:16px;color:var(--blau-d)}
.pm span{font-size:14px;font-weight:700;color:var(--grau)}
.pm.null{background:var(--orange);border-color:var(--orange-d)}
.pm.null b,.pm.null span{color:#fff}
.pmgitter.dicht{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:3px}
.pmgitter.dicht .pm b{font-size:14px}
.pmurteil{border-radius:14px;padding:10px 16px;font-size:21px;font-weight:700;text-align:center}
.pmurteil.ja{background:linear-gradient(150deg,var(--blau-d),var(--blau));color:#fff}
.pmurteil.ja strong{color:var(--orange)}
.pmurteil.nein{background:var(--orange-pastell);color:var(--blau-d)}

/* ---------- Handy ---------- */
html.handy .titeliban{font-size:12px;white-space:normal}
html.handy .ibangross{font-size:20px;white-space:normal}
html.handy .ibangross.klein2{font-size:18px}
html.handy .aufbau .tk{font-size:20px}
html.handy .z36{grid-template-columns:repeat(6,1fr)}
html.handy .z36legende{flex-wrap:wrap;gap:8px}
html.handy .grossfeld{font-size:26px}
html.handy .grossfeld.mittel,html.handy .grossfeld.breit{font-size:20px}
html.handy table.b36 td{min-width:0;font-size:15px;padding:0 4px}
html.handy table.b36 td.zf{font-size:20px}
html.handy table.b36 td.sw,html.handy table.b36 td.ok{font-size:14px}
html.handy .b36tab{overflow-x:auto}
html.handy .pw{grid-template-columns:40px 1fr}
html.handy .pwz{grid-column:1 / -1;font-size:15px;white-space:normal;overflow-wrap:anywhere}
html.handy .pwz.gross,html.handy .pwz.gross2{font-size:15px}
html.handy .stueckzahl{font-size:19px;overflow-wrap:anywhere}
html.handy table.resttab{font-size:15px}
html.handy table.resttab td{padding:2px 4px}
html.handy table.resttab.klein3{font-size:14px}
html.handy .sinhalt .pwz,html.handy .prweg .pwz{font-size:16px}
html.handy .urteil{font-size:20px}
html.handy .urteil b{font-size:30px}
html.handy .jz{grid-template-columns:1fr}
html.handy .formelband{flex-direction:column;align-items:center;gap:4px}
html.handy .formelband .mono{font-size:32px}
html.handy .rterg .gl{font-size:24px}
html.handy .rterg .gl2{font-size:18px}
html.handy .pmgitter,html.handy .pmgitter.dicht{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
html.handy .pmgitter.dicht .pm b,html.handy .pm b{font-size:14px}
html.handy .titelrest{font-size:16px}
.prweg .resttab,.sinhalt .resttab{align-self:flex-start}
html.handy sub{font-size:14px}
html.handy .titeliban .ic{font-size:14px}
.schlusszeile{color:rgba(255,255,255,.85);font-size:19px;margin-top:26px;max-width:780px}

</style>
</head>

<script>
const KURS = "Informatik · Algorithmen";
const REIHE = "IBAN";
const Z36 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const MUSTER = 'DE89370400440532013000';
const BITS = (MUSTER + ' 1314 Rest 1 97 ').repeat(14);
const sub = b => `<sub>${b}</sub>`;

/* IBAN farbig: Land, Prüfziffern, BLZ, Kontonummer – in Viererblöcken */
const TEILE = ['land','land','pz','pz', ...Array(8).fill('blz'), ...Array(10).fill('kto')];
const ibanHTML = (iban, mark = new Set()) => [...iban].map((c,k)=>
  `<span class="ic ${TEILE[k] || ''}${mark.has(k) ? ' mark' : ''}${k % 4 === 3 && k < iban.length-1 ? ' lk' : ''}">${c}</span>`).join('');

const folien = [

{titel:"Titel", klasse:"titel", roh:`
  <div class="bitregen"><div>${BITS}${BITS}</div></div>
  <div class="links">
    <div class="balken"></div>
    <div class="eyebrow">Zahlensysteme im Alltag</div>
    <h1>IBAN</h1>
    <p class="unter">Eine Kontonummer, die ihre eigenen Tippfehler bemerkt.</p>
    <div class="meta">
      <span>Informatik</span>
      <span>Unterrichtsreihe Algorithmen</span>
    </div>
  </div>
  <div class="rechts">
    <div class="logokachel"><img src="${LOGO}" alt="Logo Montessori-Schule Landau"></div>
    <div class="titeliban">${ibanHTML(MUSTER)}</div>
    <div class="titelrest">… : 97 = … Rest 1</div>
  </div>
`},

{titel:"Aufbau", eyebrow:"Die IBAN", h2:"22 Zeichen, vier Teile", roh:`
  <div class="ibangross frag" data-schritt="1">${ibanHTML(MUSTER)}</div>
  <div class="raster g4 aufbau" style="gap:16px;margin-top:26px">
    <div class="karte teil land frag" data-schritt="2"><div class="tk mono">DE</div><h3>Land</h3><p class="klein">Zwei Buchstaben: DE für Deutschland, AT für Österreich, FR für Frankreich.</p></div>
    <div class="karte teil pz frag" data-schritt="5"><div class="tk mono">89</div><h3>Prüfziffern</h3><p class="klein">Zwei Ziffern, die aus allen anderen <strong>berechnet</strong> werden. Um sie geht es heute.</p></div>
    <div class="karte teil blz frag" data-schritt="3"><div class="tk mono">370 400 44</div><h3>Bankleitzahl</h3><p class="klein">Acht Ziffern: Welche Bank? Die BLZ gab es schon vor der IBAN.</p></div>
    <div class="karte teil kto frag" data-schritt="4"><div class="tk mono">0532013000</div><h3>Kontonummer</h3><p class="klein">Zehn Ziffern: Welches Konto? Ist sie kürzer, wird sie <strong>vorn mit Nullen</strong> aufgefüllt.</p></div>
  </div>
  <p class="klein frag" data-schritt="6" style="margin-top:18px;text-align:center">Diese IBAN steht als Beispiel in vielen Anleitungen. Alle anderen IBANs hier sind ausgedacht.</p>
`},

{titel:"Tippfehler", eyebrow:"Das Problem", h2:"Eine Ziffer falsch, und das Geld landet woanders?", roh:`
  <div class="vergleich">
    <div class="frag"><p class="vl">richtig</p><div class="ibangross klein2">${ibanHTML(MUSTER)}</div></div>
    <div class="frag"><p class="vl">vertippt</p><div class="ibangross klein2">${ibanHTML('DE89370400440532018000', new Set([18]))}</div></div>
  </div>
  <div class="raster g3" style="gap:18px;margin-top:26px">
    <div class="karte blau frag"><h3>Ohne Prüfung</h3><p class="klein">Eine 3 statt einer 8 – und schon ist es eine andere Kontonummer. Die könnte es wirklich geben.</p></div>
    <div class="karte blau frag"><h3>Die Idee</h3><p class="klein">Zwei Ziffern werden aus allen anderen <strong>ausgerechnet</strong>. Wer sich vertippt, bringt die Rechnung durcheinander.</p></div>
    <div class="karte orange frag"><h3>Mit Prüfung</h3><p class="klein">Die Banking-App rechnet nach, noch bevor Geld fließt: <strong>„IBAN ungültig“</strong>.</p></div>
  </div>
`},

{titel:"Bis Z", klasse:"kompakt", eyebrow:"Buchstaben als Ziffern", h2:"Nach F geht es weiter – bis Z", roh:`
  <div class="z36 frag">
    ${[...Z36].map((z,k)=>`<div class="zk ${k<10?'d':k<16?'h':'n'}"><b>${z}</b><span>${k}</span></div>`).join('')}
  </div>
  <div class="z36legende frag"><span class="d">0–9: kennt ihr</span><span class="h">A–F: aus der Hex-Stunde</span><span class="n">G–Z: neu</span></div>
  <div class="raster g3" style="gap:18px;margin-top:16px">
    <div class="karte blau frag"><h3>Weiterzählen</h3><p class="klein">Hex hörte bei F = 15 auf. Wir zählen einfach weiter: G = 16, H = 17, … <strong>Z = 35</strong>.</p></div>
    <div class="karte orange frag"><h3>36 Ziffern</h3><p class="klein">0 bis 9 und A bis Z: Das sind 36 Ziffern. Wir haben uns gerade ein <strong>neues Zahlensystem</strong> gebaut – zur Basis 36.</p></div>
    <div class="karte voll frag"><p class="klein">Für die IBAN heißt das: <strong>D = 13</strong> und <strong>E = 14</strong>. Genau wie bei hex.</p></div>
  </div>
`},

{titel:"Basis 36", klasse:"kompakt", eyebrow:"Ein eigenes Zahlensystem", h2:"Jedes Wort ist eine Zahl", roh:`
  <div class="interaktiv raster" id="basis36" style="grid-template-columns:1.35fr 1fr;gap:26px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="eingabezeile">
        <label for="b36Feld">Wort oder Zahl (bis 6 Zeichen)</label>
        <input id="b36Feld" class="grossfeld mono" value="MSL" autocomplete="off" spellcheck="false" maxlength="12">
      </div>
      <div class="knopfleiste">
        ${['MSL','HI','ZZ','10','IBAN'].map(w=>`<button class="knopf hell b36bsp" data-w="${w}">${w}</button>`).join('')}
      </div>
      <div class="meldung" id="b36Meldung"></div>
      <div class="b36tab" id="b36Tab"></div>
      <div class="b36erg" id="b36Erg"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">

<script>
/* =====================================================================
   Folien aufbauen und navigieren (Rahmen wie ds2)
   ===================================================================== */
const stage = document.getElementById('stage');

folien.forEach((f,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (f.klasse ? ' '+f.klasse : '');
  let html = '';
  if(!(f.klasse||'').split(' ').includes('titel')){
    html += `<header class="kopf">
        <img src="${LOGO}" alt="">
        <span class="schule">Montessori-Schule Landau</span>
        <span class="kurs">${KURS}</span>
      </header>`;
    if(f.h2){
      html += `<div class="titelzeile">${f.eyebrow?`<div class="eyebrow">${f.eyebrow}</div>`:''}<h2>${f.h2}</h2></div>`;
    }
    html += `<div class="inhalt">${f.roh}</div>`;
    html += `<div class="fuss"><span>${REIHE}</span><span>${i+1} / ${folien.length}</span></div>`;
  } else {
    html = f.roh;
  }
  el.innerHTML = html;
  stage.appendChild(el);
});

const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;

function frags(n){
  const alle = [...slides[n].querySelectorAll('.frag')];
  return alle
    .map((el,k)=>({el, ord: el.dataset.schritt ? parseFloat(el.dataset.schritt) : k+1, k}))
    .sort((a,b)=> a.ord - b.ord || a.k - b.k)
    .map(x=>x.el);
}

function zeige(n, alleFragmente=false){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('aktiv', k===i));
  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));
  document.getElementById('zaehler').textContent = (i+1)+' / '+slides.length;
  document.getElementById('fortschritt').style.width = ((i+1)/slides.length*100)+'%';
  location.hash = i+1;
}
function vor(){
  const fr = frags(i);
  if(schritt < fr.length){ fr[schritt].classList.add('an'); schritt++; return; }
  if(i < slides.length-1) zeige(i+1);
}
function zurueck(){
  if(schritt > 0){ schritt--; frags(i)[schritt].classList.remove('an'); return; }
  if(i > 0) zeige(i-1, true);
}

function skalieren(){
  const rand = 40;
  const s = Math.min((innerWidth-rand)/1280, (innerHeight-rand)/720);
  stage.style.transform = 'scale('+s+')';
}
addEventListener('resize', skalieren);

const ueb = document.getElementById('uebersicht');
const gitter = ueb.querySelector('.gitter');
folien.forEach((f,k)=>{
  const d = document.createElement('div');
  d.className = 'mini';
  d.innerHTML = `<div class="nr">FOLIE ${k+1}</div><div class="tt">${f.h2 || f.titel}</div>`;
  d.onclick = ()=>{ ueb.classList.remove('an'); zeige(k); };
  gitter.appendChild(d);
});

addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input, select, textarea')) return;   // in Feldern tippen, nicht blättern
  if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ e.preventDefault(); zurueck(); }
  else if(e.key==='Home'){ zeige(0); }
  else if(e.key==='End'){ zeige(slides.length-1, true); }
  else if(e.key==='o'||e.key==='O'){ ueb.classList.toggle('an'); }
  else if(e.key==='Escape'){ ueb.classList.remove('an'); }
  else if(e.key==='f'||e.key==='F'){ vollbild(); }
});
function vollbild(){
  const el = document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen();
  else if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
// Wischen auf Tablets: links = weiter, rechts = zurück (nicht in interaktiven Bereichen)
let wischX = null, wischY = null;
stage.addEventListener('touchstart', e=>{
  if(e.target.closest('.interaktiv')){ wischX = null; return; }
  wischX = e.touches[0].clientX; wischY = e.touches[0].clientY;
}, {passive:true});
stage.addEventListener('touchend', e=>{
  if(wischX === null) return;
  const dx = e.changedTouches[0].clientX - wischX, dy = e.changedTouches[0].clientY - wischY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? vor : zurueck)();
  wischX = null;
});
document.getElementById('uebBtn').onclick = ()=> ueb.classList.toggle('an');
document.getElementById('vor').onclick = vor;
document.getElementById('zurueck').onclick = zurueck;
stage.addEventListener('click', e=>{ if(!e.target.closest('a, button, input, .interaktiv')) vor(); });

skalieren();
zeige(parseInt(location.hash.slice(1)) - 1 || 0);

/* =====================================================================
   IBAN-Hilfen: streng lesen, nichts still verändern
   ===================================================================== */
const B = id => document.getElementById(id);
/* Zahlen ab 10 000 mit Leerzeichen gruppiert (wie 65 535), darunter ohne */
const tz = n => n < 10000 ? String(n) : n.toLocaleString('de-DE').replace(/\./g, '\u00a0');
const gruppen = s => s.match(/.{1,4}/g).join(' ');
const umstellen = iban => iban.slice(4) + iban.slice(0, 4);
const ersetzen = s => [...s].map(c => /[A-Z]/.test(c) ? String(Z36.indexOf(c)) : c).join('');
const zahlVon = iban => ersetzen(umstellen(iban));

/* Rest bei 97 stückweise: erst 9 Ziffern, dann Rest + 7 Ziffern – jede Zahl bleibt unter einer Milliarde */
function stueckweise(z){
  const zeilen = []; let r = null, t = z;
  while(t.length){
    const neu = t.slice(0, r === null ? 9 : 7); t = t.slice(neu.length);
    const vorn = r === null ? '' : String(r), v = Number(vorn + neu);
    r = v % 97; zeilen.push({vorn, neu, q: Math.floor(v / 97), r});
  }
  return zeilen;
}
const restTab = zeilen => `<table class="resttab klein3">${zeilen.map((x,k)=>
  `<tr><td class="mono">${x.vorn ? `<b class="mit">${x.vorn}</b>` : ''}<span class="s${k % 4 + 1}">${x.neu}</span></td><td>: 97 = ${x.q}</td><td class="r">Rest ${x.r}</td></tr>`).join('')}</table>`;

/* Ziffernfolge mit erlaubten einzelnen Leerzeichen zwischen Blöcken; {wert} | {leer} | {fehler} */
function liesZiffern(t, name, min, max){
  const s = t.trim();
  if(!s) return {leer:true};
  if(!/^\d+( \d+)*$/.test(s)) return {fehler:`${name}: nur Ziffern 0 bis 9, Leerzeichen höchstens einzeln zwischen Blöcken.`};
  const x = s.replace(/ /g, '');
  if(x.length < min || x.length > max) return {fehler: min === max ? `${name}: genau ${min} Ziffern, hier sind es ${x.length}.` : `${name}: ${min} bis ${max} Ziffern, hier sind es ${x.length}.`};
  return {wert:x};
}
/* ganze Zahl in [lo, hi] */
function liesGanz(t, name, lo, hi){
  const s = t.trim();
  if(!s) return {leer:true};
  if(!/^\d+$/.test(s)) return {fehler:`${name}: bitte eine ganze Zahl (nur Ziffern 0 bis 9).`};
  const w = s.length > 6 ? Infinity : Number(s);
  if(w < lo || w > hi) return {fehler:`${name}: von ${lo} bis ${hi}.`};
  return {wert:w};
}
function liesIBAN(t){
  const s = t.trim();
  if(!s) return {leer:true};
  if(!/^[A-Za-z0-9]+( [A-Za-z0-9]+)*$/.test(s)) return {fehler:'Nur Buchstaben und Ziffern, Leerzeichen höchstens einzeln zwischen den Blöcken.'};
  const x = s.replace(/ /g, '').toUpperCase();
  if(!/^[A-Z]{2}/.test(x)) return {fehler:'Eine IBAN beginnt mit zwei Buchstaben für das Land, zum Beispiel DE.'};
  if(x.slice(0, 2) !== 'DE') return {fehler:`${x.slice(0, 2)} ist nicht Deutschland. Hier geht es um deutsche IBANs: DE und 20 Ziffern.`};
  if(!/^DE\d+$/.test(x)) return {fehler:'Nach DE kommen bei einer deutschen IBAN nur Ziffern.'};
  if(x.length !== 22) return {fehler:`Eine deutsche IBAN hat 22 Zeichen, hier sind es ${x.length}.`};
  return {wert:x};
}
/* Feld rot + Meldung oder alles sauber; gibt true zurück, wenn gerechnet werden darf */
function melde(feld, box, r){
  feld.classList.toggle('falsch', !!r.fehler);
  box.className = r.fehler ? 'meldung nein' : 'meldung';
  box.textContent = r.fehler || '';
  return !r.fehler && !r.leer;
}

/* =====================================================================
   Basis 36: Wort → Zahl mit Stellenwerten
   ===================================================================== */
const BASIS36 = (function(){
  const feld = B('b36Feld');
  let wert = null;
  function lies(t){
    const s = t.trim();
    if(!s) return {leer:true};
    if(/[äöüßÄÖÜ]/.test(s)) return {fehler:'Ä, Ö, Ü und ß gibt es unter den 36 Ziffern nicht – schreib AE, OE, UE, SS.'};
    if(!/^[A-Za-z0-9]+$/.test(s)) return {fehler:'Nur die 36 Ziffern 0 bis 9 und A bis Z, ohne Leerzeichen.'};
    if(s.length > 6) return {fehler:'Höchstens 6 Zeichen.'};
    return {wert:s.toUpperCase()};
  }
  function zeige(w){
    const n = w.length;
    const z = [...w].map((c,k)=>({c, v:Z36.indexOf(c), s:36 ** (n-1-k)}));
    wert = z.reduce((a,x)=> a + x.v * x.s, 0);
    B('b36Tab').innerHTML = `<table class="b36"><tr><th>Stellenwert</th>${z.map(x=>`<td class="sw">${tz(x.s)}</td>`).join('')}</tr>
      <tr><th>Ziffer</th>${z.map(x=>`<td class="zf mono">${x.c}</td>`).join('')}</tr>
      <tr><th>Wert</th>${z.map(x=>`<td>${x.v}</td>`).join('')}</tr>
      <tr><th>zählt</th>${z.map(x=>`<td class="ok">${tz(x.v * x.s)}</td>`).join('')}</tr></table>`;
    B('b36Erg').innerHTML = `<b class="mono">${w}</b>${sub(36)} = ${z.length > 1 ? z.map(x=>tz(x.v * x.s)).join(' + ') + ' = ' : ''}<b>${tz(wert)}</b>`;
    B('basis36').dataset.wert = wert;
  }
  function eingabe(){ const r = lies(feld.value); if(melde(feld, B('b36Meldung'), r)) zeige(r.wert); }
  feld.addEventListener('input', eingabe);
  document.querySelectorAll('.b36bsp').forEach(k => k.onclick = ()=>{ feld.value = k.dataset.w; eingabe(); });
  eingabe();
  return { get wert(){ return wert; } };
})();

/* =====================================================================
   Prüfziffern berechnen: BLZ + Kontonummer → IBAN
   ===================================================================== */
const BAUER = (function(){
  const fb = B('bauBLZ'), fk = B('bauKto');
  let iban = null;
  function rechne(){
    const rb = liesZiffern(fb.value, 'Bankleitzahl', 8, 8), rk = liesZiffern(fk.value, 'Kontonummer', 1, 10);
    fb.classList.toggle('falsch', !!rb.fehler); fk.classList.toggle('falsch', !!rk.fehler);
    const f = rb.fehler || rk.fehler;
    B('bauMeldung').className = f ? 'meldung nein' : 'meldung'; B('bauMeldung').textContent = f || '';
    if(f || rb.leer || rk.leer) return;
    const kto = rk.wert.padStart(10, '0'), bban = rb.wert + kto;
    const roh = 'DE00' + bban, zahl = zahlVon(roh), zeilen = stueckweise(zahl);
    const r = zeilen.at(-1).r, pz = String(98 - r).padStart(2, '0');
    iban = 'DE' + pz + bban;
    const schritt = (n, titel, inhalt, wichtig) =>
      `<div class="schritt${wichtig ? ' wichtig' : ''}"><div class="nummer${wichtig ? '' : ' b'}">${n}</div><div class="sinhalt"><p>${titel}</p>${inhalt}</div></div>`;
    B('bauWeg').innerHTML =
      schritt(1, `Kontonummer auf 10 Stellen${kto !== rk.wert ? ', vorn mit Nullen' : ''}, Prüfziffern erst einmal <strong>00</strong>:`,
        `<div class="pwz">${ibanHTML(roh)}</div>`) +
      schritt(2, 'DE00 nach hinten, D = 13 und E = 14:', `<div class="pwz mono gross2">${zahl.slice(0, 18)}<span class="luft"></span><span class="ic land">1314</span><span class="ic pz">00</span></div>`) +
      schritt(3, 'Stückweise durch 97 teilen:', restTab(zeilen)) +
      schritt(4, `Prüfziffern: 98 − ${r} = <strong>${98 - r}</strong>${98 - r < 10 ? `, zweistellig: <strong>${pz}</strong>` : ''}`,
        `<div class="pwz">${ibanHTML(iban, new Set([2, 3]))}</div><p class="klein">Probe: Diese IBAN in den Prüfer tippen – es bleibt Rest 1.</p>`, true);
    B('bauer').dataset.iban = iban;
  }
  [fb, fk].forEach(f => f.addEventListener('input', rechne));
  B('bauZufall').onclick = ()=>{
    const z = n => Array.from({length:n}, ()=> Math.floor(Math.random() * 10)).join('');
    const blz = String(1 + Math.floor(Math.random() * 8)) + z(7);
    fb.value = blz.slice(0, 3) + ' ' + blz.slice(3, 6) + ' ' + blz.slice(6);
    fk.value = String(1 + Math.floor(Math.random() * 9)) + z(4 + Math.floor(Math.random() * 6));
    rechne();
  };
  rechne();
  return { get iban(){ return iban; } };
})();

/* =====================================================================
   IBAN prüfen, mit eingebauten Fehlern
   ===================================================================== */
const PRUEFER = (function(){
  const feld = B('prFeld');
  let iban = null, rest = null, mark = new Set(), fehlerText = '';
  function zeige(){
    const zahl = zahlVon(iban), zeilen = stueckweise(zahl);
    rest = zeilen.at(-1).r;
    B('prWeg').innerHTML =
      `<div class="pwz">${ibanHTML(iban, mark)}</div>` +
      `<p class="klein">Nach hinten und ersetzen: <span class="mono">${zahl.slice(0, 18)} <b class="landt">1314</b> <b class="pzt">${iban.slice(2, 4)}</b></span></p>` +
      restTab(zeilen);
    const ok = rest === 1;
    B('prUrteil').className = 'urteil ' + (ok ? 'gut' : 'schlecht');
    B('prUrteil').innerHTML = ok ? `Rest 1<br><b>gültig</b>` : `Rest ${rest}<br><b>ungültig</b>`;
    B('prFehler').innerHTML = fehlerText;
    B('pruefer').dataset.rest = rest;
  }
  function eingabe(){
    mark = new Set(); fehlerText = '';
    const r = liesIBAN(feld.value);
    if(melde(feld, B('prMeldung'), r)){ iban = r.wert; zeige(); }
  }
  function setze(neu, m, text){
    feld.value = gruppen(neu); feld.classList.remove('falsch');
    B('prMeldung').className = 'meldung'; B('prMeldung').textContent = '';
    iban = neu; mark = m; fehlerText = text; zeige();
  }
  feld.addEventListener('input', eingabe);
  B('prMuster').onclick = ()=> setze(MUSTER, new Set(), '');
  B('prTipp').onclick = ()=>{
    if(!iban) return;
    const p = 2 + Math.floor(Math.random() * 20), alt = iban[p];
    let d; do{ d = String(Math.floor(Math.random() * 10)); }while(d === alt);
    setze(iban.slice(0, p) + d + iban.slice(p + 1), new Set([p]), `Eingebaut: Zeichen ${p + 1} war <strong>${alt}</strong>, jetzt <strong>${d}</strong>.`);
  };
  B('prDreh').onclick = ()=>{
    if(!iban) return;
    const moegl = []; for(let p = 2; p < 21; p++) if(iban[p] !== iban[p + 1]) moegl.push(p);
    if(!moegl.length) return;
    const p = moegl[Math.floor(Math.random() * moegl.length)];
    setze(iban.slice(0, p) + iban[p + 1] + iban[p] + iban.slice(p + 2), new Set([p, p + 1]),
      `Eingebaut: Zeichen ${p + 1} und ${p + 2} vertauscht (<strong>${iban[p]}${iban[p + 1]}</strong> → <strong>${iban[p + 1]}${iban[p]}</strong>).`);
  };
  eingabe();
  return { get iban(){ return iban; }, get rest(){ return rest; } };
})();

/* =====================================================================
   Fehlerjagd: alle Fehler an der Beispiel-IBAN gegen einen Teiler m
   ===================================================================== */
const JAGD = (function(){
  const feld = B('jgFeld');
  let ergebnis = null;
  /* Stelle p der IBAN (2…21) → Stellenwert in der umgestellten Zahl */
  const zahl = zahlVon(MUSTER), L = zahl.length;
  const index = p => p >= 4 ? p - 4 : L - 2 + (p - 2);
  const stellen = Array.from({length:20}, (_,k)=> k + 2);
  const zif = p => Number(MUSTER[p]);
  function zaehle(m){
    const w = {}; for(const p of stellen){ let x = 1; for(let k = 0; k < L - 1 - index(p); k++) x = x * 10 % m; w[p] = x; }
    const null_ = x => ((x % m) + m) % m === 0;
    const e = {ein:[0,0], nach:[0,0], vert:[0,0], zwei:[0,0]};
    for(const p of stellen) for(let d = 0; d < 10; d++) if(d !== zif(p)){ e.ein[1]++; if(null_((d - zif(p)) * w[p])) e.ein[0]++; }
    for(const p of stellen) for(const q of stellen){
      if(q <= p) continue;
      if(zif(p) !== zif(q)){
        const t = null_((zif(q) - zif(p)) * w[p] + (zif(p) - zif(q)) * w[q]);
        e.vert[1]++; if(t) e.vert[0]++;
        if(q === p + 1){ e.nach[1]++; if(t) e.nach[0]++; }
      }
      for(let a = 0; a < 10; a++) if(a !== zif(p)) for(let b = 0; b < 10; b++) if(b !== zif(q)){
        e.zwei[1]++; if(null_((a - zif(p)) * w[p] + (b - zif(q)) * w[q])) e.zwei[0]++;
      }
    }
    return e;
  }
  function zerlege(n){ const f = []; for(let t = 2; t * t <= n; t++) while(n % t === 0){ f.push(t); n /= t; } if(n > 1) f.push(n); return f; }
  const prozent = (a, b) => (a / b * 100).toLocaleString('de-DE', {maximumFractionDigits:1});
  function zeige(m){
    ergebnis = zaehle(m);
    const f = zerlege(m);
    B('jgZerl').innerHTML = f.length === 1 ? `<b>${m}</b> ist eine <strong>Primzahl</strong>.` : `<b>${m}</b> = ${f.join(' · ')} – keine Primzahl.`;
    const zeilen = [['ein','Ein Tippfehler'], ['nach','Zwei Nachbarn vertauscht'], ['vert','Zwei beliebige Ziffern vertauscht'], ['zwei','Zwei Tippfehler zugleich']];
    B('jgTab').innerHTML = zeilen.map(([k, t])=>{ const [d, n] = ergebnis[k];
      return `<div class="jz" data-k="${k}"><span class="jt">${t}</span><span class="jb"><i style="width:${d / n * 100}%"></i></span>
        <span class="jw${d ? ' rot' : ' gruen'}">${d ? `${tz(d)} von ${tz(n)} rutschen durch (${prozent(d, n)} %)` : `alle ${tz(n)} bemerkt`}</span></div>`; }).join('');
    B('jagd').dataset.m = m;
  }
  function eingabe(){ const r = liesGanz(feld.value, 'Teiler', 2, 99); if(melde(feld, B('jgMeldung'), r)) zeige(r.wert); }
  feld.addEventListener('input', eingabe);
  document.querySelectorAll('.jgbsp').forEach(k => k.onclick = ()=>{ feld.value = k.dataset.t; eingabe(); });
  eingabe();
  return { get ergebnis(){ return ergebnis; } };
})();

/* =====================================================================
   Rest-Tafel: a Plätze in Reihen zu b
   ===================================================================== */
const RESTTAFEL = (function(){
  const fa = B('rtA'), fb = B('rtB');
  let stand = null;
  function zeige(a, b){
    const q = Math.floor(a / b), r = a % b, reihen = Math.ceil(a / b) || 1;
    const breite = Math.min(560, innerWidth - 70, (B('rtFeld').parentElement.clientWidth || 560) - 8), hoehe = document.documentElement.classList.contains('handy') ? 420 : 330;
    const g = Math.max(6, Math.min(26, Math.floor(breite / b) - 3, Math.floor(hoehe / reihen) - 3));
    const feld = B('rtFeld');
    feld.style.gridTemplateColumns = `repeat(${b}, ${g}px)`; feld.style.gap = g > 12 ? '3px' : '2px';
    let h = '';
    for(let k = 0; k < reihen * b; k++) h += `<i class="${k < q * b ? 'voll' : k < a ? 'rest' : ''}" style="width:${g}px;height:${g}px"></i>`;
    feld.innerHTML = h;
    stand = {a, b, q, r};
    B('rtErg').innerHTML = `<p class="mono gl">${a} : ${b} = ${q} <b>Rest ${r}</b></p><p class="mono gl2">${a} = ${q} · ${b} + ${r}</p>` +
      `<p class="klein">${q} volle Reihe${q === 1 ? '' : 'n'} zu ${b}, ${r} übrig. ` +
      (r === 0 ? `<strong>Geht auf: ${b} ist ein Teiler von ${a}.</strong>` : `Der Rest ist kleiner als ${b} – sonst gäbe es noch eine volle Reihe.`) + '</p>';
    B('resttafel').dataset.stand = JSON.stringify(stand);
  }
  function rechne(){
    const ra = liesGanz(fa.value, 'Zahl a', 0, 150), rb = liesGanz(fb.value, 'Reihenlänge b', 2, 30);
    fa.classList.toggle('falsch', !!ra.fehler); fb.classList.toggle('falsch', !!rb.fehler);
    const f = ra.fehler || rb.fehler;
    B('rtMeldung').className = f ? 'meldung nein' : 'meldung'; B('rtMeldung').textContent = f || '';
    if(!f && !ra.leer && !rb.leer) zeige(ra.wert, rb.wert);
  }
  [fa, fb].forEach(f => f.addEventListener('input', rechne));
  addEventListener('handy-wechsel', rechne); addEventListener('resize', rechne);
  document.querySelectorAll('.rtbsp').forEach(k => k.onclick = ()=>{ fa.value = k.dataset.a; fb.value = k.dataset.b; rechne(); });
  rechne();
  return { get stand(){ return stand; } };
})();

/* =====================================================================
   Primzahlen: alle Reste von n : 2 … n − 1
   ===================================================================== */
const PRIM = (function(){
  const feld = B('pmFeld');
  let teiler = null;
  function zeige(n){
    teiler = [];
    let h = '';
    for(let b = 2; b < n; b++){ const r = n % b; if(!r) teiler.push(b); h += `<div class="pm${r ? '' : ' null'}"><b>${b}</b><span>${r}</span></div>`; }
    B('pmGitter').innerHTML = h || '<p class="klein">Zwischen 1 und 2 gibt es nichts zum Probieren.</p>';
    B('pmGitter').classList.toggle('dicht', n > 120);
    B('pmUrteil').className = 'pmurteil ' + (teiler.length ? 'nein' : 'ja');
    B('pmUrteil').innerHTML = teiler.length
      ? `${n} lässt sich teilen durch <strong>${teiler.join(', ')}</strong> – keine Primzahl.`
      : `Nie Rest 0: <strong>${n} ist eine Primzahl</strong> – nur durch 1 und ${n} teilbar.`;
    B('prim').dataset.teiler = teiler.join(',');
  }
  function eingabe(){ const r = liesGanz(feld.value, 'Zahl', 2, 200); if(melde(feld, B('pmMeldung'), r)) zeige(r.wert); }
  feld.addEventListener('input', eingabe);
  document.querySelectorAll('.pmbsp').forEach(k => k.onclick = ()=>{ feld.value = k.dataset.n; eingabe(); });
  eingabe();
  return { get teiler(){ return teiler; } };
})();

<script data-handy="technik/handy/handy.js">
/* =====================================================================
   HANDY-SCHICHT — schaltet die Handy-Ansicht, wenn die Bühne 1280 × 720 zu stark
   verkleinert würde (Maßstab unter 0,62: Handy hoch und quer, Tablet hochkant).
   Muss NACH der Folien-Navigation des Rahmens stehen (nutzt stage, zeige, skalieren).
   Meldet Wechsel mit dem Ereignis „handy-wechsel", damit Rechner neu zeichnen können.
   ===================================================================== */
(function(){
  const html = document.documentElement;
  const istHandy = () => Math.min(innerWidth / 1280, innerHeight / 720) < 0.62;
  let vorher = null;
  function pruefen(){
    const h = istHandy();
    html.classList.toggle('handy', h);
    if (h) stage.style.transform = 'none';
    else if (typeof skalieren === 'function') skalieren();
    if (h !== vorher){ vorher = h; window.dispatchEvent(new CustomEvent('handy-wechsel', { detail: h })); }
  }
  addEventListener('resize', pruefen);
  addEventListener('orientationchange', () => setTimeout(pruefen, 200));
  pruefen();

  // Neue Folie (und nur dann, nicht bei jedem Knopf): nach oben scrollen
  const wach = new MutationObserver((liste) => {
    if (!html.classList.contains('handy')) return;
    if (liste.some((m) => m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))) window.scrollTo(0, 0);
  });
  document.querySelectorAll('.slide').forEach((f) => wach.observe(f, { attributes: true, attributeFilter: ['class'], attributeOldValue: true }));

  // Beim Scrollen tippt man oft auf Text: auf dem Handy blättert ein Tipp nicht weiter
  stage.addEventListener('click', (e) => {
    if (html.classList.contains('handy') && !e.target.closest('a, button, input, select, textarea, label, .interaktiv')) e.stopPropagation();
  }, true);
})();
</script><!-- /HANDY-SCHICHT -->
