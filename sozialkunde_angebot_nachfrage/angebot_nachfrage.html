/* ==== HANDY-SCHICHT: technik/handy/handy.css ==== */
/* =====================================================================
   HANDY-SCHICHT für den Rahmen der Vorlagen (ds1 / Folgen) — plus eine Regel für alle Ansichten:
   zu viel Inhalt scrollt statt abgeschnitten zu werden.
   Greift nur, wenn handy.js <html class="handy"> setzt: Bildschirm zu klein für die
   Bühne 1280 × 720 (Handy, Tablet hochkant). Beamer, Laptop und Druck bleiben unberührt.
   Aus der Bühne wird eine scrollbare Seite pro Folie; Raster werden einspaltig,
   Schrift mindestens 14 px, Knöpfe mindestens 40 px (Finger).
   ===================================================================== */
/* ---- Für ALLE Ansichten (auch Beamer): nie abschneiden. Passt der Inhalt einer Folie nicht,
        scrollt der Inhaltsbereich; Kopf und Fuß bleiben stehen. ---- */
#stage .slide .inhalt{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#C4DFF2 transparent;
  margin-bottom:-10px}   /* bis an die Fußzeilenlinie: der freie Rand darüber gehört zum Inhalt (Folgen nutzt ihn) */
@media print{#stage .slide .inhalt{overflow:visible}}            /* Druck: alles zeigen */

html.handy, html.handy body{height:auto;overflow-x:hidden;overflow-y:auto}
html.handy body{display:block;background:var(--papier)}
html.handy #stage{width:100%;height:auto;transform:none!important}
html.handy .slide{position:relative;inset:auto;display:none;min-height:100vh;border-radius:0;box-shadow:none;
  padding:64px 14px 84px;transform:none;transition:none;overflow:visible}
html.handy .slide.aktiv{display:flex}

/* Kopf, Überschriften, Fuß */
html.handy .kopf{height:48px;padding:0 12px;gap:10px}
html.handy .kopf img{height:34px}
html.handy .kopf .schule{font-size:14px;letter-spacing:.06em}
html.handy .kopf .kurs{display:none}
html.handy h1{font-size:34px}
html.handy h2, html.handy .slide.kompakt h2{font-size:25px}
html.handy .eyebrow{font-size:14px;letter-spacing:.12em}
html.handy .titelzeile, html.handy .slide.kompakt .titelzeile{margin-bottom:14px}
html.handy .inhalt, html.handy #stage .slide .inhalt{display:block;overflow:visible;margin-bottom:0}   /* Handy: die Seite scrollt, nicht die Folie */
html.handy .fuss{position:static;margin-top:22px;font-size:14px;gap:10px}
html.handy p, html.handy li{font-size:17px}
html.handy .klein, html.handy .hinweis{font-size:15px}

/* Titelfolie: untereinander */
html.handy .slide.titel{display:none;grid-template-columns:1fr;padding:0}
html.handy .slide.titel.aktiv{display:grid}
html.handy .slide.titel .links{padding:40px 20px 24px}
html.handy .slide.titel .rechts{padding:24px 0 90px;border-left:none;border-top:1px solid rgba(255,255,255,.16)}
html.handy .slide.titel .unter{font-size:18px}
html.handy .slide.titel .meta span{font-size:14px}
html.handy .slide.titel .logokachel{border-radius:26px;padding:16px 18px}
html.handy .slide.titel .logokachel img{width:110px}
html.handy .slide.titel svg{max-width:100%;height:auto}

/* Raster und Karten: einspaltig */
html.handy .raster, html.handy .g2, html.handy .g3, html.handy .g4{grid-template-columns:1fr!important}
html.handy .karte p, html.handy .karte li{font-size:16px}

/* Finger: Knöpfe und Felder mindestens 40 px */
html.handy .knopf{min-height:42px;min-width:42px;font-size:15.5px;padding:8px 14px}
html.handy input, html.handy select{min-height:42px;font-size:16px}   /* 16 px: iOS zoomt sonst beim Tippen */
html.handy #nav{right:10px;bottom:10px;padding:6px 8px;gap:6px}
html.handy #nav button{width:42px;height:42px;font-size:18px}
html.handy #zaehler{font-size:14px}
html.handy svg{max-width:100%;height:auto}
/* ==== /HANDY-SCHICHT ==== */
:root{
  --blau:#136EA9;
  --blau-d:#0C4E79;
  --blau-h:#3E93CE;
  --blau-pastell:#E3F0F9;
  --orange:#F3A92F;
  --orange-d:#D98908;
  --orange-pastell:#FDF0DA;
  --tinte:#16232E;
  --grau:#5B6A76;
  --linie:#D8E2EA;
  --papier:#FFFFFF;
  --bg:#EAF1F6;
  --rot:#C62828;
  --gruen:#2E7D32;
  --stage-w:1280px;
  --stage-h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:"Sansation","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

#stage{
  position:relative;
  width:var(--stage-w);height:var(--stage-h);
  transform-origin:center center;
  flex:none;
}
.slide{
  position:absolute;inset:0;
  background:var(--papier);
  border-radius:14px;
  box-shadow:0 18px 50px rgba(12,78,121,.22), 0 2px 6px rgba(12,78,121,.12);
  overflow:hidden;
  padding:86px 62px 58px;
  opacity:0;visibility:hidden;
  transform:translateY(14px) scale(.995);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
  display:flex;flex-direction:column;
}
.slide.aktiv{opacity:1;visibility:visible;transform:none}

.kopf{
  position:absolute;top:0;left:0;right:0;height:58px;
  background:linear-gradient(100deg,var(--blau-d) 0%,var(--blau) 55%,var(--blau-h) 100%);
  display:flex;align-items:center;gap:14px;
  padding:0 22px 0 18px;
  color:#fff;
  z-index:5;
}
.kopf::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 34%,#F6C46E 34%,#F6C46E 100%);
}
.kopf img{height:40px;width:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.kopf .schule{font-size:13px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.95}
.kopf .kurs{
  margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  padding:5px 12px;border-radius:999px;
}

h1{font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:40px;line-height:1.12;font-weight:800;letter-spacing:-.015em;color:var(--blau-d)}
h3{font-size:20px;font-weight:750;color:var(--blau-d)}
p,li{font-size:19px;line-height:1.5;color:var(--tinte)}
.klein{font-size:16px;line-height:1.45;color:var(--grau)}
.eyebrow{
  font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--orange-d);margin-bottom:10px;
}
.titelzeile{margin-bottom:26px;flex:none}
.titelzeile h2::after{
  content:"";display:block;width:64px;height:5px;border-radius:3px;
  background:var(--orange);margin-top:12px;
}
.slide.kompakt .titelzeile{margin-bottom:14px}
.slide.kompakt h2{font-size:32px}
.slide.kompakt h2::after{margin-top:8px;height:4px;width:52px}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center}
strong{color:var(--blau-d)}
em{font-style:normal;background:linear-gradient(transparent 62%, var(--orange-pastell) 62%);padding:0 2px}

.raster{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.karte{
  background:var(--papier);
  border:1px solid var(--linie);
  border-radius:12px;
  padding:20px 22px;
  box-shadow:0 2px 0 rgba(19,110,169,.05);
  display:flex;flex-direction:column;gap:8px;
}
.karte.blau{background:var(--blau-pastell);border-color:#C4DFF2}
.karte.orange{background:var(--orange-pastell);border-color:#F3DCAF}
.karte.voll{background:linear-gradient(150deg,var(--blau-d),var(--blau));border:none;color:#fff}
.karte.voll h3,.karte.voll strong{color:#fff}
.karte.voll p,.karte.voll li{color:rgba(255,255,255,.92)}
.karte .icon{font-size:26px;line-height:1}
.karte p,.karte li{font-size:17px;line-height:1.45}

.nummer{
  width:38px;height:38px;flex:none;border-radius:10px;
  background:var(--orange);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;
}
.nummer.b{background:var(--blau)}
.zeile{display:flex;gap:16px;align-items:flex-start}

ul.liste{list-style:none;display:flex;flex-direction:column;gap:11px}
ul.liste li{position:relative;padding-left:30px}
ul.liste li::before{
  content:"";position:absolute;left:6px;top:.55em;
  width:9px;height:9px;border-radius:3px;background:var(--orange);
}
ul.liste.blaupunkt li::before{background:var(--blau)}
ul.liste.eng{gap:7px}
ul.liste.eng li{font-size:16px}

.chip{
  display:inline-block;padding:6px 14px;border-radius:999px;
  background:var(--blau-pastell);color:var(--blau-d);
  font-size:16px;font-weight:650;border:1px solid #C4DFF2;
}
.chip.o{background:var(--orange-pastell);color:var(--orange-d);border-color:#F3DCAF}

.zitat{
  border-left:6px solid var(--orange);
  padding:6px 0 6px 22px;
  font-size:26px;line-height:1.35;font-weight:600;color:var(--blau-d);
}
.grossezahl{font-size:76px;font-weight:800;line-height:1;color:var(--orange);letter-spacing:-.03em}

.fuss{
  position:absolute;left:62px;right:62px;bottom:20px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;color:var(--grau);
  border-top:1px solid var(--linie);padding-top:9px;
}

/* ---------- Titel ---------- */
.slide.titel{
  padding:0;
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(243,169,47,.20), transparent 62%),
    linear-gradient(140deg,#0A4470 0%, var(--blau-d) 40%, var(--blau) 100%);
  color:#fff;
  display:grid;grid-template-columns:1.35fr .65fr;
}
.slide.titel .links{padding:74px 56px 56px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.slide.titel .rechts{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.16);
  position:relative;z-index:2;
}
.slide.titel .logokachel{
  background:#fff;border-radius:38px;padding:28px 30px;
  box-shadow:0 20px 46px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
}
.slide.titel .logokachel img{width:168px;display:block}
.slide.titel h1{color:#fff}
.slide.titel .eyebrow{color:var(--orange)}
.slide.titel .unter{font-size:23px;color:rgba(255,255,255,.9);margin-top:18px;max-width:640px}
.slide.titel .meta{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.slide.titel .meta span{
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);
  padding:8px 16px;border-radius:999px;font-size:15.5px;font-weight:600;
}
.slide.titel .balken{height:6px;width:110px;background:var(--orange);border-radius:4px;margin-bottom:26px}
.titelfaecher{position:relative;height:150px;width:250px;margin-top:6px}
.titelfaecher .sk{position:absolute;left:83px;top:10px;transform-origin:50% 120%}

.bitregen{
  position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:15px;line-height:1.75;letter-spacing:.34em;
  color:rgba(255,255,255,.085);word-break:break-all;
}
.bitregen div{animation:bitfluss 26s linear infinite}
@keyframes bitfluss{from{transform:translateY(0)}to{transform:translateY(-50%)}}

.slide.schluss{grid-template-columns:1fr}
.slide.schluss .links{align-items:center;text-align:center;padding:60px 120px}
.slide.schluss img{width:64px;margin-bottom:34px;background:rgba(255,255,255,.92);border-radius:50%;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.zitatgross{font-size:40px;line-height:1.28;font-weight:700;letter-spacing:-.015em;color:#fff;max-width:960px}
.zitatgross .strich{display:block;width:56px;height:5px;background:var(--orange);border-radius:3px;margin:26px auto 20px}
.quelle{font-size:18px;font-weight:600;color:var(--orange);letter-spacing:.06em}

/* ---------- Interaktive Bühnen (allgemein) ---------- */
.interaktiv{cursor:default}
.knopfleiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.knopf{
  font:inherit;font-size:16px;font-weight:700;
  border:none;border-radius:999px;padding:9px 18px;cursor:pointer;
  background:var(--blau);color:#fff;
  box-shadow:0 2px 0 rgba(12,78,121,.25);
  transition:background .15s, opacity .15s, transform .1s;
}
.knopf:hover{background:var(--blau-d)}
.knopf:active{transform:translateY(1px)}
.knopf.o{background:var(--orange);color:#3A2500}
.knopf.o:hover{background:var(--orange-d)}
.knopf.hell{background:var(--blau-pastell);color:var(--blau-d);box-shadow:none;border:1px solid #C4DFF2}
.knopf.hell:hover{background:#D2E7F6}
.knopf.hell.an{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.knopf:disabled{opacity:.35;cursor:not-allowed}
.knopf.aus{display:none}
.status{font-size:19px;font-weight:700;color:var(--blau-d);min-height:28px}
.status .sub{font-weight:600;color:var(--grau);font-size:16px}

/* Tabelle */
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:19px}
table.tab th{background:var(--blau-d);color:#fff;text-align:left;padding:10px 16px;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
table.tab th:first-child{border-top-left-radius:10px}
table.tab th:last-child{border-top-right-radius:10px}
table.tab td{padding:9px 16px;border-bottom:1px solid var(--linie)}
table.tab tr:nth-child(even) td{background:#F6FAFD}
table.tab td.z{font-weight:800;color:var(--orange-d);font-size:22px}

/* Schritte */
.schritte{display:flex;flex-direction:column;gap:9px}
.schritt{display:flex;gap:14px;align-items:center;background:var(--papier);border:1px solid var(--linie);border-radius:11px;padding:9px 14px}
.schritt .nummer{width:34px;height:34px;font-size:17px}
.schritt p{font-size:18px;line-height:1.35}
.schritt.wichtig{background:var(--orange-pastell);border-color:#F3DCAF}

.frag{opacity:0;transform:translateY(10px);transition:opacity .34s ease,transform .34s ease}
.frag.an{opacity:1;transform:none}
.frag.vl{transform:translateX(-22px)}
.frag.vr{transform:translateX(22px)}
.frag.vl.an,.frag.vr.an{transform:none}

#fortschritt{
  position:fixed;left:0;top:0;height:4px;background:var(--orange);
  width:0;transition:width .3s ease;z-index:50;
}
#nav{
  position:fixed;right:18px;bottom:14px;z-index:50;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
  border:1px solid var(--linie);border-radius:999px;padding:5px 8px;
  box-shadow:0 4px 14px rgba(12,78,121,.14);
}
#nav button{
  border:none;background:var(--blau-pastell);color:var(--blau-d);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:800;
}
#nav button:hover{background:var(--blau);color:#fff}
#zaehler{font-size:13px;font-weight:700;color:var(--grau);padding:0 6px;min-width:52px;text-align:center}

#uebersicht{
  position:fixed;inset:0;background:rgba(10,68,112,.96);z-index:100;
  display:none;padding:34px;overflow:auto;
}
#uebersicht.an{display:block}
#uebersicht h4{color:#fff;font-size:18px;margin-bottom:18px;font-weight:700}
#uebersicht .gitter{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#uebersicht .mini{
  background:#fff;border-radius:8px;padding:14px;cursor:pointer;
  border:3px solid transparent;min-height:78px;
}
#uebersicht .mini:hover{border-color:var(--orange)}
#uebersicht .mini .nr{font-size:11px;font-weight:800;color:var(--orange-d)}
#uebersicht .mini .tt{font-size:14px;font-weight:700;color:var(--blau-d);margin-top:3px;line-height:1.25}

@media print{
  @page{size:A4 landscape;margin:0}
  body{display:block;background:#fff;overflow:visible}
  #stage{transform:none!important;width:100%;height:auto}
  .slide{
    position:relative;visibility:visible;opacity:1;transform:none;
    width:1280px;height:720px;page-break-after:always;box-shadow:none;border-radius:0;
  }
  .frag{opacity:1!important;transform:none!important}
  #nav,#fortschritt,#uebersicht{display:none!important}
}

/* ================= Angebot und Nachfrage (diese Präsentation) =================
   Nachfrage = Blau, Angebot = Orange – überall gleich (Karten, Kurven, Punkte). */
:root{ --n:var(--blau); --a:var(--orange-d); }
.farbe-n{color:var(--n)} .farbe-a{color:var(--a)}
.punkt{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}
.punkt.n{background:var(--n)} .punkt.a{background:var(--a)}

/* Titel */
.preisregen{font-size:22px;letter-spacing:.2em;line-height:2.1;color:rgba(255,255,255,.07)}
.titelkreuz{width:230px;height:auto}
.tk-achse{fill:none;stroke:rgba(255,255,255,.75);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tk-n{stroke:#9FC3DE;stroke-width:7;stroke-linecap:round}
.tk-a{stroke:var(--orange);stroke-width:7;stroke-linecap:round}
.tk-gg{fill:#fff;stroke:var(--blau-d);stroke-width:3}
.tk-t{fill:#9FC3DE;font-size:20px;font-weight:800}
.tk-t.o{fill:var(--orange)}
.schlusszeile{color:rgba(255,255,255,.88);font-size:21px;margin-top:28px;max-width:760px}

/* Markt */
.markt .karte{align-items:flex-start}
.ikon{width:58px;height:58px;fill:none;stroke:var(--blau);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

/* Zwei Seiten */
.ziele{display:grid;grid-template-columns:1fr 250px 1fr;gap:22px;align-items:center}
.ziele .karte{min-height:200px;justify-content:center}
.ziele .karte p:last-child{font-size:21px}
.seitenkopf{display:flex;align-items:center;gap:10px}
.seitenkopf h3{font-size:24px}
.zugseil svg{width:100%;height:auto;display:block}
.zs-skala{stroke:var(--linie);stroke-width:8;stroke-linecap:round}
.zs-strich{stroke:var(--grau);stroke-width:2}
.zs-t{fill:var(--grau);font-size:17px;font-weight:700}
.zs-pfeil{stroke-width:9;stroke-linecap:round}
.zs-pfeil.n{stroke:var(--n)} .zs-pfeil.a{stroke:var(--a)}
.zs-spitze.n{fill:var(--n)} .zs-spitze.a{fill:var(--a)}
.zs-gg{fill:#fff;stroke:var(--tinte);stroke-width:4}

/* Umfrage-Tabelle */
table.umfrage th,table.umfrage td{text-align:center;font-size:21px;padding:10px 6px}
table.umfrage th:first-child,table.umfrage td:first-child{text-align:left;padding-left:16px;width:150px}
table.umfrage th.gg{background:var(--orange);color:#3A2500}
table.umfrage .zeile-a td{color:var(--a);font-weight:800}
table.umfrage .zeile-n td{color:var(--n);font-weight:800}
table.umfrage td:first-child{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
table.umfrage td.gg{box-shadow:inset 3px 0 0 var(--orange),inset -3px 0 0 var(--orange)}
table.umfrage tr:last-child td.gg{box-shadow:inset 3px 0 0 var(--orange),inset -3px 0 0 var(--orange),inset 0 -3px 0 var(--orange)}
.kante-a{border-top:5px solid var(--a)}
.kante-n{border-top:5px solid var(--n)}

/* Diagramme */
.zweiteilig{grid-template-columns:1.25fr 1fr;gap:30px;align-items:center}
.dia{width:100%;min-width:0}
.dia svg{display:block;overflow:visible}
.ax{fill:none;stroke:var(--tinte);stroke-width:2.2}
.axs{fill:var(--tinte)}
.tick{stroke:var(--tinte);stroke-width:1.6}
.tt{fill:var(--grau);font-size:15px;font-weight:600}
.axt{fill:var(--tinte);font-size:16px;font-weight:700}
.k-n,.k-a{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.k-n{stroke:var(--n)} .k-a{stroke:var(--a)}
.k-n.alt,.k-a.alt{stroke-width:3;stroke-dasharray:7 7;opacity:.4}
.pt-n{fill:var(--n);stroke:#fff;stroke-width:2}
.pt-a{fill:var(--a);stroke:#fff;stroke-width:2}
.gg{fill:#fff;stroke:var(--tinte);stroke-width:4}
.gg.alt{stroke:var(--grau);stroke-width:2.5;opacity:.6}
.hilf{fill:none;stroke:var(--grau);stroke-width:1.6;stroke-dasharray:5 5}
.hilf.blass{opacity:.45}
.lbl{font-size:18px;font-weight:800;fill:var(--tinte)}
.lbl.n{fill:var(--n)} .lbl.a{fill:var(--a)}
.lbl.blass{opacity:.5}
.lbl.klein{font-size:15px;font-weight:700;fill:var(--grau)}
.lbl.klein.stark{fill:var(--tinte)}
.lbl.gg-t{fill:var(--tinte)}
.lbl.markt{font-size:16px;fill:var(--grau);letter-spacing:.04em}
.preislinie{stroke:var(--tinte);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
.lbl.preis-t{font-size:16px}
.luecke-a{stroke:var(--orange-pastell);stroke-width:16;stroke-linecap:round}
.luecke-n{stroke:var(--blau-pastell);stroke-width:16;stroke-linecap:round}
.hoechst{stroke:var(--rot);stroke-width:3}
.lbl.hp-t{fill:var(--rot);font-size:16px}
.pf-n,.pf-o{fill:none;stroke-width:3;stroke-linecap:round}
.pf-n{stroke:var(--n)} .pf-o{stroke:var(--a)}
.pf-n.spitze{fill:var(--n);stroke:none} .pf-o.spitze{fill:var(--a);stroke:none}

/* Ebenen des Kreuzes erscheinen mit den Schritten */
.lage{opacity:0;transition:opacity .35s ease}
.slide:has(.schritt2.an) .lage2,
.slide:has(.schritt3.an) .lage3,
.slide:has(.schritt4.an) .lage4{opacity:1}
@media print{.lage{opacity:1}}

/* Pendeln */
.steuerkopf{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grau);margin-bottom:8px}
.preise{gap:8px}
.preise .knopf{min-width:62px;padding:9px 10px}
.pendelseite,.simseite,.elastseite{display:flex;flex-direction:column;gap:14px}
.pendelbefund{display:flex;flex-direction:column;gap:10px;min-height:190px}
.bef{border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:3px}
.bef b{font-size:21px}
.bef span{font-size:16px;color:var(--tinte)}
.bef.gg{background:linear-gradient(150deg,var(--blau-d),var(--blau))}
.bef.gg b,.bef.gg span,.bef.gg strong{color:#fff}
.bef.ueber-a{background:var(--orange-pastell);border:1px solid #F3DCAF}
.bef.ueber-a b{color:var(--orange-d)}
.bef.ueber-n{background:var(--blau-pastell);border:1px solid #C4DFF2}
.bef.ueber-n b{color:var(--blau-d)}
.pendelbefund p,.simbefund p,.elastbefund p{font-size:17px;line-height:1.45}
.richtung{font-size:20px;font-weight:800;color:var(--blau-d)}

/* Neustadt */
.summenbalken{display:flex;height:96px;border-radius:12px;overflow:hidden;margin-top:18px;gap:3px}
.sb{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;min-width:0}
.sb b{font-size:24px} .sb span{font-size:14px;font-weight:700;opacity:.92}
.sb.s1{background:var(--blau-h)} .sb.s2{background:var(--blau)} .sb.s3{background:var(--blau-d)} .sb.s4{background:#0A4470}
.summe{font-size:24px;font-weight:700;text-align:center;margin-top:14px;color:var(--tinte)}
.summe b{color:var(--n);font-size:30px}

/* Bewegung oder Verschiebung */
.bvspalte{display:flex;flex-direction:column;gap:10px}

/* Gründe */
.gruende{gap:28px}
.gruende .spalte{display:flex;flex-direction:column;gap:10px}
.spaltenkopf{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;padding-bottom:6px;border-bottom:3px solid var(--linie)}
.spaltenkopf.n{color:var(--n);border-color:var(--n)} .spaltenkopf.a{color:var(--a);border-color:var(--a)}
.grund{display:flex;gap:14px;align-items:center;border:1px solid var(--linie);border-radius:11px;padding:9px 14px;background:#fff}
.grund .nummer{width:34px;height:34px;font-size:17px}
.grund p{font-size:18px;line-height:1.35}

/* Verschieben */
.simzeile{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.simname{display:flex;align-items:center;gap:8px;width:130px;font-size:18px;font-weight:800;color:var(--tinte)}
.simname.n{color:var(--n)} .simname.a{color:var(--a)}
.simbefund{display:flex;flex-direction:column;gap:10px}
.ergebnis{display:flex;gap:10px;flex-wrap:wrap}
.ergebnis span{font-size:19px;font-weight:800;border-radius:999px;padding:6px 16px}
.ergebnis .hoch{background:var(--tinte);color:#fff}
.ergebnis .runter{background:#fff;color:var(--tinte);box-shadow:inset 0 0 0 2px var(--tinte)}
.ergebnis .gleich{background:#F1F4F7;color:var(--grau)}
.faelle{gap:8px}
.faelle .knopf{min-width:48px;padding:9px 12px}
.schlagzeile{border-left:6px solid var(--orange);background:#F6FAFD;border-radius:0 12px 12px 0;padding:12px 18px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.schlagzeile b{font-size:22px;line-height:1.3;color:var(--blau-d);font-family:Georgia,"Times New Roman",serif}
.schlagzeile span{font-size:16px;color:var(--grau)}

/* Fernbus */
.balkengruppen{display:flex;flex-direction:column;gap:16px}
.bgname{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grau);margin-bottom:6px}
.bgz{display:grid;grid-template-columns:66px 1fr 104px;gap:12px;align-items:center;margin-bottom:5px}
.bgz span{font-size:16px;font-weight:700;color:var(--grau)}
.bgz b{font-size:18px;color:var(--blau-d)}
.bgb{height:22px;width:var(--w);background:linear-gradient(90deg,var(--blau-d),var(--blau-h));border-radius:6px}
.bg.preis .bgb{background:linear-gradient(90deg,var(--orange-d),var(--orange))}
.bg.preis .bgz b{color:var(--orange-d)}
.zeitstrahl{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.zs{border:1px solid var(--linie);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:#fff;position:relative}
.zs p{font-size:17px}
.zs:not(:last-child)::after{content:"";position:absolute;right:-13px;top:50%;width:10px;height:10px;border-top:3px solid var(--blau);border-right:3px solid var(--blau);transform:translateY(-50%) rotate(45deg)}
.zs.ende{background:var(--orange-pastell);border-color:#F3DCAF}

/* Elastizität */
.rechnung{display:flex;flex-direction:column;gap:6px}
.rechnung div{display:grid;grid-template-columns:80px 1fr 90px;align-items:baseline;border-bottom:1px solid var(--linie);padding-bottom:5px}
.rechnung span{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--grau)}
.rechnung b{font-size:20px;color:var(--tinte)}
.rechnung i{font-style:normal;font-size:20px;font-weight:800;color:var(--blau-d);text-align:right}

/* ---------- Handy ---------- */
.nurhandy{display:none}
/* PS5: Variante A (Karten) und B (Kreuz) */
.ps5a{grid-template-columns:1fr 1.15fr;gap:24px;align-items:start}
.ps5spalte{display:flex;flex-direction:column;gap:14px}
.stand{color:var(--grau);margin-top:4px}
.richtung{font-size:15px!important;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.richtung.a{color:var(--a)} .richtung.n{color:var(--n)}
.richtung.a::before{content:"◀ "} .richtung.n::after{content:" ▶"}
.preiskette{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preiskette span{display:flex;flex-direction:column;align-items:center;background:var(--orange-pastell);border:1px solid #F3DCAF;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--grau)}
.preiskette b{font-size:19px;color:var(--orange-d)}
.preiskette i{font-style:normal;font-weight:800;color:var(--grau)}
.simzeile [data-ps]{flex:1}

/* Kritik */
.kritikzitat{font-size:21px;margin-bottom:12px}
.kritik{align-items:start;gap:14px}
.kritikfuss{margin-top:12px;padding:12px 20px}
.beleg.hell{color:rgba(255,255,255,.8);display:block}
.kritikstrahl{margin-top:4px}
.kritikstrahl .zs .klein{font-size:15px}
.kritikzitat + .kritik .karte h3{font-size:20px}
.kritik .karte{padding:14px 18px}
.kritikzitat .beleg{display:block;margin-top:4px}
.kritikzitat .uebersetzung{font-weight:500;font-style:italic}
.beleg{font-size:14px!important;font-weight:600;color:var(--grau);letter-spacing:.01em;margin-top:2px}
.kritik .karte{justify-content:flex-start;gap:4px}
.kritik .karte .klein + .beleg{margin-bottom:6px}
html.handy .nurhandy{display:inline}
html.handy .nichthandy{display:none}
html.handy .zweiteilig,html.handy .ziele{grid-template-columns:1fr}
html.handy .zugseil{max-width:170px;margin:0 auto}
html.handy .ziele .karte{min-height:0}
html.handy .ziele .karte p:last-child{font-size:18px}
html.handy table.umfrage th,html.handy table.umfrage td{font-size:15px;padding:6px 2px}
html.handy table.umfrage th:first-child,html.handy table.umfrage td:first-child{width:auto;padding-left:6px;font-size:14px;letter-spacing:0}
html.handy .umfrage{display:block;overflow-x:auto}
html.handy .summenbalken{height:auto;flex-direction:column}
html.handy .sb{flex:none!important;padding:8px}
html.handy .sb b{font-size:19px}
html.handy .summe{font-size:18px}
html.handy .summe b{font-size:22px}
html.handy .zeitstrahl{grid-template-columns:1fr}
html.handy .zs:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:-13px;transform:translateX(-50%) rotate(135deg)}
html.handy .bgz{grid-template-columns:58px 1fr 86px}
html.handy .bgz b{font-size:15px}
html.handy .simname{width:100%}
html.handy .schlagzeile b{font-size:18px}
html.handy .preise .knopf{min-width:56px}
html.handy .knopf{min-height:40px}
html.handy .pendelbefund{min-height:0}
html.handy .rechnung div{grid-template-columns:64px 1fr 72px}
html.handy .rechnung b,html.handy .rechnung i{font-size:17px}
html.handy .titelkreuz{width:170px}
html.handy .preisregen{font-size:16px}
html.handy .ikon{width:44px;height:44px}
html.handy .ps5a{grid-template-columns:1fr}
html.handy .preiskette b{font-size:17px}

</style>
</head>

<script>
/* =====================================================================
   Folien aufbauen und navigieren (Rahmen wie ds2)
   ===================================================================== */
const stage = document.getElementById('stage');

folien.forEach((f,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (f.klasse ? ' '+f.klasse : '');
  let html = '';
  if(!(f.klasse||'').split(' ').includes('titel')){
    html += `<header class="kopf">
        <img src="${LOGO}" alt="">
        <span class="schule">Montessori-Schule Landau</span>
        <span class="kurs">${KURS}</span>
      </header>`;
    if(f.h2){
      html += `<div class="titelzeile">${f.eyebrow?`<div class="eyebrow">${f.eyebrow}</div>`:''}<h2>${f.h2}</h2></div>`;
    }
    html += `<div class="inhalt">${f.roh}</div>`;
    html += `<div class="fuss"><span>${REIHE}</span><span>${i+1} / ${folien.length}</span></div>`;
  } else {
    html = f.roh;
  }
  el.innerHTML = html;
  stage.appendChild(el);
});

const slides = [...document.querySelectorAll('.slide')];
let i = 0, schritt = 0;

function frags(n){
  const alle = [...slides[n].querySelectorAll('.frag')];
  return alle
    .map((el,k)=>({el, ord: el.dataset.schritt ? parseFloat(el.dataset.schritt) : k+1, k}))
    .sort((a,b)=> a.ord - b.ord || a.k - b.k)
    .map(x=>x.el);
}

function zeige(n, alleFragmente=false){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('aktiv', k===i));
  const fr = frags(i);
  schritt = alleFragmente ? fr.length : 0;
  fr.forEach((f,k)=>f.classList.toggle('an', k<schritt));
  document.getElementById('zaehler').textContent = (i+1)+' / '+slides.length;
  document.getElementById('fortschritt').style.width = ((i+1)/slides.length*100)+'%';
  location.hash = i+1;
}
function vor(){
  const fr = frags(i);
  if(schritt < fr.length){ fr[schritt].classList.add('an'); schritt++; return; }
  if(i < slides.length-1) zeige(i+1);
}
function zurueck(){
  if(schritt > 0){ schritt--; frags(i)[schritt].classList.remove('an'); return; }
  if(i > 0) zeige(i-1, true);
}

function skalieren(){
  const rand = 40;
  const s = Math.min((innerWidth-rand)/1280, (innerHeight-rand)/720);
  stage.style.transform = 'scale('+s+')';
}
addEventListener('resize', skalieren);

const ueb = document.getElementById('uebersicht');
const gitter = ueb.querySelector('.gitter');
folien.forEach((f,k)=>{
  const d = document.createElement('div');
  d.className = 'mini';
  d.innerHTML = `<div class="nr">FOLIE ${k+1}</div><div class="tt">${f.h2 || f.titel}</div>`;
  d.onclick = ()=>{ ueb.classList.remove('an'); zeige(k); };
  gitter.appendChild(d);
});

addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input, select, textarea')) return;   // in Feldern tippen, nicht blättern
  if(e.target.closest && e.target.closest('button') && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); vor(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ e.preventDefault(); zurueck(); }
  else if(e.key==='Home'){ zeige(0); }
  else if(e.key==='End'){ zeige(slides.length-1, true); }
  else if(e.key==='o'||e.key==='O'){ ueb.classList.toggle('an'); }
  else if(e.key==='Escape'){ ueb.classList.remove('an'); }
  else if(e.key==='f'||e.key==='F'){ vollbild(); }
});
function vollbild(){
  const el = document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen();
  else if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
// Wischen auf Tablets: links = weiter, rechts = zurück (nicht in interaktiven Bereichen)
let wischX = null, wischY = null;
stage.addEventListener('touchstart', e=>{
  if(e.target.closest('.interaktiv')){ wischX = null; return; }
  wischX = e.touches[0].clientX; wischY = e.touches[0].clientY;
}, {passive:true});
stage.addEventListener('touchend', e=>{
  if(wischX === null) return;
  const dx = e.changedTouches[0].clientX - wischX, dy = e.changedTouches[0].clientY - wischY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? vor : zurueck)();
  wischX = null;
});
document.getElementById('uebBtn').onclick = ()=> ueb.classList.toggle('an');
document.getElementById('vor').onclick = vor;
document.getElementById('zurueck').onclick = zurueck;
stage.addEventListener('click', e=>{ if(!e.target.closest('a, button, input, .interaktiv')) vor(); });

skalieren();
zeige(parseInt(location.hash.slice(1)) - 1 || 0);

/* =====================================================================
   Diagramme: in echter Pixelbreite gezeichnet (Schrift bleibt lesbar),
   neu bei Folienwechsel, Größenänderung und Handy-Wechsel.
   Farben nur über Klassen (stil.css).
   ===================================================================== */
const istHandy = () => document.documentElement.classList.contains('handy');
const komma = (x, st = 2) => String(Math.round(x * 10 ** st) / 10 ** st).replace('.', ',');

/* Koordinatensystem: liefert Umrechnung und die Achsen als SVG-Text */
function system(w, h, o){
  const l = o.l ?? 58, r = o.r ?? 26, ob = o.ob ?? 34, u = o.u ?? 50;
  const x0 = o.x0 ?? 0, y0 = o.y0 ?? 0;
  const X = m => l + (m - x0) / (o.xmax - x0) * (w - l - r);
  const Y = p => h - u - (p - y0) / (o.ymax - y0) * (h - u - ob);
  let s = `<path class="ax" d="M${l} ${ob - 18}V${h - u}H${w - r + 14}"/>`
        + `<path class="axs" d="M${l - 6} ${ob - 12}L${l} ${ob - 24}L${l + 6} ${ob - 12}z"/>`
        + `<path class="axs" d="M${w - r + 8} ${h - u - 6}L${w - r + 20} ${h - u}L${w - r + 8} ${h - u + 6}z"/>`;
  if (o.xt) for (let m = x0; m <= o.xmax + 1e-9; m += o.xt)
    s += `<path class="tick" d="M${X(m)} ${h - u}v6"/><text class="tt" x="${X(m)}" y="${h - u + 24}" text-anchor="middle">${komma(m)}</text>`;
  if (o.yt) for (let p = y0; p <= o.ymax + 1e-9; p += o.yt)
    s += `<path class="tick" d="M${l - 6} ${Y(p)}h6"/><text class="tt" x="${l - 12}" y="${Y(p) + 5}" text-anchor="end">${komma(p)}</text>`;
  s += `<text class="axt" x="${l + 12}" y="${ob - 10}">${o.yl}</text>`;
  s += `<text class="axt" x="${w - r + 14}" y="${h - u + (o.xt ? 44 : 26)}" text-anchor="end">${o.xl}</text>`;
  return {X, Y, s, l, r, ob, u, w, h};
}
const linie = (K, pkte, kl) => `<polyline class="${kl}" points="${pkte.map(([m,p]) => `${K.X(m).toFixed(1)},${K.Y(p).toFixed(1)}`).join(' ')}"/>`;
const punkt = (K, m, p, kl, r = 7) => `<circle class="${kl}" cx="${K.X(m)}" cy="${K.Y(p)}" r="${r}"/>`;
const text = (x, y, t, kl, anker = 'start') => `<text class="${kl}" x="${x}" y="${y}" text-anchor="${anker}">${t}</text>`;
/* gestrichelte Hilfslinien vom Punkt zu beiden Achsen */
const hilfe = (K, m, p, kl = 'hilf') => `<path class="${kl}" d="M${K.l} ${K.Y(p)}H${K.X(m)}V${K.h - K.u}"/>`;
/* Pfeil von a nach b (Pixel) */
function pfeil(x1, y1, x2, y2, kl){
  const a = Math.atan2(y2 - y1, x2 - x1), s = 13, b = 0.45;
  const sx = x2 - s * Math.cos(a), sy = y2 - s * Math.sin(a);
  return `<path class="${kl}" d="M${x1} ${y1}L${sx} ${sy}"/>`
       + `<path class="${kl} spitze" d="M${x2} ${y2}L${x2 - s * Math.cos(a - b)} ${y2 - s * Math.sin(a - b)}L${x2 - s * Math.cos(a + b)} ${y2 - s * Math.sin(a + b)}z"/>`;
}

/* Register: jedes Diagramm zeichnet sich selbst neu */
const zeichner = [];
function registriere(el, f){
  const r = () => {
    const w = Math.max(280, el.clientWidth || 560);
    el.innerHTML = f(w);
  };
  el._zeichne = r;
  zeichner.push(r);
  r();
}
const alleNeu = () => zeichner.forEach(r => r());
addEventListener('handy-wechsel', alleNeu);
let ruhe = null;
addEventListener('resize', () => { clearTimeout(ruhe); ruhe = setTimeout(alleNeu, 120); });
new MutationObserver(liste => liste.forEach(m => {
  if (m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))
    m.target.querySelectorAll('.dia').forEach(d => d._zeichne && d._zeichne());
})).observe(stage, {subtree: true, attributes: true, attributeFilter: ['class'], attributeOldValue: true});

const diaHoehe = (w, desk, faktor) => istHandy() ? Math.round(Math.min(desk, w * faktor)) : desk;

/* ---------- Apfelmarkt: Daten aus der Umfrage ---------- */
const NPKT = APFEL.map(z => [z.n, z.p]), APKT = APFEL.map(z => [z.a, z.p]);
const apfelSystem = (w, h) => system(w, h, {xmax: 20, ymax: 12, xt: 2, yt: 2, yl: 'Preis in €', xl: 'Menge in Kisten'});
function apfelKurven(K){
  return linie(K, NPKT, 'k-n') + linie(K, APKT, 'k-a')
    + text(K.X(15) + 10, K.Y(2) + 6, 'N', 'lbl n') + text(K.X(15) + 10, K.Y(10) + 6, 'A', 'lbl a');
}

/* Folie „Kreuz“: Ebenen erscheinen mit den Schritten rechts */
document.querySelectorAll('.dia[data-dia="kreuz"]').forEach(el => registriere(el, w => {
  const h = diaHoehe(w, 470, 0.85), K = apfelSystem(w, h);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Angebots- und Nachfragekurve für Apfelkisten">${K.s}
    <g class="lage lage2">${linie(K, NPKT, 'k-n')}${NPKT.map(([m,p]) => punkt(K, m, p, 'pt-n', 5)).join('')}${text(K.X(15) + 10, K.Y(2) + 6, 'N', 'lbl n')}</g>
    <g class="lage lage3">${linie(K, APKT, 'k-a')}${APKT.map(([m,p]) => punkt(K, m, p, 'pt-a', 5)).join('')}${text(K.X(15) + 10, K.Y(10) + 6, 'A', 'lbl a')}</g>
    <g class="lage lage4">${hilfe(K, 10, 6)}${punkt(K, 10, 6, 'gg', 9)}
      ${text(K.X(10), K.Y(6) - 48, 'Gleichgewicht', 'lbl gg-t', 'middle')}
      ${text(K.l + 6, K.Y(6) - 8, 'p* = 6 €', 'lbl klein')}${text(K.X(10) + 6, K.h - K.u - 8, 'm* = 10', 'lbl klein')}</g>
  </svg>`;
}));

/* ---------- Folie „Pendeln“ ---------- */
(function(){
  const box = document.getElementById('pendel');
  if (!box) return;
  const el = box.querySelector('.dia'), befund = document.getElementById('pendelBefund');
  const los = document.getElementById('pendelLos');
  let p = 9, uhr = null;
  const zeile = () => APFEL.find(z => z.p === p);

  registriere(el, w => {
    const h = diaHoehe(w, 470, 0.85), K = apfelSystem(w, h), z = zeile();
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Preis ${p} Euro im Diagramm">${K.s}${apfelKurven(K)}`;
    s += `<path class="preislinie" d="M${K.l} ${K.Y(p)}H${K.w - K.r}"/>`;
    if (!istHandy()) s += text(K.w - K.r, K.Y(p) - 10, `Preis ${p} €`, 'lbl preis-t', 'end');
    if (z.a === z.n){
      s += hilfe(K, 10, 6) + punkt(K, 10, 6, 'gg', 10);
      s += text(K.X(10), K.Y(6) - 48, 'Gleichgewicht', 'lbl gg-t', 'middle');
    } else {
      const ueA = z.a > z.n, lo = Math.min(z.a, z.n), hi = Math.max(z.a, z.n);
      s += `<path class="${ueA ? 'luecke-a' : 'luecke-n'}" d="M${K.X(lo)} ${K.Y(p)}H${K.X(hi)}"/>`;
      s += `<path class="hilf" d="M${K.X(lo)} ${K.Y(p)}V${K.h - K.u}"/>`;
      s += punkt(K, z.n, p, 'pt-n', 8) + punkt(K, z.a, p, 'pt-a', 8);
      const mitte = (K.X(lo) + K.X(hi)) / 2;
      s += text(mitte, K.Y(p) - 16, `${hi - lo} zu viel${istHandy() ? '' : ueA ? ' angeboten' : ' nachgefragt'}`, `lbl ${ueA ? 'a' : 'n'}`, 'middle');
      s += text(K.X(lo) + 6, K.h - K.u - 8, `verkauft: ${lo}`, 'lbl klein');
    }
    return s + '</svg>';
  });

  function befundZeigen(){
    const z = zeile();
    box.querySelectorAll('.pk').forEach(b => b.classList.toggle('an', +b.dataset.p === p));
    if (z.a === z.n){
      befund.innerHTML = `<div class="bef gg"><b>Gleichgewicht bei 6 €</b><span>10 Kisten angeboten, 10 Kisten nachgefragt.</span></div>
        <p>Wer zu 6 € kaufen oder verkaufen will, kommt zum Zug. Für niemanden lohnt es sich, den Preis zu ändern.</p>`;
    } else if (z.a > z.n){
      befund.innerHTML = `<div class="bef ueber-a"><b>Angebotsüberschuss: ${z.a - z.n} Kisten</b><span>${z.a} angeboten, nur ${z.n} nachgefragt. Verkauft werden ${z.n}.</span></div>
        <p>Die Anbieter bleiben auf ihren Äpfeln sitzen. Wer verkaufen will, geht mit dem Preis <strong>runter</strong>.</p>
        <div class="richtung">Der Preis sinkt ↓</div>`;
    } else {
      befund.innerHTML = `<div class="bef ueber-n"><b>Nachfrageüberschuss: ${z.n - z.a} Kisten</b><span>${z.n} nachgefragt, nur ${z.a} angeboten. Verkauft werden ${z.a}.</span></div>
        <p>Käufer gehen leer aus und bieten mehr. Die Anbieter merken: Es geht auch <strong>teurer</strong>.</p>
        <div class="richtung">Der Preis steigt ↑</div>`;
    }
    los.disabled = p === 6 || uhr !== null;
  }
  function setze(neu){ p = neu; el._zeichne(); befundZeigen(); }
  box.querySelectorAll('.pk').forEach(b => b.onclick = () => { halt(); setze(+b.dataset.p); });
  function halt(){ if (uhr){ clearInterval(uhr); uhr = null; } }
  los.onclick = () => {
    if (p === 6) return;
    uhr = setInterval(() => {
      setze(p + (p > 6 ? -1 : 1));
      if (p === 6){ halt(); befundZeigen(); }
    }, 650);
    befundZeigen();
  };
  befundZeigen();
})();

/* ---------- Bewegung und Verschiebung (fest) ---------- */
const linSystem = (w, h, kl) => system(w, h, {xmax: 24, ymax: 12, yl: 'Preis', xl: 'Menge', ob: 30, u: 34, l: 30});
const nGerade = (s = 0) => [[2 + s, 10], [18 + s, 2]];          /* N: p = 11 − (m − s)/2 */
const aGerade = (s = 0) => [[2 + s, 2], [18 + s, 10]];          /* A: p = 1 + (m − s)/2  */

document.querySelectorAll('.dia[data-dia="bewegung"]').forEach(el => registriere(el, w => {

    ${linie(K, nGerade(), 'k-n')}${text(K.X(18) + 8, K.Y(2) - 4, 'N', 'lbl n')}

    ${punkt(K, 6, 8, 'pt-n', 7)}${punkt(K, 14, 4, 'pt-n', 7)}
    ${text(K.X(6) + 12, K.Y(8) - 10, 'teurer: weniger', 'lbl klein')}
    ${text(K.X(14) + 12, K.Y(4) - 10, 'billiger: mehr', 'lbl klein')}

}));
document.querySelectorAll('.dia[data-dia="verschiebung"]').forEach(el => registriere(el, w => {

    ${[8, 6, 4].map(p => pfeil(K.X(2 * (11 - p)) + 8, K.Y(p), K.X(2 * (11 - p) + 5) - 8, K.Y(p), 'pf-o')).join('')}

const SCHRITT = 4, HP = 4.5;
const FAELLE = [
  {k: 'Äpfel', markt: 'Äpfel', z: '„An apple a day keeps the doctor away!“', u: 'Gesundheitsforscher fanden heraus, dass Äpfel viel gesünder sind als Birnen.',

  {k: 'b', markt: 'Kaffee', z: 'Eine Studie überzeugt die Bürger, dass Kaffeetrinken sehr gesund ist.', u: '',

  {k: 'e', markt: 'Kaffee', z: 'Eine neue, preiswerte Erntemaschine wird erfunden.', u: '',
   sn: 0, sa: 1, hp: false, e: 'Die Ernte wird <strong>billiger</strong>. Zu jedem Preis wird mehr angeboten: Das <strong>Angebot</strong> verschiebt sich nach rechts.'},
  {k: 'f', markt: 'Kaffee', z: 'Die Regierung setzt einen Höchstpreis für Kaffee fest.', u: '',
   sn: 0, sa: 0, hp: true, e: 'Keine Kurve verschiebt sich. Liegt der Höchstpreis <strong>unter</strong> dem Gleichgewichtspreis, darf der Preis nicht steigen: Es wird weniger angeboten, als die Leute kaufen wollen. Kein Gleichgewicht mehr – es fehlt Ware.'},
];

function gleichgewicht(sn, sa){ return {m: 10 + (sn + sa) / 2, p: 6 + (sn - sa) / 4}; }
/* Gerade m(p) zwischen zwei Preisen, an den Achsen abgeschnitten */
function gerade(K, mVonP, pa, pb, kl){
  const pkte = [];
  for (let k = 0; k <= 40; k++){
    const p = pa + (pb - pa) * k / 40, m = mVonP(p);
    if (m >= 0.3 && m <= 23.5) pkte.push([m, p]);
  }
  return linie(K, pkte, kl);
}
const mN = s => p => 2 * (11 - p) + s, mA = s => p => 2 * (p - 1) + s;

document.querySelectorAll('.sim').forEach(box => {
  const fallModus = box.dataset.sim === 'fall';
  const el = box.querySelector('.dia'), befund = box.querySelector('.simbefund');
  const st = {sn: 0, sa: 0, hp: false};             /* Ziel (in Schritten −1, 0, 1) */
  const an = {sn: 0, sa: 0};                       /* angezeigt (für die Bewegung) */
  let fall = fallModus ? 0 : null, geloest = false, animiert = null;

  registriere(el, w => {
    const h = diaHoehe(w, 470, 0.85);
    const K = system(w, h, {xmax: 24, ymax: 12, yl: 'Preis', xl: 'Menge', u: 40});
    const sn = an.sn * SCHRITT, sa = an.sa * SCHRITT, g0 = gleichgewicht(0, 0), g = gleichgewicht(sn, sa);
    const bewegt = Math.abs(sn) > 0.01 || Math.abs(sa) > 0.01;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Angebot und Nachfrage verschieben">${K.s}`;
    if (fall !== null) s += text(K.w - K.r, K.ob - 10, 'Markt für ' + FAELLE[fall].markt, 'lbl markt', 'end');
    if (Math.abs(sn) > 0.01) s += gerade(K, mN(0), 10, 1.5, 'k-n alt') + text(K.X(mN(0)(1.6)) + 4, K.Y(1.6) + 22, 'N', 'lbl n blass');
    if (Math.abs(sa) > 0.01) s += gerade(K, mA(0), 2, 10.5, 'k-a alt') + text(K.X(mA(0)(10.4)) + 4, K.Y(10.4) - 4, 'A', 'lbl a blass');
    s += gerade(K, mN(sn), 10.5, 1.5, 'k-n') + gerade(K, mA(sa), 1.5, 10.5, 'k-a');
    const nEnde = Math.min(23, mN(sn)(1.6)), aEnde = Math.min(23, mA(sa)(10.4));
    s += text(K.X(nEnde) + 6, K.Y(11 - (nEnde - sn) / 2) - 6, Math.abs(sn) > 0.01 ? 'N₁' : 'N', 'lbl n');
    s += text(K.X(aEnde) + 6, K.Y(1 + (aEnde - sa) / 2) - 6, Math.abs(sa) > 0.01 ? 'A₁' : 'A', 'lbl a');
    const hpBindet = st.hp && HP < g.p - 1e-9;
    if (bewegt){
      s += hilfe(K, g0.m, g0.p, 'hilf blass') + punkt(K, g0.m, g0.p, 'gg alt', 7);
      const eng = Math.abs(K.X(g.m) - K.X(g0.m)) < 34, links = g.m >= g0.m;
      s += text(K.l - 8, K.Y(g0.p) + 5, 'p*', 'lbl klein', 'end')
         + text(K.X(g0.m) + (eng ? (links ? -3 : 3) : 0), K.h - K.u + 20, 'm*', 'lbl klein', eng ? (links ? 'end' : 'start') : 'middle');
    }
    if (!hpBindet){
      s += hilfe(K, g.m, g.p) + punkt(K, g.m, g.p, 'gg', 9);
      if (bewegt){
        const dp = Math.abs(g.p - g0.p) > 0.3, dm = Math.abs(g.m - g0.m) > 0.6;
        if (dp) s += text(K.l - 8, K.Y(g.p) + 5, 'p₁', 'lbl klein stark', 'end');
        const eng = Math.abs(K.X(g.m) - K.X(g0.m)) < 34, rechts = g.m >= g0.m;
        if (dm) s += text(K.X(g.m) + (eng ? (rechts ? 3 : -3) : 0), K.h - K.u + 20, 'm₁', 'lbl klein stark', eng ? (rechts ? 'start' : 'end') : 'middle');
      } else {
        s += text(K.l - 8, K.Y(g.p) + 5, 'p*', 'lbl klein', 'end') + text(K.X(g.m), K.h - K.u + 20, 'm*', 'lbl klein', 'middle');
      }
    }
    if (st.hp){
      s += `<path class="hoechst" d="M${K.l} ${K.Y(HP)}H${K.w - K.r}"/>` + text(K.w - K.r, K.Y(HP) + 24, 'Höchstpreis', 'lbl hp-t', 'end');
      if (hpBindet){
        const ma = mA(sa)(HP), mn = mN(sn)(HP);
        s += `<path class="luecke-n" d="M${K.X(ma)} ${K.Y(HP)}H${K.X(mn)}"/>`;
        s += `<path class="hilf" d="M${K.X(ma)} ${K.Y(HP)}V${K.h - K.u}"/>`;
        s += punkt(K, ma, HP, 'pt-a', 8) + punkt(K, mn, HP, 'pt-n', 8);
        s += text((K.X(ma) + K.X(mn)) / 2, K.Y(HP) + 26, 'fehlt', 'lbl n', 'middle');
        s += text(K.X(ma), K.h - K.u + 20, 'verkauft', 'lbl klein stark', 'middle');
      }
    }
    return s + '</svg>';
  });

  const wort = (d, w) => Math.abs(d) < 1e-9 ? `<span class="gleich">${w} bleibt gleich</span>` : d > 0 ? `<span class="hoch">${w} steigt ↑</span>` : `<span class="runter">${w} sinkt ↓</span>`;
  function befundZeigen(){
    if (fallModus && !geloest){ befund.innerHTML = ''; return; }
    const g0 = gleichgewicht(0, 0), g = gleichgewicht(st.sn * SCHRITT, st.sa * SCHRITT);
    let h = fallModus ? `<p>${FAELLE[fall].e}</p>` : '';
    if (st.hp && HP < g.p){
      h += `<div class="ergebnis">${wort(-1, 'Preis')}${wort(-1, 'Verkaufte Menge')}</div>
            <p class="klein">Der Preis darf nicht über den Höchstpreis. Zu diesem Preis wollen viele kaufen, aber wenige verkaufen: <strong>Nachfrageüberschuss</strong>. Schlangen, leere Regale.</p>`;
    } else {
      if (st.sn === 0 && st.sa === 0 && !st.hp){ befund.innerHTML = fallModus ? h : '<p class="klein">Verschiebt eine Kurve – oder beide.</p>'; return; }
      h += `<div class="ergebnis">${wort(g.p - g0.p, 'Preis')}${wort(g.m - g0.m, 'Menge')}</div>`;
      if (st.hp) h += '<p class="klein">Der Höchstpreis liegt über dem Gleichgewichtspreis – er wirkt nicht.</p>';
      else if (st.sn !== 0 && st.sa !== 0 && Math.abs(g.p - g0.p) < 1e-9) h += '<p class="klein">Beide Kurven gleich weit nach rechts (oder links): Die Wirkungen auf den Preis heben sich auf.</p>';
      else if (st.sn !== 0 && st.sa !== 0 && Math.abs(g.m - g0.m) < 1e-9) h += '<p class="klein">Die Wirkungen auf die Menge heben sich auf.</p>';
    }
    befund.innerHTML = h;
  }
  function knoepfe(){
    box.querySelectorAll('[data-s]').forEach(b => {
      const v = st[b.dataset.s === 'n' ? 'sn' : 'sa'] + +b.dataset.d;
      b.disabled = v < -1 || v > 1;
    });
    const hpk = box.querySelector('[data-hp]');
    if (hpk) hpk.classList.toggle('an', st.hp);
    box.querySelectorAll('.fallk').forEach((b, k) => b.classList.toggle('an', k === fall));
    const auf = box.querySelector('[data-aufloesen]');
    if (auf) auf.disabled = geloest;
  }
  function bewege(){
    const von = {...an}, t0 = performance.now();
    cancelAnimationFrame(animiert);
    const schritt = t => {
      const q = Math.min(1, (t - t0) / 450), e = q < 0.5 ? 2 * q * q : 1 - 2 * (1 - q) * (1 - q);
      an.sn = von.sn + (st.sn - von.sn) * e; an.sa = von.sa + (st.sa - von.sa) * e;
      el._zeichne();
      if (q < 1) animiert = requestAnimationFrame(schritt);
    };
    animiert = requestAnimationFrame(schritt);
    befundZeigen(); knoepfe();
  }
  function anfang(){ st.sn = 0; st.sa = 0; st.hp = false; geloest = false; bewege(); }
  box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    st[b.dataset.s === 'n' ? 'sn' : 'sa'] += +b.dataset.d; bewege();
  });
  const hpk = box.querySelector('[data-hp]');
  if (hpk) hpk.onclick = () => { st.hp = !st.hp; el._zeichne(); befundZeigen(); knoepfe(); };
  box.querySelectorAll('[data-reset]').forEach(b => b.onclick = anfang);

  if (fallModus){
    const leiste = box.querySelector('.faelle'), zeile = box.querySelector('.schlagzeile');
    leiste.innerHTML = FAELLE.map((f, k) => `<button class="knopf hell fallk" data-f="${k}">${f.k}</button>`).join('');
    const waehle = k => {
      fall = k;
      const f = FAELLE[k];
      zeile.innerHTML = `<b>${f.z}</b>${f.u ? `<span>${f.u}</span>` : ''}`;
      anfang();
    };
    leiste.querySelectorAll('.fallk').forEach(b => b.onclick = () => waehle(+b.dataset.f));
    box.querySelector('[data-aufloesen]').onclick = () => {
      const f = FAELLE[fall];
      st.sn = f.sn; st.sa = f.sa; st.hp = f.hp; geloest = true; bewege();
    };
    waehle(0);
  } else { befundZeigen(); knoepfe(); }
});

/* ---------- PS5: Speicherchips (Angebot links) und GTA 6 (Nachfrage rechts) ---------- */
const PS5_N = 8, PS5_A = -4;   /* Nachfrage zwei Schritte nach rechts, Angebot einer nach links: Menge steigt */
(function(){
  const box = document.getElementById('ps5');
  if (!box) return;
  const el = box.querySelector('.dia'), befund = box.querySelector('.simbefund');
  const st = {c: 0, g: 0}, an = {c: 0, g: 0};
  let animiert = null;
  registriere(el, w => {
    const h = diaHoehe(w, 470, 0.85);
    const K = system(w, h, {xmax: 24, ymax: 12, yl: 'Preis', xl: 'Menge', u: 40});
    const sn = an.g * PS5_N, sa = an.c * PS5_A, g0 = gleichgewicht(0, 0), g = gleichgewicht(sn, sa);
    const bewegt = an.g > 0.01 || an.c > 0.01;
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Markt für Spielkonsolen: Angebot und Nachfrage">${K.s}`;
    s += text(K.w - K.r, K.ob - 10, 'Markt für Spielkonsolen', 'lbl markt', 'end');
    if (an.g > 0.01) s += gerade(K, mN(0), 10, 1.5, 'k-n alt');
    if (an.c > 0.01) s += gerade(K, mA(0), 2, 10.5, 'k-a alt');
    s += gerade(K, mN(sn), 11.8, 1.5, 'k-n') + gerade(K, mA(sa), 1.5, 11, 'k-a');
    const nEnde = Math.min(23, mN(sn)(1.6)), aEnde = Math.min(23, mA(sa)(10.9));
    s += text(K.X(nEnde) + 6, K.Y(11 - (nEnde - sn) / 2) - 6, an.g > 0.01 ? 'N₁' : 'N', 'lbl n');
    s += text(K.X(aEnde) + 6, K.Y(1 + (aEnde - sa) / 2) + 6, an.c > 0.01 ? 'A₁' : 'A', 'lbl a');
    if (bewegt){
      s += hilfe(K, g0.m, g0.p, 'hilf blass') + punkt(K, g0.m, g0.p, 'gg alt', 7);
      s += text(K.l - 8, K.Y(g0.p) + 5, 'p*', 'lbl klein', 'end');
      if (Math.abs(g.p - g0.p) > 0.3) s += text(K.l - 8, K.Y(g.p) + 5, 'p₁', 'lbl klein stark', 'end');
    } else s += text(K.l - 8, K.Y(g.p) + 5, 'p*', 'lbl klein', 'end');
    s += hilfe(K, g.m, g.p) + punkt(K, g.m, g.p, 'gg', 9);
    return s + '</svg>';
  });
  const wort = (d, w) => Math.abs(d) < 1e-9 ? `<span class="gleich">${w} bleibt gleich</span>` : d > 0 ? `<span class="hoch">${w} steigt ↑</span>` : `<span class="runter">${w} sinkt ↓</span>`;
  const TEXT = {
    c: 'KI-Rechenzentren kaufen Speicherchips in riesigen Mengen. Für Konsolen werden die Chips teurer: Zu jedem Preis lohnt sich weniger. Das <strong>Angebot</strong> verschiebt sich nach links.',
    g: 'Am 19. November kommt GTA 6, vorerst nur für Konsolen. Spiel und Konsole gehören zusammen (<strong>Komplementärgüter</strong>): Zu jedem Preis wollen mehr eine PS5. Die <strong>Nachfrage</strong> verschiebt sich nach rechts.',
    cg: 'Beides treibt den Preis nach oben. Bei der Menge kommt es darauf an, welche Verschiebung stärker ist. In den USA wurden zuletzt rund 22 % mehr PS5 verkauft – <strong>teurer und trotzdem mehr verkauft</strong>. Kein Widerspruch: Die ganze Nachfragekurve hat sich verschoben.',
  };
  function befundZeigen(){
    const k = (st.c ? 'c' : '') + (st.g ? 'g' : '');
    if (!k){ befund.innerHTML = '<p class="klein">Was ist 2026 passiert? Schaltet die beiden Ereignisse ein – einzeln oder zusammen.</p>'; return; }
    const g0 = gleichgewicht(0, 0), g = gleichgewicht(st.g * PS5_N, st.c * PS5_A);
    befund.innerHTML = `<div class="ergebnis">${wort(g.p - g0.p, 'Preis')}${wort(g.m - g0.m, 'Menge')}</div><p class="klein">${TEXT[k]}</p>`;
  }
  function bewege(){
    const von = {...an}, t0 = performance.now();
    cancelAnimationFrame(animiert);
    const schritt = t => {
      const q = Math.min(1, (t - t0) / 450), e = q < 0.5 ? 2 * q * q : 1 - 2 * (1 - q) * (1 - q);
      an.c = von.c + (st.c - von.c) * e; an.g = von.g + (st.g - von.g) * e;
      el._zeichne();
      if (q < 1) animiert = requestAnimationFrame(schritt);
    };
    animiert = requestAnimationFrame(schritt);
    box.querySelectorAll('[data-ps]').forEach(b => b.classList.toggle('an', !!st[b.dataset.ps]));
    befundZeigen();
  }
  box.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => { st[b.dataset.ps] = 1 - st[b.dataset.ps]; bewege(); });
  box.querySelector('[data-ps0]').onclick = () => { st.c = 0; st.g = 0; bewege(); };
  befundZeigen();
})();

/* ---------- Preiselastizität ---------- */
(function(){
  const box = document.getElementById('elast');
  if (!box) return;
  const el = box.querySelector('.dia'), befund = document.getElementById('elastBefund');
  const ARTEN = [
    {q2: 50,  name: 'elastisch', bsp: 'Die Zeitung am Kiosk: 150 Leser springen ab. So reagieren oft Güter, auf die man verzichten oder ausweichen kann, etwa Luxusgüter.'},
    {q2: 180, name: 'unelastisch', bsp: 'Angenommen, es geht um Brot. Was man jeden Tag braucht, kauft man auch teurer – nur etwas weniger.'},
    {q2: 200, name: 'völlig unelastisch', bsp: 'Die Menge bleibt gleich, egal was es kostet – etwa bei einem lebenswichtigen Medikament.'},
  ];
  let wahl = 0;
  registriere(el, w => {
    const h = diaHoehe(w, 470, 0.85);
    const K = system(w, h, {xmax: 250, ymax: 14, xt: 50, yt: 2, yl: 'Preis in GE', xl: 'Menge'});
    let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Nachfragekurven mit verschiedener Preiselastizität">${K.s}`;
    const zug = (q2, kl) => {
      /* Gerade durch (200|10) und (q2|13), etwas verlängert */
      const m = p => 200 + (q2 - 200) * (p - 10) / 3, pkte = [];
      for (let k = 0; k <= 60; k++){ const p = 8.5 + 5.3 * k / 60; if (m(p) >= 0 && m(p) <= 245) pkte.push([m(p), p]); }
      return linie(K, pkte, kl);
    };
    ARTEN.forEach((a, k) => { if (k !== wahl) s += zug(a.q2, 'k-n alt'); });
    const a = ARTEN[wahl];
    s += zug(a.q2, 'k-n');
    s += hilfe(K, 200, 10) + hilfe(K, a.q2, 13);
    s += pfeil(K.l + 16, K.Y(10), K.l + 16, K.Y(13) + 4, 'pf-o');
    s += text(K.l + 26, K.Y(11.5) + 5, '+30 %', 'lbl a');
    if (a.q2 !== 200){
      s += pfeil(K.X(200), K.h - K.u - 16, K.X(a.q2) + 4, K.h - K.u - 16, 'pf-n');
      const eng = K.X(200) - K.X(a.q2) < 90;
      s += text(eng ? K.X(a.q2) - 10 : (K.X(200) + K.X(a.q2)) / 2, K.h - K.u - (eng ? 10 : 26), `−${komma((200 - a.q2) / 2)} %`, 'lbl n', eng ? 'end' : 'middle');
    }
    s += punkt(K, 200, 10, 'pt-n', 8) + punkt(K, a.q2, 13, 'pt-n', 8);
    return s + '</svg>';
  });
  function zeigen(){
    const a = ARTEN[wahl], dm = (200 - a.q2) / 200 * 100, e = dm / 30;
    box.querySelectorAll('[data-e]').forEach(b => b.classList.toggle('an', +b.dataset.e === wahl));
    const eText = Math.abs(e * 100 - Math.round(e * 100)) > 1e-9 ? `≈ ${komma(e)}` : `= ${komma(e)}`;
    const urteil = e > 1 ? 'größer als 1: <strong>elastisch</strong>' : e > 0 ? 'kleiner als 1: <strong>unelastisch</strong>' : 'gleich 0: <strong>völlig unelastisch</strong>';
    befund.innerHTML = `
      <div class="rechnung">
        <div><span>Menge</span><b>200 → ${a.q2}</b><i>${dm ? '−' + komma(dm) : '±0'} %</i></div>
        <div><span>Preis</span><b>10 → 13 GE</b><i>+30 %</i></div>
      </div>
      <div class="bef gg"><b>Preiselastizität = ${komma(dm)} % : 30 % ${eText}</b><span>Ergebnis ${urteil}</span></div>
      <p class="klein">${a.bsp}</p>`;
  }
  box.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { wahl = +b.dataset.e; el._zeichne(); zeigen(); });
  zeigen();
})();

</script>
<script data-handy="technik/handy/handy.js">
/* =====================================================================
   HANDY-SCHICHT — schaltet die Handy-Ansicht, wenn die Bühne 1280 × 720 zu stark
   verkleinert würde (Maßstab unter 0,62: Handy hoch und quer, Tablet hochkant).
   Muss NACH der Folien-Navigation des Rahmens stehen (nutzt stage, zeige, skalieren).
   Meldet Wechsel mit dem Ereignis „handy-wechsel", damit Rechner neu zeichnen können.
   ===================================================================== */
(function(){
  const html = document.documentElement;
  const istHandy = () => Math.min(innerWidth / 1280, innerHeight / 720) < 0.62;
  let vorher = null;
  function pruefen(){
    const h = istHandy();
    html.classList.toggle('handy', h);
    if (h) stage.style.transform = 'none';
    else if (typeof skalieren === 'function') skalieren();
    if (h !== vorher){ vorher = h; window.dispatchEvent(new CustomEvent('handy-wechsel', { detail: h })); }
  }
  addEventListener('resize', pruefen);
  addEventListener('orientationchange', () => setTimeout(pruefen, 200));
  pruefen();

  // Neue Folie (und nur dann, nicht bei jedem Knopf): nach oben scrollen
  const wach = new MutationObserver((liste) => {
    if (!html.classList.contains('handy')) return;
    if (liste.some((m) => m.target.classList.contains('aktiv') && !/\baktiv\b/.test(m.oldValue || ''))) window.scrollTo(0, 0);
  });
  document.querySelectorAll('.slide').forEach((f) => wach.observe(f, { attributes: true, attributeFilter: ['class'], attributeOldValue: true }));

  // Beim Scrollen tippt man oft auf Text: auf dem Handy blättert ein Tipp nicht weiter
  stage.addEventListener('click', (e) => {
    if (html.classList.contains('handy') && !e.target.closest('a, button, input, select, textarea, label, .interaktiv')) e.stopPropagation();
  }, true);
})();
</script><!-- /HANDY-SCHICHT -->
